)(k + 2)(2k + 3)/6."},{"id":"math-10-013","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"D","q":"The inequality 2ⁿ > n² is to be proved by induction for all integers n ≥ m. The least m for which this is possible is:","o":["1","3","5","4"],"a":2,"x":"2ⁿ > n² holds at n = 1 (2 > 1) but fails at n = 2, 3, 4 (4 = 4, 8 < 9, 16 = 16). From n = 5 (32 > 25) it holds for every larger n, so the induction must start at 5; starting at 1 ignores the failures."},{"id":"math-10-014","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"M","q":"The inequality n! > 2ⁿ holds for every integer n ≥ m. The least such m is:","o":["4","3","2","5"],"a":0,"x":"n = 1, 2, 3 give 1 < 2, 2 < 4, 6 < 8; n = 4 gives 24 > 16, and (k + 1)! = (k + 1)k! > 2·2ᵏ for k ≥ 4. So m = 4."},{"id":"math-10-015","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"D","q":"Let P(n) be the statement 'n² + n is odd'. Which is true?","o":["P(1) is true, but the inductive step fails","the inductive step P(k) ⇒ P(k + 1) holds, but P(1) is false","P(n) is true for every positive integer n","both P(1) and the inductive step fail"],"a":1,"x":"(k + 1)² + (k + 1) = (k² + k) + 2(k + 1), so if k² + k is odd, so is the next value: the step holds. But 1² + 1 = 2 is even, so the base case fails and P(n) is never true. Both steps are needed."},{"id":"math-10-016","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"M","q":"In proving that 4ⁿ − 1 is divisible by 3, one writes 4^(k+1) − 1 = 4(4ᵏ − 1) + m. The number m is:","o":["4","1","−3","3"],"a":3,"x":"4(4ᵏ − 1) = 4^(k+1) − 4, so 4^(k+1) − 1 = 4(4ᵏ − 1) + 3. Both parts are multiples of 3 when 4ᵏ − 1 is, which completes the step."},{"id":"math-10-017","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"E","q":"For every positive integer n, xⁿ − yⁿ is always divisible by:","o":["x + y","x² − y²","x − y","xy"],"a":2,"x":"xⁿ − yⁿ = (x − y)(x^(n−1) + x^(n−2)y + … + y^(n−1)), provable by induction. At n = 1 it is x − y itself, so x + y and x² − y² do not always divide it."},{"id":"math-10-018","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"M","q":"Which formula for 1 + 4 + 7 + … + (3n − 2) can be proved by induction?","o":["n(3n + 1)/2","n(3n − 2)/2","3n(n − 1)/2","n(3n − 1)/2"],"a":3,"x":"Check n = 1: 1 = 1·2/2, and n = 2: 1 + 4 = 5 = 2·5/2. The other forms give 2, 1/2 and 0 at n = 1. (Also, AP sum = n(1 + 3n − 2)/2.)"},{"id":"math-10-019","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"D","q":"For every positive integer n, 1·1! + 2·2! + 3·3! + … + n·n! equals:","o":["(n + 1)! − 1","(n + 1)!","n! − 1","(n + 1)! + 1"],"a":0,"x":"r·r! = (r + 1)! − r!, so the sum telescopes to (n + 1)! − 1. Check n = 2: 1 + 4 = 5 = 3! − 1. Inductive step: (k + 1)! − 1 + (k + 1)(k + 1)! = (k + 2)! − 1."},{"id":"math-10-020","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"D","q":"For which value of a is n³ + an divisible by 3 for every positive integer n?","o":["1","3","2","4"],"a":2,"x":"n³ + 2n = (n³ − n) + 3n, and n³ − n = (n − 1)n(n + 1) is a multiple of 3, so a = 2 works. Test n = 1 for the rest: 1 + 1 = 2, 1 + 3 = 4, 1 + 4 = 5 are not multiples of 3."},{"id":"math-10-021","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"E","q":"How many terms are there in the expansion of (a + b)¹⁰?","o":["10","12","9","11"],"a":3,"x":"(a + b)ⁿ has n + 1 terms, from r = 0 to r = n, so 10 + 1 = 11. Answering 10 forgets the term with r = 0."},{"id":"math-10-022","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"E","q":"The sum of all the binomial coefficients in the expansion of (1 + x)⁸ is:","o":["128","256","512","64"],"a":1,"x":"Put x = 1: ⁸C₀ + ⁸C₁ + … + ⁸C₈ = 2⁸ = 256. The value 128 = 2⁷ is the sum of only the odd-placed (or even-placed) coefficients."},{"id":"math-10-023","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"M","q":"The coefficient of x³ in the expansion of (1 + 2x)⁵ is:","o":["10","40","20","80"],"a":3,"x":"The term is ⁵C₃(2x)³ = 10 × 8x³ = 80x³. Forgetting to cube the 2 gives 10 or 20, and 40 is the coefficient of x²."},{"id":"math-10-024","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"M","q":"The term independent of x in the expansion of (x − 2/x)⁶ is:","o":["160","−160","−20","60"],"a":1,"x":"T(r+1) = ⁶Cᵣ x^(6−r)(−2/x)ʳ = ⁶Cᵣ(−2)ʳ x^(6−2r); x⁰ needs r = 3, giving 20 × (−8) = −160. Dropping the sign gives 160, forgetting (−2)³ gives −20."},{"id":"math-10-025","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"M","q":"The middle term of the expansion of (x + 1/(2x))⁸ is:","o":["35/16","70","35/8","35/4"],"a":2,"x":"With n = 8 the middle term is T₅ (r = 4): ⁸C₄ x⁴(1/(2x))⁴ = 70/16 = 35/8. Using 70 alone forgets the factor 1/2⁴."},{"id":"math-10-026","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"E","q":"In the expansion of (a + b)⁹, the middle term(s) are:","o":["the 4th and 5th terms","the 5th term only","the 6th and 7th terms","the 5th and 6th terms"],"a":3,"x":"There are 10 terms (an even number), so there are two middle terms: the ((9 + 1)/2)th = 5th and the ((9 + 3)/2)th = 6th."},{"id":"math-10-027","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"M","q":"The coefficient of x⁵ in the expansion of (x² + 1/x)⁷ is:","o":["21","7","35","0"],"a":2,"x":"T(r+1) = ⁷Cᵣ(x²)^(7−r)(1/x)ʳ = ⁷Cᵣ x^(14−3r). 14 − 3r = 5 gives r = 3, so the coefficient is ⁷C₃ = 35. 21 = ⁷C₂ comes from taking r = 2."},{"id":"math-10-028","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"E","q":"In the expansion of (a + b)ⁿ, which statement about the general term is correct?","o":["ⁿCᵣ a^(n−r) bʳ is the rth term","ⁿCᵣ a^(n−r) bʳ is the (r + 1)th term","ⁿCᵣ a^(n−r) bʳ is the (r − 1)th term","ⁿCᵣ a^(n−r) bʳ is the (n − r)th term"],"a":1,"x":"Counting starts at r = 0 for the first term aⁿ, so ⁿCᵣ a^(n−r) bʳ is T(r+1), the (r + 1)th term. Calling it the rth term is the usual off-by-one slip."},{"id":"math-10-029","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"M","q":"In the expansion of (1 + x)ⁿ, the coefficients of the 5th and 9th terms are equal. Then n equals:","o":["14","13","12","4"],"a":2,"x":"The 5th and 9th coefficients are ⁿC₄ and ⁿC₈. ⁿC₄ = ⁿC₈ with 4 ≠ 8 needs 4 + 8 = n, so n = 12. Using term numbers 5 + 9 gives 14."},{"id":"math-10-030","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"M","q":"The sum of the coefficients in the expansion of (3x − 2)⁵ is:","o":["−1","1","3125","32"],"a":1,"x":"Put x = 1: (3 − 2)⁵ = 1. Ignoring the minus sign gives (3 + 2)⁵ = 3125, and 32 = 2⁵ treats it like (1 + x)⁵."},{"id":"math-10-031","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"M","q":"The value of ¹⁰C₁ + ¹⁰C₃ + ¹⁰C₅ + ¹⁰C₇ + ¹⁰C₉ is:","o":["1024","512","256","511"],"a":1,"x":"The odd-placed and even-placed coefficients have equal sums (put x = −1 in (1 + x)¹⁰), and together they make 2¹⁰ = 1024, so each sum is 2⁹ = 512."},{"id":"math-10-032","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"D","q":"The value of (√2 + 1)⁴ + (√2 − 1)⁴ is:","o":["17","24","68","34"],"a":3,"x":"In the sum the odd powers of 1 cancel: 2[(√2)⁴ + ⁴C₂(√2)² + 1] = 2[4 + 12 + 1] = 34. Check: (√2 + 1)² = 3 + 2√2, squared 17 + 12√2; the other gives 17 − 12√2. 17 forgets the factor 2."},{"id":"math-10-033","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"M","q":"The greatest binomial coefficient in the expansion of (1 + x)¹⁰ is:","o":["210","252","120","462"],"a":1,"x":"For even n = 10 the largest coefficient is the middle one, ¹⁰C₅ = 252. 210 = ¹⁰C₄ and 120 = ¹⁰C₃ are its neighbours."},{"id":"math-10-034","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"D","q":"The coefficient of x⁴ in the expansion of (2x² − 3/x)⁵ is:","o":["720","−720","240","1080"],"a":0,"x":"T(r+1) = ⁵Cᵣ(2x²)^(5−r)(−3/x)ʳ = ⁵Cᵣ 2^(5−r)(−3)ʳ x^(10−3r). x⁴ needs r = 2: 10 × 8 × 9 = 720 (positive, since (−3)² = 9). Using 3 instead of 9 gives 240."},{"id":"math-10-035","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"M","q":"After simplifying, how many terms does (x + a)⁷ − (x − a)⁷ have?","o":["8","4","3","7"],"a":1,"x":"Terms with even powers of a cancel and those with odd powers double: 2[⁷C₁x⁶a + ⁷C₃x⁴a³ + ⁷C₅x²a⁵ + a⁷], which is 4 terms."},{"id":"math-10-036","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"D","q":"The middle term in the expansion of (x/3 + 9y)¹⁰ is:","o":["252 x⁵y⁵","20412 x⁵y⁵","61236 x⁵y⁵","61236 x⁶y⁴"],"a":2,"x":"Middle term T₆ (r = 5): ¹⁰C₅(x/3)⁵(9y)⁵ = 252 × (9/3)⁵ x⁵y⁵ = 252 × 243 x⁵y⁵ = 61236 x⁵y⁵. Using 3⁴ = 81 instead of 3⁵ gives 20412."},{"id":"math-10-037","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"M","q":"If the coefficient of x² in the expansion of (1 + kx)⁶ is 60 and k > 0, then k equals:","o":["4","√2","2","3"],"a":2,"x":"The x² term is ⁶C₂(kx)² = 15k²x², so 15k² = 60, k² = 4 and k = 2 (k > 0). Taking k² = 4 as the answer gives 4."},{"id":"math-10-038","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"M","q":"Using the binomial theorem on (10 + 1)⁴, the value of 11⁴ is:","o":["14641","14441","13641","14661"],"a":0,"x":"(10 + 1)⁴ = 10⁴ + 4·10³ + 6·10² + 4·10 + 1 = 10000 + 4000 + 600 + 40 + 1 = 14641."},{"id":"math-10-039","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"M","q":"The 6th term in the expansion of (1 − x)⁸ is:","o":["−56x⁵","56x⁵","70x⁴","−56x⁶"],"a":0,"x":"T₆ has r = 5: ⁸C₅(−x)⁵ = 56(−x⁵) = −56x⁵. The sign is negative because the power of (−x) is odd; 70x⁴ is the 5th term."},{"id":"math-10-040","unit":"math-10","topic":"math-10-binomial","lo":"MATH-10.2","d":"D","q":"Using the binomial theorem, the remainder when 2³¹ is divided by 5 is:","o":["3","2","1","4"],"a":0,"x":"2³¹ = 2·(2²)¹⁵ = 2(5 − 1)¹⁵. Every term of (5 − 1)¹⁵ except the last, (−1)¹⁵ = −1, is a multiple of 5, so 2³¹ leaves the same remainder as 2·(−1) = −2, i.e. 3. Taking (+1)¹⁵ gives 2."},{"id":"math-10-041","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"E","q":"The expansion 1/(1 + x) = 1 − x + x² − x³ + … is valid when:","o":["|x| ≤ 1","|x| < 1","x > −1","x is any real number"],"a":1,"x":"The binomial series for a negative or fractional index converges only for |x| < 1. At x = 1 the series 1 − 1 + 1 − … does not converge, and x = 3 > −1 also fails."},{"id":"math-10-042","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"E","q":"For |x| < 1, the first three terms of (1 − x)⁻² are:","o":["1 − 2x + 3x²","1 + 2x + x²","1 + 2x + 3x²","1 − 2x − 3x²"],"a":2,"x":"(1 + y)ⁿ = 1 + ny + n(n − 1)y²/2 with n = −2, y = −x: 1 + 2x + (−2)(−3)/2 x² = 1 + 2x + 3x². 1 − 2x + 3x² is (1 + x)⁻²."},{"id":"math-10-043","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"M","q":"For |x| < 1, the first three terms of √(1 + x) are:","o":["1 + x/2 + x²/8","1 + x/2 − x²/4","1 − x/2 − x²/8","1 + x/2 − x²/8"],"a":3,"x":"n = 1/2: n(n − 1)/2 = (1/2)(−1/2)/2 = −1/8, so √(1 + x) = 1 + x/2 − x²/8 + … Forgetting to divide by 2! gives −x²/4."},{"id":"math-10-044","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"M","q":"For |x| < 1, the coefficient of x³ in the expansion of (1 + x)⁻³ is:","o":["10","−6","−20","−10"],"a":3,"x":"n(n − 1)(n − 2)/3! with n = −3: (−3)(−4)(−5)/6 = −60/6 = −10. Dropping the sign gives 10."},{"id":"math-10-045","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"M","q":"Using the first three terms of the binomial series, √1.02 is approximately:","o":["1.01005","1.0098","1.01","1.00995"],"a":3,"x":"√(1 + x) ≈ 1 + x/2 − x²/8 with x = 0.02: 1 + 0.01 − 0.0004/8 = 1.01 − 0.00005 = 1.00995. 1.01 stops after two terms, and 1.01005 adds the third term instead of subtracting it."},{"id":"math-10-046","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"M","q":"Using the first two terms of the binomial series, √99 is approximately:","o":["9.95","9.9","9.995","9.05"],"a":0,"x":"√99 = 10(1 − 0.01)^(1/2) ≈ 10(1 − 0.005) = 9.95. Forgetting the factor 1/2 gives 10(1 − 0.01) = 9.9."},{"id":"math-10-047","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"M","q":"For |x| < 1, the coefficient of x² in the expansion of (1 − x)^(−1/2) is:","o":["−3/8","3/8","1/8","3/4"],"a":1,"x":"n = −1/2, y = −x: n(n − 1)/2 · y² = (−1/2)(−3/2)/2 · x² = (3/4)/2 x² = 3x²/8. Forgetting the 2! gives 3/4."},{"id":"math-10-048","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"M","q":"The expansion of (2 + 3x)⁻¹ in ascending powers of x is valid for:","o":["|x| < 3/2","|x| < 1/3","|x| < 3","|x| < 2/3"],"a":3,"x":"(2 + 3x)⁻¹ = (1/2)(1 + 3x/2)⁻¹, valid when |3x/2| < 1, i.e. |x| < 2/3. Inverting the fraction gives |x| < 3/2."},{"id":"math-10-049","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"D","q":"If x is so small that x² and higher powers can be neglected, then √(4 + x)/(1 − x) is approximately:","o":["2 + 9x/4","2 + 5x/4","2 + 9x/8","2 − 7x/4"],"a":0,"x":"√(4 + x) = 2(1 + x/4)^(1/2) ≈ 2(1 + x/8) and 1/(1 − x) ≈ 1 + x. Product: 2(1 + x/8 + x) = 2 + x/4 + 2x = 2 + 9x/4. Multiplying only 1 by the 2 gives 2 + 5x/4."},{"id":"math-10-050","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"E","q":"For |x| < 1, the coefficient of xʳ in the expansion of (1 − x)⁻² is:","o":["r + 1","r","(−1)ʳ(r + 1)","r − 1"],"a":0,"x":"(1 − x)⁻² = 1 + 2x + 3x² + 4x³ + …, so xʳ has coefficient r + 1. The sign (−1)ʳ belongs to (1 + x)⁻²."},{"id":"math-10-051","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"D","q":"The sum of the series 1 + 1/4 + (1·3)/(4·8) + (1·3·5)/(4·8·12) + … is:","o":["2","√3","√2","1/√2"],"a":2,"x":"(1 − y)^(−1/2) = 1 + (1/2)y + (1·3)/(2·4)y² + (1·3·5)/(2·4·6)y³ + … With y = 1/2 the terms are 1, 1/4, 3/32, 15/384, matching the series. So the sum is (1 − 1/2)^(−1/2) = √2."},{"id":"math-10-052","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"M","q":"For |x| < 1, the coefficient of x² in the expansion of (1 + x)/(1 − x)² is:","o":["3","4","5","6"],"a":2,"x":"(1 − x)⁻² = 1 + 2x + 3x² + … Multiply by (1 + x): the x² terms are 3x² + x·2x = 5x². Forgetting the second product gives 3."},{"id":"math-10-053","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"M","q":"For small x, the first two terms of (8 + 3x)^(2/3) are:","o":["4 + 2x","4 + x","4 + x/4","8 + x"],"a":1,"x":"(8 + 3x)^(2/3) = 8^(2/3)(1 + 3x/8)^(2/3) ≈ 4(1 + (2/3)(3x/8)) = 4(1 + x/4) = 4 + x. Forgetting to multiply x/4 by 4 gives 4 + x/4."},{"id":"math-10-054","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"M","q":"If y = 1 + 2x + 3x² + 4x³ + … where |x| < 1, then x equals:","o":["1 − 1/y","1/√y − 1","√y − 1","1 − 1/√y"],"a":3,"x":"The series is (1 − x)⁻², so y = 1/(1 − x)², 1 − x = 1/√y (positive since x < 1) and x = 1 − 1/√y. 1 − 1/y treats the series as (1 − x)⁻¹."},{"id":"math-10-055","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"E","q":"Which of these, expanded by the binomial theorem in powers of x, gives an infinite series?","o":["(1 + x)^(1/2)","(1 + x)⁵","(1 − x)³","(2 + x)⁴"],"a":0,"x":"For a positive integral index the expansion stops after n + 1 terms. For a fractional index such as 1/2 the coefficients never become zero, so the series is infinite (valid for |x| < 1)."},{"id":"math-10-056","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"M","q":"Using the first two terms of the binomial series, (0.99)⁻³ is approximately:","o":["1.03","0.97","1.003","0.997"],"a":0,"x":"(1 − 0.01)⁻³ ≈ 1 + (−3)(−0.01) = 1 + 0.03 = 1.03. A sign slip gives 0.97; using 0.001 for the step gives 1.003."},{"id":"math-10-057","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"D","q":"For |x| < 1/2, the coefficient of x⁴ in the expansion of (1 − 2x)^(−1/2) is:","o":["35/128","35/8","−35/8","35/16"],"a":1,"x":"(1 − y)^(−1/2) has y⁴ coefficient (1·3·5·7)/(2·4·6·8) = 105/384 = 35/128. With y = 2x this is multiplied by 2⁴ = 16: 35/128 × 16 = 35/8. Forgetting 2⁴ leaves 35/128."},{"id":"math-10-058","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"M","q":"For |x| < 1, the third term in the expansion of (1 + x)^(−1/3) is:","o":["−2x²/9","2x²/9","4x²/9","x²/9"],"a":1,"x":"Third term = n(n − 1)/2! · x² with n = −1/3: (−1/3)(−4/3)/2 = (4/9)/2 = 2/9, so 2x²/9. Forgetting the 2! gives 4x²/9."},{"id":"math-10-059","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"D","q":"If x is so small that x³ and higher powers can be neglected, then √((1 + x)/(1 − x)) is approximately:","o":["1 + x + x²","1 + x − x²/2","1 + x + x²/4","1 + x + x²/2"],"a":3,"x":"(1 + x)^(1/2) ≈ 1 + x/2 − x²/8 and (1 − x)^(−1/2) ≈ 1 + x/2 + 3x²/8. Multiply: 1 + x + (−1/8 + 1/4 + 3/8)x² = 1 + x + x²/2."},{"id":"math-10-060","unit":"math-10","topic":"math-10-series","lo":"MATH-10.3","d":"M","q":"Using the first two terms of the binomial series, 1/√4.08 is approximately:","o":["0.505","0.49","0.495","0.51"],"a":2,"x":"1/√4.08 = (1/2)(1 + 0.02)^(−1/2) ≈ (1/2)(1 − 0.01) = 0.495. A sign slip gives 0.505; forgetting the index −1/2 gives (1/2)(0.98) = 0.49."},{"id":"math-11-001","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"E","q":"What is 150° expressed in radians?","o":["2π/3","3π/4","5π/6","7π/6"],"a":2,"x":"Multiply by π/180: 150 × π/180 = 5π/6. The option 2π/3 equals 120°, and 7π/6 equals 210°, so neither matches."},{"id":"math-11-002","unit":"math-11","topic":"math-11-ratios","lo":"MATH-11.2","d":"E","q":"The terminal side of angle α passes through the point P(−3, 4). What is sin α?","o":["4/5","−4/5","−3/5","3/5"],"a":0,"x":"r = √(9 + 16) = 5, so sin α = y/r = 4/5. The value −3/5 is x/r, which is cos α."},{"id":"math-11-003","unit":"math-11","topic":"math-11-basic","lo":"MATH-11.3","d":"E","q":"Given sin α = 3/5 and α in the second quadrant, what is cos α?","o":["−3/4","−4/5","3/4","4/5"],"a":1,"x":"cos²α = 1 − 9/25 = 16/25, so cos α = ±4/5; in the second quadrant cosine is negative, giving −4/5. The value 4/5 ignores the quadrant, and ±3/4 is tan α, not cos α."},{"id":"math-11-004","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"E","q":"An angle measures 7π/4 radians. What is its size in degrees?","o":["135°","225°","315°","300°"],"a":2,"x":"Multiply by 180/π: (7/4) × 180° = 315°. 225° is 5π/4, which comes from misreading the numerator as 5."},{"id":"math-11-005","unit":"math-11","topic":"math-11-ratios","lo":"MATH-11.2","d":"M","q":"The terminal side of angle α passes through P(−3, 4). What is the value of 2 sin α + cos α?","o":["−2/5","1","1/5","11/5"],"a":1,"x":"r = 5, so sin α = 4/5 and cos α = −3/5. Then 2 sin α + cos α = 8/5 − 3/5 = 1. The value 11/5 ignores the negative sign of cos α, and −2/5 swaps sin and cos."},{"id":"math-11-006","unit":"math-11","topic":"math-11-basic","lo":"MATH-11.3","d":"M","q":"Given cos α = −12/13 and α in the third quadrant, what is tan α?","o":["−5/12","−5/13","5/13","5/12"],"a":3,"x":"sin²α = 1 − 144/169 = 25/169 and sin α < 0 in the third quadrant, so sin α = −5/13. Then tan α = (−5/13)/(−12/13) = 5/12. The answer −5/12 forgets that tangent is positive in the third quadrant."},{"id":"math-11-007","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"E","q":"A circle has radius 6 cm. What is the length of the arc subtended by a central angle of π/3?","o":["π cm","3π cm","2π cm","6π cm"],"a":2,"x":"Arc length l = rθ = 6 × π/3 = 2π cm. The answer 6π cm uses the angle as if it were π, i.e. the arc of a half circle."},{"id":"math-11-008","unit":"math-11","topic":"math-11-ratios","lo":"MATH-11.2","d":"M","q":"The terminal side of angle α passes through P(4a, −3a), where a < 0. What is sin α?","o":["3/5","−4/5","−3/5","4/5"],"a":0,"x":"r = √(16a² + 9a²) = 5|a| = −5a because a < 0. So sin α = −3a/(−5a) = 3/5. The answer −3/5 comes from assuming a > 0; in fact P lies in the second quadrant."},{"id":"math-11-009","unit":"math-11","topic":"math-11-basic","lo":"MATH-11.3","d":"M","q":"Given tan α = 2, what is the value of (sin α + cos α)/(sin α − cos α)?","o":["−3","1/3","1","3"],"a":3,"x":"Divide numerator and denominator by cos α: (tan α + 1)/(tan α − 1) = 3/1 = 3. The value 1/3 inverts the fraction, and −3 comes from writing the denominator as cos α − sin α."},{"id":"math-11-010","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"M","q":"A sector has radius 6 and central angle 2π/3. What is its area?","o":["4π","6π","24π","12π"],"a":3,"x":"Sector area S = ½r²θ = ½ × 36 × 2π/3 = 12π. The value 24π forgets the factor ½, and 4π is the arc length rθ, not the area."},{"id":"math-11-011","unit":"math-11","topic":"math-11-ratios","lo":"MATH-11.2","d":"E","q":"If cos α < 0 and tan α < 0, in which quadrant does the terminal side of α lie?","o":["First","Second","Third","Fourth"],"a":1,"x":"cos α < 0 means the second or third quadrant. tan α < 0 means sin and cos have opposite signs, so sin α > 0: second quadrant. In the third quadrant tan α is positive."},{"id":"math-11-012","unit":"math-11","topic":"math-11-basic","lo":"MATH-11.3","d":"M","q":"Given tan α = 3, what is the value of sin α cos α?","o":["1/3","3/4","3/5","3/10"],"a":3,"x":"Write sin α cos α = sin α cos α/(sin²α + cos²α) and divide by cos²α: tan α/(tan²α + 1) = 3/10. The value 3/5 is twice this, which is sin 2α."},{"id":"math-11-013","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"M","q":"A sector of a circle with radius 5 cm has a perimeter of 20 cm. What is the area of the sector?","o":["10 cm²","20 cm²","50 cm²","25 cm²"],"a":3,"x":"The perimeter is 2r + l = 20, so the arc l = 10 cm and θ = l/r = 2. Area = ½lr = ½ × 10 × 5 = 25 cm². The value 50 cm² forgets the ½ in the area formula."},{"id":"math-11-014","unit":"math-11","topic":"math-11-ratios","lo":"MATH-11.2","d":"E","q":"What is the value of sin(π/6) + cos(π/3)?","o":["1/2","1","√3/2","√3"],"a":1,"x":"sin(π/6) = 1/2 and cos(π/3) = 1/2, so the sum is 1. Choosing √3 comes from using √3/2 for both values (the cosine of π/6 and sine of π/3)."},{"id":"math-11-015","unit":"math-11","topic":"math-11-basic","lo":"MATH-11.3","d":"M","q":"Given sin α + cos α = 1/5 with 0 < α < π, what is sin α cos α?","o":["−24/25","12/25","24/25","−12/25"],"a":3,"x":"Square both sides: 1 + 2 sin α cos α = 1/25, so 2 sin α cos α = −24/25 and sin α cos α = −12/25. The value −24/25 forgets to divide by 2."},{"id":"math-11-016","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"D","q":"A sector has a fixed perimeter of 16 cm. For which central angle is the area of the sector largest?","o":["2 rad","1 rad","π/2 rad","4 rad"],"a":0,"x":"With radius r, the arc is l = 16 − 2r and the area is S = ½lr = r(8 − r), which is largest at r = 4 (S = 16 cm²). Then l = 8 and θ = l/r = 2 rad. Choosing π/2 assumes a quarter circle is best, but the area depends only on r here."},{"id":"math-11-017","unit":"math-11","topic":"math-11-ratios","lo":"MATH-11.2","d":"E","q":"What is the value of tan(2π/3)?","o":["−√3","−√3/3","√3/3","√3"],"a":0,"x":"2π/3 is in the second quadrant, where tangent is negative, and its reference angle is π/3 with tan(π/3) = √3. So tan(2π/3) = −√3. The value −√3/3 uses the reference angle π/6 by mistake."},{"id":"math-11-018","unit":"math-11","topic":"math-11-basic","lo":"MATH-11.3","d":"D","q":"Given sin α + cos α = 1/5 with 0 < α < π, what is tan α?","o":["−3/4","3/4","4/3","−4/3"],"a":3,"x":"Squaring gives 2 sin α cos α = −24/25, so sin α > 0 > cos α. Then (sin α − cos α)² = 1 + 24/25 = 49/25 and sin α − cos α = 7/5. Solving with the sum: sin α = 4/5, cos α = −3/5, so tan α = −4/3. The value −3/4 swaps sin and cos."},{"id":"math-11-019","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"E","q":"Which angle has the same terminal side as −π/3?","o":["5π/3","2π/3","4π/3","7π/3"],"a":0,"x":"Angles with the same terminal side differ by 2kπ: −π/3 + 2π = 5π/3. The angle 7π/3 = π/3 + 2π shares a terminal side with +π/3, not −π/3."},{"id":"math-11-020","unit":"math-11","topic":"math-11-ratios","lo":"MATH-11.2","d":"E","q":"What is the value of cos(5π/4)?","o":["−1/2","−√2/2","1/2","√2/2"],"a":1,"x":"5π/4 = π + π/4 lies in the third quadrant, where cosine is negative, so cos(5π/4) = −cos(π/4) = −√2/2. The positive value √2/2 ignores the quadrant sign."},{"id":"math-11-021","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"M","q":"What is 22°30′ expressed in radians?","o":["π/16","π/4","π/8","3π/16"],"a":2,"x":"22°30′ = 22.5° and 22.5 × π/180 = π/8. Check: 4 × 22.5° = 90° = π/2. Doubling instead gives π/4."},{"id":"math-11-022","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"M","q":"The minute hand of a clock is 14 cm long. How far does its tip move in 20 minutes?","o":["14π/3 cm","56π/3 cm","28π/3 cm","7π/3 cm"],"a":2,"x":"In 20 minutes the hand turns 20/60 of a revolution = 120° = 2π/3 rad, so l = rθ = 14 × 2π/3 = 28π/3 cm. Using the angle π/3 gives 14π/3 cm."},{"id":"math-11-023","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"D","q":"What is the angle between the hour hand and the minute hand of a clock at 3:30, in radians?","o":["π/2","5π/12","π/4","7π/12"],"a":1,"x":"The minute hand is at 180°. The hour hand moves 30° per hour, so it is at 3 × 30° + 15° = 105°. The angle is 75° = 5π/12. Forgetting the hour hand's extra 15° gives π/2."},{"id":"math-11-024","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"M","q":"In a circle of radius 7 cm, an arc of length 11 cm subtends a central angle θ. Taking π = 22/7, what is θ in degrees?","o":["45°","180°","60°","90°"],"a":3,"x":"θ = l/r = 11/7 rad, and 11/7 × 180/π = 11/7 × 180 × 7/22 = 90°. Check: a quarter of the circumference 2π × 7 = 44 is 11."},{"id":"math-11-025","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"M","q":"A wheel turns at 300 revolutions per minute. What is its angular speed in radians per second?","o":["5π","600π","20π","10π"],"a":3,"x":"300 rev/min = 5 rev/s, and each revolution is 2π rad, so the speed is 10π rad/s. 5π forgets the 2 in 2π; 600π is per minute."},{"id":"math-11-026","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"E","q":"What is the smallest positive angle that has the same terminal side as −1000°?","o":["280°","100°","80°","260°"],"a":2,"x":"Add whole turns: −1000° + 3 × 360° = 80°, which lies between 0° and 360°. 280° is 360° − 80°, the reflection, not the same terminal side."},{"id":"math-11-027","unit":"math-11","topic":"math-11-angles","lo":"MATH-11.1","d":"D","q":"Two concentric circles have radii 3 cm and 5 cm. A central angle of π/4 cuts out the region between them. What is its area?","o":["4π cm²","π/2 cm²","2π cm²","π cm²"],"a":2,"x":"Sector area is ½r²θ, so the region is ½(5² − 3²)(π/4) = ½ × 16 × π/4 = 2π cm². Leaving out the ½ gives 4π; using (5 − 3)² gives π/2."},{"id":"math-11-028","unit":"math-11","topic":"math-11-ratios","lo":"MATH-11.2","d":"M","q":"What is the value of sin(−1110°)?","o":["−1/2","1/2","−√3/2","√3/2"],"a":0,"x":"−1110° + 3 × 360° = −30°, so sin(−1110°) = sin(−30°) = −sin 30° = −1/2. Forgetting that sine is odd gives 1/2."},{"id":"math-11-029","unit":"math-11","topic":"math-11-ratios","lo":"MATH-11.2","d":"E","q":"What is the value of tan 30° tan 60° + sin²45°?","o":["2","1","1/2","3/2"],"a":3,"x":"tan 30° tan 60° = (1/√3)(√3) = 1 and sin²45° = (1/√2)² = 1/2, so the total is 3/2. Taking sin²45° as 1 gives 2."},{"id":"math-11-030","unit":"math-11","topic":"math-11-ratios","lo":"MATH-11.2","d":"M","q":"If sin θ cos θ > 0 and sin θ tan θ < 0, in which quadrant does the terminal side of θ lie?","o":["Third","First","Second","Fourth"],"a":0,"x":"sin θ tan θ = sin²θ/cos θ < 0 forces cos θ < 0; then sin θ cos θ > 0 forces sin θ < 0. Both negative means the third quadrant."},{"id":"math-11-031","unit":"math-11","topic":"math-11-ratios","lo":"MATH-11.2","d":"M","q":"If sec θ = −2 and the terminal side of θ is in the third quadrant, what is cosec θ?","o":["2/√3","−2/√3","−√3/2","−2"],"a":1,"x":"cos θ = −1/2, so sin θ = −√(1 − 1/4) = −√3/2 (negative in the third quadrant) and cosec θ = −2/√3. −√3/2 is sin θ itself, not its reciprocal."},{"id":"math-11-032","unit":"math-11","topic":"math-11-ratios","lo":"MATH-11.2","d":"M","q":"What is the value of the product cos 1° × cos 2° × cos 3° × ... × cos 179°?","o":["1","0","−1","1/2"],"a":1,"x":"The product contains the factor cos 90° = 0, so the whole product is 0. Pairing cos θ with cos(180° − θ) = −cos θ and forgetting the middle factor leads to a wrong ±1."},{"id":"math-11-033","unit":"math-11","topic":"math-11-ratios","lo":"MATH-11.2","d":"D","q":"What is the value of sin²10° + sin²20° + sin²30° + ... + sin²80°?","o":["4","5","8","7/2"],"a":0,"x":"There are 8 terms. sin 80° = cos 10°, and so on, so the terms pair up as sin²10° + cos²10° = 1 four times: the sum is 4. Running the list on to sin²90° = 1 gives 5."},{"id":"math-11-034","unit":"math-11","topic":"math-11-basic","lo":"MATH-11.3","d":"E","q":"What does (1 − cos²θ)(1 + cot²θ) simplify to?","o":["1","sin²θ","cos²θ","tan²θ"],"a":0,"x":"1 − cos²θ = sin²θ and 1 + cot²θ = cosec²θ, so the product is sin²θ × cosec²θ = 1."},{"id":"math-11-035","unit":"math-11","topic":"math-11-basic","lo":"MATH-11.3","d":"M","q":"What does sec⁴θ − tan⁴θ simplify to?","o":["1","2sec²θ","1 + 2tan²θ","1 − 2tan²θ"],"a":2,"x":"Difference of squares: (sec²θ − tan²θ)(sec²θ + tan²θ) = 1 × (1 + tan²θ + tan²θ) = 1 + 2tan²θ. Stopping at the first factor gives 1."},{"id":"math-11-036","unit":"math-11","topic":"math-11-basic","lo":"MATH-11.3","d":"D","q":"If sec θ + tan θ = 3, what is sec θ?","o":["4/3","1/3","5/3","10/3"],"a":2,"x":"sec²θ − tan²θ = 1 gives sec θ − tan θ = 1/3. Adding the two equations: 2 sec θ = 10/3, so sec θ = 5/3 (and tan θ = 4/3). 4/3 is tan θ; 10/3 forgets to halve."},{"id":"math-11-037","unit":"math-11","topic":"math-11-basic","lo":"MATH-11.3","d":"M","q":"If sin θ + cosec θ = 2, what is sin²θ + cosec²θ?","o":["4","2","6","0"],"a":1,"x":"Square: sin²θ + 2 sin θ cosec θ + cosec²θ = 4, and sin θ cosec θ = 1, so sin²θ + cosec²θ = 4 − 2 = 2. Check: sin θ = 1 gives 1 + 1 = 2."},{"id":"math-11-038","unit":"math-11","topic":"math-11-basic","lo":"MATH-11.3","d":"M","q":"If tan θ + cot θ = 4, what is sin θ cos θ?","o":["1/4","4","1/2","1/8"],"a":0,"x":"tan θ + cot θ = (sin²θ + cos²θ)/(sin θ cos θ) = 1/(sin θ cos θ) = 4, so sin θ cos θ = 1/4. Forgetting to take the reciprocal gives 4."},{"id":"math-11-039","unit":"math-11","topic":"math-11-basic","lo":"MATH-11.3","d":"D","q":"For 0 < θ < π/2, what is √[(1 − sin θ)/(1 + sin θ)] equal to?","o":["sec θ + tan θ","tan θ − sec θ","sec θ − tan θ","cosec θ − cot θ"],"a":2,"x":"Multiply inside by (1 − sin θ)/(1 − sin θ): √[(1 − sin θ)²/cos²θ] = (1 − sin θ)/cos θ, positive since cos θ > 0, which is sec θ − tan θ. tan θ − sec θ has the wrong sign."},{"id":"math-11-040","unit":"math-11","topic":"math-11-basic","lo":"MATH-11.3","d":"M","q":"If x = a sec θ and y = b tan θ (a, b > 0), which equation do x and y satisfy for every θ?","o":["x²/a² + y²/b² = 1","x²/a² − y²/b² = 1","y²/b² − x²/a² = 1","x/a − y/b = 1"],"a":1,"x":"sec θ = x/a and tan θ = y/b, and sec²θ − tan²θ = 1, so x²/a² − y²/b² = 1. Using sin²θ + cos²θ = 1 by mistake gives the plus sign."},{"id":"math-12-001","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"M","q":"Which expression equals sin⁴α − cos⁴α for all α?","o":["cos 2α","sin 2α","−cos 2α","1"],"a":2,"x":"Factor: sin⁴α − cos⁴α = (sin²α − cos²α)(sin²α + cos²α) = sin²α − cos²α = −cos 2α. Choosing cos 2α misses the sign, since cos 2α = cos²α − sin²α."},{"id":"math-12-002","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"E","q":"For angles where it is defined, tan(π − α) equals","o":["tan α","−tan α","1/tan α","−1/tan α"],"a":1,"x":"tan(π − α) = sin(π − α)/cos(π − α) = sin α/(−cos α) = −tan α. Using +tan α forgets that π − α changes the sign of the cosine."},{"id":"math-12-003","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"E","q":"What is the value of sin 15° cos 15°?","o":["1/8","1/4","1/2","√3/4"],"a":1,"x":"sin 15° cos 15° = ½ sin 30° = ½ × ½ = 1/4. The value 1/2 is sin 30° itself, forgetting the factor ½ from sin 2θ = 2 sin θ cos θ."},{"id":"math-12-004","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"M","q":"For angles where it is defined, simplify [sin(π − α) · cos(2π − α) · tan(π − α)] / [cos(−α) · sin(π + α)].","o":["tan α","−tan α","−sin α","cos α"],"a":0,"x":"sin(π − α) = sin α, cos(2π − α) = cos α, tan(π − α) = −tan α, so the numerator is −sin²α. The denominator is cos α · (−sin α) = −sin α cos α. The ratio is sin α/cos α = tan α. The answer −tan α comes from missing the minus sign in sin(π + α) = −sin α."},{"id":"math-12-005","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"E","q":"What is the value of cos²22.5° − sin²22.5°?","o":["1/2","√3/2","1","√2/2"],"a":3,"x":"cos²θ − sin²θ = cos 2θ, so the value is cos 45° = √2/2. The answer 1 confuses this with cos²θ + sin²θ."},{"id":"math-12-006","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"M","q":"Given sin(π/6 − α) = 1/3, what is cos(π/3 + α)?","o":["−1/3","2√2/3","−2√2/3","1/3"],"a":3,"x":"(π/6 − α) + (π/3 + α) = π/2, so cos(π/3 + α) = cos[π/2 − (π/6 − α)] = sin(π/6 − α) = 1/3. The values ±2√2/3 come from computing a cosine of the same angle π/6 − α instead of using the complementary relation."},{"id":"math-12-007","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"E","q":"What is the value of 2 tan 22.5° / (1 − tan²22.5°)?","o":["1","1/2","√2/2","√3"],"a":0,"x":"2 tan θ/(1 − tan²θ) = tan 2θ, so the value is tan 45° = 1. The value √2/2 is sin 45° or cos 45°, not tan 45°."},{"id":"math-12-008","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"M","q":"Given cos(π/6 − α) = √3/3, what is cos(5π/6 + α)?","o":["√3/3","−√3/3","−√6/3","√6/3"],"a":1,"x":"(5π/6 + α) + (π/6 − α) = π, so cos(5π/6 + α) = cos[π − (π/6 − α)] = −cos(π/6 − α) = −√3/3. Answering √3/3 forgets that cos(π − x) = −cos x."},{"id":"math-12-009","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"M","q":"Given sin α = 3/5 with α in the second quadrant, what is sin 2α?","o":["−7/25","7/25","−24/25","24/25"],"a":2,"x":"cos α = −4/5 in the second quadrant, so sin 2α = 2 sin α cos α = 2(3/5)(−4/5) = −24/25. The value 24/25 takes cos α as positive; 7/25 is cos 2α."},{"id":"math-12-010","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"M","q":"Given cos(π + α) = −1/2 and 3π/2 < α < 2π, what is sin(2π − α)?","o":["−√3/2","√3/2","−1/2","1/2"],"a":1,"x":"cos(π + α) = −cos α = −1/2 gives cos α = 1/2. In the fourth quadrant sin α = −√3/2, and sin(2π − α) = −sin α = √3/2. The answer −√3/2 stops at sin α and forgets the reduction formula."},{"id":"math-12-011","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"M","q":"Given tan α = 3, what is cos 2α?","o":["4/5","3/5","−3/5","−4/5"],"a":3,"x":"cos 2α = (cos²α − sin²α)/(cos²α + sin²α) = (1 − tan²α)/(1 + tan²α) = (1 − 9)/10 = −4/5. The value 3/5 is sin 2α = 2 tan α/(1 + tan²α)."},{"id":"math-12-012","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"D","q":"Let f(α) = [sin(π − α) · cos(2π − α) · cos(3π/2 − α)] / [cos(π/2 − α) · sin(−π − α)]. If α is in the third quadrant and cos(α − 3π/2) = 1/5, what is f(α)?","o":["2√6/5","−2√6/5","−1/5","1/5"],"a":0,"x":"The numerator is sin α · cos α · (−sin α) and the denominator is sin α · sin α, so f(α) = −cos α. cos(α − 3π/2) = −sin α = 1/5 gives sin α = −1/5, and in the third quadrant cos α = −√(24)/5 = −2√6/5. So f(α) = 2√6/5. The answer −2√6/5 is cos α itself, missing the minus sign in f."},{"id":"math-12-013","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"M","q":"Given tan α = 2, what is tan 2α?","o":["4","−4/3","4/3","−3/4"],"a":1,"x":"tan 2α = 2 tan α/(1 − tan²α) = 4/(1 − 4) = −4/3. The value 4 is just 2 tan α, forgetting the denominator, and 4/3 drops its negative sign."},{"id":"math-12-014","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"E","q":"What is the exact value of sin 75°?","o":["(√6 − √2)/4","(√2 + 1)/2","(√6 + √2)/4","(√6 + √2)/2"],"a":2,"x":"sin 75° = sin(45° + 30°) = sin 45° cos 30° + cos 45° sin 30° = (√2/2)(√3/2) + (√2/2)(1/2) = (√6 + √2)/4. The value (√6 − √2)/4 is sin 15°, and (√2 + 1)/2 wrongly adds sin 45° and sin 30°."},{"id":"math-12-015","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"D","q":"Given cos(π/4 − α) = 3/5, what is sin 2α?","o":["−24/25","7/25","24/25","−7/25"],"a":3,"x":"sin 2α = cos(π/2 − 2α) = cos[2(π/4 − α)] = 2cos²(π/4 − α) − 1 = 18/25 − 1 = −7/25. The value 7/25 uses 1 − 2cos² instead of 2cos² − 1."},{"id":"math-12-016","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"E","q":"What is the value of sin 20° cos 40° + cos 20° sin 40°?","o":["1/2","√2/2","1","√3/2"],"a":3,"x":"sin A cos B + cos A sin B = sin(A + B), so the value is sin(20° + 40°) = sin 60° = √3/2. Choosing 1/2 gives cos 60° instead of sin 60°."},{"id":"math-12-017","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"D","q":"Given sin α + cos α = 1/2 with 0 < α < π, what is cos 2α?","o":["√7/4","−3/4","±√7/4","−√7/4"],"a":3,"x":"Squaring: 1 + sin 2α = 1/4, so 2 sin α cos α = −3/4; hence sin α > 0 > cos α. (cos α − sin α)² = 1 + 3/4 = 7/4 and cos α − sin α < 0, so cos α − sin α = −√7/2. cos 2α = (cos α − sin α)(cos α + sin α) = −√7/4. The option ±√7/4 ignores the sign information, and −3/4 is sin 2α."},{"id":"math-12-018","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"E","q":"What is the value of cos 80° cos 20° + sin 80° sin 20°?","o":["−1/2","√3/2","1/2","1"],"a":2,"x":"cos A cos B + sin A sin B = cos(A − B), so the value is cos 60° = 1/2. The value −1/2 is cos 100°, from using the plus sign in cos(A + B)."},{"id":"math-12-019","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"M","q":"For angles where it is defined, (1 + cos 2α)/sin 2α simplifies to","o":["sin α","cos α","1/tan α","tan α"],"a":2,"x":"1 + cos 2α = 2cos²α and sin 2α = 2 sin α cos α, so the quotient is cos α/sin α = 1/tan α. The answer tan α belongs to (1 − cos 2α)/sin 2α."},{"id":"math-12-020","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"M","q":"What is the exact value of tan 15°?","o":["√3 − 1","2 + √3","2 − √3","(√3 − 1)/2"],"a":2,"x":"tan 15° = tan(45° − 30°) = (1 − √3/3)/(1 + √3/3) = (3 − √3)/(3 + √3) = (12 − 6√3)/6 = 2 − √3. The value 2 + √3 is tan 75°, obtained with the sum formula instead of the difference."},{"id":"math-12-021","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"E","q":"Which expression equals cos 2α for every α?","o":["2sin²α − 1","1 − 2sin²α","1 − sin²α","2 sin α cos α"],"a":1,"x":"cos 2α = cos²α − sin²α = (1 − sin²α) − sin²α = 1 − 2sin²α. The form 2sin²α − 1 has the wrong sign (it equals −cos 2α), and 2 sin α cos α is sin 2α."},{"id":"math-12-022","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"M","q":"What is the value of (1 + tan 15°)/(1 − tan 15°)?","o":["√3/3","1","2 + √3","√3"],"a":3,"x":"Since tan 45° = 1, the expression is (tan 45° + tan 15°)/(1 − tan 45° tan 15°) = tan 60° = √3. The value √3/3 is tan 30° = tan(45° − 15°), the difference formula."},{"id":"math-12-023","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"D","q":"What is the value of cos 20° · cos 40° · cos 80°?","o":["√3/8","1/8","1/4","1/16"],"a":1,"x":"Multiply and divide by sin 20°: sin 20° cos 20° cos 40° cos 80° = ½ sin 40° cos 40° cos 80° = ¼ sin 80° cos 80° = ⅛ sin 160° = ⅛ sin 20°. Dividing by sin 20° gives 1/8. The value 1/16 applies the halving step one time too many."},{"id":"math-12-024","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"M","q":"α and β are acute angles with sin α = 3/5 and cos β = 5/13. What is cos(α + β)?","o":["−56/65","16/65","56/65","−16/65"],"a":3,"x":"cos α = 4/5 and sin β = 12/13. cos(α + β) = cos α cos β − sin α sin β = 20/65 − 36/65 = −16/65. The value 56/65 is cos(α − β), from using a plus sign."},{"id":"math-12-025","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"M","q":"Given cos 2θ = 7/25 with 0 < θ < π/2, what is sin θ?","o":["4/5","3/5","3/4","9/25"],"a":1,"x":"cos 2θ = 1 − 2sin²θ gives sin²θ = (1 − 7/25)/2 = 9/25, and sin θ > 0, so sin θ = 3/5. The value 9/25 forgets the square root, and 4/5 is cos θ."},{"id":"math-12-026","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"M","q":"α is acute with sin α = 4/5, and β lies between π/2 and π with cos β = −5/13. What is sin(α + β)?","o":["56/65","16/65","−56/65","−63/65"],"a":1,"x":"cos α = 3/5 and sin β = 12/13. sin(α + β) = sin α cos β + cos α sin β = (4/5)(−5/13) + (3/5)(12/13) = −20/65 + 36/65 = 16/65. The value 56/65 ignores the negative sign of cos β, and −56/65 is sin(α − β)."},{"id":"math-12-027","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"E","q":"For angles where it is defined, which expression equals sin 2α?","o":["2 tan α/(1 − tan²α)","2 tan α/(1 + tan²α)","(1 − tan²α)/(1 + tan²α)","tan α/(1 + tan²α)"],"a":1,"x":"sin 2α = 2 sin α cos α/(sin²α + cos²α); dividing by cos²α gives 2 tan α/(1 + tan²α). The expression 2 tan α/(1 − tan²α) is tan 2α, and (1 − tan²α)/(1 + tan²α) is cos 2α."},{"id":"math-12-028","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"D","q":"α and β are acute angles with cos α = 13/14 and cos(α + β) = 1/7. What is β?","o":["π/6","π/3","π/4","2π/3"],"a":1,"x":"sin α = √(1 − 169/196) = 3√3/14 and, since 0 < α + β < π, sin(α + β) = √(1 − 1/49) = 4√3/7. cos β = cos[(α + β) − α] = (1/7)(13/14) + (4√3/7)(3√3/14) = 13/98 + 36/98 = 1/2, so β = π/3. 2π/3 has cosine −1/2 and is not acute."},{"id":"math-12-029","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"M","q":"What is the value of cos²15° − sin²15°?","o":["1/2","√3/4","√3/2","1"],"a":2,"x":"cos²θ − sin²θ = cos 2θ, so the value is cos 30° = √3/2. The answer 1 confuses this with cos²θ + sin²θ, and 1/2 is sin 30°."},{"id":"math-12-030","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"D","q":"Given sin(α + β) = 1/2 and sin(α − β) = 1/3, what is tan α / tan β?","o":["5","1/5","5/12","3/2"],"a":0,"x":"Adding and subtracting the expansions: sin α cos β = (1/2 + 1/3)/2 = 5/12 and cos α sin β = (1/2 − 1/3)/2 = 1/12. Then tan α/tan β = (sin α cos β)/(cos α sin β) = 5. The value 3/2 just divides the two given sines, which is not the required ratio."},{"id":"math-12-031","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"M","q":"Given sin α = 1/3, what is cos 2α?","o":["7/9","−7/9","1/3","8/9"],"a":0,"x":"cos 2α = 1 − 2sin²α = 1 − 2/9 = 7/9. The value 1/3 forgets to square sin α, and 8/9 is cos²α."},{"id":"math-12-032","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"D","q":"What is the value of tan 20° + tan 40° + √3 tan 20° tan 40°?","o":["√3/3","1","√3","2√3"],"a":2,"x":"tan 60° = (tan 20° + tan 40°)/(1 − tan 20° tan 40°) = √3, so tan 20° + tan 40° = √3 − √3 tan 20° tan 40°. Adding √3 tan 20° tan 40° leaves √3. The value 2√3 comes from using + in the denominator of the tangent sum formula."},{"id":"math-12-033","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"M","q":"Given tan α = 1/3, what is tan 2α?","o":["3/4","4/3","2/3","3/5"],"a":0,"x":"tan 2α = 2 tan α/(1 − tan²α) = (2/3)/(8/9) = 3/4. The value 2/3 is only 2 tan α, and 3/5 is sin 2α = 2 tan α/(1 + tan²α)."},{"id":"math-12-034","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"M","q":"Which expression equals √3 sin x + cos x for all x?","o":["2 sin(x + π/3)","2 sin(x + π/6)","2 sin(x − π/6)","2 cos(x + π/6)"],"a":1,"x":"√3 sin x + cos x = 2[(√3/2) sin x + (1/2) cos x] = 2[sin x cos(π/6) + cos x sin(π/6)] = 2 sin(x + π/6). Choosing π/3 matches cos(π/3) = 1/2 to the wrong term: 2 sin(x + π/3) = sin x + √3 cos x."},{"id":"math-12-035","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"D","q":"Given cos α = −7/25 with π < α < 3π/2, what is cos(α/2)?","o":["−3/5","4/5","3/5","−4/5"],"a":0,"x":"cos α = 2cos²(α/2) − 1 gives cos²(α/2) = (1 − 7/25)/2 = 9/25. Since π/2 < α/2 < 3π/4, α/2 is in the second quadrant and cos(α/2) = −3/5. The value 3/5 ignores the quadrant of α/2."},{"id":"math-12-036","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"M","q":"For all angles α and β, sin(α + β) · sin(α − β) equals","o":["sin²α + sin²β","cos²α − sin²β","sin²α − cos²β","sin²α − sin²β"],"a":3,"x":"Expand: (sin α cos β)² − (cos α sin β)² = sin²α(1 − sin²β) − (1 − sin²α)sin²β = sin²α − sin²β. cos²α − sin²β is the value of cos(α + β) · cos(α − β), the usual mix-up."},{"id":"math-12-037","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"M","q":"α and β are acute angles with tan α = 1/2 and tan β = 1/3. What is α + β?","o":["π/4","π/3","π/6","5π/12"],"a":0,"x":"tan(α + β) = (1/2 + 1/3)/(1 − 1/6) = (5/6)/(5/6) = 1. Both angles are acute and their sum is under π/2 here, so α + β = π/4."},{"id":"math-12-038","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"D","q":"Given sin α + sin β = 1 and cos α + cos β = 1/2, what is cos(α − β)?","o":["−3/8","3/8","1/8","5/8"],"a":0,"x":"Square and add: (sin²α + cos²α) + (sin²β + cos²β) + 2(cos α cos β + sin α sin β) = 1 + 1/4, so 2 + 2cos(α − β) = 5/4 and cos(α − β) = −3/8. Forgetting one of the two 1's gives 1/8."},{"id":"math-12-039","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"M","q":"What is the least value of 5 sin x − 12 cos x + 3?","o":["−14","−10","−13","16"],"a":1,"x":"5 sin x − 12 cos x = 13 sin(x − θ) with cos θ = 5/13, sin θ = 12/13, so it ranges from −13 to 13. The least value is −13 + 3 = −10; −14 comes from using 5 + 12 = 17 instead of √(25 + 144) = 13."},{"id":"math-12-040","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"M","q":"What is the value of sin 105° + cos 105°?","o":["√6/2","−√2/2","(√6 − √2)/4","√2/2"],"a":3,"x":"sin 105° = sin(60° + 45°) = (√6 + √2)/4 and cos 105° = cos(60° + 45°) = (√2 − √6)/4. Adding gives 2√2/4 = √2/2. Check: sin x + cos x = √2 sin(x + 45°) = √2 sin 150° = √2/2."},{"id":"math-12-041","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"E","q":"The fundamental law of trigonometry states that, for all angles α and β,","o":["cos(α − β) = cos α cos β − sin α sin β","cos(α − β) = sin α cos β − cos α sin β","cos(α − β) = cos α cos β + sin α sin β","cos(α − β) = cos α − cos β"],"a":2,"x":"The fundamental law is cos(α − β) = cos α cos β + sin α sin β. The form with a minus sign is the formula for cos(α + β); sin α cos β − cos α sin β is sin(α − β)."},{"id":"math-12-042","unit":"math-12","topic":"math-12-compound","lo":"MATH-12.1","d":"D","q":"Given tan(α + β) = 3 and tan(α − β) = 2, what is tan 2α?","o":["−1","1","1/7","5"],"a":0,"x":"Write 2α = (α + β) + (α − β): tan 2α = (3 + 2)/(1 − 3 × 2) = 5/(−5) = −1. Using the difference formula gives (3 − 2)/(1 + 6) = 1/7, which is tan 2β."},{"id":"math-12-043","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"M","q":"Given cos θ = 1/3, what is cos 3θ?","o":["23/27","−5/9","−23/27","31/27"],"a":2,"x":"cos 3θ = 4cos³θ − 3cos θ = 4/27 − 1 = −23/27. Using 3cos θ − 4cos³θ (the pattern of sin 3θ) gives 23/27; squaring instead of cubing gives 4/9 − 1 = −5/9."},{"id":"math-12-044","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"M","q":"What is the exact value of tan 67.5°?","o":["√2 + 1","√2 − 1","2 + √3","(√2 + 1)/2"],"a":0,"x":"tan(θ/2) = (1 − cos θ)/sin θ with θ = 135°: (1 + √2/2)/(√2/2) = (2 + √2)/√2 = √2 + 1. √2 − 1 is tan 22.5°; 2 + √3 is tan 75°."},{"id":"math-12-045","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"M","q":"Given tan(θ/2) = 1/2, what is sin θ + cos θ?","o":["1/5","4/5","7/5","8/5"],"a":2,"x":"With t = tan(θ/2) = 1/2: sin θ = 2t/(1 + t²) = 1/(5/4) = 4/5 and cos θ = (1 − t²)/(1 + t²) = (3/4)/(5/4) = 3/5. The sum is 7/5; 1/5 is sin θ − cos θ."},{"id":"math-12-046","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"D","q":"For angles where it is defined, (sin θ + sin 2θ)/(1 + cos θ + cos 2θ) simplifies to","o":["cot θ","tan 2θ","tan(θ/2)","tan θ"],"a":3,"x":"Numerator: sin θ + 2 sin θ cos θ = sin θ(1 + 2cos θ). Denominator: 1 + cos θ + 2cos²θ − 1 = cos θ(1 + 2cos θ). The ratio is sin θ/cos θ = tan θ. Check θ = 45°: (√2/2 + 1)/(1 + √2/2 + 0) = 1."},{"id":"math-12-047","unit":"math-12","topic":"math-12-multiple","lo":"MATH-12.2","d":"D","q":"Given cos 2θ = 1/3, what is sin⁴θ + cos⁴θ?","o":["4/9","5/9","2/3","7/9"],"a":1,"x":"cos²θ = (1 + cos 2θ)/2 = 2/3 and sin²θ = (1 − cos 2θ)/2 = 1/3, so sin⁴θ + cos⁴θ = 4/9 + 1/9 = 5/9. Check: 1 − ½ sin²2θ = 1 − ½ × 8/9 = 5/9. 4/9 is cos⁴θ alone."},{"id":"math-12-048","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"E","q":"What is the value of sin 75° + sin 15°?","o":["√2/2","√3/2","√6/2","√6/4"],"a":2,"x":"sin C + sin D = 2 sin((C + D)/2) cos((C − D)/2) = 2 sin 45° cos 30° = 2 × (√2/2) × (√3/2) = √6/2. Forgetting the factor 2 gives √6/4."},{"id":"math-12-049","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"E","q":"What is the value of cos 75° − cos 15°?","o":["√2/2","−√6/2","√6/2","−√2/2"],"a":3,"x":"cos C − cos D = −2 sin((C + D)/2) sin((C − D)/2) = −2 sin 45° sin 30° = −2 × (√2/2) × ½ = −√2/2. Dropping the minus sign gives √2/2; √6/2 is cos 75° + cos 15°."},{"id":"math-12-050","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"E","q":"Which expression equals 2 sin 5x cos 3x for all x?","o":["sin 8x − sin 2x","sin 8x + sin 2x","cos 8x + cos 2x","sin 15x"],"a":1,"x":"2 sin A cos B = sin(A + B) + sin(A − B) = sin 8x + sin 2x. sin 8x − sin 2x is 2 cos 5x sin 3x."},{"id":"math-12-051","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"M","q":"Which expression equals 2 sin 3x sin x for all x?","o":["cos 4x − cos 2x","cos 2x + cos 4x","cos 2x − cos 4x","sin 4x − sin 2x"],"a":2,"x":"2 sin A sin B = cos(A − B) − cos(A + B) = cos 2x − cos 4x. Writing cos(A + B) − cos(A − B) reverses the sign; cos 2x + cos 4x is 2 cos 3x cos x."},{"id":"math-12-052","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"M","q":"sin 70° − sin 10° is equal to","o":["sin 40°","2 cos 40°","cos 40°","sin 60°"],"a":2,"x":"sin C − sin D = 2 cos((C + D)/2) sin((C − D)/2) = 2 cos 40° sin 30° = 2 cos 40° × ½ = cos 40°. Leaving out sin 30° = ½ gives 2 cos 40°."},{"id":"math-12-053","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"M","q":"What is the value of cos 10° + cos 110° + cos 130°?","o":["1","1/2","0","−1/2"],"a":2,"x":"cos 130° + cos 10° = 2 cos 70° cos 60° = cos 70°, and cos 110° = −cos 70°. So the sum is cos 70° − cos 70° = 0."},{"id":"math-12-054","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"M","q":"For angles where it is defined, (sin 5x + sin 3x)/(cos 5x + cos 3x) equals","o":["tan 4x","tan x","cot 4x","tan 8x"],"a":0,"x":"Numerator 2 sin 4x cos x, denominator 2 cos 4x cos x, so the ratio is tan 4x. tan x would come from using the half-difference angle instead of the half-sum."},{"id":"math-12-055","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"M","q":"For angles where it is defined, (cos x − cos 3x)/(sin 3x − sin x) equals","o":["−tan 2x","cot 2x","tan x","tan 2x"],"a":3,"x":"cos x − cos 3x = −2 sin 2x sin(−x) = 2 sin 2x sin x and sin 3x − sin x = 2 cos 2x sin x. The ratio is tan 2x. Missing the sign of sin(−x) gives −tan 2x."},{"id":"math-12-056","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"E","q":"Which expression equals cos 4x cos 2x for all x?","o":["½(cos 6x + cos 2x)","cos 6x + cos 2x","½(cos 6x − cos 2x)","½(sin 6x + sin 2x)"],"a":0,"x":"2 cos A cos B = cos(A + B) + cos(A − B), so cos 4x cos 2x = ½(cos 6x + cos 2x). Forgetting the ½ gives cos 6x + cos 2x."},{"id":"math-12-057","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"M","q":"What is the value of sin 75° cos 15°?","o":["(2 − √3)/4","(1 + √3)/4","√3/4","(2 + √3)/4"],"a":3,"x":"sin 75° cos 15° = ½[sin 90° + sin 60°] = ½(1 + √3/2) = (2 + √3)/4. Check: cos 15° = sin 75°, so it is sin²75° = (1 − cos 150°)/2, the same value."},{"id":"math-12-058","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"M","q":"What is the value of 2 sin 52.5° sin 7.5°?","o":["(√2 + 1)/2","(√2 − 1)/2","(1 − √2)/2","(√3 − √2)/2"],"a":1,"x":"2 sin A sin B = cos(A − B) − cos(A + B) = cos 45° − cos 60° = √2/2 − ½ = (√2 − 1)/2. Reversing the order gives (1 − √2)/2, which is negative although both sines are positive."},{"id":"math-12-059","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"D","q":"Given sin A + sin B = 1/2 and cos A + cos B = 1, what is cos(A + B)?","o":["−3/5","4/5","3/5","1/3"],"a":2,"x":"Dividing the sum-to-product forms: 2 sin((A+B)/2)cos((A−B)/2) ÷ 2 cos((A+B)/2)cos((A−B)/2) gives tan((A + B)/2) = 1/2. Then cos(A + B) = (1 − t²)/(1 + t²) = (3/4)/(5/4) = 3/5; 4/5 is sin(A + B)."},{"id":"math-12-060","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"D","q":"A, B and C are the angles of a triangle (A + B + C = π). Which expression equals sin 2A + sin 2B + sin 2C?","o":["4 cos A cos B cos C","−4 sin A sin B sin C","2 sin A sin B sin C","4 sin A sin B sin C"],"a":3,"x":"sin 2A + sin 2B = 2 sin(A + B) cos(A − B) = 2 sin C cos(A − B), and sin 2C = 2 sin C cos C = −2 sin C cos(A + B). So the sum is 2 sin C[cos(A − B) − cos(A + B)] = 4 sin A sin B sin C. Check with an equilateral triangle: 3(√3/2) = 4(√3/2)³."},{"id":"math-12-061","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"M","q":"What is the value of (sin 80° − sin 20°)/(cos 80° + cos 20°)?","o":["√3","1/√3","1","−1/√3"],"a":1,"x":"Numerator 2 cos 50° sin 30° = cos 50°; denominator 2 cos 50° cos 30° = √3 cos 50°. The ratio is 1/√3, that is tan 30°. Taking the ratio upside down gives √3."},{"id":"math-12-062","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"M","q":"What is the value of sin 37.5° cos 7.5°?","o":["(√2 + 1)/4","(√2 − 1)/4","(√3 + 1)/4","(√2 + 1)/2"],"a":0,"x":"2 sin A cos B = sin(A + B) + sin(A − B), so sin 37.5° cos 7.5° = ½(sin 45° + sin 30°) = ½(√2/2 + ½) = (√2 + 1)/4. Forgetting the ½ gives (√2 + 1)/2."},{"id":"math-12-063","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"D","q":"As x varies, what is the greatest value of sin(x + 20°) · cos(x − 10°)?","o":["1","3/4","1/2","5/4"],"a":1,"x":"sin(x + 20°)cos(x − 10°) = ½[sin(2x + 10°) + sin 30°] = ½ sin(2x + 10°) + 1/4. The greatest value is ½ + 1/4 = 3/4. Taking 1 for the greatest value of a product of a sine and a cosine ignores that they cannot both be 1 here."},{"id":"math-12-064","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"M","q":"Which expression equals sin(x + 60°) − sin(x − 60°) for all x?","o":["√3 cos x","√3 sin x","cos x","−√3 cos x"],"a":0,"x":"sin C − sin D = 2 cos((C + D)/2) sin((C − D)/2) = 2 cos x sin 60° = √3 cos x. Using sin instead of cos for the half-sum gives √3 sin x."},{"id":"math-12-065","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"D","q":"Which expression equals cos x + cos 3x + cos 5x + cos 7x for all x?","o":["4 cos x cos 3x cos 4x","2 cos 2x cos 4x","4 sin x sin 2x sin 4x","4 cos x cos 2x cos 4x"],"a":3,"x":"Pair the outer and inner terms: cos 7x + cos x = 2 cos 4x cos 3x and cos 5x + cos 3x = 2 cos 4x cos x. So the sum is 2 cos 4x(cos 3x + cos x) = 2 cos 4x · 2 cos 2x cos x = 4 cos x cos 2x cos 4x."},{"id":"math-12-066","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"M","q":"Which expression equals sin x + sin 2x + sin 3x for all x?","o":["sin 2x (1 + 2 cos x)","sin 2x (1 + 2 sin x)","cos 2x (1 + 2 cos x)","2 sin 2x cos x"],"a":0,"x":"sin 3x + sin x = 2 sin 2x cos x, so the sum is sin 2x + 2 sin 2x cos x = sin 2x(1 + 2cos x). 2 sin 2x cos x leaves out the middle term sin 2x."},{"id":"math-12-067","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"M","q":"If cos 6x − cos 2x = k sin 4x sin 2x for all x, what is k?","o":["−2","2","−1","1"],"a":0,"x":"cos C − cos D = −2 sin((C + D)/2) sin((C − D)/2) = −2 sin 4x sin 2x, so k = −2. Check x = 22.5°: cos 135° − cos 45° = −√2 and sin 90° sin 45° = √2/2, so k = −2. Forgetting the minus sign gives 2."},{"id":"math-12-068","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"E","q":"Which of these sum-to-product formulas is correct for all angles C and D?","o":["cos C − cos D = 2 sin((C + D)/2) sin((C − D)/2)","sin C − sin D = 2 sin((C + D)/2) cos((C − D)/2)","sin C + sin D = 2 cos((C + D)/2) sin((C − D)/2)","cos C + cos D = 2 cos((C + D)/2) cos((C − D)/2)"],"a":3,"x":"cos C + cos D = 2 cos((C + D)/2) cos((C − D)/2) is the standard formula. The correct forms of the others are cos C − cos D = −2 sin((C + D)/2) sin((C − D)/2), sin C − sin D = 2 cos((C + D)/2) sin((C − D)/2) and sin C + sin D = 2 sin((C + D)/2) cos((C − D)/2)."},{"id":"math-12-069","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"M","q":"Given x + y = 60°, what is (cos x + cos y)/(sin x + sin y), where defined?","o":["1/√3","1","√3","2"],"a":2,"x":"Numerator 2 cos((x + y)/2) cos((x − y)/2), denominator 2 sin((x + y)/2) cos((x − y)/2). The ratio is cot((x + y)/2) = cot 30° = √3. Using tan 30° gives 1/√3."},{"id":"math-12-070","unit":"math-12","topic":"math-12-sumprod","lo":"MATH-12.3","d":"D","q":"What is the value of cos(2π/7) + cos(4π/7) + cos(6π/7)?","o":["−1/2","1/2","0","−1"],"a":0,"x":"Multiply the sum S by 2 sin(π/7) and use 2 sin A cos B = sin(A + B) − sin(B − A): the terms give [sin(3π/7) − sin(π/7)] + [sin(5π/7) − sin(3π/7)] + [sin π − sin(5π/7)] = −sin(π/7). So 2 sin(π/7) · S = −sin(π/7) and S = −1/2."},{"id":"math-13-001","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"M","q":"What is the range of y = sin x for x in [π/6, 2π/3]?","o":["[1/2, √3/2]","[1/2, 1]","[√3/2, 1]","[0, 1]"],"a":1,"x":"On [π/6, 2π/3] sin x rises from 1/2 to 1 at x = π/2, then falls to √3/2 at 2π/3. So the least value is 1/2 and the greatest is 1. The range [1/2, √3/2] uses only the endpoint values and misses the maximum at π/2."},{"id":"math-13-002","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"M","q":"What is the maximum value of y = sin x − √3 cos x + 1?","o":["1","2","3","2 + √3"],"a":2,"x":"sin x − √3 cos x = 2 sin(x − π/3), whose maximum is 2, so y has maximum 2 + 1 = 3. The value 2 + √3 adds the separate maxima of sin x and −√3 cos x, which cannot happen at the same x."},{"id":"math-13-003","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"E","q":"What is the amplitude of y = −4 cos(3x + 1)?","o":["4","−4","1","3"],"a":0,"x":"The amplitude is |A| = |−4| = 4; the minus sign only reflects the graph in the x-axis. An amplitude is never negative, so −4 is wrong, and 3 is ω, which affects the period."},{"id":"math-13-004","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"E","q":"What is the smallest positive period of y = 3 sin(2x − π/4)?","o":["π","π/2","2π","4π"],"a":0,"x":"For y = A sin(ωx + φ) the period is T = 2π/ω = 2π/2 = π. The amplitude 3 and the phase −π/4 do not affect the period; 4π comes from multiplying by ω instead of dividing."},{"id":"math-13-005","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"M","q":"What is the range of y = 2 sin(2x − π/6) for x in [0, π/2]?","o":["[−2, 2]","[−1, 1]","[1, 2]","[−1, 2]"],"a":3,"x":"For x in [0, π/2], 2x − π/6 runs over [−π/6, 5π/6], where sine takes values in [−1/2, 1]. Multiplying by 2 gives [−1, 2]. The range [−2, 2] ignores the restricted domain."},{"id":"math-13-006","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"M","q":"How is the graph of y = sin(x − π/5) obtained from the graph of y = sin x?","o":["Shift right by π/5","Shift left by π/5","Shift up by π/5","Shift down by π/5"],"a":0,"x":"Replacing x by x − π/5 moves every point π/5 units to the right: the value sin x at x = 0 now occurs at x = π/5. Shifting left would give sin(x + π/5)."},{"id":"math-13-007","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"E","q":"What is the smallest positive period of y = tan(x/2 + π/3)?","o":["π/2","π","4π","2π"],"a":3,"x":"The tangent function has period π, so y = tan(ωx + φ) has period π/ω = π/(1/2) = 2π. The value 4π uses 2π/ω, the formula for sine and cosine."},{"id":"math-13-008","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"D","q":"What is the maximum value of y = cos 2x + 2 sin x?","o":["1","3/2","2","3"],"a":1,"x":"Write cos 2x = 1 − 2sin²x and let s = sin x in [−1, 1]: y = −2s² + 2s + 1, a downward parabola with vertex at s = 1/2, where y = −1/2 + 1 + 1 = 3/2. The value 3 adds the separate maxima of cos 2x and 2 sin x, but at sin x = 1 we have cos 2x = −1."},{"id":"math-13-009","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"M","q":"How is the graph of y = sin(2x + π/3) obtained from the graph of y = sin 2x?","o":["Shift left by π/3","Shift right by π/6","Shift right by π/3","Shift left by π/6"],"a":3,"x":"sin(2x + π/3) = sin[2(x + π/6)], so x is replaced by x + π/6: a shift left by π/6. Shifting left by π/3 would give sin[2(x + π/3)] = sin(2x + 2π/3); the shift must be read after factoring out ω."},{"id":"math-13-010","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"M","q":"If y = sin(2x + φ), with 0 < φ < π, is an even function, what is φ?","o":["3π/4","π/4","π/2","π/6"],"a":2,"x":"An even function needs the graph symmetric about x = 0, so x = 0 must be an axis: φ = π/2 + kπ, and in (0, π) this is π/2. Then y = sin(2x + π/2) = cos 2x, which is even. The other values make the graph neither even nor odd."},{"id":"math-13-011","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"E","q":"What is the maximum value of y = 3 − 2 cos x?","o":["5","−1","1","3"],"a":0,"x":"cos x ranges over [−1, 1], so −2 cos x ranges over [−2, 2] and y over [1, 5]. The maximum 5 occurs when cos x = −1. The value 1 is the minimum, obtained when cos x = 1."},{"id":"math-13-012","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"M","q":"Every point on the graph of y = sin x has its x-coordinate halved (y-coordinate unchanged), and then the graph is shifted right by π/6. What is the equation of the new graph?","o":["y = sin(2x − π/6)","y = sin(2x − π/3)","y = sin(x/2 − π/6)","y = sin(x/2 − π/12)"],"a":1,"x":"Halving x-coordinates gives y = sin 2x. Shifting right by π/6 replaces x by x − π/6: y = sin[2(x − π/6)] = sin(2x − π/3). The answer sin(2x − π/6) subtracts π/6 from 2x instead of from x."},{"id":"math-13-013","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"M","q":"What is the smallest positive period of y = |sin x|?","o":["π/2","π","2π","4π"],"a":1,"x":"Taking the absolute value reflects the negative half of each wave above the axis, so |sin(x + π)| = |−sin x| = |sin x| and the graph repeats every π. 2π is a period but not the smallest one."},{"id":"math-13-014","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"D","q":"What is the maximum value of f(x) = sin²x + √3 sin x cos x?","o":["1/2","1","3/2","2"],"a":2,"x":"sin²x = (1 − cos 2x)/2 and √3 sin x cos x = (√3/2) sin 2x, so f(x) = (√3/2) sin 2x − ½ cos 2x + ½ = sin(2x − π/6) + ½. The maximum is 1 + ½ = 3/2. The value 1 forgets the constant ½ left over from sin²x."},{"id":"math-13-015","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"D","q":"The graph of y = A sin(ωx + φ), with A > 0, ω > 0 and |φ| < π/2, has a highest point at (π/6, 2), and the nearest zero to the right of it is at x = 5π/12. Which function is it?","o":["y = 2 sin(2x + π/3)","y = 2 sin(x + π/3)","y = 2 sin(4x − π/6)","y = 2 sin(2x + π/6)"],"a":3,"x":"A = 2. From a maximum to the next zero is a quarter period: T/4 = 5π/12 − π/6 = π/4, so T = π and ω = 2. Then 2(π/6) + φ = π/2 gives φ = π/6. The choice 2 sin(4x − π/6) treats the gap as half a period."},{"id":"math-13-016","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"E","q":"Which function is odd and has smallest positive period π?","o":["y = cos 2x","y = sin 2x","y = tan 2x","y = sin x"],"a":1,"x":"sin 2x is odd and has period 2π/2 = π. cos 2x has period π but is even, tan 2x is odd but has period π/2, and sin x has period 2π."},{"id":"math-13-017","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"M","q":"What is the minimum value of y = 2 sin(x + π/6) for x in [0, π/2]?","o":["−2","0","1","√3"],"a":2,"x":"For x in [0, π/2], x + π/6 runs over [π/6, 2π/3], where sine is smallest at π/6 (value 1/2), since sin(2π/3) = √3/2 is larger. So the minimum is 2 × ½ = 1. The value √3 is the value at the right endpoint, not the minimum, and −2 ignores the restricted domain."},{"id":"math-13-018","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"M","q":"The graph of y = 3 sin(ωx + φ), with ω > 0 and |φ| < π/2, has a maximum at x = π/12 and the next minimum at x = 7π/12. What is the value of y at x = 0?","o":["3√3/2","−3/2","3/2","3"],"a":0,"x":"Maximum to next minimum is half a period: T/2 = 7π/12 − π/12 = π/2, so T = π and ω = 2. Then 2(π/12) + φ = π/2 gives φ = π/3, and y(0) = 3 sin(π/3) = 3√3/2. The value 3/2 is 3 sin(π/6), from taking the phase as π/6 instead of π/3."},{"id":"math-13-019","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"M","q":"What is the domain of y = tan(2x − π/3)? (k ∈ ℤ)","o":["x ≠ 5π/12 + kπ","x ≠ 5π/6 + kπ","x ≠ π/12 + kπ/2","x ≠ 5π/12 + kπ/2"],"a":3,"x":"Need 2x − π/3 ≠ π/2 + kπ, so 2x ≠ 5π/6 + kπ and x ≠ 5π/12 + kπ/2. Writing kπ instead of kπ/2 forgets to divide the period term by 2, and π/12 comes from adding π/3 with the wrong sign."},{"id":"math-13-020","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"M","q":"For f(x) = sin x + cos x, what are the maximum value and the smallest positive period?","o":["Maximum 2, period 2π","Maximum √2, period 2π","Maximum √2, period π","Maximum 2, period π"],"a":1,"x":"sin x + cos x = √2 sin(x + π/4), so the maximum is √2 and the period is 2π. The maximum 2 adds the separate maxima of sin x and cos x, which never occur at the same x."},{"id":"math-13-021","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"E","q":"How can the graph of y = cos x be obtained from the graph of y = sin x?","o":["Shift right by π/2","Shift left by π","Shift right by π","Shift left by π/2"],"a":3,"x":"sin(x + π/2) = cos x, so shifting y = sin x left by π/2 gives y = cos x. Shifting right by π/2 gives sin(x − π/2) = −cos x."},{"id":"math-13-022","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"E","q":"What is the smallest positive period of y = 2 cos(x/3 + π/4)?","o":["6π","2π/3","2π","3π"],"a":0,"x":"T = 2π/ω = 2π/(1/3) = 6π. The value 2π/3 multiplies by ω instead of dividing by it."},{"id":"math-13-023","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"M","q":"How is the graph of y = cos(2x − π/3) obtained from the graph of y = cos 2x?","o":["Shift left by π/3","Shift right by π/3","Shift right by π/6","Shift left by π/6"],"a":2,"x":"cos(2x − π/3) = cos[2(x − π/6)], so x is replaced by x − π/6: a shift right by π/6. Shifting by π/3 ignores the factor 2 in front of x."},{"id":"math-13-024","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"D","q":"The graph of y = A sin(ωx + φ), with A > 0, ω > 0 and |φ| < π/2, has smallest positive period π, and the highest point nearest to the y-axis on its right is (π/8, 3). Which function is it?","o":["y = 3 sin(2x + π/8)","y = 3 sin(x + 3π/8)","y = 3 sin(2x + π/4)","y = 3 sin(2x − π/4)"],"a":2,"x":"A = 3 and ω = 2π/π = 2. At the maximum 2(π/8) + φ = π/2, so φ = π/4. The function 3 sin(x + 3π/8) also peaks at π/8 but has period 2π, and 3 sin(2x − π/4) is zero at π/8."},{"id":"math-13-025","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"D","q":"What is the smallest positive period of y = sin⁴x + cos⁴x?","o":["π/2","π","π/4","2π"],"a":0,"x":"sin⁴x + cos⁴x = 1 − 2sin²x cos²x = 1 − ½sin²2x = 3/4 + ¼cos 4x, whose period is 2π/4 = π/2. Taking the period of sin²x or cos²x gives π."},{"id":"math-13-026","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"M","q":"What is the smallest positive period of y = sin 3x + cos 2x?","o":["π","6π","2π/3","2π"],"a":3,"x":"The periods are 2π/3 and π; the smallest common multiple is 2π (3 × 2π/3 = 2 × π). Multiplying the coefficients 3 × 2 and writing 6π is a common slip."},{"id":"math-13-027","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"E","q":"What is the range of y = 2 sec x?","o":["(−∞, −2] ∪ [2, ∞)","[−2, 2]","(−∞, −1] ∪ [1, ∞)","(−2, 2)"],"a":0,"x":"sec x takes all values with |sec x| ≥ 1, so 2 sec x takes all values with |y| ≥ 2. [−2, 2] is the range of 2 cos x, not of its reciprocal."},{"id":"math-13-028","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"M","q":"Which of these functions is even?","o":["y = x cos x","y = sin x + cos x","y = x sin x","y = tan x"],"a":2,"x":"f(−x) = (−x)sin(−x) = x sin x = f(x), so x sin x is even (odd × odd). x cos x and tan x are odd, and sin x + cos x is neither."},{"id":"math-13-029","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"M","q":"For x in [0, 2π), what is the domain of y = √(sin x)?","o":["[π, 2π)","[0, π]","[0, π/2]","[0, π)"],"a":1,"x":"We need sin x ≥ 0, which holds for 0 ≤ x ≤ π (sin π = 0 is allowed). [0, π) leaves out the end point where sin x = 0."},{"id":"math-13-030","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"M","q":"What is the domain of y = cot(x/2)? (k ∈ ℤ)","o":["x ≠ 2kπ","x ≠ kπ","x ≠ kπ/2","x ≠ (2k + 1)π"],"a":0,"x":"cot u is undefined when u = kπ, so x/2 ≠ kπ, that is x ≠ 2kπ. Using the rule for cot x itself gives x ≠ kπ."},{"id":"math-13-031","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"D","q":"What is the smallest positive period of y = |sin x| + |cos x|?","o":["π","π/4","π/2","2π"],"a":2,"x":"f(x + π/2) = |cos x| + |sin x| = f(x), so π/2 is a period. π/4 is not: f(0) = 1 but f(π/4) = √2. Taking the period of |sin x| alone gives π."},{"id":"math-13-032","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"M","q":"What is the range of y = 1/(2 + sin x)?","o":["[1/3, 1]","[1/2, 1]","[−1, 1]","[1/3, 1/2]"],"a":0,"x":"2 + sin x runs over [1, 3], so its reciprocal runs over [1/3, 1]; the largest value 1 comes from the smallest denominator. Using sin x ≥ 0 gives [1/3, 1/2]."},{"id":"math-13-033","unit":"math-13","topic":"math-13-domain","lo":"MATH-13.1","d":"D","q":"Let f(x) = a sin x + b tan x + 1, where a and b are constants. If f(2) = 5, what is f(−2)?","o":["−5","5","3","−3"],"a":3,"x":"g(x) = a sin x + b tan x is odd, and g(2) = 5 − 1 = 4, so g(−2) = −4 and f(−2) = −4 + 1 = −3. Treating all of f as odd gives −5."},{"id":"math-13-034","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"M","q":"For y = 3 sin(2x − π/3), what are the amplitude, period and phase shift?","o":["Amplitude 3, period π, shift π/3 right","Amplitude 3, period 2π, shift π/6 right","Amplitude 3, period π, shift π/6 left","Amplitude 3, period π, shift π/6 right"],"a":3,"x":"y = 3 sin 2(x − π/6): amplitude 3, period 2π/2 = π, and the graph of 3 sin 2x moves π/6 to the right. Reading π/3 straight from the bracket forgets to divide by 2."},{"id":"math-13-035","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"E","q":"What is the frequency (number of complete cycles per unit of t) of y = 5 cos(4πt)?","o":["1/2","4π","2","5"],"a":2,"x":"Period = 2π/(4π) = 1/2, and frequency = 1/period = 2. 1/2 is the period, and 5 is the amplitude."},{"id":"math-13-036","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"M","q":"For x in [0, 2π], how many times does the graph of y = sin 2x meet the line y = 1/2?","o":["2","4","8","3"],"a":1,"x":"sin 2x = ½ with 2x in [0, 4π] gives 2x = π/6, 5π/6, 13π/6, 17π/6: four points. y = sin 2x has two full cycles on [0, 2π], two meetings per cycle; counting one cycle gives 2."},{"id":"math-13-037","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"M","q":"What are the vertical asymptotes of the graph of y = tan 2x for x in (0, π)?","o":["x = π/4 and x = 3π/4","x = π/2 only","x = π/8 and x = 5π/8","x = π/4 only"],"a":0,"x":"tan 2x is undefined when 2x = π/2 + kπ, that is x = π/4 + kπ/2; in (0, π) these are π/4 and 3π/4. x = π/2 is the asymptote of tan x, where tan 2x = 0."},{"id":"math-13-038","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"D","q":"Which line is an axis of symmetry of the graph of y = sin(2x + π/3)?","o":["x = π/6","x = π/12","x = π/3","x = −π/6"],"a":1,"x":"Axes of symmetry pass through maxima or minima: 2x + π/3 = π/2 + kπ, so x = π/12 + kπ/2. At x = −π/6 the angle is 0, a zero of the graph (a centre of symmetry), not an axis."},{"id":"math-13-039","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"M","q":"Which function has exactly the same graph as y = sin x?","o":["y = sin(−x)","y = sin(π − x)","y = sin(x − π)","y = cos(π − x)"],"a":1,"x":"sin(π − x) = sin x for every x. sin(−x) and sin(x − π) both equal −sin x (a reflection), and cos(π − x) = −cos x."},{"id":"math-13-040","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"M","q":"The graph of y = sin ωx (ω > 0) crosses the x-axis at points spaced π/3 apart. What is ω?","o":["6","3/2","2/3","3"],"a":3,"x":"Neighbouring zeros of a sine curve are half a period apart, so the period is 2π/3 and ω = 2π ÷ (2π/3) = 3. Taking π/3 as the full period gives 6."},{"id":"math-13-041","unit":"math-13","topic":"math-13-graphs","lo":"MATH-13.2","d":"D","q":"Which sequence of steps turns the graph of y = sin x into the graph of y = sin(x/2 + π/6)?","o":["Shift left by π/3, then double every x-coordinate","Shift left by π/6, then double every x-coordinate","Shift left by π/6, then halve every x-coordinate","Double every x-coordinate, then shift left by π/6"],"a":1,"x":"Shift left π/6: y = sin(x + π/6); doubling x-coordinates replaces x by x/2: y = sin(x/2 + π/6). Doubling first and then shifting π/6 gives sin(x/2 + π/12); after doubling the shift would have to be π/3."},{"id":"math-13-042","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"M","q":"What is the minimum value of y = 3 sin x − 4 cos x + 2?","o":["−5","−2","7","−3"],"a":3,"x":"3 sin x − 4 cos x ranges over [−5, 5] since √(3² + 4²) = 5, so the minimum is −5 + 2 = −3. 7 is the maximum and −5 forgets the + 2."},{"id":"math-13-043","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"D","q":"What is the minimum value of y = sin²x − 4 sin x + 5?","o":["1","5","10","2"],"a":3,"x":"With t = sin x in [−1, 1], y = (t − 2)² + 1. The vertex t = 2 is outside [−1, 1], so y is decreasing there and the minimum is at t = 1: y = 1 + 1 = 2. The vertex value 1 is never reached."},{"id":"math-13-044","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"E","q":"What is the maximum value of y = sin x cos x?","o":["1/2","1","2","√2/2"],"a":0,"x":"sin x cos x = ½ sin 2x, and sin 2x is at most 1, so the maximum is 1/2. Taking each factor as 1 at once gives 1, but they cannot both be 1."},{"id":"math-13-045","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"M","q":"What is the maximum value of y = 2cos²x + sin 2x?","o":["1 + √2","3","2","√2"],"a":0,"x":"2cos²x = 1 + cos 2x, so y = 1 + cos 2x + sin 2x, and cos 2x + sin 2x has maximum √2. The maximum is 1 + √2; adding the separate maxima 2 + 1 gives 3."},{"id":"math-13-046","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"D","q":"What is the minimum value of y = cos 2x + 6 cos x?","o":["−11/2","−5","−7","7"],"a":1,"x":"With c = cos x in [−1, 1], y = 2c² + 6c − 1. The vertex c = −3/2 is outside [−1, 1], so the minimum is at c = −1: 2 − 6 − 1 = −5. The vertex value −11/2 is not reached; 7 is the maximum."},{"id":"math-13-047","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"M","q":"What is the minimum value of y = sec²x + cos²x (cos x ≠ 0)?","o":["1","0","2","4"],"a":2,"x":"With u = cos²x in (0, 1], y = 1/u + u ≥ 2, with equality at u = 1 (x = 0). Taking each term's least value separately (1 and 0) gives 1, but they are not reached together."},{"id":"math-13-048","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"M","q":"For x in [0, π], at which value of x does y = sin x − cos x reach its maximum?","o":["π/4","π/2","3π/4","π"],"a":2,"x":"y = √2 sin(x − π/4), which is largest when x − π/4 = π/2, so x = 3π/4 (y = √2). At x = π/4 the value is 0."},{"id":"math-13-049","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"E","q":"What is the maximum value of y = (sin x + cos x)²?","o":["√2","1","2","4"],"a":2,"x":"(sin x + cos x)² = 1 + 2 sin x cos x = 1 + sin 2x, whose maximum is 2. √2 is the maximum of sin x + cos x before squaring."},{"id":"math-13-050","unit":"math-13","topic":"math-13-maxmin","lo":"MATH-13.3","d":"M","q":"The maximum value of y = a sin x + 2 cos x is 3, where a > 0. What is a?","o":["1","√5","√13","5"],"a":1,"x":"The maximum of a sin x + 2 cos x is √(a² + 4), so a² + 4 = 9 and a = √5. Assuming the maximum is a + 2 gives a = 1."},{"id":"math-14-001","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"E","q":"In triangle ABC, A = 30°, B = 45° and a = 2. What is b?","o":["√2","2","2√3","2√2"],"a":3,"x":"By the sine rule b = a sin B/sin A = 2 × (√2/2)/(1/2) = 2√2. The value √2 multiplies by sin B/sin A upside down."},{"id":"math-14-002","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"E","q":"In triangle ABC, a = 4, b = 6 and C = 30°. What is the area of the triangle?","o":["6√3","12","12√3","6"],"a":3,"x":"Area = ½ab sin C = ½ × 4 × 6 × ½ = 6. The value 12 forgets the factor ½ in the area formula, and 6√3 uses cos 30° instead of sin 30°."},{"id":"math-14-003","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"M","q":"In triangle ABC, a = 3 and A = 60°. What is the radius R of the circumcircle?","o":["√3/2","2√3","√3","3"],"a":2,"x":"The extended sine rule gives a/sin A = 2R, so 2R = 3/(√3/2) = 2√3 and R = √3. The value 2√3 is the diameter 2R, not the radius."},{"id":"math-14-004","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"D","q":"To find the distance to a tree C across a river, Amina marks points A and B on her bank 60 m apart. She measures ∠CAB = 75° and ∠CBA = 45°. What is the distance AC?","o":["20√3 m","30√6 m","60√2 m","20√6 m"],"a":3,"x":"The third angle is C = 180° − 75° − 45° = 60°. By the sine rule AC/sin B = AB/sin C, so AC = 60 × (√2/2)/(√3/2) = 60√2/√3 = 20√6 m. The value 30√6 m swaps sin B and sin C."},{"id":"math-14-005","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"E","q":"In triangle ABC, a = 3, b = 5 and C = 120°. What is c?","o":["√19","√34","49","7"],"a":3,"x":"c² = a² + b² − 2ab cos C = 9 + 25 − 2 × 3 × 5 × (−1/2) = 49, so c = 7. Using cos 120° = +1/2 gives √19, and 49 is c² without the square root."},{"id":"math-14-006","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"D","q":"In triangle ABC, B = 60° and b = 3. What is the largest possible area of the triangle?","o":["9/4","9√3/2","9√3/4","3√3/4"],"a":2,"x":"By the cosine rule 9 = a² + c² − ac ≥ 2ac − ac = ac, so ac ≤ 9, with equality when a = c = 3. The area ½ac sin B ≤ ½ × 9 × √3/2 = 9√3/4 (an equilateral triangle). The value 9√3/2 forgets the factor ½."},{"id":"math-14-007","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"E","q":"Triangle ABC has circumradius R. Which relation is correct?","o":["a/sin A = R","a sin A = 2R","a/sin A = 2R","sin A/a = 2R"],"a":2,"x":"The extended sine rule states a/sin A = b/sin B = c/sin C = 2R, the diameter of the circumcircle. Writing R instead of 2R confuses the radius with the diameter."},{"id":"math-14-008","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"M","q":"A triangle has sides 3, 5 and 7. What is its largest angle?","o":["90°","120°","135°","150°"],"a":1,"x":"The largest angle is opposite the side 7: cos θ = (3²
