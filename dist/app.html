 − 4/(x + 3) = 2 + 3/2 − 4/3 = 13/6 at x = 0. Adding the last term instead of subtracting gives 29/6."},{"id":"math-17-083","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"M","q":"If y = sin 2x, what is the third derivative y‴?","o":["8 cos 2x","−8 cos 2x","−8 sin 2x","−6 cos 2x"],"a":1,"x":"y′ = 2 cos 2x, y″ = −4 sin 2x, y‴ = −8 cos 2x; each step multiplies by 2. Losing the sign at the cos → sin step gives 8 cos 2x."},{"id":"math-17-084","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"M","q":"For which values of the constant a does y = e^(ax) satisfy y″ − 3y′ + 2y = 0?","o":["a = −1 or a = −2","a = 1 or a = 2","a = 1 or a = −2","a = 2 only"],"a":1,"x":"y′ = ae^(ax), y″ = a²e^(ax), so e^(ax)(a² − 3a + 2) = 0, giving (a − 1)(a − 2) = 0, a = 1 or 2. A sign slip in factorising gives −1 and −2."},{"id":"math-17-085","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"M","q":"If y = ln x (x > 0), what is the fifth derivative y⁽⁵⁾?","o":["−24/x⁵","120/x⁵","24/x⁵","24/x⁶"],"a":2,"x":"y′ = 1/x, y″ = −1/x², y‴ = 2/x³, y⁽⁴⁾ = −6/x⁴, y⁽⁵⁾ = 24/x⁵. In general y⁽ⁿ⁾ = (−1)^(n − 1)(n − 1)!/xⁿ; using n! gives 120/x⁵."},{"id":"math-17-086","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"D","q":"On the circle x² + y² = 1 (y ≠ 0), what is d²y/dx² in terms of y?","o":["−1/y³","1/y³","−1/y²","−x/y³"],"a":0,"x":"y′ = −x/y, so y″ = −(y − xy′)/y² = −(y + x²/y)/y² = −(x² + y²)/y³ = −1/y³. Forgetting that y′ itself depends on x gives −1/y."},{"id":"math-17-087","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"D","q":"If y = x + 1/x, what is the value of x²y″ + xy′ − y?","o":["2/x","x","0","1"],"a":2,"x":"y′ = 1 − 1/x² and y″ = 2/x³. Then x²y″ = 2/x and xy′ = x − 1/x, so the sum is 2/x + x − 1/x − x − 1/x = 0."},{"id":"math-17-088","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"D","q":"If y = sin⁻¹x (|x| < 1), which relation does y satisfy?","o":["(1 − x²)y″ + xy′ = 0","(1 + x²)y″ − xy′ = 0","(1 − x²)y″ − xy′ = 0","(1 − x²)y″ − y′ = 0"],"a":2,"x":"y′ = (1 − x²)^(−1/2) and y″ = x(1 − x²)^(−3/2). So (1 − x²)y″ = x(1 − x²)^(−1/2) = xy′, giving (1 − x²)y″ − xy′ = 0."},{"id":"math-17-089","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"D","q":"If y = tan(x + y), what is dy/dx in terms of y?","o":["(1 + y²)/y²","−1/y²","−y²/(1 + y²)","−(1 + y²)/y²"],"a":3,"x":"y′ = sec²(x + y)(1 + y′) = (1 + y²)(1 + y′), so y′[1 − (1 + y²)] = 1 + y², giving y′ = −(1 + y²)/y². Losing the minus when solving gives (1 + y²)/y²."},{"id":"math-17-090","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"M","q":"A curve is given by x = t + 1/t, y = t − 1/t (t ≠ 0, ±1). What is dy/dx?","o":["(t² − 1)/(t² + 1)","(t² + 1)/(t² − 1)","−(t² + 1)/(t² − 1)","1"],"a":1,"x":"dy/dt = 1 + 1/t² and dx/dt = 1 − 1/t²; multiplying both by t² gives dy/dx = (t² + 1)/(t² − 1). Dividing the wrong way gives the reciprocal."},{"id":"math-17-091","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"M","q":"If f(x) = (2x + 1)⁴, what is the fourth derivative f⁽⁴⁾(x)?","o":["24","192","384","96"],"a":2,"x":"Each differentiation brings down the power and a factor 2: f⁽⁴⁾ = 4 × 3 × 2 × 1 × 2⁴ = 24 × 16 = 384. Forgetting the chain-rule factor 2 each time gives 24."},{"id":"math-17-092","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"E","q":"For the curve xy² = 12, what is dy/dx at the point (3, 2)?","o":["−3","−1/3","1/3","−4/3"],"a":1,"x":"y² + 2xy·y′ = 0, so y′ = −y/(2x) = −2/6 = −1/3. Writing −2x/y gives −3."},{"id":"math-17-093","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"E","q":"In the Maclaurin series of eˣ, what is the coefficient of x⁴?","o":["1/24","1/4","1/12","1/120"],"a":0,"x":"eˣ = 1 + x + x²/2! + x³/3! + x⁴/4! + ..., so the coefficient is 1/4! = 1/24. 1/120 is the coefficient of x⁵."},{"id":"math-17-094","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"E","q":"What are the first three non-zero terms of the Maclaurin series of sin x?","o":["x − x³/6 + x⁵/120","x + x³/6 + x⁵/120","x − x³/3 + x⁵/5","1 − x²/2 + x⁴/24"],"a":0,"x":"f(0) = 0, f′(0) = 1, f‴(0) = −1, f⁽⁵⁾(0) = 1, so sin x = x − x³/3! + x⁵/5! − ... The all-plus series is sinh x, x − x³/3 + x⁵/5 is tan⁻¹x and 1 − x²/2 + x⁴/24 is cos x."},{"id":"math-17-095","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"M","q":"In the Maclaurin series of cos 2x, what is the coefficient of x⁴?","o":["1/24","1/12","−2/3","2/3"],"a":3,"x":"cos u = 1 − u²/2! + u⁴/4! − ...; with u = 2x the x⁴ term is 16x⁴/24 = (2/3)x⁴. Forgetting to raise 2 to the fourth power gives 1/24 or 1/12."},{"id":"math-17-096","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"M","q":"In the Maclaurin series of ln(1 + x), what is the coefficient of x⁴?","o":["−1/4","1/4","−1/24","1/24"],"a":0,"x":"ln(1 + x) = x − x²/2 + x³/3 − x⁴/4 + ..., so the coefficient is −1/4 (even powers are negative). Dividing by 4! instead of 4 gives −1/24."},{"id":"math-17-097","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"M","q":"In the Taylor series of f(x) = x³ about x = 1, what is the coefficient of (x − 1)²?","o":["3","6","1","3/2"],"a":0,"x":"The coefficient is f″(1)/2! = 6x/2 at x = 1 = 3. Check: x³ = 1 + 3(x − 1) + 3(x − 1)² + (x − 1)³. Forgetting the 2! gives 6."},{"id":"math-17-098","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"M","q":"In the Taylor series of ln x about x = 1, what is the coefficient of (x − 1)³?","o":["−1/3","2","1/3","1/6"],"a":2,"x":"f′ = 1/x, f″ = −1/x², f‴ = 2/x³, so f‴(1)/3! = 2/6 = 1/3. This matches ln(1 + u) = u − u²/2 + u³/3 with u = x − 1. Forgetting 3! gives 2."},{"id":"math-17-099","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"M","q":"In the Maclaurin series of e^(−x²), what is the coefficient of x⁴?","o":["−1/2","1/2","1/24","1/4"],"a":1,"x":"Put u = −x² in eᵘ = 1 + u + u²/2 + ...: the x⁴ term is (−x²)²/2 = x⁴/2. The square makes it positive; taking 1/4! from the x⁴ term of eˣ gives 1/24."},{"id":"math-17-100","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"M","q":"In the Maclaurin series of √(1 + x), what is the coefficient of x²?","o":["1/8","−1/4","−1/8","1/4"],"a":2,"x":"f″(x) = −¼(1 + x)^(−3/2), so f″(0)/2! = −1/8. Same from the binomial series: (½)(−½)/2 = −1/8. Forgetting the 2! gives −1/4."},{"id":"math-17-101","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"M","q":"Using the Maclaurin series of eˣ, what is lim(x→0) (eˣ − 1 − x)/x²?","o":["1","0","1/2","2"],"a":2,"x":"eˣ − 1 − x = x²/2 + x³/6 + ..., so the quotient is 1/2 + x/6 + ... → 1/2. Forgetting the 2! in x²/2! gives 1."},{"id":"math-17-102","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"D","q":"Using the Maclaurin series of sin x, what is lim(x→0) (x − sin x)/x³?","o":["1/6","−1/6","1/3","0"],"a":0,"x":"x − sin x = x − (x − x³/6 + x⁵/120 − ...) = x³/6 − x⁵/120 + ..., so the quotient tends to 1/6. Reversing the subtraction gives −1/6."},{"id":"math-17-103","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"M","q":"The Maclaurin series of a function f begins 1 + 2x − 3x² + 5x³ + .... What is f‴(0)?","o":["30","5","15","5/6"],"a":0,"x":"The coefficient of x³ is f‴(0)/3!, so f‴(0) = 5 × 6 = 30. Reading the coefficient 5 straight off gives 5."},{"id":"math-17-104","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"M","q":"What are the first two non-zero terms of the Taylor series of sin x about x = π/2?","o":["1 + (x − π/2)²/2","1 − (x − π/2)²/2","(x − π/2) − (x − π/2)³/6","1 − (x − π/2)"],"a":1,"x":"At π/2: f = sin = 1, f′ = cos = 0, f″ = −sin = −1, so sin x = 1 − (x − π/2)²/2! + .... The linear term vanishes because cos(π/2) = 0."},{"id":"math-17-105","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"M","q":"Using the first three terms of the Maclaurin series of eˣ, what is the approximate value of e^0.1?","o":["1.1","1.105","1.11","1.01"],"a":1,"x":"eˣ ≈ 1 + x + x²/2 = 1 + 0.1 + 0.01/2 = 1.105. Forgetting to halve x² gives 1.11; using only two terms gives 1.1."},{"id":"math-17-106","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"E","q":"Using cos x ≈ 1 − x²/2 (x in radians), what is the approximate value of cos 0.2?","o":["0.96","0.98","0.99","0.8"],"a":1,"x":"1 − (0.2)²/2 = 1 − 0.04/2 = 1 − 0.02 = 0.98. Forgetting to halve gives 0.96."},{"id":"math-17-107","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"M","q":"In the Maclaurin series of 1/(1 + 2x), what is the coefficient of x³?","o":["8","−6","−8","−2"],"a":2,"x":"1/(1 + u) = 1 − u + u² − u³ + ... with u = 2x, so the x³ term is −(2x)³ = −8x³. Forgetting to cube the 2 gives −2."},{"id":"math-17-108","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"D","q":"The Maclaurin series of tan x is x + kx³ + .... What is k?","o":["−1/3","1/3","1/6","−1/6"],"a":1,"x":"f′ = sec²x, f″ = 2sec²x tan x, f‴ = 4sec²x tan²x + 2sec⁴x, so f‴(0) = 2 and k = 2/3! = 1/3. Guessing from sin x gives −1/6."},{"id":"math-17-109","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"D","q":"In the Maclaurin series of sin²x, what is the coefficient of x⁴?","o":["1/3","−1/3","−1/6","−2/3"],"a":1,"x":"sin²x = (1 − cos 2x)/2 and cos 2x = 1 − 2x² + (2/3)x⁴ − ..., so sin²x = x² − (1/3)x⁴ + .... Forgetting the factor ½ gives −2/3."},{"id":"math-17-110","unit":"math-17","topic":"math-17-series","lo":"MATH-17.5","d":"D","q":"In the Maclaurin series of eˣ sin x, what is the coefficient of x³?","o":["1/2","1/3","2/3","1/6"],"a":1,"x":"(1 + x + x²/2 + ...)(x − x³/6 + ...): the x³ terms are (x²/2)·x + 1·(−x³/6) = x³/2 − x³/6 = x³/3. Adding the −x³/6 as +x³/6 gives 2/3."},{"id":"math-18-001","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"M","q":"∫ (x³ − 2x + 5)/x² dx, for x > 0, equals:","o":["x²/2 − 2 ln x + 5/x + C","x²/2 − 2 ln x − 5/x + C","x²/2 + 2 ln x − 5/x + C","x²/2 − 5 ln x − 2/x + C"],"a":1,"x":"Split: x − 2/x + 5x⁻², which integrates to x²/2 − 2 ln x − 5/x + C. Differentiating back: x − 2/x + 5/x² checks. Writing ∫x⁻² dx as +1/x gives the sign slip on 5/x."},{"id":"math-18-002","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"E","q":"∫ (1/x) dx, for x > 0, equals:","o":["−1/x² + C","x ln x + C","ln x + C","1/(2x²) + C"],"a":2,"x":"The standard result is ∫ x⁻¹ dx = ln x + C, since d/dx (ln x) = 1/x. The power rule xⁿ⁺¹/(n + 1) fails for n = −1; −1/x² is the derivative of 1/x, not its integral."},{"id":"math-18-003","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"E","q":"∫ cos 3x dx equals:","o":["3 sin 3x + C","−(1/3) sin 3x + C","(1/3) sin 3x + C","−3 sin 3x + C"],"a":2,"x":"∫ cos ax dx = (1/a) sin ax + C, so the answer is (1/3) sin 3x + C. Check: d/dx[(1/3) sin 3x] = cos 3x. Multiplying by 3 instead of dividing gives 3 sin 3x."},{"id":"math-18-004","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"E","q":"∫ e^(2x) dx equals:","o":["½ e^(2x) + C","2 e^(2x) + C","e^(2x) + C","−½ e^(2x) + C"],"a":0,"x":"∫ e^(ax) dx = (1/a) e^(ax) + C, so ∫ e^(2x) dx = ½ e^(2x) + C. Differentiating ½ e^(2x) gives e^(2x). Forgetting the 1/a factor gives e^(2x) + C."},{"id":"math-18-005","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"M","q":"∫ (√x + 1/√x) dx, for x > 0, equals:","o":["(2/3)x^(3/2) + 2√x + C","(2/3)x^(3/2) − 2√x + C","(3/2)x^(3/2) + ½√x + C","1/(2√x) − 1/(2x^(3/2)) + C"],"a":0,"x":"∫ x^(1/2) dx = (2/3)x^(3/2) and ∫ x^(−1/2) dx = 2x^(1/2). So the answer is (2/3)x^(3/2) + 2√x + C. 1/(2√x) − 1/(2x^(3/2)) is the derivative, not the integral."},{"id":"math-18-006","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"M","q":"∫ tan²x dx equals:","o":["tan x + x + C","(tan³x)/3 + C","sec x tan x + C","tan x − x + C"],"a":3,"x":"Write tan²x = sec²x − 1, so the integral is tan x − x + C. Check: d/dx(tan x − x) = sec²x − 1 = tan²x. Using tan²x = sec²x + 1 gives tan x + x."},{"id":"math-18-007","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"M","q":"∫ (x² − 1)/(x − 1) dx, for x ≠ 1, equals:","o":["x²/2 − x + C","x² + x + C","(x³/3 − x)/(x²/2 − x) + C","x²/2 + x + C"],"a":3,"x":"(x² − 1)/(x − 1) = x + 1, so the integral is x²/2 + x + C. Integrating the top and bottom separately is not allowed."},{"id":"math-18-008","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"M","q":"∫ sin²x dx equals:","o":["x/2 + (sin 2x)/4 + C","(sin³x)/3 + C","x/2 − (sin 2x)/2 + C","x/2 − (sin 2x)/4 + C"],"a":3,"x":"sin²x = (1 − cos 2x)/2, which integrates to x/2 − (sin 2x)/4 + C. Using the power rule on sin x gives (sin³x)/3, which ignores the chain rule."},{"id":"math-18-009","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"M","q":"∫ dx/(4 + x²) equals:","o":["tan⁻¹(x/2) + C","½ tan⁻¹(x/2) + C","2 tan⁻¹(x/2) + C","½ tan⁻¹(2x) + C"],"a":1,"x":"∫ dx/(a² + x²) = (1/a) tan⁻¹(x/a) + C with a = 2, giving ½ tan⁻¹(x/2) + C. Check: d/dx = ½ · (½)/(1 + x²/4) = 1/(4 + x²). Dropping the 1/a gives tan⁻¹(x/2)."},{"id":"math-18-010","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"M","q":"∫ dx/√(9 − x²), for |x| < 3, equals:","o":["(1/3) sin⁻¹(x/3) + C","3 sin⁻¹(x/3) + C","sin⁻¹(3x) + C","sin⁻¹(x/3) + C"],"a":3,"x":"∫ dx/√(a² − x²) = sin⁻¹(x/a) + C, with no 1/a factor. Check: d/dx sin⁻¹(x/3) = (1/3)/√(1 − x²/9) = 1/√(9 − x²). Mixing it up with the tan⁻¹ formula gives (1/3) sin⁻¹(x/3)."},{"id":"math-18-011","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"M","q":"∫ 2ˣ dx equals:","o":["2ˣ/ln 2 + C","2ˣ ln 2 + C","2^(x+1)/(x + 1) + C","x · 2^(x−1) + C"],"a":0,"x":"∫ aˣ dx = aˣ/ln a + C, since d/dx(aˣ) = aˣ ln a. So ∫ 2ˣ dx = 2ˣ/ln 2 + C. Treating 2ˣ like xⁿ gives 2^(x+1)/(x + 1)."},{"id":"math-18-012","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"M","q":"∫ (e^(3x) − 1)/eˣ dx equals:","o":["½ e^(2x) − e^(−x) + C","½ e^(2x) + e^(−x) + C","2e^(2x) + e^(−x) + C","½ e^(2x) + eˣ + C"],"a":1,"x":"Divide first: e^(2x) − e^(−x). Then ∫ e^(2x) dx = ½e^(2x) and ∫ −e^(−x) dx = +e^(−x). Total ½e^(2x) + e^(−x) + C; missing the minus from the −x gives −e^(−x)."},{"id":"math-18-013","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"M","q":"If f′(x) = 3x² − 2 and f(1) = 4, then f(x) is:","o":["x³ − 2x + 5","x³ − 2x + 4","x³ − 2x + 3","3x³ − 2x + 3"],"a":0,"x":"f(x) = x³ − 2x + C. f(1) = 1 − 2 + C = 4 gives C = 5, so f(x) = x³ − 2x + 5. Taking C = f(1) = 4 directly gives x³ − 2x + 4; 3x³ − 2x + 3 fits f(1) = 4 but has the wrong derivative."},{"id":"math-18-014","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"E","q":"∫ sec x tan x dx equals:","o":["−sec x + C","(sec²x)/2 + C","ln|sec x| + C","sec x + C"],"a":3,"x":"d/dx(sec x) = sec x tan x, so ∫ sec x tan x dx = sec x + C. ln|sec x| is the integral of tan x, not of sec x tan x."},{"id":"math-18-015","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"D","q":"∫ dx/(1 + cos x) equals:","o":["tan(x/2) + C","−cot(x/2) + C","½ tan(x/2) + C","2 tan(x/2) + C"],"a":0,"x":"1 + cos x = 2cos²(x/2), so the integrand is ½ sec²(x/2), whose integral is tan(x/2) + C. −cot(x/2) is the answer for 1/(1 − cos x), a sign slip in the half-angle formula."},{"id":"math-18-016","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"D","q":"∫ (sin x + cos x)² dx equals:","o":["x − ½ cos 2x + C","x + ½ cos 2x + C","(sin x + cos x)³/3 + C","x − 2 cos 2x + C"],"a":0,"x":"(sin x + cos x)² = 1 + sin 2x, which integrates to x − ½ cos 2x + C. Check: d/dx = 1 + sin 2x. The cube over 3 ignores the chain rule."},{"id":"math-18-017","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"D","q":"For 0 < x < π/4, ∫ √(1 − sin 2x) dx equals:","o":["sin x − cos x + C","cos x − sin x + C","sin x + cos x + C","−sin x − cos x + C"],"a":2,"x":"1 − sin 2x = (cos x − sin x)², and on (0, π/4) cos x > sin x, so the root is cos x − sin x. Its integral is sin x + cos x + C. Taking the root as sin x − cos x gives the wrong sign."},{"id":"math-18-018","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"M","q":"If ∫ f(x) dx = x² sin x + C, then f(x) is:","o":["2x cos x","2x sin x + x² cos x","2x sin x − x² cos x","−(x³/3) cos x"],"a":1,"x":"f is the derivative of x² sin x. By the product rule f(x) = 2x sin x + x² cos x. Differentiating each factor separately gives 2x cos x."},{"id":"math-18-019","unit":"math-18","topic":"math-18-anti","lo":"MATH-18.1","d":"E","q":"∫ (3x² + 4x) dx equals:","o":["6x + 4 + C","x³ + 2x² + C","x³ + 4x² + C","3x³ + 4x² + C"],"a":1,"x":"Integrate term by term: 3 · x³/3 + 4 · x²/2 = x³ + 2x², plus C. 6x + 4 is the derivative."},{"id":"math-18-020","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"E","q":"∫ 2x(x² + 1)⁴ dx equals:","o":["(x² + 1)⁵ + C","(x² + 1)⁵/5 + C","2x(x² + 1)⁵/5 + C","x²(x² + 1)⁵/5 + C"],"a":1,"x":"Put u = x² + 1, du = 2x dx: ∫ u⁴ du = u⁵/5 + C = (x² + 1)⁵/5 + C. Keeping the 2x outside after substituting gives 2x(x² + 1)⁵/5."},{"id":"math-18-021","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"E","q":"∫ (2x + 3)/(x² + 3x + 1) dx equals:","o":["1/(x² + 3x + 1) + C","ln|x² + 3x + 1| + C","(2x + 3) ln|x² + 3x + 1| + C","ln|2x + 3| + C"],"a":1,"x":"The numerator is the derivative of the denominator, and ∫ f′(x)/f(x) dx = ln|f(x)| + C. So the answer is ln|x² + 3x + 1| + C."},{"id":"math-18-022","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"M","q":"∫ tan x dx equals:","o":["ln|sec x| + C","ln|cos x| + C","sec²x + C","ln|sin x| + C"],"a":0,"x":"tan x = sin x/cos x; with u = cos x, du = −sin x dx, the integral is −ln|cos x| = ln|sec x| + C. Dropping the minus sign gives ln|cos x|."},{"id":"math-18-023","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"M","q":"∫ sin³x cos x dx equals:","o":["−(sin⁴x)/4 + C","(sin⁴x)/4 + C","(cos⁴x)/4 + C","sin⁴x + C"],"a":1,"x":"Put u = sin x, du = cos x dx: ∫ u³ du = u⁴/4 = (sin⁴x)/4 + C. Differentiating back: sin³x cos x."},{"id":"math-18-024","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"M","q":"∫ e^(sin x) cos x dx equals:","o":["e^(sin x) + C","e^(cos x) + C","−e^(sin x) + C","e^(sin x) cos x + C"],"a":0,"x":"With u = sin x, du = cos x dx, the integral is ∫ eᵘ du = e^(sin x) + C. Check: d/dx e^(sin x) = e^(sin x) cos x."},{"id":"math-18-025","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"M","q":"∫ x e^(x²) dx equals:","o":["2 e^(x²) + C","½ e^(x²) + C","e^(x²) + C","(x²/2) e^(x²) + C"],"a":1,"x":"Put u = x², du = 2x dx, so x dx = du/2: ½ ∫ eᵘ du = ½ e^(x²) + C. Forgetting the ½ gives e^(x²)."},{"id":"math-18-026","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"M","q":"∫ dx/(x ln x), for x > 1, equals:","o":["(ln x)²/2 + C","1/ln x + C","ln(ln x) + C","(ln x)/x + C"],"a":2,"x":"Put u = ln x, du = dx/x: ∫ du/u = ln u = ln(ln x) + C. (ln x)²/2 is the integral of (ln x)/x, a different integrand."},{"id":"math-18-027","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"M","q":"∫ (ln x)²/x dx, for x > 0, equals:","o":["(ln x)³/3 + C","(ln x)³ + C","(ln x)²/2 + C","2(ln x)/x + C"],"a":0,"x":"With u = ln x, du = dx/x: ∫ u² du = u³/3 = (ln x)³/3 + C. Check: d/dx (ln x)³/3 = (ln x)² · (1/x)."},{"id":"math-18-028","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"E","q":"∫ dx/(3x − 2), for x > 2/3, equals:","o":["(1/3) ln(3x − 2) + C","3 ln(3x − 2) + C","ln(3x − 2) + C","−3/(3x − 2)² + C"],"a":0,"x":"With u = 3x − 2, du = 3 dx: (1/3) ∫ du/u = (1/3) ln(3x − 2) + C. Forgetting to divide by 3 gives ln(3x − 2)."},{"id":"math-18-029","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"M","q":"If ∫ x/(x² + 9) dx = k ln(x² + 9) + C, then k equals:","o":["2","1","½","1/9"],"a":2,"x":"With u = x² + 9, du = 2x dx, the integral is ½ ∫ du/u = ½ ln(x² + 9) + C, so k = ½. Check: d/dx [½ ln(x² + 9)] = x/(x² + 9)."},{"id":"math-18-030","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"M","q":"∫ dx/(x² + 2x + 5) equals:","o":["tan⁻¹((x + 1)/2) + C","2 tan⁻¹((x + 1)/2) + C","½ tan⁻¹((x + 1)/2) + C","½ tan⁻¹((x − 1)/2) + C"],"a":2,"x":"Complete the square: x² + 2x + 5 = (x + 1)² + 4. Then ∫ du/(u² + 2²) with u = x + 1 gives ½ tan⁻¹((x + 1)/2) + C. Completing as (x − 1)² is the sign slip."},{"id":"math-18-031","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"D","q":"∫ dx/√(4x − x²), for 0 < x < 4, equals:","o":["sin⁻¹((x − 2)/4) + C","½ sin⁻¹((x − 2)/2) + C","cos⁻¹((x − 2)/2) + C","sin⁻¹((x − 2)/2) + C"],"a":3,"x":"4x − x² = 4 − (x − 2)², so with u = x − 2 the integral is ∫ du/√(4 − u²) = sin⁻¹((x − 2)/2) + C. cos⁻¹ has the opposite derivative sign, and dividing by 4 instead of 2 uses a² in place of a."},{"id":"math-18-032","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"D","q":"Using x = sin θ, ∫ √(1 − x²) dx, for |x| < 1, equals:","o":["x√(1 − x²) + sin⁻¹x + C","½ x√(1 − x²) − ½ sin⁻¹x + C","½ x√(1 − x²) + ½ sin⁻¹x + C","(2/3)(1 − x²)^(3/2) + C"],"a":2,"x":"With x = sin θ the integral is ∫ cos²θ dθ = θ/2 + (sin 2θ)/4 = ½ sin⁻¹x + ½ x√(1 − x²) + C. Differentiating back gives √(1 − x²). Missing the ½ from cos²θ = (1 + cos 2θ)/2 gives x√(1 − x²) + sin⁻¹x."},{"id":"math-18-033","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"M","q":"With the substitution x = 3 sin θ (−π/2 < θ < π/2), the integral ∫ dx/√(9 − x²) becomes:","o":["∫ 3 dθ","∫ (1/3) dθ","∫ dθ","∫ 3 cos²θ dθ"],"a":2,"x":"dx = 3 cos θ dθ and √(9 − 9 sin²θ) = 3 cos θ, so the integrand is 3 cos θ/(3 cos θ) = 1, giving ∫ dθ = θ + C = sin⁻¹(x/3) + C. Forgetting to change dx into 3 cos θ dθ leaves a stray factor 1/3."},{"id":"math-18-034","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"E","q":"Which substitution is the standard choice for ∫ √(a² + x²) dx?","o":["x = a sin θ","x = a sec θ","x = a tan θ","x = a cos²θ"],"a":2,"x":"Since 1 + tan²θ = sec²θ, x = a tan θ turns a² + x² into a² sec²θ. x = a sin θ suits a² − x², and x = a sec θ suits x² − a²."},{"id":"math-18-035","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"M","q":"∫ sin x/(1 + cos x) dx equals:","o":["ln(1 + cos x) + C","−1/(1 + cos x) + C","−ln(1 + cos x) + C","x − ln(1 + cos x) + C"],"a":2,"x":"With u = 1 + cos x, du = −sin x dx, the integral is −∫ du/u = −ln(1 + cos x) + C. Missing the minus from d(cos x) gives ln(1 + cos x)."},{"id":"math-18-036","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"D","q":"∫ eˣ/(1 + e^(2x)) dx equals:","o":["ln(1 + e^(2x)) + C","½ ln(1 + e^(2x)) + C","½ tan⁻¹(e^(2x)) + C","tan⁻¹(eˣ) + C"],"a":3,"x":"Put u = eˣ, du = eˣ dx: ∫ du/(1 + u²) = tan⁻¹u = tan⁻¹(eˣ) + C. The log options would need e^(2x) on top, not eˣ."},{"id":"math-18-037","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"D","q":"∫ x√(x + 1) dx, for x > −1, equals:","o":["(2/5)(x + 1)^(5/2) + (2/3)(x + 1)^(3/2) + C","(2/3)x(x + 1)^(3/2) + C","(x²/2) · (2/3)(x + 1)^(3/2) + C","(2/5)(x + 1)^(5/2) − (2/3)(x + 1)^(3/2) + C"],"a":3,"x":"Put u = x + 1, so x = u − 1: ∫ (u − 1)√u du = (2/5)u^(5/2) − (2/3)u^(3/2) + C. Integrating each factor separately and multiplying the results is not valid."},{"id":"math-18-038","unit":"math-18","topic":"math-18-subst","lo":"MATH-18.2","d":"M","q":"∫ cos x/sin²x dx, for 0 < x < π, equals:","o":["−cosec x + C","cosec x + C","−cot x + C","ln(sin²x) + C"],"a":0,"x":"Put u = sin x, du = cos x dx: ∫ u⁻² du = −1/u = −cosec x + C. Check: d/dx(−cosec x) = cosec x cot x = cos x/sin²x. Writing ∫ u⁻² du as +1/u gives cosec x."},{"id":"math-18-039","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"E","q":"∫ x eˣ dx equals:","o":["(x + 1)eˣ + C","x eˣ + C","(x²/2)eˣ + C","(x − 1)eˣ + C"],"a":3,"x":"Take u = x, dv = eˣ dx: x eˣ − ∫ eˣ dx = x eˣ − eˣ + C = (x − 1)eˣ + C. Check: d/dx[(x − 1)eˣ] = eˣ + (x − 1)eˣ = x eˣ."},{"id":"math-18-040","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"M","q":"∫ x cos x dx equals:","o":["x sin x − cos x + C","−x sin x + cos x + C","(x²/2) sin x + C","x sin x + cos x + C"],"a":3,"x":"u = x, dv = cos x dx gives x sin x − ∫ sin x dx = x sin x + cos x + C. Check: sin x + x cos x − sin x = x cos x. Writing ∫ sin x dx = cos x gives x sin x − cos x."},{"id":"math-18-041","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"E","q":"∫ ln x dx, for x > 0, equals:","o":["x ln x + x + C","x ln x − x + C","1/x + C","(ln x)²/2 + C"],"a":1,"x":"Take u = ln x, dv = dx: x ln x − ∫ x · (1/x) dx = x ln x − x + C. Check: ln x + 1 − 1 = ln x. 1/x is the derivative of ln x."},{"id":"math-18-042","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"M","q":"∫ x ln x dx, for x > 0, equals:","o":["(x²/2) ln x − x²/4 + C","(x²/2) ln x + x²/4 + C","(x²/2) ln x − x²/2 + C","x ln x − x + C"],"a":0,"x":"u = ln x, dv = x dx: (x²/2) ln x − ∫ (x²/2)(1/x) dx = (x²/2) ln x − x²/4 + C. Forgetting the ½ in ∫ x/2 dx gives −x²/2."},{"id":"math-18-043","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"M","q":"∫ x sin 2x dx equals:","o":["½ x cos 2x + ¼ sin 2x + C","−½ x cos 2x − ¼ sin 2x + C","−½ x cos 2x + ¼ sin 2x + C","−x cos 2x + sin 2x + C"],"a":2,"x":"u = x, dv = sin 2x dx, v = −½ cos 2x: −½ x cos 2x + ½ ∫ cos 2x dx = −½ x cos 2x + ¼ sin 2x + C. Dropping the ½ factors from v gives −x cos 2x + sin 2x."},{"id":"math-18-044","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"M","q":"∫ tan⁻¹x dx equals:","o":["x tan⁻¹x + ½ ln(1 + x²) + C","x tan⁻¹x − ln(1 + x²) + C","x tan⁻¹x − ½ ln(1 + x²) + C","1/(1 + x²) + C"],"a":2,"x":"u = tan⁻¹x, dv = dx: x tan⁻¹x − ∫ x/(1 + x²) dx = x tan⁻¹x − ½ ln(1 + x²) + C. Missing the ½ in ∫ x/(1 + x²) dx gives −ln(1 + x²)."},{"id":"math-18-045","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"D","q":"∫ x² eˣ dx equals:","o":["(x² + 2x + 2)eˣ + C","(x² − 2x + 2)eˣ + C","(x² − 2x)eˣ + C","(x² − 2x − 2)eˣ + C"],"a":1,"x":"Parts twice: x²eˣ − 2∫ x eˣ dx = x²eˣ − 2(x − 1)eˣ = (x² − 2x + 2)eˣ + C. Check: derivative is (2x − 2)eˣ + (x² − 2x + 2)eˣ = x²eˣ. Stopping after one step gives (x² − 2x)eˣ."},{"id":"math-18-046","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"D","q":"∫ eˣ sin x dx equals:","o":["½ eˣ(sin x − cos x) + C","½ eˣ(sin x + cos x) + C","eˣ(sin x − cos x) + C","½ eˣ(cos x − sin x) + C"],"a":0,"x":"Parts twice brings back I: I = eˣ sin x − eˣ cos x − I, so 2I = eˣ(sin x − cos x) and I = ½ eˣ(sin x − cos x) + C. Forgetting to divide by 2 gives eˣ(sin x − cos x)."},{"id":"math-18-047","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"M","q":"∫ eˣ (1/x − 1/x²) dx, for x > 0, equals:","o":["eˣ ln x + C","−eˣ/x + C","eˣ/x² + C","eˣ/x + C"],"a":3,"x":"Use ∫ eˣ[f(x) + f′(x)] dx = eˣ f(x) + C with f(x) = 1/x, f′(x) = −1/x². So the answer is eˣ/x + C. Check: d/dx(eˣ/x) = eˣ/x − eˣ/x²."},{"id":"math-18-048","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"M","q":"∫ eˣ (sin x + cos x) dx equals:","o":["eˣ cos x + C","eˣ sin x + C","eˣ (sin x − cos x) + C","−eˣ cos x + C"],"a":1,"x":"With f(x) = sin x, f′(x) = cos x, the rule ∫ eˣ[f + f′] dx = eˣ f(x) + C gives eˣ sin x + C. Check: eˣ sin x + eˣ cos x. Choosing f = cos x gives eˣ cos x, whose derivative is eˣ(cos x − sin x)."},{"id":"math-18-049","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"E","q":"To find ∫ x ln x dx by parts (∫ u dv), the best choice is:","o":["u = x, dv = ln x dx","u = x ln x, dv = dx","u = ln x, dv = x dx","u = 1, dv = x ln x dx"],"a":2,"x":"Choose u = ln x because it becomes simpler (1/x) when differentiated, and x dx is easy to integrate. Taking dv = ln x dx needs ∫ ln x dx first, which makes the work longer."},{"id":"math-18-050","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"M","q":"∫ sin⁻¹x dx, for |x| < 1, equals:","o":["x sin⁻¹x − √(1 − x²) + C","x sin⁻¹x + √(1 − x²) + C","x sin⁻¹x + ½√(1 − x²) + C","1/√(1 − x²) + C"],"a":1,"x":"u = sin⁻¹x, dv = dx: x sin⁻¹x − ∫ x/√(1 − x²) dx = x sin⁻¹x + √(1 − x²) + C. Check: sin⁻¹x + x/√(1 − x²) − x/√(1 − x²) = sin⁻¹x. The sign slip in ∫ x/√(1 − x²) dx gives −√(1 − x²)."},{"id":"math-18-051","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"D","q":"∫ (ln x)/x² dx, for x > 0, equals:","o":["−(ln x + 1)/x + C","(ln x + 1)/x + C","(1 − ln x)/x + C","−(ln x)/x + C"],"a":0,"x":"u = ln x, dv = x⁻² dx, v = −1/x: −(ln x)/x + ∫ x⁻² dx = −(ln x)/x − 1/x + C = −(ln x + 1)/x + C. Stopping before the second integral gives −(ln x)/x."},{"id":"math-18-052","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"M","q":"∫ x sec²x dx, for |x| < π/2, equals:","o":["x tan x − ln(cos x) + C","x tan x + ln(cos x) + C","x tan x + ln|sin x| + C","(x²/2) tan x + C"],"a":1,"x":"u = x, dv = sec²x dx: x tan x − ∫ tan x dx = x tan x − ln(sec x) = x tan x + ln(cos x) + C. Using ∫ tan x dx = ln(cos x) gives x tan x − ln(cos x)."},{"id":"math-18-053","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"M","q":"If ∫ x e^(2x) dx = e^(2x)(Ax + B) + C, then:","o":["A = ½, B = ¼","A = ½, B = −¼","A = ½, B = −½","A = 2, B = −2"],"a":1,"x":"By parts: (x/2)e^(2x) − ½ ∫ e^(2x) dx = (x/2)e^(2x) − ¼e^(2x), so A = ½, B = −¼. Check: d/dx = e^(2x)(x − ½) + ½e^(2x) = x e^(2x)."},{"id":"math-18-054","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"D","q":"∫ x³ e^(x²) dx equals:","o":["½ e^(x²)(x² + 1) + C","e^(x²)(x² − 1) + C","½ x² e^(x²) + C","½ e^(x²)(x² − 1) + C"],"a":3,"x":"Put t = x², dt = 2x dx: ½ ∫ t eᵗ dt = ½ (t − 1)eᵗ = ½ e^(x²)(x² − 1) + C. Check: x e^(x²)(x² − 1) + x e^(x²) = x³e^(x²). Losing the ½ from dt = 2x dx gives e^(x²)(x² − 1)."},{"id":"math-18-055","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"E","q":"The rule for integration by parts is ∫ u dv =","o":["uv − ∫ v du","uv + ∫ v du","uv − ∫ u dv","v du − u dv"],"a":0,"x":"From the product rule d(uv) = u dv + v du, integrating gives ∫ u dv = uv − ∫ v du. The plus sign and the swapped integral are the usual slips."},{"id":"math-18-056","unit":"math-18","topic":"math-18-parts","lo":"MATH-18.3","d":"M","q":"∫ x² ln x dx, for x > 0, equals:","o":["(x³/3) ln x − x³/3 + C","(x³/3) ln x − x³/9 + C","(x³/3) ln x + x³/9 + C","(x²/2) ln x − x²/4 + C"],"a":1,"x":"u = ln x, dv = x² dx: (x³/3) ln x − ∫ (x³/3)(1/x) dx = (x³/3) ln x − x³/9 + C. Forgetting to integrate x²/3 fully gives −x³/3."},{"id":"math-18-057","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"M","q":"∫ dx/((x − 1)(x + 1)), for x > 1, equals:","o":["½ ln((x + 1)/(x − 1)) + C","½ ln((x − 1)/(x + 1)) + C","ln((x − 1)(x + 1)) + C","ln((x − 1)/(x + 1)) + C"],"a":1,"x":"1/((x − 1)(x + 1)) = ½[1/(x − 1) − 1/(x + 1)], so the integral is ½ ln((x − 1)/(x + 1)) + C. Dropping the ½ gives ln((x − 1)/(x + 1))."},{"id":"math-18-058","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"E","q":"The partial fractions of 1/(x(x + 1)) are:","o":["1/x + 1/(x + 1)","1/(x + 1) − 1/x","2/x − 1/(x + 1)","1/x − 1/(x + 1)"],"a":3,"x":"1 = A(x + 1) + Bx. x = 0 gives A = 1; x = −1 gives B = −1. So 1/x − 1/(x + 1); check: ((x + 1) − x)/(x(x + 1)) = 1/(x(x + 1))."},{"id":"math-18-059","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"M","q":"∫ (3x + 5)/((x + 1)(x + 3)) dx, for x > −1, equals:","o":["2 ln(x + 1) + ln(x + 3) + C","ln(x + 1) − 2 ln(x + 3) + C","ln(x + 1) + 2 ln(x + 3) + C","ln((x + 1)(x + 3)) + C"],"a":2,"x":"3x + 5 = A(x + 3) + B(x + 1). x = −1: 2 = 2A, A = 1. x = −3: −4 = −2B, B = 2. So the integral is ln(x + 1) + 2 ln(x + 3) + C. Swapping the two coefficients gives 2 ln(x + 1) + ln(x + 3)."},{"id":"math-18-060","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"E","q":"If 1/((x − 1)(x − 2)(x − 3)) = A/(x − 1) + B/(x − 2) + C/(x − 3), then B equals:","o":["−1","1","½","−½"],"a":0,"x":"Cover-up at x = 2: B = 1/((2 − 1)(2 − 3)) = 1/(−1) = −1. (The other two coefficients both come out ½.) Forgetting the negative factor (2 − 3) gives 1."},{"id":"math-18-061","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"M","q":"∫ x/((x − 1)(x − 2)) dx, for x > 2, equals:","o":["2 ln(x − 1) − ln(x − 2) + C","ln(x − 2) − ln(x − 1) + C","2 ln(x − 2) − ln(x − 1) + C","ln(x − 1) + 2 ln(x − 2) + C"],"a":2,"x":"x = A(x − 2) + B(x − 1). x = 1: 1 = −A, A = −1. x = 2: B = 2. So the integral is −ln(x − 1) + 2 ln(x − 2) + C. Losing the sign of A gives ln(x − 1) + 2 ln(x − 2)."},{"id":"math-18-062","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"D","q":"∫ x²/(x² − 1) dx, for x > 1, equals:","o":["x − ½ ln((x − 1)/(x + 1)) + C","½ ln((x − 1)/(x + 1)) + C","x + ln(x² − 1) + C","x + ½ ln((x − 1)/(x + 1)) + C"],"a":3,"x":"The fraction is improper, so divide first: x²/(x² − 1) = 1 + 1/(x² − 1) = 1 + ½[1/(x − 1) − 1/(x + 1)]. Integrating gives x + ½ ln((x − 1)/(x + 1)) + C. Skipping the division loses the x."},{"id":"math-18-063","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"E","q":"The correct form of partial fractions for (2x + 1)/((x − 1)²(x + 2)) is:","o":["A/(x − 1)² + C/(x + 2)","A/(x − 1) + C/(x + 2)","A/(x − 1) + B/(x − 1)² + C/(x + 2)","A/(x − 1) + B/(x + 2) + C/(x + 2)²"],"a":2,"x":"A repeated linear factor (x − 1)² needs one term for each power: A/(x − 1) + B/(x − 1)². The factor (x + 2) appears once, so it gets one term C/(x + 2)."},{"id":"math-18-064","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"D","q":"∫ dx/(x²(x + 1)), for x > 0, equals:","o":["ln((x + 1)/x) − 1/x + C","ln((x + 1)/x) + 1/x + C","ln(x/(x + 1)) − 1/x + C","ln(x(x + 1)) − 1/x + C"],"a":0,"x":"1/(x²(x + 1)) = −1/x + 1/x² + 1/(x + 1) (B = 1 at x = 0, C = 1 at x = −1, A = −C). Integrating: −ln x − 1/x + ln(x + 1) = ln((x + 1)/x) − 1/x + C. Writing ∫ x⁻² dx = +1/x gives ln((x + 1)/x) + 1/x."},{"id":"math-18-065","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"M","q":"∫ dx/(x(x² + 1)), for x > 0, equals:","o":["ln x + ½ ln(x² + 1) + C","ln x − ½ ln(x² + 1) + C","ln x − ln(x² + 1) + C","ln x − tan⁻¹x + C"],"a":1,"x":"1/(x(x² + 1)) = 1/x − x/(x² + 1) (A = 1, then Bx + C = −x). So the integral is ln x − ½ ln(x² + 1) + C. Taking −x/(x² + 1) to −tan⁻¹x is the slip."},{"id":"math-18-066","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"M","q":"∫ dx/(x² − 9), for x > 3, equals:","o":["(1/3) ln((x − 3)/(x + 3)) + C","(1/6) ln((x + 3)/(x − 3)) + C","(1/3) tan⁻¹(x/3) + C","(1/6) ln((x − 3)/(x + 3)) + C"],"a":3,"x":"1/(x² − 9) = (1/6)[1/(x − 3) − 1/(x + 3)], so the integral is (1/6) ln((x − 3)/(x + 3)) + C, matching (1/2a) ln((x − a)/(x + a)) with a = 3. tan⁻¹ belongs to x² + 9."},{"id":"math-18-067","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"M","q":"∫ dx/(4 − x²), for |x| < 2, equals:","o":["½ ln((2 + x)/(2 − x)) + C","¼ ln((2 − x)/(2 + x)) + C","½ tan⁻¹(x/2) + C","¼ ln((2 + x)/(2 − x)) + C"],"a":3,"x":"1/(4 − x²) = ¼[1/(2 − x) + 1/(2 + x)]. Integrating, −¼ ln(2 − x) + ¼ ln(2 + x) = ¼ ln((2 + x)/(2 − x)) + C. Missing the minus from ∫ dx/(2 − x) gives the flipped fraction."},{"id":"math-18-068","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"M","q":"If (5x − 1)/((x + 1)(x − 2)) = A/(x + 1) + B/(x − 2), then A + B equals:","o":["1","−1","5","6"],"a":2,"x":"x = −1: −6 = −3A, A = 2. x = 2: 9 = 3B, B = 3. So A + B = 5, which also matches the x-coefficient of 5x − 1 after clearing denominators."},{"id":"math-18-069","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"D","q":"∫ 2/((x + 1)(x² + 1)) dx, for x > −1, equals:","o":["ln(x + 1) + ½ ln(x² + 1) − tan⁻¹x + C","ln(x + 1) − ½ ln(x² + 1) − tan⁻¹x + C","ln(x + 1) − ½ ln(x² + 1) + tan⁻¹x + C","2 ln(x + 1) − ln(x² + 1) + tan⁻¹x + C"],"a":2,"x":"2/((x + 1)(x² + 1)) = 1/(x + 1) + (−x + 1)/(x² + 1) (A = 1 at x = −1; then B = −1, C = 1). Integrating: ln(x + 1) − ½ ln(x² + 1) + tan⁻¹x + C."},{"id":"math-18-070","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"M","q":"∫ eˣ/((eˣ + 1)(eˣ + 2)) dx equals:","o":["ln((eˣ + 2)/(eˣ + 1)) + C","ln((eˣ + 1)/(eˣ + 2)) + C","ln((eˣ + 1)(eˣ + 2)) + C","½ ln((eˣ + 1)/(eˣ + 2)) + C"],"a":1,"x":"Put u = eˣ, du = eˣ dx: ∫ du/((u + 1)(u + 2)) = ∫ [1/(u + 1) − 1/(u + 2)] du = ln((u + 1)/(u + 2)) + C. Swapping signs gives the flipped fraction."},{"id":"math-18-071","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"M","q":"∫ (x − 1)/(x + 1) dx, for x > −1, equals:","o":["x + 2 ln(x + 1) + C","x − ln(x + 1) + C","ln(x + 1) − x + C","x − 2 ln(x + 1) + C"],"a":3,"x":"(x − 1)/(x + 1) = 1 − 2/(x + 1), so the integral is x − 2 ln(x + 1) + C. Check: 1 − 2/(x + 1) = (x − 1)/(x + 1)."},{"id":"math-18-072","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"M","q":"∫ cos x/(sin x (1 + sin x)) dx, for 0 < x < π/2, equals:","o":["ln((1 + sin x)/sin x) + C","ln(sin x (1 + sin x)) + C","ln(1 + sin x) + C","ln(sin x/(1 + sin x)) + C"],"a":3,"x":"Put u = sin x: ∫ du/(u(1 + u)) = ∫ [1/u − 1/(1 + u)] du = ln(u/(1 + u)) + C = ln(sin x/(1 + sin x)) + C."},{"id":"math-18-073","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"E","q":"Which fraction must be divided out (it is improper) before splitting into partial fractions?","o":["(x + 1)/(x² − 4)","(x³ + 1)/(x² − 4)","(2x − 3)/(x² + x)","5/(x² − 1)"],"a":1,"x":"A rational function is improper when the degree of the numerator is at least that of the denominator. Only (x³ + 1)/(x² − 4) has degree 3 over degree 2; the others are already proper."},{"id":"math-18-074","unit":"math-18","topic":"math-18-pfrac","lo":"MATH-18.4","d":"D","q":"∫ (3x + 1)/(x + 1)² dx, for x > −1, equals:","o":["3 ln(x + 1) + 2/(x + 1) + C","3 ln(x + 1) − 2/(x + 1) + C","3 ln(x + 1) − 2/(x + 1)² + C","3 ln(x + 1) + 1/(x + 1) + C"],"a":0,"x":"3x + 1 = 3(x + 1) − 2, so the integrand is 3/(x + 1) − 2/(x + 1)². Since ∫ (x + 1)⁻² dx = −1/(x + 1), the integral is 3 ln(x + 1) + 2/(x + 1) + C. Missing that minus gives −2/(x + 1)."},{"id":"math-18-075","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"E","q":"∫₀¹ x² dx equals:","o":["1/2","1/3","1","2"],"a":1,"x":"[x³/3] from 0 to 1 = 1/3 − 0 = 1/3. Using x²/2 as the antiderivative gives ½."},{"id":"math-18-076","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"E","q":"∫₀^(π/2) cos x dx equals:","o":["0","1","−1","π/2"],"a":1,"x":"[sin x] from 0 to π/2 = sin(π/2) − sin 0 = 1. Using −sin x as the antiderivative gives −1."},{"id":"math-18-077","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"E","q":"∫₁^e (1/x) dx equals:","o":["e","e − 1","1","0"],"a":2,"x":"[ln x] from 1 to e = ln e − ln 1 = 1 − 0 = 1."},{"id":"math-18-078","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"M","q":"∫₀^π sin x dx equals:","o":["0","1","−2","2"],"a":3,"x":"[−cos x] from 0 to π = −cos π + cos 0 = 1 + 1 = 2. Taking cos x as the antiderivative gives −2; a sign mix-up in −cos π gives 0."},{"id":"math-18-079","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"M","q":"∫₀² |x − 1| dx equals:","o":["0","2","1","1/2"],"a":2,"x":"Split at x = 1: ∫₀¹ (1 − x) dx + ∫₁² (x − 1) dx = ½ + ½ = 1. Ignoring the modulus, ∫₀² (x − 1) dx = 0."},{"id":"math-18-080","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"E","q":"If ∫₁³ f(x) dx = 5, then ∫₃¹ 2f(x) dx equals:","o":["−10","10","−5","5/2"],"a":0,"x":"Reversing the limits changes the sign and the constant comes out: ∫₃¹ 2f(x) dx = −2 × 5 = −10. Forgetting the limit swap gives 10."},{"id":"math-18-081","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"M","q":"If ∫₀² f(x) dx = 3 and ∫₀⁵ f(x) dx = 7, then ∫₂⁵ f(x) dx equals:","o":["10","−4","4","3"],"a":2,"x":"∫₀⁵ f = ∫₀² f + ∫₂⁵ f, so ∫₂⁵ f = 7 − 3 = 4. Adding the two gives 10; subtracting the wrong way gives −4."},{"id":"math-18-082","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"D","q":"∫₋₁¹ (x³ + x cos x + 2) dx equals:","o":["4","0","2","2 + 2 cos 1"],"a":0,"x":"x³ and x cos x are odd, so their integrals over [−1, 1] are 0. The constant 2 gives 2 × 2 = 4. Assuming the whole integrand is odd gives 0."},{"id":"math-18-083","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"M","q":"d/dx ∫₀ˣ √(1 + t³) dt equals:","o":["√(1 + x³) − 1","3x²/(2√(1 + x³))","√(1 + x³)","0"],"a":2,"x":"By the Fundamental Theorem of Calculus, d/dx ∫ₐˣ f(t) dt = f(x), so the answer is √(1 + x³). Differentiating the integrand again gives 3x²/(2√(1 + x³))."},{"id":"math-18-084","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"D","q":"d/dx ∫₀^(x²) sin t dt equals:","o":["sin(x²)","2x cos(x²)","1 − cos(x²)","2x sin(x²)"],"a":3,"x":"FTC with the chain rule: f(upper limit) × (upper limit)′ = sin(x²) · 2x. Forgetting the factor 2x gives sin(x²); 1 − cos(x²) is the integral itself."},{"id":"math-18-085","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"M","q":"∫₀^(π/2) sin²x dx equals:","o":["π/2","1/2","π/4","π/8"],"a":2,"x":"sin²x = (1 − cos 2x)/2. [x/2 − (sin 2x)/4] from 0 to π/2 = π/4 − 0 = π/4. Forgetting the ½ gives π/2."},{"id":"math-18-086","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"M","q":"∫₀¹ x eˣ dx equals:","o":["e","e − 1","e − 2","1"],"a":3,"x":"∫ x eˣ dx = (x − 1)eˣ. From 0 to 1: 0 − (−1) = 1. Dropping the lower-limit value −1 gives 0, and using x eˣ alone gives e."},{"id":"math-18-087","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"M","q":"∫₀¹ dx/(1 + x²) equals:","o":["π/2","π/4","ln 2","1"],"a":1,"x":"[tan⁻¹x] from 0 to 1 = π/4 − 0 = π/4. ln 2 would come from ∫₀¹ 2x/(1 + x²) dx, a different integrand."},{"id":"math-18-088","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"M","q":"∫₀¹ 2x/(1 + x²) dx equals:","o":["½ ln 2","1","ln 2","π/4"],"a":2,"x":"With u = 1 + x², du = 2x dx, limits u = 1 to 2: ∫₁² du/u = ln 2. Halving it wrongly gives ½ ln 2; π/4 belongs to ∫₀¹ dx/(1 + x²)."},{"id":"math-18-089","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"M","q":"If ∫₀ᵏ (2x + 1) dx = 6 and k > 0, then k equals:","o":["3","−3","6","2"],"a":3,"x":"[x² + x] from 0 to k = k² + k = 6, so (k + 3)(k − 2) = 0. Since k > 0, k = 2. Taking the negative root gives −3."},{"id":"math-18-090","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"D","q":"∫₀^(π/2) sin x/(sin x + cos x) dx equals:","o":["π/2","1","1/2","π/4"],"a":3,"x":"Call it I. Using ∫₀ᵃ f(x) dx = ∫₀ᵃ f(a − x) dx, I also equals ∫₀^(π/2) cos x/(cos x + sin x) dx. Adding, 2I = ∫₀^(π/2) 1 dx = π/2, so I = π/4."},{"id":"math-18-091","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"D","q":"∫₁² ln x dx equals:","o":["2 ln 2","ln 2 − 1","2 ln 2 − 1","2 ln 2 + 1"],"a":2,"x":"∫ ln x dx = x ln x − x. From 1 to 2: (2 ln 2 − 2) − (0 − 1) = 2 ln 2 − 1. Dropping the −x part of the antiderivative gives 2 ln 2."},{"id":"math-18-092","unit":"math-18","topic":"math-18-definite","lo":"MATH-18.5","d":"M","q":"∫₀^(π/3) tan x dx equals:","o":["ln 2","−ln 2","√3 − 1","½ ln 3"],"a":0,"x":"∫ tan x dx = ln(sec x). From 0 to π/3: ln(sec π/3) − ln 1 = ln 2. Using ln(cos x) as the antiderivative gives −ln 2."},{"id":"math-18-093","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"E","q":"The area between y = x², the x-axis and the lines x = 0 and x = 3 is:","o":["27","9","3","6"],"a":1,"x":"Area = ∫₀³ x² dx = [x³/3]₀³ = 27/3 = 9 square units. Forgetting to divide by 3 gives 27."},{"id":"math-18-094","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"E","q":"The area under y = 2x + 1 from x = 0 to x = 2 (above the x-axis) is:","o":["6","5","4","8"],"a":0,"x":"∫₀² (2x + 1) dx = [x² + x]₀² = 4 + 2 = 6 square units. Leaving out the constant term gives 4."},{"id":"math-18-095","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"M","q":"The total area enclosed between y = cos x and the x-axis from x = 0 to x = π is:","o":["0","1","2","π"],"a":2,"x":"cos x is positive on (0, π/2) and negative on (π/2, π). Area = ∫₀^(π/2) cos x dx + |∫_(π/2)^π cos x dx| = 1 + 1 = 2. Integrating straight through gives 0, which is not an area."},{"id":"math-18-096","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"M","q":"The area of the region bounded by y = x² and y = x is:","o":["1/6","1/2","1/3","5/6"],"a":0,"x":"They meet at x = 0 and x = 1, and x ≥ x² there. Area = ∫₀¹ (x − x²) dx = ½ − ⅓ = 1/6."},{"id":"math-18-097","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"M","q":"The area of the region bounded by the parabola y = x² and the line y = 4 is:","o":["32/3","16/3","16","8"],"a":0,"x":"They meet at x = ±2. Area = ∫₋₂² (4 − x²) dx = 16 − 16/3 = 32/3. Using only x from 0 to 2 gives half, 16/3."},{"id":"math-18-098","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"M","q":"The area enclosed between the curve y = x³, the x-axis and the lines x = −1 and x = 1 is:","o":["0","1/2","1/4","1"],"a":1,"x":"The part for −1 ≤ x ≤ 0 lies below the axis. Area = 2∫₀¹ x³ dx = 2 × ¼ = ½. Integrating straight from −1 to 1 gives 0."},{"id":"math-18-099","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"E","q":"The area under y = eˣ from x = 0 to x = ln 2 is:","o":["1","2","ln 2","1/2"],"a":0,"x":"∫₀^(ln 2) eˣ dx = e^(ln 2) − e⁰ = 2 − 1 = 1. Forgetting to subtract e⁰ gives 2."},{"id":"math-18-100","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"M","q":"The area under y = 1/x from x = 1 to x = 4 is:","o":["ln 3","3/4","2 ln 2","ln 2"],"a":2,"x":"∫₁⁴ dx/x = ln 4 − ln 1 = ln 4 = 2 ln 2. Taking ln(4 − 1) = ln 3 is the slip."},{"id":"math-18-101","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"D","q":"The area of the region bounded by the curves y = x² and y = 2x − x² is:","o":["2/3","1/3","1/6","1"],"a":1,"x":"x² = 2x − x² gives x = 0 or 1. On [0, 1], 2x − x² ≥ x², so area = ∫₀¹ (2x − 2x²) dx = 1 − 2/3 = 1/3."},{"id":"math-18-102","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"D","q":"The area of the region bounded by the parabola y² = 4x and the line x = 1 is:","o":["4/3","2/3","16/3","8/3"],"a":3,"x":"The region is symmetric about the x-axis with upper half y = 2√x. Area = 2∫₀¹ 2√x dx = 4 × (2/3) = 8/3. Taking only the upper half gives 4/3."},{"id":"math-18-103","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"M","q":"The region under y = x from x = 0 to x = 2 is rotated about the x-axis. The volume of the solid is:","o":["8π/3","2π","4π","8π"],"a":0,"x":"V = π∫₀² x² dx = π × 8/3 = 8π/3 (a cone of radius 2, height 2). Using π∫ y dx instead of π∫ y² dx gives 2π."},{"id":"math-18-104","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"M","q":"The region under y = √x from x = 0 to x = 4 is rotated about the x-axis. The volume generated is:","o":["16π/3","16π","4π","8π"],"a":3,"x":"V = π∫₀⁴ (√x)² dx = π∫₀⁴ x dx = π × 8 = 8π. Forgetting to square y gives π∫₀⁴ √x dx = 16π/3."},{"id":"math-18-105","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"D","q":"The semicircle y = √(9 − x²), −3 ≤ x ≤ 3, is rotated about the x-axis. The volume of the solid formed is:","o":["36π","18π","12π","108π"],"a":0,"x":"V = π∫₋₃³ (9 − x²) dx = π(54 − 18) = 36π, which agrees with the sphere formula (4/3)π(3)³ = 36π. Using only 0 ≤ x ≤ 3 gives 18π."},{"id":"math-18-106","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"E","q":"When the region under y = f(x) (f ≥ 0) from x = a to x = b is rotated about the x-axis, the volume is:","o":["2π∫ₐᵇ y dx","π∫ₐᵇ y dx","π²∫ₐᵇ y² dx","π∫ₐᵇ y² dx"],"a":3,"x":"Each thin slice is a disc of radius y and thickness dx, volume πy² dx. Adding them gives V = π∫ₐᵇ y² dx."},{"id":"math-18-107","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"M","q":"The region under y = eˣ from x = 0 to x = 1 is rotated about the x-axis. The volume is:","o":["π(e − 1)","π(e² − 1)","π(e² − 1)/4","π(e² − 1)/2"],"a":3,"x":"V = π∫₀¹ e^(2x) dx = π[e^(2x)/2]₀¹ = π(e² − 1)/2. Not squaring y gives π(e − 1); forgetting the ½ from e^(2x) gives π(e² − 1)."},{"id":"math-18-108","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"M","q":"The area of the region bounded by y = |x| and the line y = 2 is:","o":["2","4","8","6"],"a":1,"x":"The lines meet at x = ±2. Area = ∫₋₂² (2 − |x|) dx = 8 − 4 = 4, the triangle with base 4 and height 2. Using only x ≥ 0 gives 2."},{"id":"math-18-109","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"D","q":"The area enclosed between y = sin x and y = cos x from x = 0 to x = π/2 is:","o":["2√2 − 2","0","√2 − 1","2 − √2"],"a":0,"x":"The curves cross at x = π/4. Area = ∫₀^(π/4) (cos x − sin x) dx + ∫_(π/4)^(π/2) (sin x − cos x) dx = (√2 − 1) + (√2 − 1) = 2√2 − 2. Integrating cos x − sin x straight through gives 0."},{"id":"math-18-110","unit":"math-18","topic":"math-18-area","lo":"MATH-18.6","d":"M","q":"The area under y = kx² from x = 0 to x = 3 is 18 square units (k > 0). Then k equals:","o":["6","2","2/3","3"],"a":1,"x":"∫₀³ kx² dx = k × 27/3 = 9k = 18, so k = 2. Using 27k = 18 (forgetting the 1/3) gives 2/3."},{"id":"math-19-001","unit":"math-19","topic":"math-19-basics","lo":"MATH-19.1","d":"E","q":"The order and degree of the differential equation (d²y/dx²)³ + (dy/dx)⁴ + y = 0 are:","o":["Order 2, degree 3","Order 3, degree 2","Order 2, degree 4","Order 4, degree 2"],"a":0,"x":"The highest derivative is d²y/dx², so the order is 2; its power is 3, so the degree is 3. Taking the power 4 of dy/dx as the degree is the common slip."},{"id":"math-19-002","unit":"math-19","topic":"math-19-basics","lo":"MATH-19.1","d":"M","q":"The order and degree of the differential equation d²y/dx² = √(1 + (dy/dx)²) are:","o":["Order 2, degree 2","Order 2, degree 1","Order 1, degree 2","Order 2, degree ½"],"a":0,"x":"First clear the radical: (d²y/dx²)² = 1 + (dy/dx)². The highest derivative is second order and it now appears squared, so order 2, degree 2. Reading the degree before removing the square root gives degree 1."},{"id":"math-19-003","unit":"math-19","topic":"math-19-basics","lo":"MATH-19.1","d":"E","q":"What is the order of the differential equation d³y/dx³ + 2(d²y/dx²)⁵ − y = sin x?","o":["5","2","3","1"],"a":2,"x":"The order is the order of the highest derivative present, d³y/dx³, so it is 3. The 5 is the power of a lower derivative, not the order."},{"id":"math-19-004","unit":"math-19","topic":"math-19-basics","lo":"MATH-19.1","d":"M","q":"Eliminating the arbitrary constant c from y = cx² gives the differential equation:","o":["dy/dx = 2xy","x·dy/dx = y","2x·dy/dx = y","x·dy/dx = 2y"],"a":3,"x":"Differentiate: dy/dx = 2cx. From y = cx², c = y/x², so dy/dx = 2y/x, i.e. x·dy/dx = 2y. Check with y = x²: x·2x = 2x² = 2y."},{"id":"math-19-005","unit":"math-19","topic":"math-19-basics","lo":"MATH-19.1","d":"M","q":"The differential equation of the family y = A cos x + B sin x (A, B arbitrary constants) is:","o":["y″ + y = 0","y″ − y = 0","y′ + y = 0","y″ + y′ = 0"],"a":0,"x":"y′ = −A sin x + B cos x and y″ = −A cos x − B sin x = −y, so y″ + y = 0. Two constants need a second-order equation, which rules out y′ + y = 0."},{"id":"math-19-006","unit":"math-19","topic":"math-19-basics","lo":"MATH-19.1","d":"E","q":"The general solution of a differential equation of order 3 contains how many arbitrary constants?","o":["3","2","1","4"],"a":0,"x":"The general solution of an nth-order differential equation contains n independent arbitrary constants, so order 3 gives 3 constants."},{"id":"math-19-007","unit":"math-19","topic":"math-19-basics","lo":"MATH-19.1","d":"M","q":"The differential equation of the family y = Ae^(2x) + Be^(−2x) is:","o":["y″ + 4y = 0","y″ − 2y = 0","y′ − 4y = 0","y″ − 4y = 0"],"a":3,"x":"y′ = 2Ae^(2x) − 2Be^(−2x) and y″ = 4Ae^(2x) + 4Be^(−2x) = 4y, so y″ − 4y = 0. The sign change from e^(−2x) cancels on the second differentiation, so y″ + 4y = 0 is wrong."},{"id":"math-19-008","unit":"math-19","topic":"math-19-basics","lo":"MATH-19.1","d":"M","q":"Which of the following differential equations is of first order and first degree?","o":["(dy/dx)² + y = 0","d²y/dx² + y = 0","(d²y/dx²)² = y","dy/dx + y = x²"],"a":3,"x":"dy/dx + y = x² has only the first derivative, to power 1. (dy/dx)² + y = 0 is first order but degree 2; the other two are second order."},{"id":"math-19-009","unit":"math-19","topic":"math-19-basics","lo":"MATH-19.1","d":"M","q":"y = e^(kx) is a solution of y″ − 5y′ + 6y = 0 if:","o":["k = −2 or k = −3","k = 2 or k = 3","k = 1 or k = 6","k = −1 or k = 6"],"a":1,"x":"Substituting gives (k² − 5k + 6)e^(kx) = 0, so (k − 2)(k − 3) = 0 and k = 2 or 3. Check k = 2: 4 − 10 + 6 = 0. The sign slip gives −2, −3."},{"id":"math-19-010","unit":"math-19","topic":"math-19-basics","lo":"MATH-19.1","d":"M","q":"The differential equation of the family of circles x² + y² = r² (r arbitrary) is:","o":["x + y·dy/dx = 0","x − y·dy/dx = 0","y + x·dy/dx = 0","x·dy/dx − y = 0"],"a":0,"x":"Differentiate x² + y² = r²: 2x + 2y·dy/dx = 0, so x + y·dy/dx = 0; r disappears because it is a constant."},{"id":"math-19-011","unit":"math-19","topic":"math-19-basics","lo":"MATH-19.1","d":"D","q":"The order and degree of the differential equation y = x·(dy/dx) + √(1 + (dy/dx)²) are:","o":["Order 1, degree 2","Order 1, degree 1","Order 2, degree 2","Order 1, degree ½"],"a":0,"x":"Write p = dy/dx. Isolate the root and square: (y − xp)² = 1 + p², which expands to a polynomial of degree 2 in p. So the order is 1 and the degree is 2; reading the degree before clearing the root gives 1."},{"id":"math-19-012","unit":"math-19","topic":"math-19-basics","lo":"MATH-19.1","d":"D","q":"The differential equation of the family y = (A + Bx)eˣ (A, B arbitrary constants) is:","o":["y″ + 2y′ + y = 0","y″ − 2y′ + y = 0","y″ − y = 0","y″ − 2y′ = 0"],"a":1,"x":"y′ = (A + B + Bx)eˣ and y″ = (A + 2B + Bx)eˣ. Then y″ − 2y′ + y = (A + 2B + Bx − 2A − 2B − 2Bx + A + Bx)eˣ = 0. Check B = 0, y = eˣ: 1 − 2 + 1 = 0."},{"id":"math-19-013","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"E","q":"The general solution of dy/dx = x/y is:","o":["y² + x² = c","y = x + c","y² − x² = c","y² = 2x + c"],"a":2,"x":"Separate: y dy = x dx, so y²/2 = x²/2 + c₁, i.e. y² − x² = c. Moving x² to the wrong side gives y² + x² = c, which belongs to dy/dx = −x/y."},{"id":"math-19-014","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"M","q":"The general solution of dy/dx = e^(x − y) is:","o":["e^(−y) = e^x + c","e^y = −e^x + c","e^y = e^x + c","e^(x + y) = c"],"a":2,"x":"Write e^(x − y) = eˣ·e^(−y), so e^y dy = e^x dx and e^y = e^x + c. Check: differentiating gives e^y y′ = e^x, i.e. y′ = e^(x − y)."},{"id":"math-19-015","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"E","q":"The general solution of dy/dx = y/x is:","o":["y = x + c","y = cx","xy = c","y = cx²"],"a":1,"x":"Separate: dy/y = dx/x, so ln|y| = ln|x| + ln|c| and y = cx. xy = c solves dy/dx = −y/x instead."},{"id":"math-19-016","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"M","q":"The general solution of (1 + x²) dy = (1 + y²) dx is:","o":["tan⁻¹y = tan⁻¹x + c","tan⁻¹y + tan⁻¹x = c","ln(1 + y²) = ln(1 + x²) + c","1 + y² = c(1 + x²)"],"a":0,"x":"Separate: dy/(1 + y²) = dx/(1 + x²), so tan⁻¹y = tan⁻¹x + c. Integrating 1/(1 + y²) as a logarithm gives the ln and power forms, which are wrong."},{"id":"math-19-017","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"E","q":"The solution of dy/dx = 2x with y(0) = 3 is:","o":["y = x² + 3","y = x² − 3","y = 2x² + 3","y = x² + 3x"],"a":0,"x":"Integrate: y = x² + c; y(0) = 3 gives c = 3, so y = x² + 3. Check: y′ = 2x and y(0) = 3."},{"id":"math-19-018","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"M","q":"If dy/dx = 3y and y(0) = 2, then y at x = ln 2 is:","o":["8","12","6","16"],"a":3,"x":"dy/y = 3 dx gives y = Ce^(3x); y(0) = 2 gives C = 2. So y(ln 2) = 2e^(3 ln 2) = 2 × 8 = 16. Forgetting the factor 2 gives 8."},{"id":"math-19-019","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"M","q":"The solution of dy/dx = y² with y(0) = 1 is:","o":["y = 1/(1 + x)","y = 1/(1 − x)","y = eˣ","y = 1 − x"],"a":1,"x":"dy/y² = dx gives −1/y = x + c; y(0) = 1 gives c = −1, so 1/y = 1 − x and y = 1/(1 − x). Check: y′ = 1/(1 − x)² = y². The sign slip in −1/y gives 1/(1 + x)."},{"id":"math-19-020","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"M","q":"The general solution of sec²x tan y dx + sec²y tan x dy = 0 is:","o":["tan x + tan y = c","sin x · sin y = c","tan x · tan y = c","tan x = c·tan y"],"a":2,"x":"Divide by tan x tan y: (sec²x/tan x) dx + (sec²y/tan y) dy = 0. Integrating gives ln|tan x| + ln|tan y| = ln|c|, so tan x · tan y = c."},{"id":"math-19-021","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"M","q":"A curve passes through (0, 1) and its slope at every point (x, y) is 2xy. Its equation is:","o":["y = e^(2x)","y = x² + 1","y = 2e^(x²) − 1","y = e^(x²)"],"a":3,"x":"dy/dx = 2xy gives dy/y = 2x dx, ln y = x² + c; at (0, 1), c = 0, so y = e^(x²). Check: y′ = 2x e^(x²) = 2xy. y = x² + 1 has slope 2x, not 2xy."},{"id":"math-19-022","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"D","q":"The general solution of dy/dx = sin x · cos y is:","o":["ln|sec y + tan y| = cos x + c","ln|sec y| = −cos x + c","ln|sec y + tan y| = −cos x + c","sin y = −cos x + c"],"a":2,"x":"Separate: sec y dy = sin x dx. ∫sec y dy = ln|sec y + tan y| and ∫sin x dx = −cos x, giving the first form. Writing ∫sin x dx = cos x is the sign slip; sin y = −cos x + c comes from multiplying by cos y instead of dividing."},{"id":"math-19-023","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"M","q":"If dy/dx = x·e^(−y) and y(0) = 0, the value of y at x = 2 is:","o":["ln 2","ln 5","2","ln 3"],"a":3,"x":"e^y dy = x dx gives e^y = x²/2 + c; y(0) = 0 gives c = 1. At x = 2, e^y = 2 + 1 = 3, so y = ln 3. Dropping the ½ gives ln 5; dropping the constant gives ln 2."},{"id":"math-19-024","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"M","q":"If dy/dx = y cos x and y(0) = 1, then y(π/2) equals:","o":["1","e","e^(−1)","e^(π/2)"],"a":1,"x":"dy/y = cos x dx gives ln y = sin x + c; y(0) = 1 gives c = 0, so y = e^(sin x). At π/2, sin x = 1, so y = e."},{"id":"math-19-025","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"D","q":"If dy/dx = xy + x and y(0) = 0, then y at x = √2 is:","o":["e","e² − 1","e − 1","1"],"a":2,"x":"Factor: dy/dx = x(y + 1), so dy/(y + 1) = x dx and ln|y + 1| = x²/2 + c. y(0) = 0 gives c = 0, so y = e^(x²/2) − 1, and at x = √2, y = e − 1. Forgetting the −1 gives e."},{"id":"math-19-026","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"M","q":"Which differential equation is NOT separable?","o":["dy/dx = xy","dy/dx = e^(x + y)","dy/dx = x²/(y + 1)","dy/dx = x + y"],"a":3,"x":"x + y cannot be written as f(x)·g(y). The others factor: xy = x·y, e^(x + y) = eˣ·e^y, and x²/(y + 1) = x²·1/(y + 1)."},{"id":"math-19-027","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"M","q":"If (x + 1)·dy/dx = 2y and y(0) = 1, then y(2) equals:","o":["3","9","6","4"],"a":1,"x":"dy/y = 2 dx/(x + 1) gives ln y = 2 ln(x + 1) + c; y(0) = 1 gives c = 0, so y = (x + 1)². Then y(2) = 3² = 9. Losing the factor 2 gives y = x + 1 and the answer 3."},{"id":"math-19-028","unit":"math-19","topic":"math-19-separable","lo":"MATH-19.2","d":"D","q":"If y·dy/dx = 2x and y = −2 when x = 1, then y when x = 3 is:","o":["2√5","−2√3","−√10","−2√5"],"a":3,"x":"y dy = 2x dx gives y²/2 = x² + c; at (1, −2), 2 = 1 + c, c = 1, so y² = 2x² + 2. At x = 3, y² = 20, and y keeps the sign of the starting value, so y = −2√5. Dropping the ½ on y gives y² = x² + 3 and −2√3."},{"id":"math-19-029","unit":"math-19","topic":"math-19-apps","lo":"MATH-19.3","d":"E","q":"A population P grows at a rate proportional to its size: dP/dt = kP, with P = P₀ at t = 0. Then P(t) is:","o":["P₀ + kt","P₀e^(kt)","P₀e^(−kt)","kP₀t"],"a":1,"x":"dP/P = k dt gives ln P = kt + c, so P = Ce^(kt); P(0) = P₀ gives C = P₀. P₀e^(−kt) describes decay."},{"id":"math-19-030","unit":"math-19","topic":"math-19-apps","lo":"MATH-19.3","d":"M","q":"A bacteria culture grows at a rate proportional to its size and doubles every 3 hours. If it starts with 500 bacteria, how many are there after 9 hours?","o":["4000","1500","3000","2000"],"a":0,"x":"Growth proportional to size is exponential: 9 hours is 3 doubling times, so 500 × 2³ = 4000. Adding the same amount each 3 hours (linear growth) gives 2000."},{"id":"math-19-031","unit":"math-19","topic":"math-19-apps","lo":"MATH-19.3","d":"M","q":"A radioactive substance decays at a rate proportional to the amount present and has a half-life of 10 years. What fraction of it remains after 30 years?","o":["1/3","1/6","1/4","1/8"],"a":3,"x":"30 years is 3 half-lives, so the fraction left is (½)³ = 1/8. Dividing by 3 instead of halving three times gives 1/3."},{"id":"math-19-032","unit":"math-19","topic":"math-19-apps","lo":"MATH-19.3","d":"M","q":"A quantity decays by dN/dt = −kN (k > 0) and halves in time T. Then k equals:","o":["(ln 2)/T","T/(ln 2)","2/T","(ln 2)·T"],"a":0,"x":"N = N₀e^(−kt) and N₀/2 = N₀e^(−kT), so e^(kT) = 2 and k = (ln 2)/T. T/(ln 2) is the inverted form."},{"id":"math-19-033","unit":"math-19","topic":"math-19-apps","lo":"MATH-19.3","d":"M","q":"A population following P = P₀e^(kt) triples in 2 years. How long does it take to become 9 times its starting size?","o":["6 years","3 years","4 years","8 years"],"a":2,"x":"Tripling in 2 years means e^(2k) = 3. Nine times is 3², which needs e^(kt) = (e^(2k))², so t = 4 years. Scaling the time by 9/3 gives the linear answer 6."},{"id":"math-19-034","unit":"math-19","topic":"math-19-apps","lo":"MATH-19.3","d":"M","q":"A boat's speed v (m/s) falls under resistance with dv/dt = −kv. If v = 20 at t = 0 and v = 10 at t = 1 s, then v at t = 3 s is:","o":["5","2.5","0","1.25"],"a":1,"x":"v = 20e^(−kt) and e^(−k) = ½, so v(3) = 20 × (½)³ = 2.5. Subtracting 10 per second (linear decrease) gives 0."},{"id":"math-19-035","unit":"math-19","topic":"math-19-apps","lo":"MATH-19.3","d":"D","q":"The excess temperature θ of a cooling body over its surroundings satisfies dθ/dt = −kθ. θ falls from 80 °C to 40 °C in 10 minutes. How much longer does it take to fall from 40 °C to 10 °C?","o":["10 minutes","15 minutes","20 minutes","30 minutes"],"a":2,"x":"θ = θ₀e^(−kt) halves every 10 minutes. From 40 to 10 is two halvings (40 → 20 → 10), so 20 minutes. Counting it as one halving gives 10; treating the fall as linear (4 degrees per minute) gives 7.5."},{"id":"math-19-036","unit":"math-19","topic":"math-19-apps","lo":"MATH-19.3","d":"E","q":"An amount of money A grows continuously at a rate of 5% of the current amount per year. The differential equation for A (t in years) is:","o":["dA/dt = 0.05","dA/dt = 5A","dA/dt = 0.05A","dA/dt = A + 0.05"],"a":2,"x":"The rate of change is 5% of the amount, i.e. 0.05 × A, so dA/dt = 0.05A. Writing 5A forgets to turn the percentage into a decimal."},{"id":"math-19-037","unit":"math-19","topic":"math-19-apps","lo":"MATH-19.3","d":"M","q":"Money grows by dA/dt = 0.05A (t in years). The time for the money to double is:","o":["(ln 2)/20 years","20 years","20 ln 2 years","5 ln 2 years"],"a":2,"x":"A = A₀e^(0.05t), so 2 = e^(0.05t) and t = (ln 2)/0.05 = 20 ln 2 years. Using 1/0.05 = 20 without the ln 2 gives 20 years."},{"id":"math-19-038","unit":"math-19","topic":"math-19-apps","lo":"MATH-19.3","d":"D","q":"A particle moves along a line so that ds/dt = 2√s, with s = 1 at t = 0. Its displacement s at t = 2 is:","o":["5","9","4","16"],"a":1,"x":"ds/√s = 2 dt gives 2√s = 2t + c; at t = 0, √s = 1, so √s = t + 1 and s(2) = 3² = 9. Treating the rate as fixed at its starting value 2 gives s = 1 + 2 × 2 = 5."},{"id":"math-19-039","unit":"math-19","topic":"math-19-apps","lo":"MATH-19.3","d":"M","q":"A town's population P = 1000e^(0.02t) (t in years). What is its rate of growth, in people per year, when P = 1500?","o":["20","30","3000","300"],"a":1,"x":"dP/dt = 0.02 × 1000e^(0.02t) = 0.02P, so at P = 1500 the rate is 0.02 × 1500 = 30. Using the starting size 1000 gives 20."},{"id":"math-19-040","unit":"math-19","topic":"math-19-apps","lo":"MATH-19.3","d":"D","q":"A radioactive sample decays at a rate proportional to the amount present. After 2 hours only one quarter of it is left. How many MORE hours until only 1/32 of the original is left?","o":["5","6","4","3"],"a":3,"x":"One quarter after 2 hours is 2 half-lives, so the half-life is 1 hour. 1/32 = (½)⁵ is reached at t = 5 hours, so 3 more hours. 5 is the total time, not the extra time."},{"id":"math-20-001","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"E","q":"The graph of a linear function passes through (0, −1) and (2, 3). Where does it cross the x-axis?","o":["x = −1","x = −1/2","x = 1/2","x = 2"],"a":2,"x":"The slope is (3 − (−1))/2 = 2 and the intercept is −1, so y = 2x − 1. Setting y = 0 gives x = 1/2. The value −1 is the y-intercept, not the x-intercept."},{"id":"math-20-002","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"M","q":"The lines ax + 2y − 1 = 0 and 2x + (a − 3)y + 4 = 0 are parallel. What is the value of a?","o":["4","4 or −1","−1","1 or −4"],"a":1,"x":"Parallel requires a(a − 3) = 2 × 2, so a² − 3a − 4 = 0 and a = 4 or a = −1. Checking: a = 4 gives 4x + 2y − 1 = 0 and 2x + y + 4 = 0; a = −1 gives x − 2y + 1 = 0 and x − 2y + 2 = 0. Neither pair coincides, so both values are valid."},{"id":"math-20-003","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"E","q":"What is the distance from the point (1, 2) to the line 3x + 4y − 1 = 0?","o":["1","12/5","2","10"],"a":2,"x":"d = |3·1 + 4·2 − 1|/√(3² + 4²) = |10|/5 = 2. The answer 10 forgets to divide by √(A² + B²) = 5; 12/5 comes from using +1 instead of −1."},{"id":"math-20-004","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"E","q":"Points A(−1, 3) and B(5, −1) are given. What are the coordinates of the midpoint M of AB?","o":["(2, 1)","(3, −2)","(4, 2)","(6, −4)"],"a":0,"x":"M = ((−1 + 5)/2, (3 + (−1))/2) = (2, 1). (6, −4) is the vector AB, (3, −2) is half of AB, and (4, 2) is the sum of the coordinates before halving."},{"id":"math-20-005","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"E","q":"What is the slope of the line through the points (1, 2) and (4, 8)?","o":["−2","1/2","2","3"],"a":2,"x":"Slope = (8 − 2)/(4 − 1) = 6/3 = 2. The value 1/2 comes from dividing the change in x by the change in y, which is upside down."},{"id":"math-20-006","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"E","q":"The lines 2x + y − 3 = 0 and x + my + 1 = 0 are perpendicular. What is m?","o":["−1/2","−2","1/2","2"],"a":1,"x":"For A₁x + B₁y + C₁ = 0 and A₂x + B₂y + C₂ = 0 to be perpendicular, A₁A₂ + B₁B₂ = 0: 2·1 + 1·m = 0, so m = −2. The value 1/2 is the condition for parallel lines (2m = 1)."},{"id":"math-20-007","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"M","q":"What is the distance between the parallel lines 3x − 4y + 2 = 0 and 6x − 8y − 1 = 0?","o":["1/2","1/10","3/10","3/5"],"a":0,"x":"First make the coefficients equal: 6x − 8y − 1 = 0 is 3x − 4y − 1/2 = 0. Then d = |2 − (−1/2)|/√(9 + 16) = (5/2)/5 = 1/2. The value 3/5 uses C = −1 without first dividing the second equation by 2."},{"id":"math-20-008","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"E","q":"What is the inclination angle of the line x − √3y + 1 = 0?","o":["60°","120°","30°","150°"],"a":2,"x":"Rewrite as y = (1/√3)x + 1/√3, so the slope is 1/√3 = √3/3 and tan α = √3/3 gives α = 30°. Choosing 60° confuses slope √3/3 with slope √3."},{"id":"math-20-009","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"M","q":"What is the reflection of the point (1, 2) in the line x + y − 5 = 0?","o":["(2, 1)","(−3, −4)","(4, 3)","(3, 4)"],"a":3,"x":"Reflection in x + y = 5 maps (x, y) to (5 − y, 5 − x), giving (5 − 2, 5 − 1) = (3, 4). Check: the midpoint (2, 3) lies on the line and the segment has slope 1, perpendicular to the line. (4, 3) mixes up which coordinate is subtracted."},{"id":"math-20-010","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"M","q":"The distance from the point (a, 2) to the line 4x − 3y + 2 = 0 is 4, and a > 0. What is a?","o":["−4","4","6","5"],"a":2,"x":"|4a − 6 + 2|/5 = 4 gives |4a − 4| = 20, so 4a − 4 = ±20 and a = 6 or a = −4. Since a > 0, a = 6. −4 is the root that the condition a > 0 rejects."},{"id":"math-20-011","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"E","q":"What is the inclination angle of the line √3x + y − 2 = 0?","o":["2π/3","π/6","π/3","5π/6"],"a":0,"x":"y = −√3x + 2, so tan α = −√3 with 0 ≤ α < π, giving α = 2π/3. π/3 ignores the negative sign of the slope; an inclination with a negative slope must be obtuse."},{"id":"math-20-012","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"M","q":"A line passes through the intersection of x + y − 3 = 0 and 2x − y = 0 and is perpendicular to x − 2y + 1 = 0. What is its equation?","o":["x − 2y + 3 = 0","x + 2y − 5 = 0","2x + y + 4 = 0","2x + y − 4 = 0"],"a":3,"x":"Adding the two equations gives 3x = 3, so the intersection is (1, 2). The given line has slope 1/2, so the required slope is −2: y − 2 = −2(x − 1), i.e. 2x + y − 4 = 0. x − 2y + 3 = 0 passes through (1, 2) but is parallel, not perpendicular, to the given line."},{"id":"math-20-013","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"D","q":"Line l passes through P(1, 2), and the points A(2, 3) and B(4, −5) are at equal distances from l. What is the equation of l?","o":["4x + y − 6 = 0 or 2x − 3y + 4 = 0","4x + y − 6 = 0 or 3x + 2y − 7 = 0","3x + 2y − 7 = 0 only","x − 4y + 7 = 0 or 3x + 2y − 7 = 0"],"a":1,"x":"Either l ∥ AB or l passes through the midpoint of AB. AB has slope −8/2 = −4, giving y − 2 = −4(x − 1), i.e. 4x + y − 6 = 0. The midpoint is (3, −1); the line through (1, 2) and (3, −1) has slope −3/2, giving 3x + 2y − 7 = 0. Taking only the midpoint case misses the parallel line."},{"id":"math-20-014","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"E","q":"A line passes through (2, −1) and has slope 3. What is its equation?","o":["y = 3x − 5","y = 3x + 5","y = 3x + 7","y = 3x − 7"],"a":3,"x":"Point-slope form: y − (−1) = 3(x − 2), so y + 1 = 3x − 6 and y = 3x − 7. y = 3x − 5 comes from writing y − 1 instead of y + 1."},{"id":"math-20-015","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"M","q":"The lines x + my + 6 = 0 and (m − 2)x + 3y + 2m = 0 are parallel (and distinct). What is m?","o":["1","3","−1 or 3","−1"],"a":3,"x":"Parallel requires 1·3 = m(m − 2), so m² − 2m − 3 = 0 and m = 3 or m = −1. For m = 3 both equations become x + 3y + 6 = 0, so the lines coincide and m = 3 is rejected. For m = −1 the lines x − y + 6 = 0 and x − y + 2/3 = 0 are parallel, so m = −1."},{"id":"math-20-016","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"D","q":"As λ varies, what is the greatest possible distance from the origin to the line (1 + 2λ)x + (1 − λ)y − 3 = 0?","o":["3","2","√2","√5"],"a":3,"x":"Rewrite as (x + y − 3) + λ(2x − y) = 0; every such line passes through the solution of x + y = 3 and 2x = y, which is P(1, 2). The distance from O is at most |OP| = √5, and it is reached by the line through P perpendicular to OP, x + 2y − 5 = 0, which is the case λ = −1/5. 3 is the constant term, not a distance."},{"id":"math-20-017","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"E","q":"A line has x-intercept 3 and y-intercept −2. Which equation describes it?","o":["2x − 3y − 6 = 0","3x − 2y − 6 = 0","2x + 3y − 6 = 0","3x + 2y + 6 = 0"],"a":0,"x":"Intercept form: x/3 + y/(−2) = 1; multiplying by 6 gives 2x − 3y = 6, i.e. 2x − 3y − 6 = 0. The equation 3x − 2y − 6 = 0 swaps the coefficients and has intercepts 2 and −3 instead."},{"id":"math-20-018","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"E","q":"Line l is perpendicular to the line 2x − 3y + 1 = 0. What is the slope of l?","o":["−2/3","−3/2","2/3","3/2"],"a":1,"x":"The given line has slope 2/3. Perpendicular slopes multiply to −1, so the slope of l is −3/2. 3/2 takes the reciprocal but forgets to change the sign."},{"id":"math-20-019","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"E","q":"What is the distance from the point (−1, 3) to the line 5x − 12y + 2 = 0?","o":["1","41/13","39","3"],"a":3,"x":"d = |5(−1) − 12(3) + 2|/√(25 + 144) = |−39|/13 = 3. 39 forgets to divide by 13, and 41/13 leaves out the constant term 2."},{"id":"math-20-020","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"M","q":"A line passes through P(2, 3) and has equal non-zero intercepts on the x-axis and y-axis. What is its equation?","o":["x − y + 1 = 0","3x − 2y = 0","x + y + 5 = 0","x + y − 5 = 0"],"a":3,"x":"Equal intercepts a give x/a + y/a = 1, i.e. x + y = a; substituting P gives a = 5, so x + y − 5 = 0. x − y + 1 = 0 has intercepts −1 and 1, which are opposite, and 3x − 2y = 0 has both intercepts zero, which the stem excludes."},{"id":"math-20-021","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"M","q":"For every real k, the line (k − 1)x − y + 2k + 1 = 0 passes through a fixed point. What is that point?","o":["(−2, 3)","(2, 3)","(−2, −1)","(2, −1)"],"a":0,"x":"Group the terms in k: k(x + 2) + (−x − y + 1) = 0. This holds for all k only if x + 2 = 0 and −x − y + 1 = 0, so x = −2 and y = 3. (2, 3) comes from solving x − 2 = 0 by mistake."},{"id":"math-20-022","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"M","q":"What is the distance between the parallel lines 2x + y − 1 = 0 and 2x + y + 4 = 0?","o":["3√5/5","5","1","√5"],"a":3,"x":"d = |C₁ − C₂|/√(A² + B²) = |−1 − 4|/√5 = 5/√5 = √5. 3√5/5 subtracts 1 from 4 instead of −1 from 4, and 5 forgets the denominator."},{"id":"math-20-023","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"M","q":"What is the area of the triangle formed by the line 3x + 4y − 12 = 0 and the two coordinate axes?","o":["5","7","12","6"],"a":3,"x":"Setting y = 0 gives x = 4; setting x = 0 gives y = 3. The right triangle has legs 4 and 3, so its area is ½ × 4 × 3 = 6. The value 12 forgets the factor ½."},{"id":"math-20-024","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"D","q":"A(1, 0) and B(3, 0) are fixed. Point P moves on the line x − y + 1 = 0. What is the minimum value of |PA| + |PB|?","o":["2","4","√26","2√5"],"a":3,"x":"A and B are on the same side of the line (x − y + 1 is positive at both), so reflect A in the line. Reflection in y = x + 1 sends (x, y) to (y − 1, x + 1), so A′ = (−1, 2). The minimum is |A′B| = √(4² + 2²) = 2√5. The value 2 is |AB|, which would need P on segment AB, but AB does not meet the line."},{"id":"math-20-025","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"M","q":"The points A(1, 2), B(3, k) and C(5, 10) lie on one straight line. What is k?","o":["4","5","7","6"],"a":3,"x":"The slope of AC is (10 − 2)/(5 − 1) = 2. B must give the same slope from A: (k − 2)/(3 − 1) = 2, so k = 6. Since B has the midpoint x-coordinate 3, k is also the average of 2 and 10."},{"id":"math-20-026","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"M","q":"A(1, 2) and B(3, 4) are given. What is the equation of the perpendicular bisector of AB?","o":["x − y + 1 = 0","x + y − 3 = 0","x + y − 5 = 0","x − y − 1 = 0"],"a":2,"x":"The midpoint of AB is (2, 3) and AB has slope 1, so the bisector has slope −1: y − 3 = −(x − 2), i.e. x + y − 5 = 0. x − y + 1 = 0 also passes through (2, 3), but it is the line AB itself."},{"id":"math-20-027","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"D","q":"As θ takes all real values, what is the range of the inclination angle α of the line x cos θ + √3y + 2 = 0?","o":["[π/6, 5π/6]","[0, π/6] ∪ [5π/6, π)","[0, π/3] ∪ [2π/3, π)","[0, π/6]"],"a":1,"x":"The slope is k = −cos θ/√3, and since −1 ≤ cos θ ≤ 1, k lies in [−√3/3, √3/3]. tan α ∈ [0, √3/3] gives α ∈ [0, π/6], and tan α ∈ [−√3/3, 0) gives α ∈ [5π/6, π). The option with π/3 and 2π/3 corresponds to slopes between −√3 and √3."},{"id":"math-20-028","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"M","q":"Which line passes through the origin and the intersection point of x + 2y − 4 = 0 and 2x − y − 3 = 0?","o":["2x − y = 0","x + 2y = 0","x − 2y = 0","2x + y = 0"],"a":2,"x":"From the second equation y = 2x − 3; substituting gives x + 4x − 6 − 4 = 0, so x = 2 and y = 1. The line through (0, 0) and (2, 1) has slope 1/2, i.e. x − 2y = 0. 2x − y = 0 has slope 2, which inverts the ratio."},{"id":"math-20-029","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"E","q":"A line has slope −2 and y-intercept 3. What is its general equation?","o":["2x − y + 3 = 0","2x + y − 3 = 0","2x + y + 3 = 0","x + 2y − 6 = 0"],"a":1,"x":"Slope-intercept form gives y = −2x + 3, which rearranges to 2x + y − 3 = 0. 2x − y + 3 = 0 is y = 2x + 3, which has slope +2."},{"id":"math-20-030","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"E","q":"Which line passes through (0, 2) and is parallel to y = −3x + 1?","o":["3x + y − 2 = 0","x − 3y + 6 = 0","3x − y + 2 = 0","3x + y + 2 = 0"],"a":0,"x":"A parallel line has the same slope −3, and the y-intercept is 2: y = −3x + 2, i.e. 3x + y − 2 = 0. x − 3y + 6 = 0 passes through (0, 2) but has slope 1/3."},{"id":"math-20-031","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"E","q":"Which statement about the line x = −2 is correct?","o":["Its inclination is 0° and its slope is 0","Its inclination is 90° and it has no slope","Its inclination is 90° and its slope is 0","Its inclination is 135° and its slope is −2"],"a":1,"x":"x = −2 is a vertical line, so its inclination angle is 90°, and since tan 90° is undefined, its slope does not exist. A slope of 0 belongs to horizontal lines such as y = −2, whose inclination is 0°."},{"id":"math-20-032","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"D","q":"A light ray from A(−2, 3) hits the x-axis, is reflected, and then passes through B(2, 5). What is the equation of the line of the reflected ray?","o":["2x − y + 1 = 0","2x + y + 1 = 0","x − 2y + 8 = 0","2x + y − 9 = 0"],"a":0,"x":"The reflected ray lies on the line through B and the image of A in the x-axis, A′(−2, −3). Its slope is (5 + 3)/(2 + 2) = 2, so y − 5 = 2(x − 2), i.e. 2x − y + 1 = 0. 2x + y + 1 = 0 is the line of the incident ray (through A and B′(2, −5))."},{"id":"math-20-033","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"E","q":"What is the slope of the line 2x − 4y + 3 = 0?","o":["−1/2","2","1/2","−2"],"a":2,"x":"Solve for y: 4y = 2x + 3, so y = ½x + 3/4 and the slope is 1/2. Using −A/B correctly gives −2/(−4) = 1/2; −1/2 drops the sign of B."},{"id":"math-20-034","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"M","q":"The lines x + ay + 2 = 0 and (a + 2)x + 3y − 1 = 0 are perpendicular. What is a?","o":["−1/2","−2","1/2","2"],"a":0,"x":"Perpendicular lines satisfy A₁A₂ + B₁B₂ = 0: 1·(a + 2) + a·3 = 0, so 4a + 2 = 0 and a = −1/2. Setting a(a + 2) = 3 instead is the parallel condition."},{"id":"math-20-035","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"E","q":"What is the slope of the line through (−2, 1) and (2, −7)?","o":["−1/2","−2","1/2","2"],"a":1,"x":"Slope = (−7 − 1)/(2 − (−2)) = −8/4 = −2. The value 2 drops the minus sign: y falls as x rises, so the slope is negative."},{"id":"math-20-036","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"M","q":"Which line passes through (1, −2) and is perpendicular to 3x − y + 4 = 0?","o":["3x − y − 5 = 0","x − 3y − 7 = 0","x + 3y − 5 = 0","x + 3y + 5 = 0"],"a":3,"x":"The given line has slope 3, so the required slope is −1/3: y + 2 = −⅓(x − 1), which gives x + 3y + 5 = 0. 3x − y − 5 = 0 passes through the point but is parallel to the given line."},{"id":"math-20-037","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"E","q":"What is the inclination angle of the line y = −x + 4?","o":["45°","90°","150°","135°"],"a":3,"x":"The slope is −1, and tan α = −1 with 0° ≤ α < 180° gives α = 135°. 45° is the inclination for slope +1."},{"id":"math-20-038","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"M","q":"What is the reflection of the point P(4, 0) in the line x − 2y +
