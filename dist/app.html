 3: a = 1/2 and b = 3, a + b = 7/2. Check: f(f⁻¹(1)) = f(−4) = −2 + 3 = 1. Reading a = 2, b = −6 straight from f⁻¹ gives −4."},{"id":"math-03-061","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"E","q":"What is the vertex of the parabola y = 2x² − 8x + 3?","o":["(−2, 27)","(2, 3)","(2, −5)","(4, 3)"],"a":2,"x":"The vertex is at x = −b/(2a) = 8/4 = 2, and y = 2(4) − 16 + 3 = −5. Completing the square, y = 2(x − 2)² − 5, agrees. A sign slip in −b/(2a) gives (−2, 27)."},{"id":"math-03-062","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"M","q":"The graph of y = √x is stretched vertically by a factor of 2 and then shifted 3 units to the left. What is the equation of the new graph?","o":["y = 2√(x + 3)","y = 2√(x − 3)","y = √(2x + 3)","y = √(2(x + 3))"],"a":0,"x":"A vertical stretch by 2 multiplies the output: y = 2√x. A shift 3 units left replaces x by x + 3: y = 2√(x + 3). Using x − 3 shifts right; putting the 2 inside the root is a horizontal change, not a vertical stretch."},{"id":"math-03-063","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"M","q":"What are the amplitude and the period of y = −3 cos(x/2) + 1?","o":["amplitude −3, period 4π","amplitude 3, period π","amplitude 4, period 4π","amplitude 3, period 4π"],"a":3,"x":"For y = A cos(bx) + c the amplitude is |A| = 3 and the period is 2π/b = 2π ÷ (1/2) = 4π. The amplitude is never negative, the +1 only shifts the graph up, and period π comes from multiplying 2π by 1/2."},{"id":"math-03-064","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"M","q":"For which value of k does the line y = x + k touch the parabola y = x² − 3x + 5 at exactly one point?","o":["−1","5","1","9"],"a":2,"x":"Equating gives x² − 4x + (5 − k) = 0. Tangency needs discriminant 0: 16 − 4(5 − k) = 0, so k = 1. Check: x² − 4x + 4 = (x − 2)², touching at (2, 3), and 3 = 2 + 1."},{"id":"math-03-065","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"M","q":"What is the range of y = 2 − 3 sin x?","o":["[−3, 3]","[−1, 5]","[2, 5]","[−5, 1]"],"a":1,"x":"sin x runs over [−1, 1], so −3 sin x runs over [−3, 3] and 2 − 3 sin x over [−1, 5] (5 at sin x = −1, −1 at sin x = 1). [−3, 3] forgets the shift by 2."},{"id":"math-03-066","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"D","q":"Where does the graph of y = log₂(x − 1) + 2 cross the x-axis?","o":["x = 5","x = 1/4","x = 3","x = 5/4"],"a":3,"x":"Set y = 0: log₂(x − 1) = −2, so x − 1 = 2⁻² = 1/4 and x = 5/4. Check: log₂(1/4) + 2 = −2 + 2 = 0. Using +2 instead of −2 gives x − 1 = 4, x = 5; forgetting to add 1 gives 1/4."},{"id":"math-03-067","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"M","q":"At which points does the graph of y = |x − 2| − 3 meet the x-axis?","o":["x = −5 and x = 1","x = −1 and x = 5","x = 5 only","x = −1 only"],"a":1,"x":"|x − 2| = 3 gives x − 2 = 3 or x − 2 = −3, so x = 5 or x = −1. The V-shaped graph has its vertex at (2, −3) below the axis, so it crosses twice. Taking only x − 2 = 3 misses a root."},{"id":"math-03-068","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"D","q":"How many times does the graph of y = x² − 4|x| + 3 meet the x-axis?","o":["2","3","4","1"],"a":2,"x":"Since x² = |x|², the equation is |x|² − 4|x| + 3 = 0, so |x| = 1 or |x| = 3, giving x = ±1 and x = ±3: four points. Solving x² − 4x + 3 = 0 only gives the two positive ones."},{"id":"math-03-069","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"D","q":"The point (3, −2) lies on the graph of y = f(x). Which point must lie on the graph of y = 2f(x − 1) + 3?","o":["(4, −1)","(2, −1)","(4, 2)","(4, −7)"],"a":0,"x":"x − 1 = 3 gives x = 4, and then y = 2f(3) + 3 = 2(−2) + 3 = −1, so (4, −1). Shifting left instead of right gives (2, −1); adding 3 before doubling gives (4, 2)."},{"id":"math-03-070","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"M","q":"Which statement about the graph of y = log₀.₅ x is true? (The base of the logarithm is 0.5.)","o":["It is increasing on (0, ∞) and passes through (1, 0).","It is decreasing on (0, ∞) and passes through (0, 1).","It is decreasing on (0, ∞) and passes through (1, 0).","It is defined for all real x and is decreasing."],"a":2,"x":"A logarithm with base between 0 and 1 decreases on its domain (0, ∞), and log₀.₅ 1 = 0 gives the point (1, 0); the y-axis is an asymptote. (0, 1) lies on exponential graphs such as y = 0.5ˣ, not on log graphs."},{"id":"math-03-071","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"E","q":"If logₓ 81 = 4, what is the value of x?","o":["±3","9","3","81/4"],"a":2,"x":"logₓ 81 = 4 means x⁴ = 81, so x = 3. A logarithm base must be positive (and not 1), so −3 is not allowed. 81/4 divides instead of taking the fourth root."},{"id":"math-03-072","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"M","q":"Solve 3^(x + 1) + 3^(x − 1) = 30.","o":["x = 3","x = 1","x = log₃10","x = 2"],"a":3,"x":"Factor out 3ˣ: 3ˣ(3 + 1/3) = 30, so 3ˣ × 10/3 = 30, 3ˣ = 9 and x = 2. Check: 27 + 3 = 30. Dividing by 4 instead of 10/3 is the usual slip."},{"id":"math-03-073","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"M","q":"Solve log₃x + log₉x = 3.","o":["x = 27","x = 9","x = 3","x = 81"],"a":1,"x":"log₉x = (log₃x)/2, so (3/2)log₃x = 3 and log₃x = 2, x = 9. Check: log₃9 + log₉9 = 2 + 1 = 3. Treating log₉x as log₃x gives log₃x = 3/2, and x = 27 comes from log₃x = 3."},{"id":"math-03-074","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"M","q":"What is the solution set of (1/3)^(x − 1) ≥ 27?","o":["x ≥ −2","x ≤ 4","x ≤ −2","x ≥ 4"],"a":2,"x":"(1/3)^(x − 1) = 3^(1 − x), so 3^(1 − x) ≥ 3³ gives 1 − x ≥ 3, i.e. x ≤ −2. Check x = −2: (1/3)⁻³ = 27. Forgetting that base 1/3 reverses the inequality gives x − 1 ≥ 3, i.e. x ≥ 4."},{"id":"math-03-075","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"M","q":"Ayesha invests Rs. 8,000 at 25% per year, compounded annually. After how many years will the amount be Rs. 15,625?","o":["2","4","5","3"],"a":3,"x":"8000 × (5/4)ⁿ = 15625 gives (5/4)ⁿ = 15625/8000 = 125/64 = (5/4)³, so n = 3. Check: 8000 → 10000 → 12500 → 15625. Two years give only Rs. 12,500 and four give about Rs. 19,531."},{"id":"math-03-076","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"M","q":"The sound level is L = 10 log₁₀(I/I₀) decibels, where I is the intensity. If the intensity is multiplied by 1000, by how much does the sound level increase?","o":["30 dB","3 dB","300 dB","1000 dB"],"a":0,"x":"The new level is 10 log₁₀(1000I/I₀) = 10[log₁₀1000 + log₁₀(I/I₀)] = L + 10 × 3, an increase of 30 dB. 3 dB forgets the factor 10; 1000 dB treats the log scale as linear."},{"id":"math-03-077","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"M","q":"Given log 2 = a and log 3 = b (common logarithms, base 10), which expression equals log 7.2?","o":["3a + 2b − 1","3a + 2b","2a + 3b − 1","6ab − 1"],"a":0,"x":"7.2 = 72/10 = 2³ × 3²/10, so log 7.2 = 3 log 2 + 2 log 3 − log 10 = 3a + 2b − 1. Forgetting the division by 10 gives 3a + 2b; 6ab treats the log of a product as a product of logs."},{"id":"math-03-078","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"D","q":"Solve 2ˣ = 5^(x − 1) for x.","o":["x = ln 5 / ln 10","x = ln 2 / ln(5/2)","x = ln 5 / ln(5/2)","x = ln(5/2) / ln 5"],"a":2,"x":"Take ln: x ln 2 = (x − 1) ln 5, so x(ln 5 − ln 2) = ln 5 and x = ln 5 / ln(5/2). Check: the equation is 5 = (5/2)ˣ, and taking ln gives the same x. Adding the logs instead of subtracting gives ln 5 / ln 10."},{"id":"math-03-079","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"D","q":"Solve log₂(x − 1) = log₄(x + 5).","o":["x = −1 or x = 4","x = 4","x = −1","x = 3"],"a":1,"x":"log₄(x + 5) = ½ log₂(x + 5), so 2 log₂(x − 1) = log₂(x + 5) and (x − 1)² = x + 5, giving x² − 3x − 4 = 0, x = 4 or x = −1. x = −1 makes x − 1 negative, so only x = 4: log₂3 = log₄9."},{"id":"math-03-080","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"E","q":"What is the value of e^(2 ln 3 − ln 2)?","o":["7","3/2","6","9/2"],"a":3,"x":"2 ln 3 − ln 2 = ln 9 − ln 2 = ln(9/2), and e^(ln(9/2)) = 9/2. Getting 7 subtracts 9 − 2 instead of dividing; 3/2 forgets the power 2 on 3."},{"id":"math-04-001","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"E","q":"lim(x→2) (3x² − 5x + 1) equals:","o":["3","23","−1","1"],"a":0,"x":"A polynomial's limit is its value: 3(4) − 5(2) + 1 = 12 − 10 + 1 = 3. Treating −5x as +5x gives 23."},{"id":"math-04-002","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"E","q":"lim(x→3) (x² − 9)/(x − 3) equals:","o":["6","0","3","9"],"a":0,"x":"x² − 9 = (x − 3)(x + 3), so the expression is x + 3 for x ≠ 3 and the limit is 3 + 3 = 6. Answering 0 comes from substituting into the numerator only."},{"id":"math-04-003","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"M","q":"lim(x→1) (x⁴ − 1)/(x³ − 1) equals:","o":["3/4","1","0","4/3"],"a":3,"x":"Using lim(x→a) (xⁿ − aⁿ)/(x − a) = naⁿ⁻¹ on top and bottom: 4/3. Check: (x + 1)(x² + 1)/(x² + x + 1) at x = 1 is 4/3. Inverting the ratio gives 3/4."},{"id":"math-04-004","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"M","q":"lim(x→∞) (3x² + 2x)/(5x² − 7) equals:","o":["2/5","−3/7","3/5","0"],"a":2,"x":"Divide top and bottom by x²: (3 + 2/x)/(5 − 7/x²) → 3/5. The other values come from taking the wrong terms as the leading ones."},{"id":"math-04-005","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"E","q":"lim(x→∞) (2x + 1)/(x² + 3) equals:","o":["2","1/3","1","0"],"a":3,"x":"Divide by x²: (2/x + 1/x²)/(1 + 3/x²) → 0/1 = 0, since the denominator has the higher degree. 1/3 is the value at x = 0, not the limit at infinity."},{"id":"math-04-006","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"M","q":"lim(x→0) (√(x + 4) − 2)/x equals:","o":["1/2","0","1/4","4"],"a":2,"x":"Multiply by (√(x + 4) + 2): x/(x(√(x + 4) + 2)) = 1/(√(x + 4) + 2) → 1/4. Forgetting the +2 in the conjugate gives 1/2."},{"id":"math-04-007","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"M","q":"lim(x→2) (x² − 5x + 6)/(x² − 4) equals:","o":["1/4","−1/4","−5/4","0"],"a":1,"x":"(x − 2)(x − 3)/((x − 2)(x + 2)) = (x − 3)/(x + 2) → (2 − 3)/(2 + 2) = −1/4. A sign slip in x − 3 gives 1/4."},{"id":"math-04-008","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"M","q":"If lim(x→a) f(x) = 3 and lim(x→a) g(x) = −2, then lim(x→a) [f(x)·g(x) + f(x)] equals:","o":["3","−6","1","−3"],"a":3,"x":"By the product and sum theorems the limit is 3 × (−2) + 3 = −6 + 3 = −3. Stopping at the product gives −6; adding instead of multiplying gives 4 or 1."},{"id":"math-04-009","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"E","q":"The nth term of a sequence is aₙ = (2n + 3)/(n + 1). As n → ∞, aₙ tends to:","o":["3","5/2","1","2"],"a":3,"x":"Divide by n: (2 + 3/n)/(1 + 1/n) → 2. 5/2 is only the first term a₁, and 3 comes from the ratio of the constant terms."},{"id":"math-04-010","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"M","q":"lim(n→∞) (1 + 2 + 3 + … + n)/n² equals:","o":["1/2","1","0","2"],"a":0,"x":"1 + 2 + … + n = n(n + 1)/2, so the expression is (n² + n)/(2n²) → 1/2. Forgetting the factor ½ in the sum formula gives 1."},{"id":"math-04-011","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"M","q":"For f(x) = |x − 2|/(x − 2), x ≠ 2, the right-hand and left-hand limits at x = 2 are, in that order:","o":["−1 and 1","1 and −1","1 and 1","0 and 0"],"a":1,"x":"For x > 2, |x − 2| = x − 2 so f = 1; for x < 2, |x − 2| = −(x − 2) so f = −1. Right-hand limit 1, left-hand limit −1, so the limit at 2 does not exist."},{"id":"math-04-012","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"D","q":"lim(x→2) (x² + kx − 10)/(x − 2) exists as a finite number. Then k equals:","o":["−3","3","5","7"],"a":1,"x":"The denominator → 0, so the numerator must also → 0: 4 + 2k − 10 = 0, k = 3. Then (x² + 3x − 10)/(x − 2) = x + 5 → 7, which is the limit, not k."},{"id":"math-04-013","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"D","q":"lim(x→∞) (√(x² + 4x) − x) equals:","o":["4","0","2","1"],"a":2,"x":"Multiply by the conjugate: 4x/(√(x² + 4x) + x) = 4/(√(1 + 4/x) + 1) → 4/2 = 2. Forgetting the denominator 2 gives 4; ∞ − ∞ is not 0."},{"id":"math-04-014","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"M","q":"lim(x→2) (x⁵ − 32)/(x − 2) equals:","o":["32","16","80","40"],"a":2,"x":"lim(x→a) (xⁿ − aⁿ)/(x − a) = naⁿ⁻¹ = 5 × 2⁴ = 80. Writing aⁿ⁻¹ alone gives 16; using aⁿ gives 32."},{"id":"math-04-015","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"E","q":"Which statement about the sequence aₙ = (−1)ⁿ is true?","o":["its limit is 0","it has no limit","its limit is 1","its limit is −1"],"a":1,"x":"The terms are −1, 1, −1, 1, … and keep jumping between two values, so they approach no single number: the sequence has no limit. The average 0 is not a limit."},{"id":"math-04-016","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"M","q":"f(x) = 2x + 1 for x < 1 and f(x) = x² + k for x ≥ 1. lim(x→1) f(x) exists if k equals:","o":["3","2","1","0"],"a":1,"x":"Left-hand limit 2(1) + 1 = 3; right-hand limit 1 + k. They must be equal: 1 + k = 3, k = 2. Choosing k = 3 forgets the 1² term."},{"id":"math-04-017","unit":"math-04","topic":"math-04-limits","lo":"MATH-4.1","d":"D","q":"lim(x→3) (√(x + 6) − 3)/(√(x + 1) − 2) equals:","o":["2/3","3/2","1/6","1/4"],"a":0,"x":"Rationalise both: numerator = (x − 3)/(√(x + 6) + 3), denominator = (x − 3)/(√(x + 1) + 2). The ratio is (√(x + 1) + 2)/(√(x + 6) + 3) → 4/6 = 2/3. Inverting it gives 3/2."},{"id":"math-04-018","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"E","q":"lim(x→0) (sin 5x)/x equals:","o":["5","1","1/5","0"],"a":0,"x":"(sin 5x)/x = 5 · (sin 5x)/(5x) → 5 × 1 = 5. Using (sin x)/x → 1 without the factor 5 gives 1."},{"id":"math-04-019","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"M","q":"lim(x→0) (sin 3x)/(sin 7x) equals:","o":["3/7","7/3","1","21"],"a":0,"x":"Write it as [(sin 3x)/(3x)] · [(7x)/(sin 7x)] · (3x)/(7x) → 1 × 1 × 3/7 = 3/7. Turning the ratio upside down gives 7/3."},{"id":"math-04-020","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"M","q":"lim(x→0) (1 − cos x)/x² equals:","o":["1/2","1","0","2"],"a":0,"x":"1 − cos x = 2 sin²(x/2), so the expression is 2 sin²(x/2)/x² = ½ [sin(x/2)/(x/2)]² → ½. Dropping the half angle gives 2 or 1."},{"id":"math-04-021","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"M","q":"lim(x→0) (tan 2x)/(3x) equals:","o":["3/2","2/3","1","6"],"a":1,"x":"(tan 2x)/(3x) = (2/3) · (tan 2x)/(2x), and (tan 2x)/(2x) → 1, so the limit is 2/3."},{"id":"math-04-022","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"E","q":"lim(n→∞) (1 + 1/n)ⁿ equals:","o":["1","e","0","1/e"],"a":1,"x":"This is the standard limit that defines e ≈ 2.718. The tempting 1 comes from 1/n → 0 and 1ⁿ = 1, but the power grows at the same time."},{"id":"math-04-023","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"M","q":"lim(x→∞) (1 + 3/x)^x equals:","o":["e³","e^(1/3)","3e","e"],"a":0,"x":"Put x = 3t: (1 + 1/t)^(3t) = [(1 + 1/t)^t]³ → e³. Placing the 3 in the wrong place gives e^(1/3) or 3e."},{"id":"math-04-024","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"M","q":"lim(x→0) (1 + 2x)^(1/x) equals:","o":["e^(1/2)","e²","2e","e"],"a":1,"x":"(1 + 2x)^(1/x) = [(1 + 2x)^(1/(2x))]², and (1 + h)^(1/h) → e as h → 0, so the limit is e²."},{"id":"math-04-025","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"D","q":"lim(x→∞) ((x + 2)/(x − 1))^x equals:","o":["e","e²","e^(−3)","e³"],"a":3,"x":"(x + 2)/(x − 1) = 1 + 3/(x − 1). With t = x − 1, (1 + 3/t)^(t + 1) = (1 + 3/t)^t · (1 + 3/t) → e³ × 1 = e³. Taking only the 2 from the numerator gives e²."},{"id":"math-04-026","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"M","q":"lim(x→∞) (1 − 1/x)^(2x) equals:","o":["e²","e^(−1/2)","e^(1/2)","e^(−2)"],"a":3,"x":"(1 − 1/x)^x → e^(−1), so (1 − 1/x)^(2x) = [(1 − 1/x)^x]² → e^(−2). Ignoring the minus sign gives e²."},{"id":"math-04-027","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"M","q":"lim(x→0) (3ˣ − 1)/x equals:","o":["ln 3","3","1","1/ln 3"],"a":0,"x":"Standard limit: lim(x→0) (aˣ − 1)/x = ln a, so the answer is ln 3. Treating it like (eˣ − 1)/x → 1 gives 1."},{"id":"math-04-028","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"M","q":"lim(x→0) (e^(2x) − 1)/x equals:","o":["1","1/2","e²","2"],"a":3,"x":"(e^(2x) − 1)/x = 2 · (e^(2x) − 1)/(2x) → 2 × 1 = 2. Missing the factor 2 gives 1."},{"id":"math-04-029","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"M","q":"lim(x→0) (5ˣ − 3ˣ)/x equals:","o":["ln(5/3)","ln 15","ln 2","ln(3/5)"],"a":0,"x":"Split: (5ˣ − 1)/x − (3ˣ − 1)/x → ln 5 − ln 3 = ln(5/3). Adding the logs gives ln 15; reversing the order gives ln(3/5)."},{"id":"math-04-030","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"E","q":"lim(x→0) ln(1 + x)/x equals:","o":["0","e","1/e","1"],"a":3,"x":"ln(1 + x)/x = ln[(1 + x)^(1/x)] → ln e = 1. The answer e comes from forgetting to take the logarithm of the standard limit."},{"id":"math-04-031","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"D","q":"lim(x→0) (1 − cos 4x)/x² equals:","o":["4","8","16","2"],"a":1,"x":"1 − cos 4x = 2 sin² 2x, so the expression is 2 [(sin 2x)/x]² → 2 × 2² = 8. Forgetting the factor 2 in 2 sin² 2x gives 4; squaring 4 instead of 2 gives 16."},{"id":"math-04-032","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"D","q":"If θ is measured in degrees, lim(θ→0) (sin θ)/θ equals:","o":["1","180/π","π/180","0"],"a":2,"x":"θ degrees = πθ/180 radians, so (sin θ°)/θ = (π/180) · sin(πθ/180)/(πθ/180) → π/180. The value 1 holds only for radians."},{"id":"math-04-033","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"M","q":"lim(x→π) (sin x)/(π − x) equals:","o":["−1","0","π","1"],"a":3,"x":"Let h = π − x → 0. sin x = sin(π − h) = sin h, so the expression is (sin h)/h → 1. Writing sin(π − h) = −sin h gives the wrong value −1."},{"id":"math-04-034","unit":"math-04","topic":"math-04-important","lo":"MATH-4.2","d":"M","q":"lim(x→∞) (sin x)/x equals:","o":["1","−1","0","1/2"],"a":2,"x":"|sin x| ≤ 1, so |(sin x)/x| ≤ 1/|x| → 0, and the limit is 0. The value 1 belongs to x → 0, not x → ∞."},{"id":"math-04-035","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"E","q":"f(x) = (x² − 1)/(x − 1). At which point(s) is f discontinuous?","o":["x = −1 only","x = 1 and x = −1","x = 0 only","x = 1 only"],"a":3,"x":"f is not defined where the denominator x − 1 is zero, so it is discontinuous at x = 1 only. At x = −1 the numerator is zero but the denominator is −2, so f(−1) = 0 is defined."},{"id":"math-04-036","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"M","q":"f(x) = (x² − 4)/(x − 2) for x ≠ 2 and f(2) = k. f is continuous at x = 2 if k equals:","o":["2","0","−4","4"],"a":3,"x":"For x ≠ 2, f(x) = x + 2, so lim(x→2) f(x) = 4. Continuity needs f(2) = 4, so k = 4."},{"id":"math-04-037","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"M","q":"f(x) = kx + 1 for x ≤ 2 and f(x) = x² − 1 for x > 2. f is continuous at x = 2 if k equals:","o":["2","1","3","1/2"],"a":1,"x":"Left value f(2) = 2k + 1; right-hand limit 4 − 1 = 3. Setting 2k + 1 = 3 gives k = 1. Using x² + 1 by mistake gives k = 2."},{"id":"math-04-038","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"E","q":"A function f is continuous at x = x₀ exactly when:","o":["f(x₀) is defined","lim(x→x₀) f(x) exists and equals f(x₀)","lim(x→x₀) f(x) exists","the left-hand limit at x₀ equals f(x₀)"],"a":1,"x":"Continuity at x₀ needs three things: f(x₀) defined, the limit at x₀ existing, and the two being equal. Each other statement is only one part of this."},{"id":"math-04-039","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"E","q":"Which function is continuous at every real number x?","o":["x² + sin x","1/x","tan x","(x + 1)/(x − 1)"],"a":0,"x":"x² and sin x are continuous everywhere, so their sum is too. 1/x fails at 0, tan x at odd multiples of π/2, and (x + 1)/(x − 1) at x = 1."},{"id":"math-04-040","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"M","q":"f(x) = |x|/x for x ≠ 0 and f(0) = 0. Why is f discontinuous at x = 0?","o":["f(0) is not defined","the limit at 0 exists but differs from f(0)","the left and right limits at 0 are unequal","f is unbounded near 0"],"a":2,"x":"For x > 0, f = 1 and for x < 0, f = −1, so the right limit is 1 and the left limit −1: no limit at 0. f(0) = 0 is defined and f stays between −1 and 1."},{"id":"math-04-041","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"M","q":"At how many real points is f(x) = (x + 1)/(x² − 5x + 6) discontinuous?","o":["2","1","3","0"],"a":0,"x":"x² − 5x + 6 = (x − 2)(x − 3) = 0 at x = 2 and x = 3, where f is undefined. x = −1 only makes the numerator zero, so there are 2 points."},{"id":"math-04-042","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"M","q":"f(x) = (sin 3x)/x for x ≠ 0 and f(0) = k. f is continuous at x = 0 if k equals:","o":["1","1/3","3","0"],"a":2,"x":"lim(x→0) (sin 3x)/x = 3 · (sin 3x)/(3x) → 3, so k = 3. Using (sin x)/x → 1 without the factor gives 1."},{"id":"math-04-043","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"D","q":"f(x) = x² + p for x < 1, f(1) = 3, and f(x) = qx + 1 for x > 1. If f is continuous at x = 1, then p + q equals:","o":["2","4","3","5"],"a":1,"x":"Left limit 1 + p = 3 gives p = 2; right limit q + 1 = 3 gives q = 2. So p + q = 4. Each of p and q alone is 2."},{"id":"math-04-044","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"D","q":"f(x) = (x² + ax − 6)/(x − 2) for x ≠ 2 and f(2) = b. If f is continuous at x = 2, then b equals:","o":["1","3","5","4"],"a":2,"x":"A finite limit needs the numerator zero at 2: 4 + 2a − 6 = 0, a = 1. Then (x² + x − 6)/(x − 2) = x + 3 → 5, so b = 5. The value 1 is a, not b."},{"id":"math-04-045","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"M","q":"f is continuous at x = 3 and f(3) = 5. Then lim(x→3) [f(x)² − 2f(x)] equals:","o":["5","25","15","35"],"a":2,"x":"Continuity gives lim f(x) = f(3) = 5, so by the limit theorems the limit is 25 − 10 = 15. Adding 2f instead of subtracting gives 35."},{"id":"math-04-046","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"M","q":"f(x) = (1 + x)^(1/x) for x > −1, x ≠ 0. To make f continuous at x = 0, f(0) must be:","o":["1","0","e","1/e"],"a":2,"x":"lim(x→0) (1 + x)^(1/x) = e, so f(0) = e. Thinking 1 raised to any power is 1 gives the wrong value 1."},{"id":"math-04-047","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"D","q":"f(x) = sin(πx)/(x − 1) for x ≠ 1 and f(1) = k. f is continuous at x = 1 if k equals:","o":["π","1","−1","−π"],"a":3,"x":"Let x = 1 + h: sin(π + πh) = −sin(πh), so f = −sin(πh)/h → −π. Missing the sign of sin(π + θ) gives π."},{"id":"math-04-048","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"E","q":"If f and g are both continuous at x = x₀, then f + g is:","o":["discontinuous at x₀","continuous at x₀","continuous at x₀ only if f and g are polynomials","continuous at x₀ only if f(x₀) = g(x₀)"],"a":1,"x":"By the sum theorem lim (f + g) = f(x₀) + g(x₀) = (f + g)(x₀), so f + g is continuous at x₀ for any such f and g."},{"id":"math-04-049","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"M","q":"f(x) = x + 1 for x ≤ 1 and f(x) = 3 − x for x > 1. At x = 1, f is:","o":["continuous","discontinuous, because the left and right limits differ","discontinuous, because f(1) is not defined","discontinuous, because the limit exists but differs from f(1)"],"a":0,"x":"f(1) = 1 + 1 = 2, left limit 2 and right limit 3 − 1 = 2. All three agree, so f is continuous at 1."},{"id":"math-04-050","unit":"math-04","topic":"math-04-continuity","lo":"MATH-4.3","d":"M","q":"Which function is NOT continuous at x = 0?","o":["f(x) = |x|","f(x) = cos x","f(x) = 1/x for x ≠ 0, f(0) = 0","f(x) = x³ − x"],"a":2,"x":"1/x grows without bound near 0, so its limit at 0 does not exist even though f(0) = 0 is defined. |x|, cos x and x³ − x are continuous at every real x."},{"id":"math-05-001","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"E","q":"How many elements does a matrix of order 3 × 2 have?","o":["6","5","9","8"],"a":0,"x":"A matrix of order m × n has m × n elements, so 3 × 2 = 6. Adding the order (3 + 2 = 5) is the usual slip."},{"id":"math-05-002","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"E","q":"If A = [[2, −1], [0, 3]] and B = [[1, 4], [−2, 5]], then A + B equals:","o":["[[3, 3], [−2, 8]]","[[1, −5], [2, −2]]","[[3, 5], [−2, 8]]","[[2, −4], [0, 15]]"],"a":0,"x":"Add corresponding entries: 2 + 1 = 3, −1 + 4 = 3, 0 + (−2) = −2, 3 + 5 = 8. [[1, −5], [2, −2]] is A − B and [[2, −4], [0, 15]] multiplies entries."},{"id":"math-05-003","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"E","q":"A square matrix A = [aᵢⱼ] in which aᵢⱼ = 0 for every i > j is called:","o":["an upper triangular matrix","a lower triangular matrix","a diagonal matrix","a scalar matrix"],"a":0,"x":"i > j means the entries below the main diagonal; if all of these are zero the matrix is upper triangular. The entries above the diagonal need not be zero, so it need not be diagonal."},{"id":"math-05-004","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"E","q":"A square matrix A is called symmetric if:","o":["Aᵗ = −A","A² = A","A² = I","Aᵗ = A"],"a":3,"x":"Symmetric means A equals its transpose, Aᵗ = A. Aᵗ = −A defines skew-symmetric, A² = A idempotent and A² = I involutory."},{"id":"math-05-005","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"M","q":"If A = [[1, 2], [3, 4]] and B = [[0, 1], [1, 0]], then AB equals:","o":["[[3, 4], [1, 2]]","[[0, 2], [3, 0]]","[[2, 1], [4, 3]]","[[2, 4], [1, 3]]"],"a":2,"x":"Row 1 of A with the columns of B: (1·0 + 2·1, 1·1 + 2·0) = (2, 1); row 2: (3·0 + 4·1, 3·1 + 4·0) = (4, 3). [[3, 4], [1, 2]] is BA, which swaps rows instead of columns."},{"id":"math-05-006","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"M","q":"If [[x + y, 2], [3, x − y]] = [[7, 2], [3, 1]], then:","o":["x = 4, y = 3","x = 3, y = 4","x = 4, y = −3","x = 7, y = 1"],"a":0,"x":"Equal matrices have equal entries: x + y = 7 and x − y = 1. Adding gives 2x = 8, so x = 4 and y = 3; check 4 − 3 = 1."},{"id":"math-05-007","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"M","q":"The matrix [[0, 2, −3], [k, 0, 5], [3, −5, 0]] is skew-symmetric. Find k.","o":["−2","2","0","5"],"a":0,"x":"Skew-symmetric needs aᵢⱼ = −aⱼᵢ, so a₂₁ = −a₁₂ gives k = −2. The other pairs already agree: 3 = −(−3) and −5 = −5."},{"id":"math-05-008","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"M","q":"If A = [[1, 1], [0, 1]], then A³ equals:","o":["[[1, 1], [0, 1]]","[[3, 3], [0, 3]]","[[1, 3], [0, 1]]","[[1, 0], [3, 1]]"],"a":2,"x":"A² = [[1, 2], [0, 1]] and A³ = A²·A = [[1, 3], [0, 1]]. Cubing each entry would wrongly leave A unchanged, and [[3, 3], [0, 3]] is 3A."},{"id":"math-05-009","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"M","q":"If A = [[1 + i, 2], [3i, 1 − i]], then the conjugate transpose (Ā)ᵗ equals:","o":["[[1 − i, 2], [−3i, 1 + i]]","[[1 + i, 3i], [2, 1 − i]]","[[1 − i, 3i], [2, 1 + i]]","[[1 − i, −3i], [2, 1 + i]]"],"a":3,"x":"Conjugate each entry: Ā = [[1 − i, 2], [−3i, 1 + i]], then transpose to get [[1 − i, −3i], [2, 1 + i]]. Stopping after conjugating, or transposing without conjugating, gives the other forms."},{"id":"math-05-010","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"M","q":"Which of the following matrices is Hermitian?","o":["[[2, 1 + i], [1 + i, 3]]","[[2, 1 + i], [1 − i, 3]]","[[i, 1 + i], [1 − i, 3]]","[[2, 1 + i], [−1 + i, 3]]"],"a":1,"x":"A is Hermitian if (Ā)ᵗ = A: diagonal entries real and a₂₁ = conjugate of a₁₂. Only [[2, 1 + i], [1 − i, 3]] satisfies both; [[2, 1 + i], [1 + i, 3]] is symmetric but not Hermitian, and a diagonal entry i is not real."},{"id":"math-05-011","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"M","q":"If A = [[2, 3], [1, 4]], then A² − 6A equals:","o":["5I","−5I","−8I","8I"],"a":1,"x":"A² = [[7, 18], [6, 19]] and 6A = [[12, 18], [6, 24]], so A² − 6A = [[−5, 0], [0, −5]] = −5I. Check: trace 6 and determinant 8 − 3 = 5 give A² − 6A + 5I = O."},{"id":"math-05-012","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"M","q":"If A and B are symmetric matrices of the same order, then AB − BA is:","o":["symmetric","a diagonal matrix","skew-symmetric","the identity matrix"],"a":2,"x":"(AB − BA)ᵗ = BᵗAᵗ − AᵗBᵗ = BA − AB = −(AB − BA), so AB − BA is skew-symmetric. (AB + BA would be symmetric.)"},{"id":"math-05-013","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"M","q":"If A = [[1, 2], [0, 1]] and B = [[1, 0], [3, 1]], then (AB)ᵗ equals:","o":["[[7, 3], [2, 1]]","[[7, 2], [3, 1]]","[[1, 3], [2, 7]]","[[1, 2], [3, 7]]"],"a":0,"x":"AB = [[1 + 6, 0 + 2], [0 + 3, 1]] = [[7, 2], [3, 1]], so (AB)ᵗ = [[7, 3], [2, 1]]. Using AᵗBᵗ instead of BᵗAᵗ gives [[1, 3], [2, 7]]."},{"id":"math-05-014","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"M","q":"If 3X + [[1, 2], [3, 4]] = [[7, 2], [0, 10]], then X equals:","o":["[[2, 0], [−1, 2]]","[[6, 0], [−3, 6]]","[[8/3, 4/3], [1, 14/3]]","[[2, 0], [1, 2]]"],"a":0,"x":"3X = [[7 − 1, 2 − 2], [0 − 3, 10 − 4]] = [[6, 0], [−3, 6]], so X = [[2, 0], [−1, 2]]. Forgetting to divide by 3 gives [[6, 0], [−3, 6]]; adding instead of subtracting gives [[8/3, 4/3], [1, 14/3]]."},{"id":"math-05-015","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"D","q":"If A = [[1, 1], [1, 1]], then A⁵ equals:","o":["[[32, 32], [32, 32]]","[[5, 5], [5, 5]]","[[16, 16], [16, 16]]","[[1, 1], [1, 1]]"],"a":2,"x":"A² = [[2, 2], [2, 2]] = 2A, so Aⁿ = 2ⁿ⁻¹·A, giving A⁵ = 16A = [[16, 16], [16, 16]]. Using 2⁵ instead of 2⁴ gives the 32 matrix."},{"id":"math-05-016","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"D","q":"If A is a square matrix with A² = A, then (I − A)² equals:","o":["I − A","I","I + A","O"],"a":0,"x":"(I − A)² = I − 2A + A² = I − 2A + A = I − A, since A commutes with I. So I − A is also idempotent."},{"id":"math-05-017","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"D","q":"If A = [[a, b], [c, −a]] and a² + bc = 1, then A² equals:","o":["−I","O","I","A"],"a":2,"x":"A² = [[a² + bc, ab − ab], [ca − ac, cb + a²]] = [[a² + bc, 0], [0, a² + bc]] = I when a² + bc = 1."},{"id":"math-05-018","unit":"math-05","topic":"math-05-algebra","lo":"MATH-5.1","d":"D","q":"If A = [[cos θ, −sin θ], [sin θ, cos θ]], then A² equals:","o":["[[cos²θ, sin²θ], [sin²θ, cos²θ]]","[[cos 2θ, sin 2θ], [−sin 2θ, cos 2θ]]","[[cos 2θ, −sin 2θ], [sin 2θ, cos 2θ]]","[[1, 0], [0, 1]]"],"a":2,"x":"A² = [[cos²θ − sin²θ, −2 sin θ cos θ], [2 sin θ cos θ, cos²θ − sin²θ]] = [[cos 2θ, −sin 2θ], [sin 2θ, cos 2θ]]. Squaring entries one by one gives the cos²θ, sin²θ matrix."},{"id":"math-05-019","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"E","q":"The value of the determinant |[[3, −2], [4, 5]]| is:","o":["7","−23","22","23"],"a":3,"x":"|[[a, b], [c, d]]| = ad − bc = 3·5 − (−2)(4) = 15 + 8 = 23. Dropping the minus sign of −2 gives 15 − 8 = 7."},{"id":"math-05-020","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"E","q":"If two rows of a square matrix are identical, its determinant is:","o":["1","0","doubled","multiplied by −1"],"a":1,"x":"Swapping the two equal rows leaves the matrix unchanged but changes the sign of the determinant, so |A| = −|A| and |A| = 0."},{"id":"math-05-021","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"E","q":"Interchanging two rows of a determinant multiplies its value by:","o":["1","0","−1","2"],"a":2,"x":"Each interchange of two rows (or two columns) changes only the sign of the determinant, so the value is multiplied by −1."},{"id":"math-05-022","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"E","q":"For the matrix [[2, 5], [7, 1]], the cofactor A₁₂ of the entry 5 is:","o":["7","5","−5","−7"],"a":3,"x":"The minor of a₁₂ is the entry left after deleting row 1 and column 2, which is 7. The cofactor is (−1)¹⁺²·7 = −7; giving the minor 7 is the usual slip."},{"id":"math-05-023","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"M","q":"The value of |[[1, 2, 3], [0, 4, 5], [0, 0, 6]]| is:","o":["0","24","11","6"],"a":1,"x":"For a triangular matrix the determinant is the product of the diagonal entries: 1 × 4 × 6 = 24. Expanding down column 1 gives the same: 1·(4·6 − 5·0) = 24."},{"id":"math-05-024","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"M","q":"The value of |[[2, 1, 3], [1, 0, 2], [4, 1, −1]]| is:","o":["−10","8","−8","4"],"a":1,"x":"Along row 1: 2(0·(−1) − 2·1) − 1(1·(−1) − 2·4) + 3(1·1 − 0·4) = 2(−2) − 1(−9) + 3(1) = −4 + 9 + 3 = 8. Using + instead of − for the middle term gives −4 − 9 + 3 = −10."},{"id":"math-05-025","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"M","q":"Find x if |[[x, 4], [3, x + 1]]| = 8.","o":["x = 4 or x = −5","x = −4 or x = 5","x = 4 or x = 5","x = 2 or x = −3"],"a":0,"x":"x(x + 1) − 12 = 8 gives x² + x − 20 = 0, i.e. (x + 5)(x − 4) = 0, so x = 4 or −5. Check x = 4: 4·5 − 12 = 8."},{"id":"math-05-026","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"M","q":"If A is a 3 × 3 matrix with |A| = 5, then |2A| equals:","o":["40","10","20","80"],"a":0,"x":"Multiplying a 3 × 3 matrix by 2 multiplies each of its 3 rows by 2, so |2A| = 2³|A| = 8 × 5 = 40. Taking 2|A| = 10 is the common slip."},{"id":"math-05-027","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"M","q":"If A is a 3 × 3 matrix with |A| = −2, then |A²Aᵗ| equals:","o":["−8","8","−6","4"],"a":0,"x":"|A²Aᵗ| = |A|²·|Aᵗ| = |A|³ since |Aᵗ| = |A|. So the value is (−2)³ = −8. Taking |Aᵗ| = −|A| gives 8."},{"id":"math-05-028","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"M","q":"For the matrix [[1, 2, 3], [4, 5, 6], [7, 8, 0]], the cofactor A₂₃ is:","o":["−6","22","−22","6"],"a":3,"x":"Delete row 2 and column 3: the minor is |[[1, 2], [7, 8]]| = 8 − 14 = −6. The cofactor is (−1)²⁺³(−6) = 6; quoting the minor gives −6."},{"id":"math-05-029","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"M","q":"The value of |[[1, a, b + c], [1, b, c + a], [1, c, a + b]]| is:","o":["a + b + c","abc","1","0"],"a":3,"x":"Add column 2 to column 3: every entry of column 3 becomes a + b + c, so column 3 is (a + b + c) times column 1. Two proportional columns give determinant 0."},{"id":"math-05-030","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"M","q":"For what value of k is the matrix [[1, 2, k], [2, 4, 1], [3, 1, 2]] singular?","o":["−1/2","1/2","2","5"],"a":1,"x":"|A| = 1(8 − 1) − 2(4 − 3) + k(2 − 12) = 7 − 2 − 10k = 5 − 10k. Singular means |A| = 0, so k = 1/2."},{"id":"math-05-031","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"M","q":"The value of |[[0, 0, 3], [0, 2, 5], [1, 4, 7]]| is:","o":["6","42","0","−6"],"a":3,"x":"Expand along row 1: only a₁₃ = 3 is non-zero, with cofactor (+1)|[[0, 2], [1, 4]]| = 0 − 2 = −2, so the value is 3(−2) = −6. Multiplying the anti-diagonal 3·2·1 without the sign gives 6."},{"id":"math-05-032","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"D","q":"If |[[a, b, c], [d, e, f], [g, h, i]]| = 4, then |[[d, e, f], [a, b, c], [2g, 2h, 2i]]| equals:","o":["8","−4","−8","2"],"a":2,"x":"Swapping rows 1 and 2 changes the sign (−4), and doubling row 3 doubles the value: 2(−4) = −8. Forgetting the sign change gives 8."},{"id":"math-05-033","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"M","q":"If |[[a, b, c], [d, e, f], [g, h, i]]| = 4, then |[[a, b, c], [d + 2a, e + 2b, f + 2c], [g, h, i]]| equals:","o":["8","12","4","0"],"a":2,"x":"Adding a multiple of one row to another row does not change a determinant (R₂ → R₂ + 2R₁), so the value stays 4. Treating it as multiplying a row by 2 or 3 gives 8 or 12."},{"id":"math-05-034","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"D","q":"The value of |[[1, 1, 1], [a, b, c], [a², b², c²]]| is:","o":["(a − b)(b − c)(a − c)","(a − b)(b − c)(c − a)","(a + b)(b + c)(c + a)","0"],"a":1,"x":"C₂ − C₁ and C₃ − C₁ give |[[b − a, c − a], [b² − a², c² − a²]]| = (b − a)(c − a)(c − b), which equals (a − b)(b − c)(c − a). Check a = 0, b = 1, c = 2: the determinant is 1·4 − 2·1 = 2 and (−1)(−1)(2) = 2."},{"id":"math-05-035","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"D","q":"The roots of |[[x, 1, 1], [1, x, 1], [1, 1, x]]| = 0 are:","o":["x = −1 or x = 2","x = 1 or x = 2","x = 0 or x = 3","x = 1 or x = −2"],"a":3,"x":"Add all rows to row 1: each entry becomes x + 2, so the determinant is (x + 2)|[[1, 1, 1], [1, x, 1], [1, 1, x]]| = (x + 2)(x − 1)². So x = 1 (repeated) or x = −2."},{"id":"math-05-036","unit":"math-05","topic":"math-05-det","lo":"MATH-5.2","d":"D","q":"If ω is a complex cube root of unity, the value of |[[1, ω, ω²], [ω, ω², 1], [ω², 1, ω]]| is:","o":["1","0","3","ω"],"a":1,"x":"Add columns 2 and 3 to column 1: each entry becomes 1 + ω + ω² = 0, so column 1 is all zeros and the determinant is 0."},{"id":"math-05-037","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"E","q":"The adjoint of the matrix [[3, 5], [2, 4]] is:","o":["[[4, −5], [−2, 3]]","[[4, −2], [−5, 3]]","[[−4, 5], [2, −3]]","[[3, −5], [−2, 4]]"],"a":0,"x":"For [[a, b], [c, d]] the adjoint is [[d, −b], [−c, a]]: swap the diagonal entries and change the signs of the other two, giving [[4, −5], [−2, 3]]."},{"id":"math-05-038","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"E","q":"A square matrix A has an inverse if and only if:","o":["|A| ≠ 0","|A| = 0","|A| = 1","A is symmetric"],"a":0,"x":"A⁻¹ = (adj A)/|A| exists exactly when A is non-singular, i.e. |A| ≠ 0. A matrix with |A| = 0 is singular and has no inverse."},{"id":"math-05-039","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"E","q":"The rank of the matrix [[1, 2], [2, 4]] is:","o":["2","0","4","1"],"a":3,"x":"R₂ − 2R₁ gives [[1, 2], [0, 0]], which has one non-zero row, so the rank is 1. The determinant 4 − 4 = 0 confirms the rank is less than 2."},{"id":"math-05-040","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"M","q":"The inverse of [[2, 1], [5, 3]] is:","o":["[[3, −1], [−5, 2]]","[[−3, 1], [5, −2]]","[[3, −5], [−1, 2]]","[[2, −1], [−5, 3]]"],"a":0,"x":"|A| = 6 − 5 = 1 and adj A = [[3, −1], [−5, 2]], so A⁻¹ = [[3, −1], [−5, 2]]. Check: [[2, 1], [5, 3]]·[[3, −1], [−5, 2]] = [[1, 0], [0, 1]]."},{"id":"math-05-041","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"M","q":"For what value of k does the matrix [[2, k], [3, 4]] have no inverse?","o":["3/8","−8/3","6","8/3"],"a":3,"x":"No inverse means |A| = 0: 2·4 − 3k = 0, so k = 8/3."},{"id":"math-05-042","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"M","q":"If A is a 3 × 3 matrix with |A| = 4, then |adj A| equals:","o":["4","16","64","12"],"a":1,"x":"For an n × n matrix |adj A| = |A|ⁿ⁻¹, so here |adj A| = 4² = 16. Using |A|ⁿ = 64 is the usual slip."},{"id":"math-05-043","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"M","q":"If A⁻¹ = [[1, 2], [0, 1]] and B⁻¹ = [[1, 0], [3, 1]], then (AB)⁻¹ equals:","o":["[[7, 2], [3, 1]]","[[1, 3], [2, 7]]","[[1, 2], [3, 7]]","[[7, 3], [2, 1]]"],"a":2,"x":"(AB)⁻¹ = B⁻¹A⁻¹ = [[1, 0], [3, 1]]·[[1, 2], [0, 1]] = [[1, 2], [3, 7]]. Multiplying in the order A⁻¹B⁻¹ gives [[7, 2], [3, 1]]."},{"id":"math-05-044","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"M","q":"The rank of the matrix [[1, 2, 3], [2, 4, 6], [1, 1, 1]] is:","o":["1","3","0","2"],"a":3,"x":"R₂ − 2R₁ gives a zero row and R₃ − R₁ gives (0, −1, −2), so the echelon form has two non-zero rows: rank 2."},{"id":"math-05-045","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"M","q":"For what value of k does the matrix [[1, 2], [3, k]] have rank 1?","o":["2","6","3","−6"],"a":1,"x":"Rank 1 means the rows are proportional: R₂ = 3R₁ needs k = 3 × 2 = 6. Equivalently |A| = k − 6 = 0."},{"id":"math-05-046","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"M","q":"Which of the following matrices is in reduced row echelon form?","o":["[[1, 3, 0], [0, 2, 1]]","[[1, 0, 2], [0, 1, 3]]","[[0, 1, 2], [1, 0, 3]]","[[1, 4, 0], [0, 1, 0]]"],"a":1,"x":"Reduced echelon form needs each leading entry to be 1, leading entries moving right row by row, and zeros above and below each leading 1. [[1, 0, 2], [0, 1, 3]] meets all three; the others fail on a leading 2, the staircase order, or the 4 above a leading 1."},{"id":"math-05-047","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"M","q":"The inverse of the diagonal matrix [[2, 0, 0], [0, −1, 0], [0, 0, 4]] is:","o":["[[−2, 0, 0], [0, 1, 0], [0, 0, −4]]","[[1/2, 0, 0], [0, 1, 0], [0, 0, 1/4]]","[[1/4, 0, 0], [0, −1, 0], [0, 0, 1/2]]","[[1/2, 0, 0], [0, −1, 0], [0, 0, 1/4]]"],"a":3,"x":"A diagonal matrix with non-zero diagonal entries is inverted by taking the reciprocal of each diagonal entry: 1/2, 1/(−1) = −1, 1/4. Changing signs instead of taking reciprocals gives the second form."},{"id":"math-05-048","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"M","q":"If A = [[1, 2], [3, 4]], then |A⁻¹| equals:","o":["−2","1/2","−1/2","2"],"a":2,"x":"|A| = 4 − 6 = −2 and |A⁻¹| = 1/|A| = −1/2. Quoting |A| itself gives −2."},{"id":"math-05-049","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"M","q":"If A is a 3 × 3 matrix with |A| = 5, then A·(adj A) equals:","o":["25I","I","125I","5I"],"a":3,"x":"For every square matrix A·(adj A) = (adj A)·A = |A| I, so the product is 5I. 25I would be |adj A| confused with the product."},{"id":"math-05-050","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"M","q":"The inverse of [[1, 2, 0], [0, 1, 0], [0, 0, 2]] is:","o":["[[1, −2, 0], [0, 1, 0], [0, 0, 1/2]]","[[1, 2, 0], [0, 1, 0], [0, 0, 1/2]]","[[1, −2, 0], [0, 1, 0], [0, 0, 2]]","[[−1, 2, 0], [0, −1, 0], [0, 0, −1/2]]"],"a":0,"x":"|A| = 2 and the cofactors give adj A = [[2, −4, 0], [0, 2, 0], [0, 0, 1]], so A⁻¹ = [[1, −2, 0], [0, 1, 0], [0, 0, 1/2]]. Check: the product with A is I."},{"id":"math-05-051","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"D","q":"If a square matrix A satisfies A² − 5A + 7I = O, then A⁻¹ equals:","o":["(A − 5I)/7","(5I + A)/7","7(5I − A)","(5I − A)/7"],"a":3,"x":"A² − 5A = −7I gives A(5I − A) = 7I, so A·(5I − A)/7 = I and A⁻¹ = (5I − A)/7. A sign slip when moving 7I gives (A − 5I)/7."},{"id":"math-05-052","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"D","q":"If A is a 3 × 3 matrix with |A| = 3, then |adj(2A)| equals:","o":["36","576","144","72"],"a":1,"x":"|2A| = 2³ × 3 = 24 and |adj B| = |B|² for a 3 × 3 matrix B, so |adj(2A)| = 24² = 576. Using |adj A| = 9 and multiplying by 4 or 16 gives 36 or 144."},{"id":"math-05-053","unit":"math-05","topic":"math-05-inverse","lo":"MATH-5.3","d":"D","q":"For what value of k does the matrix [[1, 2, 1], [2, 3, k], [3, 5, 2]] have rank 2?","o":["1","−1","2","0"],"a":0,"x":"|A| = 1(6 − 5k) − 2(4 − 3k) + 1(10 − 9) = k − 1, so the rank is less than 3 only when k = 1. Then R₃ = R₁ + R₂ and R₁, R₂ are not proportional, so the rank is exactly 2."},{"id":"math-05-054","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"E","q":"A homogeneous system AX = O of linear equations always has:","o":["no solution","exactly two solutions","only non-trivial solutions","the trivial solution X = O"],"a":3,"x":"Putting every unknown equal to 0 satisfies every equation of AX = O, so the trivial solution always exists. Non-trivial solutions exist only when |A| = 0."},{"id":"math-05-055","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"E","q":"By Cramer's rule, the solution of ax + by = p, cx + dy = q (with ad − bc ≠ 0) has x equal to:","o":["(aq − pc)/(ad − bc)","(ad − bc)/(pd − bq)","(pd − bq)/(ad − bc)","(pb − dq)/(ad − bc)"],"a":2,"x":"x = Dₓ/D, where Dₓ replaces the x-column by the constants: Dₓ = |[[p, b], [q, d]]| = pd − bq and D = ad − bc. (aq − pc)/(ad − bc) is the value of y."},{"id":"math-05-056","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"E","q":"When the system x + 2y = 5, 3x − y = 1 is written as AX = B, the coefficient matrix A is:","o":["[[1, 3], [2, −1]]","[[1, 2], [3, 1]]","[[1, 2], [3, −1]]","[[5, 2], [1, −1]]"],"a":2,"x":"Each row of A holds the coefficients of one equation in the order x, y: (1, 2) and (3, −1). Writing the coefficients by columns gives the transpose instead."},{"id":"math-05-057","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"M","q":"Using Cramer's rule, the value of y in 2x + 3y = 8, x − y = −1 is:","o":["2","−2","1","3"],"a":0,"x":"D = 2(−1) − 3(1) = −5 and Dᵧ = |[[2, 8], [1, −1]]| = −2 − 8 = −10, so y = −10/(−5) = 2. Check with x = Dₓ/D = (−8 + 3)/(−5) = 1: 2 + 6 = 8."},{"id":"math-05-058","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"M","q":"Solve x + y + z = 6, 2x − y + z = 3, x + 2y − z = 2. The value of z is:","o":["2","3","1","−3"],"a":1,"x":"Adding the first and third equations gives 2x + 3y = 8; adding the second and third gives 3x + y = 5. These give x = 1, y = 2, and then z = 6 − 1 − 2 = 3. Check: 1 + 4 − 3 = 2."},{"id":"math-05-059","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"M","q":"For what value of k does the system kx + 2y = 5, 3x + y = 1 have no solution?","o":["3/2","−6","6","2/3"],"a":2,"x":"The coefficient determinant is k − 6, which is zero when k = 6. Then the equations read 6x + 2y = 5 and 6x + 2y = 2, which contradict each other, so there is no solution."},{"id":"math-05-060","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"M","q":"For what value of k does the homogeneous system x + ky = 0, 2x + 8y = 0 have a non-trivial solution?","o":["−4","4","2","16"],"a":1,"x":"A homogeneous system has non-trivial solutions only when the coefficient determinant is zero: 8 − 2k = 0, so k = 4."},{"id":"math-05-061","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"M","q":"For AX = B with A⁻¹ = [[2, −1], [−1, 1]] and B = [4, 1]ᵗ (a column), the solution X = [x, y]ᵗ gives:","o":["x = 3, y = −7","x = 7, y = −3","x = 7, y = 3","x = −3, y = 7"],"a":1,"x":"X = A⁻¹B: x = 2·4 + (−1)·1 = 7 and y = (−1)·4 + 1·1 = −3. Dropping the minus sign in the second row gives y = 3."},{"id":"math-05-062","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"M","q":"For what value of k does the system x + 2y = 3, 2x + 4y = k have infinitely many solutions?","o":["6","3","12","0"],"a":0,"x":"The second equation's left side is twice the first, so the system has infinitely many solutions when k = 2 × 3 = 6; for any other k it has none."},{"id":"math-05-063","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"M","q":"The system x + y + z = 1, x + y + z = 2, x − y = 0 has:","o":["exactly one solution","infinitely many solutions","no solution","only the trivial solution"],"a":2,"x":"The first two equations ask x + y + z to equal both 1 and 2 at once, which is impossible, so the system is inconsistent. The coefficient determinant is zero because two rows are equal."},{"id":"math-05-064","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"M","q":"For x + y = 3, y + z = 5, x + z = 4 solved by Cramer's rule, the determinant Dᵧ (y-column replaced by the constants) is:","o":["2","−4","4","6"],"a":2,"x":"Dᵧ = |[[1, 3, 0], [0, 5, 1], [1, 4, 1]]| = 1(5 − 4) − 3(0 − 1) + 0 = 4. With D = 2, y = 4/2 = 2; check: x = 1, z = 3 satisfy all three equations."},{"id":"math-05-065","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"D","q":"For what value of k does the homogeneous system 2x − y + z = 0, x + 2y − z = 0, x − 3y + kz = 0 have a non-trivial solution?","o":["−2","0","5","2"],"a":3,"x":"Need the coefficient determinant zero: 2(2k − 3) + 1(k + 1) + 1(−3 − 2) = 5k − 10 = 0, so k = 2. Check: the third equation is then the first minus the second."},{"id":"math-05-066","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"M","q":"Row reduction of the augmented matrix of a system in x, y, z gives rows (1, 2, −1 | 4), (0, 1, 3 | 5), (0, 0, 2 | 4). The value of x is:","o":["0","4","−4","8"],"a":3,"x":"Back-substitution: 2z = 4 gives z = 2; y = 5 − 3(2) = −1; x = 4 − 2(−1) + 2 = 8. Losing the sign of the −z term gives x = 4."},{"id":"math-05-067","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"M","q":"2 pens and 3 pencils cost Rs 80, and 3 pens and 2 pencils cost Rs 95. What is the price of one pen?","o":["Rs 10","Rs 25","Rs 15","Rs 35"],"a":1,"x":"2p + 3q = 80 and 3p + 2q = 95. Adding gives p + q = 35 and subtracting gives p − q = 15, so p = 25 (and q = 10). Check: 50 + 30 = 80."},{"id":"math-05-068","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"D","q":"For what value of k is the system x + y + z = 1, x + 2y + 3z = 4, x + 3y + 5z = k consistent?","o":["5","7","4","1"],"a":1,"x":"The left sides satisfy (row 3) = 2(row 2) − (row 1), so the coefficient determinant is 0. The system is consistent only if the constants obey the same relation: k = 2(4) − 1 = 7, and then it has infinitely many solutions."},{"id":"math-05-069","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"D","q":"The system x + 2y + z = 3, 2x + y − z = 0, x + y + kz = 2 has a unique solution exactly when:","o":["k ≠ 1","k ≠ 0","k ≠ −1","k ≠ 3"],"a":1,"x":"A unique solution needs a non-zero coefficient determinant: 1(k + 1) − 2(2k + 1) + 1(2 − 1) = k + 1 − 4k − 2 + 1 = −3k. This is non-zero exactly when k ≠ 0."},{"id":"math-05-070","unit":"math-05","topic":"math-05-systems","lo":"MATH-5.4","d":"M","q":"If |A| = 0 for the coefficient matrix of a non-homogeneous system AX = B, then the system:","o":["has exactly one solution","always has infinitely many solutions","has either no solution or infinitely many solutions","always has no solution"],"a":2,"x":"With |A| = 0, A⁻¹ does not exist and the solution cannot be unique. Depending on B the equations either contradict each other (no solution) or one is a combination of the others (infinitely many)."},{"id":"math-06-001","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"D","q":"The proposition “∃x ∈ R, x² + 2x + a ≤ 0” is false. What is the range of the real number a?","o":["a < 1","a ≤ 1","a > 1","a ≥ 1"],"a":2,"x":"If the statement is false, its negation “∀x ∈ R, x² + 2x + a > 0” is true, so Δ = 4 − 4a < 0, giving a > 1. a = 1 is excluded because then x = −1 gives x² + 2x + 1 = 0 ≤ 0, which would make the original statement true."},{"id":"math-06-002","unit":"math-06","topic":"math-06-solve","lo":"MATH-6.1","d":"E","q":"What are the zeros of f(x) = x² − x − 6?","o":["−2 and 3","−3 and 2","2 and 3","−6 and 1"],"a":0,"x":"Factorise: x² − x − 6 = (x − 3)(x + 2), so f(x) = 0 when x = 3 or x = −2. The pair −3 and 2 has both signs reversed: those are the zeros of x² + x − 6."},{"id":"math-06-003","unit":"math-06","topic":"math-06-nature","lo":"MATH-6.2","d":"D","q":"The equation x² − 2mx + m + 6 = 0 has two distinct real roots, both greater than 1. What is the range of m?","o":["3 < m < 7","m > 3","m < 7","−2 < m < 3"],"a":0,"x":"Let f(x) = x² − 2mx + m + 6. We need Δ = 4m² − 4(m + 6) > 0, i.e. m < −2 or m > 3; the axis m > 1; and f(1) = 7 − m > 0, i.e. m < 7. Together 3 < m < 7. The answer m > 3 forgets f(1) > 0: for m = 8 one root is less than 1."},{"id":"math-06-004","unit":"math-06","topic":"math-06-poly","lo":"MATH-6.4","d":"E","q":"How many zeros does the function f(x) = x³ − 4x have?","o":["3","1","2","4"],"a":0,"x":"Factorise: x³ − 4x = x(x − 2)(x + 2), so the zeros are −2, 0 and 2, which is 3 zeros. Dividing both sides by x first loses the zero x = 0 and gives only 2."},{"id":"math-06-005","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"The proposition “∀x ∈ [1, 2], x² − a ≥ 0” is true. What is the range of the real number a?","o":["a ≥ 4","a ≤ 1","a ≤ 4","a ≥ 1"],"a":1,"x":"We need a ≤ x² for every x in [1, 2], so a must be at most the smallest value of x², which is 1. a ≤ 4 uses the largest value instead; that would only make the statement true for some x, not for all."},{"id":"math-06-006","unit":"math-06","topic":"math-06-nature","lo":"MATH-6.2","d":"D","q":"The function f(x) = x² − ax + 1 has exactly one zero in the interval (0, 1). What is the range of a?","o":["a ≥ 2","a < −2","0 < a < 2","a > 2"],"a":3,"x":"The product of the roots is 1, so if one root r lies in (0, 1) the other is 1/r > 1, and a = r + 1/r. For r in (0, 1), r + 1/r takes every value greater than 2. At a = 2 the double root is x = 1, which is not inside (0, 1), so a ≥ 2 is wrong."},{"id":"math-06-007","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"E","q":"What is the solution set of x² − 4 < 0?","o":["x < 2","−2 < x < 2","x < −2 or x > 2","x < −2"],"a":1,"x":"(x − 2)(x + 2) < 0 holds between the roots, so −2 < x < 2. x < 2 comes from taking the square root as if x² < 4 meant x < 2, which wrongly includes x = −5."},{"id":"math-06-008","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"E","q":"What is the solution set of x² − x − 6 > 0?","o":["−2 < x < 3","x < −3 or x > 2","x < −2 or x > 3","−3 < x < 2"],"a":2,"x":"x² − x − 6 = (x − 3)(x + 2), with roots −2 and 3. The parabola opens upward, so it is positive outside the roots: x < −2 or x > 3. The roots −3 and 2 come from factorising as (x + 3)(x − 2), which gives x² + x − 6."},{"id":"math-06-009","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"What is the solution set of −x² + 2x + 8 ≥ 0?","o":["x ≤ −2 or x ≥ 4","−4 ≤ x ≤ 2","x ≤ −4 or x ≥ 2","−2 ≤ x ≤ 4"],"a":3,"x":"Multiply by −1 and reverse the sign: x² − 2x − 8 ≤ 0, i.e. (x − 4)(x + 2) ≤ 0, so −2 ≤ x ≤ 4. x ≤ −2 or x ≥ 4 forgets to reverse the sign after multiplying by −1."},{"id":"math-06-010","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"What is the solution set of x² − 6x + 9 > 0?","o":["{x | x ≠ 3}","{x | x > 3}","R","∅"],"a":0,"x":"x² − 6x + 9 = (x − 3)², which is positive for every x except x = 3, where it equals 0. R would be correct for ≥ 0, but the strict inequality excludes x = 3."},{"id":"math-06-011","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"What is the solution set of x² + 2x + 5 < 0?","o":["R","{x | x ≠ −1}","{x | −5 < x < 1}","∅"],"a":3,"x":"Δ = 4 − 20 = −16 < 0 and the parabola opens upward, so x² + 2x + 5 = (x + 1)² + 4 ≥ 4 for all x and is never negative. The solution set is ∅; R would be the answer for > 0."},{"id":"math-06-012","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"D","q":"The solution set of ax² + bx + 2 > 0 is {x | −1/2 < x < 1/3}. What is the value of a + b?","o":["−10","−14","10","14"],"a":1,"x":"The roots are −1/2 and 1/3 and a < 0. By Vieta, product 2/a = −1/6 gives a = −12, and sum −b/a = −1/6 gives b = −2, so a + b = −14. The value −10 comes from using b/a = −1/6 (a sign error in the sum of roots), which gives b = 2."},{"id":"math-06-013","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"The solution set of x² + bx + c < 0 is {x | 1 < x < 3}. What is the value of b + c?","o":["−7","1","−1","7"],"a":2,"x":"The roots are 1 and 3, so x² + bx + c = (x − 1)(x − 3) = x² − 4x + 3, giving b = −4, c = 3 and b + c = −1. The answer 7 takes b = +4, forgetting that the sum of roots equals −b."},{"id":"math-06-014","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"For which values of k does x² − kx + 4 > 0 hold for every real x?","o":["−2 < k < 2","−4 < k < 4","−4 ≤ k ≤ 4","k < −4 or k > 4"],"a":1,"x":"An upward parabola is always positive exactly when Δ = k² − 16 < 0, i.e. −4 < k < 4. At k = ±4 the expression is a perfect square that equals 0 at one point, so the endpoints are excluded."},{"id":"math-06-015","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"D","q":"For which values of the real number k does kx² − kx + 1 > 0 hold for every real x?","o":["0 < k < 4","0 ≤ k ≤ 4","k < 0 or k > 4","0 ≤ k < 4"],"a":3,"x":"If k = 0 the inequality becomes 1 > 0, which is always true. If k ≠ 0 we need k > 0 and Δ = k² − 4k < 0, giving 0 < k < 4. Together 0 ≤ k < 4; the answer 0 < k < 4 forgets to check k = 0, where the expression is not quadratic."},{"id":"math-06-016","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"What is the solution set of (x − 1)(2 − x) ≥ 0?","o":["1 < x < 2","x ≤ 1 or x ≥ 2","1 ≤ x ≤ 2","x ≥ 2"],"a":2,"x":"Rewrite as (x − 1)(x − 2) ≤ 0 (multiplying by −1 reverses the sign), which holds between and at the roots: 1 ≤ x ≤ 2. x ≤ 1 or x ≥ 2 treats (2 − x) as if it were (x − 2) without reversing the sign."},{"id":"math-06-017","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"How many integers satisfy x² − 2x − 8 ≤ 0?","o":["7","5","6","8"],"a":0,"x":"(x − 4)(x + 2) ≤ 0 gives −2 ≤ x ≤ 4, which contains the integers −2, −1, 0, 1, 2, 3, 4: seven of them. The answer 5 drops both endpoints, which are allowed because of ≤."},{"id":"math-06-018","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"Given a > 1, what is the solution set of x² − (a + 1)x + a < 0?","o":["{x | a < x < 1}","{x | x < 1 or x > a}","∅","{x | 1 < x < a}"],"a":3,"x":"x² − (a + 1)x + a = (x − 1)(x − a), with roots 1 and a, and a > 1. The expression is negative between the roots, so 1 < x < a. {x | a < x < 1} is empty when a > 1, because its order of roots is reversed."},{"id":"math-06-019","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"D","q":"The inequality x² − ax + 4 ≥ 0 holds for every x in [1, 3]. What is the range of the real number a?","o":["a ≤ 5","a ≤ 4","a ≤ 13/3","a ≥ 4"],"a":1,"x":"For x > 0 the condition is a ≤ x + 4/x for all x in [1, 3]. By AM-GM x + 4/x ≥ 2√4 = 4, with equality at x = 2, which lies in [1, 3], so the minimum is 4 and a ≤ 4. a ≤ 5 uses the value at the endpoint x = 1, which is not the minimum."},{"id":"math-06-020","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"E","q":"What is the solution set of x² < 2x?","o":["x < 2","x < 0 or x > 2","0 < x < 2","x > 2"],"a":2,"x":"x² − 2x < 0 gives x(x − 2) < 0, so 0 < x < 2. Dividing both sides by x to get x < 2 is invalid, because x may be negative or zero; x = −1 satisfies x < 2 but 1 < −2 is false."},{"id":"math-06-021","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"D","q":"The equation x² + mx + 1 = 0 has two distinct negative real roots. What is the range of m?","o":["m > 2","m < −2","m > 0","m < −2 or m > 2"],"a":0,"x":"We need Δ = m² − 4 > 0 (so m < −2 or m > 2), sum of roots −m < 0 (so m > 0) and product 1 > 0. Together m > 2. m < −2 or m > 2 only guarantees two distinct roots; for m < −2 both roots are positive."},{"id":"math-06-022","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"D","q":"The solution set of x² + ax + b < 0 is {x | −3 < x < 2}. What is the solution set of bx² + ax + 1 > 0?","o":["−1/2 < x < 1/3","−1/3 < x < 1/2","x < −1/3 or x > 1/2","−3 < x < 2"],"a":1,"x":"The roots −3 and 2 give a = −(−3 + 2) = 1 and b = (−3)(2) = −6. Then −6x² + x + 1 > 0 becomes 6x² − x − 1 < 0, i.e. (3x + 1)(2x − 1) < 0, so −1/3 < x < 1/2. The interval −1/2 < x < 1/3 comes from factor signs swapped, as (3x − 1)(2x + 1)."},{"id":"math-06-023","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"E","q":"What is the solution set of (x + 3)(x − 5) ≤ 0?","o":["−5 ≤ x ≤ 3","x ≤ −3 or x ≥ 5","−3 < x < 5","−3 ≤ x ≤ 5"],"a":3,"x":"The roots are −3 and 5, and the product is ≤ 0 between and at them, so −3 ≤ x ≤ 5. −5 ≤ x ≤ 3 reads the roots off the factors with the wrong signs."},{"id":"math-06-024","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"D","q":"A rectangle has perimeter 20 cm. Its length is x cm and its length is at least its width. For which x is the area at least 21 cm²?","o":["3 ≤ x ≤ 7","5 ≤ x < 10","3 ≤ x ≤ 5","5 ≤ x ≤ 7"],"a":3,"x":"The width is 10 − x, so x(10 − x) ≥ 21 gives x² − 10x + 21 ≤ 0, i.e. 3 ≤ x ≤ 7. Length at least width means x ≥ 10 − x, so x ≥ 5. Together 5 ≤ x ≤ 7; 3 ≤ x ≤ 7 ignores the length-width condition."},{"id":"math-06-025","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"For which values of a does the equation x² + (a − 3)x + a = 0 have no real roots?","o":["a < 1 or a > 9","1 < a < 9","−9 < a < −1","1 ≤ a ≤ 9"],"a":1,"x":"No real roots means Δ = (a − 3)² − 4a = a² − 10a + 9 < 0, i.e. (a − 1)(a − 9) < 0, so 1 < a < 9. At a = 1 or a = 9 there is a double root, so the endpoints are excluded; a < 1 or a > 9 is the condition for two distinct roots."},{"id":"math-06-026","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"E","q":"What is the solution set of x² ≥ 9?","o":["x ≥ 3","−3 ≤ x ≤ 3","x > 3","x ≤ −3 or x ≥ 3"],"a":3,"x":"x² − 9 = (x − 3)(x + 3) ≥ 0 holds outside and at the roots: x ≤ −3 or x ≥ 3. x ≥ 3 alone forgets the negative values, e.g. x = −4 gives 16 ≥ 9."},{"id":"math-06-027","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"E","q":"What is the solution set of (x − 2)/(x + 1) < 0?","o":["−2 < x < 1","−1 < x < 2","x < −1 or x > 2","−1 ≤ x < 2"],"a":1,"x":"A quotient is negative when numerator and denominator have opposite signs, which is equivalent to (x − 2)(x + 1) < 0, so −1 < x < 2. x = −1 cannot be included because the denominator would be 0."},{"id":"math-06-028","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"What is the solution set of (x + 3)/(x − 1) ≥ 0?","o":["x ≤ −3 or x ≥ 1","x ≤ −3 or x > 1","−3 ≤ x < 1","x < −3 or x > 1"],"a":1,"x":"The critical points are −3 (numerator zero, allowed) and 1 (denominator zero, never allowed). The quotient is non-negative outside them, so x ≤ −3 or x > 1. Including x = 1 is the classic slip: the fraction is undefined there."},{"id":"math-06-029","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"What is the solution set of 1/x > 1?","o":["x < 1","x > 1","x < 0 or x > 1","0 < x < 1"],"a":3,"x":"1/x − 1 > 0 gives (1 − x)/x > 0, i.e. x(x − 1) < 0, so 0 < x < 1. x < 1 comes from multiplying both sides by x without knowing its sign; x = −2 gives 1/x = −1/2, which is not greater than 1."},{"id":"math-06-030","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"What is the solution set of (2x − 1)/(x + 2) ≤ 1?","o":["−2 < x ≤ 3","x ≤ 3","−2 ≤ x ≤ 3","x < −2 or x ≥ 3"],"a":0,"x":"Move 1 across: (2x − 1 − x − 2)/(x + 2) ≤ 0, i.e. (x − 3)/(x + 2) ≤ 0, so −2 < x ≤ 3. x ≤ 3 comes from cross-multiplying by x + 2, which is only valid when x + 2 > 0; x = −2 is excluded since it makes the denominator 0."},{"id":"math-06-031","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"What is the solution set of 3/(x − 2) ≥ 1?","o":["x ≤ 5","x < 2 or x ≥ 5","2 < x ≤ 5","2 ≤ x ≤ 5"],"a":2,"x":"3/(x − 2) − 1 = (5 − x)/(x − 2) ≥ 0, which is equivalent to (x − 5)/(x − 2) ≤ 0, so 2 < x ≤ 5. 2 ≤ x ≤ 5 includes x = 2, where 3/(x − 2) is undefined."},{"id":"math-06-032","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"How many integers satisfy (x + 1)/(x − 4) ≤ 0?","o":["4","5","6","7"],"a":1,"x":"The solution is −1 ≤ x < 4 (x = −1 makes the fraction 0, x = 4 is excluded). The integers are −1, 0, 1, 2, 3: five of them. Counting 6 wrongly includes x = 4, where the denominator is 0."},{"id":"math-06-033","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"What is the solution set of x/(x − 1) < 2?","o":["x < 2","x < 1 or x > 2","1 < x < 2","x > 2"],"a":1,"x":"x/(x − 1) − 2 = (2 − x)/(x − 1) < 0, which means (x − 2)/(x − 1) > 0, so x < 1 or x > 2. Cross-multiplying to x < 2x − 2 gives only x > 2 and loses the part x < 1, where x − 1 is negative."},{"id":"math-06-034","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"Let A = {x | (x − 3)/(x + 1) ≤ 0} and B = {x | x ≥ 1}. What is A ∩ B?","o":["{x | 1 ≤ x < 3}","{x | 1 ≤ x ≤ 3}","{x | −1 < x ≤ 3}","{x | x ≥ −1}"],"a":1,"x":"(x − 3)/(x + 1) ≤ 0 gives A = {x | −1 < x ≤ 3}, where x = 3 makes the fraction 0 and is included. Intersecting with x ≥ 1 gives 1 ≤ x ≤ 3. Excluding 3 confuses the numerator zero with the denominator zero."},{"id":"math-06-035","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"D","q":"What is the solution set of |x² − 2| < 2?","o":["−2 < x < 2","0 < x < 2","−2 < x < 0 or 0 < x < 2","−4 < x < 0 or 0 < x < 4"],"a":2,"x":"−2 < x² − 2 < 2 gives 0 < x² < 4. x² < 4 means −2 < x < 2, and x² > 0 removes x = 0. So −2 < x < 0 or 0 < x < 2; the answer −2 < x < 2 forgets that x = 0 gives |0 − 2| = 2, which is not less than 2."},{"id":"math-06-036","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"E","q":"Positive numbers a and b satisfy a + b = 8. What is the maximum value of ab?","o":["16","4","8","32"],"a":0,"x":"AM-GM gives √(ab) ≤ (a + b)/2 = 4, so ab ≤ 16, with equality when a = b = 4. The value 4 is the maximum of √(ab), not of ab."},{"id":"math-06-037","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"For 0 < x < 1/2, what is the maximum value of x(1 − 2x)?","o":["1/4","1/2","1/8","1"],"a":2,"x":"x(1 − 2x) = (1/2) · 2x(1 − 2x) ≤ (1/2) · ((2x + 1 − 2x)/2)² = (1/2)(1/4) = 1/8, with equality when 2x = 1 − 2x, i.e. x = 1/4. The answer 1/4 is the bound for 2x(1 − 2x) and forgets the factor 1/2."},{"id":"math-06-038","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"A rectangular pen is built against a long straight wall, so fencing is needed on only three sides. With 20 m of fencing, what is the largest possible area?","o":["50 m²","25 m²","100 m²","400/9 m²"],"a":0,"x":"With the two sides perpendicular to the wall each x m, the third side is 20 − 2x and the area is x(20 − 2x) = (1/2) · 2x(20 − 2x) ≤ (1/2)(10)² = 50 m², at x = 5. 400/9 m² assumes all three sides are equal, which is not optimal."},{"id":"math-06-039","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"D","q":"Given a < 0, what is the solution set of x² − 2ax − 3a² < 0?","o":["{x | 3a < x < −a}","{x | −a < x < 3a}","{x | x < 3a or x > −a}","{x | −3a < x < a}"],"a":0,"x":"x² − 2ax − 3a² = (x − 3a)(x + a), with roots 3a and −a. Since a < 0, 3a is negative and −a is positive, so 3a < −a and the solution is 3a < x < −a. {x | −a < x < 3a} lists the roots in the order that would be correct for a > 0 and is empty here."},{"id":"math-06-040","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"E","q":"What is the solution set of x² − 5x + 4 ≤ 0?","o":["−4 ≤ x ≤ −1","x ≤ 1 or x ≥ 4","1 ≤ x ≤ 4","1 < x < 4"],"a":2,"x":"x² − 5x + 4 = (x − 1)(x − 4) ≤ 0 holds between and at the roots, so 1 ≤ x ≤ 4. x ≤ 1 or x ≥ 4 is the solution of ≥ 0, and 1 < x < 4 drops the endpoints allowed by ≤."},{"id":"math-06-041","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"What is the solution set of 2x² − x − 1 > 0?","o":["x < −1/2 or x > 1","−1/2 < x < 1","x < −1 or x > 1/2","−1 < x < 1/2"],"a":0,"x":"2x² − x − 1 = (2x + 1)(x − 1), with roots −1/2 and 1. The parabola opens upward, so it is positive outside the roots: x < −1/2 or x > 1. The roots −1 and 1/2 come from factorising as (2x − 1)(x + 1), which gives 2x² + x − 1."},{"id":"math-06-042","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"For which values of m does the equation x² − 2x + m = 0 have two distinct real roots?","o":["m ≤ 1","m > 1","m < 1","m < 4"],"a":2,"x":"Two distinct real roots need Δ = 4 − 4m > 0, so m < 1. m ≤ 1 includes m = 1, where the equation (x − 1)² = 0 has only one (double) root."},{"id":"math-06-043","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"D","q":"For which values of the real number m does (m − 1)x² + (m − 1)x + 2 > 0 hold for every real x?","o":["1 < m < 9","1 ≤ m ≤ 9","1 ≤ m < 9","m < 1 or m > 9"],"a":2,"x":"If m = 1 the inequality is 2 > 0, always true. Otherwise we need m − 1 > 0 and Δ = (m − 1)² − 8(m − 1) = (m − 1)(m − 9) < 0, giving 1 < m < 9. Together 1 ≤ m < 9; forgetting the case m = 1, where the expression is not quadratic, gives 1 < m < 9."},{"id":"math-06-044","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"What is the solution set of (x − 1)/(x + 3) > 0?","o":["x < −3 or x > 1","−3 < x < 1","x < −1 or x > 3","x ≤ −3 or x ≥ 1"],"a":0,"x":"The quotient is positive when (x − 1)(x + 3) > 0, i.e. x < −3 or x > 1. The option with ≤ and ≥ includes x = −3, where the denominator is 0, and x = 1, where the quotient is 0 and not positive."},{"id":"math-06-045","unit":"math-06","topic":"math-06-qfunc","lo":"MATH-6.5","d":"M","q":"What is the solution set of 2/x ≤ 1?","o":["x ≥ 2","x < 0 or x ≥ 2","0 < x ≤ 2","x ≤ 0 or x ≥ 2"],"a":1,"x":"2/x − 1 = (2 − x)/x ≤ 0, i.e. (x − 2)/x ≥ 0, so x < 0 or x ≥ 2 (x = 0 is excluded). x ≥ 2 comes from multiplying by x as if it were positive; every negative x also works, since 2/x is then negative."},{"id":"math-06-046","unit":"math-06","topic":"math-06-solve","lo":"MATH-6.1","d":"M","q":"What is the product of all the real roots of x⁴ − 13x² + 36 = 0?","o":["−36","6","13","36"],"a":3,"x":"Put y = x²: y² − 13y + 36 = 0 gives y = 4 or 9, so x = ±2, ±3. Product = (2)(−2)(3)(−3) = 36; taking only the positive roots gives 6."},{"id":"math-06-047","unit":"math-06","topic":"math-06-solve","lo":"MATH-6.1","d":"M","q":"What is the solution set of 4ˣ − 3·2^(x + 1) + 8 = 0?","o":["{2, 4}","{−1, −2}","{1, 2}","{1, 3}"],"a":2,"x":"Put y = 2ˣ: y² − 6y + 8 = 0, so y = 2 or 4, giving x = 1 or 2. Stopping at the values of y gives {2, 4}."},{"id":"math-06-048","unit":"math-06","topic":"math-06-solve","lo":"MATH-6.1","d":"M","q":"Which value(s) of x satisfy √(x + 7) = x − 5?","o":["x = 9 only","x = 2 only","x = 2 and x = 9","no real value"],"a":0,"x":"Squaring: x + 7 = x² − 10x + 25, so x² − 11x + 18 = 0 and x = 2 or 9. Check: x = 9 gives 4 = 4, but x = 2 gives 3 = −3, so 2 is extraneous."},{"id":"math-06-049","unit":"math-06","topic":"math-06-solve","lo":"MATH-6.1","d":"D","q":"What are the real solutions of (x² + 1/x²) − 3(x + 1/x) + 4 = 0?","o":["x = 1 and x = 2","x = 1 and x = −1","x = 2 and x = 1/2","x = 1 only"],"a":3,"x":"Put y = x + 1/x, so x² + 1/x² = y² − 2: y² − 3y + 2 = 0, y = 1 or 2. y = 2 gives x = 1; y = 1 gives x² − x + 1 = 0, which has no real roots. Check: 2 − 6 + 4 = 0."},{"id":"math-06-050","unit":"math-06","topic":"math-06-solve","lo":"MATH-6.1","d":"E","q":"Completing the square, x² + 6x − 7 = 0 can be written as","o":["(x + 3)² = 7","(x − 3)² = 16","(x + 3)² = 16","(x + 6)² = 43"],"a":2,"x":"Add 9 to both sides of x² + 6x = 7: (x + 3)² = 16, giving x = 1 or −7. Forgetting to add 9 on the right gives (x + 3)² = 7."},{"id":"math-06-051","unit":"math-06","topic":"math-06-solve","lo":"MATH-6.1","d":"M","q":"What are the roots of 2x² − 4x − 1 = 0?","o":["(2 ± √6)/4","(2 ± √6)/2","(−2 ± √6)/2","(2 ± √2)/2"],"a":1,"x":"x = (4 ± √(16 + 8))/4 = (4 ± 2√6)/4 = (2 ± √6)/2. Dividing only the surd part by 4 gives (2 ± √6)/4."},{"id":"math-06-052","unit":"math-06","topic":"math-06-solve","lo":"MATH-6.1","d":"D","q":"What is the sum of the real roots of (x + 1)(x + 2)(x + 3)(x + 4) = 24?","o":["−5","−10","0","5"],"a":0,"x":"Pair the factors: (x² + 5x + 4)(x² + 5x + 6) = 24. With y = x² + 5x: y² + 10y = 0, so y = 0 or −10. y = 0 gives x = 0, −5; y = −10 gives x² + 5x + 10 = 0 with negative discriminant. Sum of real roots −5; adding the complex pair too gives −10."},{"id":"math-06-053","unit":"math-06","topic":"math-06-solve","lo":"MATH-6.1","d":"M","q":"What is the solution set of 3^(2x + 1) − 10·3ˣ + 3 = 0?","o":["{1/3, 3}","{1}","{−1, 1}","{0, 1}"],"a":2,"x":"Put y = 3ˣ: 3y² − 10y + 3 = 0, so (3y − 1)(y − 3) = 0 and y = 1/3 or 3, giving x = −1 or 1. {1/3, 3} are the values of y, not x."},{"id":"math-06-054","unit":"math-06","topic":"math-06-solve","lo":"MATH-6.1","d":"M","q":"What is the solution of √(x + 5) + √x = 5?","o":["x = 9","x = 4","x = 2","x = 16"],"a":1,"x":"√(x + 5) = 5 − √x; squaring: x + 5 = 25 − 10√x + x, so √x = 2 and x = 4. Check: √9 + √4 = 3 + 2 = 5. Stopping at √x = 2 gives the slip 2."},{"id":"math-06-055","unit":"math-06","topic":"math-06-nature","lo":"MATH-6.2","d":"M","q":"For which values of k does x² + kx + (k + 3) = 0 have equal roots?","o":["k = −6 or k = 2","k = 6 only","k = 6 or k = −2","k = 3 or k = −4"],"a":2,"x":"Equal roots need b² − 4ac = 0: k² − 4(k + 3) = 0, so k² − 4k − 12 = 0 = (k − 6)(k + 2). Check k = 6: x² + 6x + 9 = (x + 3)²."},{"id":"math-06-056","unit":"math-06","topic":"math-06-nature","lo":"MATH-6.2","d":"M","q":"If α and β are the roots of x² − 5x + 3 = 0, what is α² + β²?","o":["25","31","19","22"],"a":2,"x":"α + β = 5, αβ = 3, so α² + β² = (α + β)² − 2αβ = 25 − 6 = 19. Adding 2αβ instead gives 31."},{"id":"math-06-057","unit":"math-06","topic":"math-06-nature","lo":"MATH-6.2","d":"D","q":"If α and β are the roots of 2x² − 3x − 1 = 0, what is α³ + β³?","o":["9/8","27/8","45/8","63/8"],"a":2,"x":"α + β = 3/2, αβ = −1/2. α³ + β³ = (α + β)³ − 3αβ(α + β) = 27/8 + 9/4 = 45/8. Using αβ = +1/2 gives 27/8 − 18/8 = 9/8."},{"id":"math-06-058","unit":"math-06","topic":"math-06-nature","lo":"MATH-6.2","d":"M","q":"If α and β are the roots of x² − 3x + 5 = 0, which equation has roots 2α and 2β?","o":["x² − 6x + 10 = 0","x² − 6x + 20 = 0","x² + 6x + 20 = 0","x² − 3x + 20 = 0"],"a":1,"x":"New sum = 2(α + β) = 6, new product = 4αβ = 20, so x² − 6x + 20 = 0. Doubling the product only once gives 10."},{"id":"math-06-059","unit":"math-06","topic":"math-06-nature","lo":"MATH-6.2","d":"D","q":"If α and β are the roots of x² − 4x + 2 = 0, which equation has roots α/β and β/α?","o":["x² − 8x + 1 = 0","x² − 6x + 1 = 0","x² + 6x + 1 = 0","x² − 6x + 2 = 0"],"a":1,"x":"Product = 1. Sum = (α² + β²)/(αβ) = (16 − 4)/2 = 6. So x² − 6x + 1 = 0. Using α² + β² = (α + β)² = 16 and forgetting −2αβ gives 8."},{"id":"math-06-060","unit":"math-06","topic":"math-06-nature","lo":"MATH-6.2","d":"E","q":"What is the nature of the roots of 3x² − 4x + 2 = 0?","o":["complex (imaginary) and conjugate","real and equal","real, unequal and rational","real, unequal and irrational"],"a":0,"x":"Discriminant = (−4)² − 4(3)(2) = 16 − 24 = −8 < 0, so the roots are complex conjugates."},{"id":"math-06-061","unit":"math-06","topic":"math-06-nature","lo":"MATH-6.2","d":"M","q":"For which value of k are the roots of x² − 6x + k = 0 real, unequal and rational?","o":["k = 7","k = 5","k = 9","k = 10"],"a":1,"x":"Discriminant = 36 − 4k. k = 5 gives 16, a perfect square (roots 1 and 5). k = 7 gives 8 (irrational roots), k = 9 gives 0 (equal roots), k = 10 gives −4 (complex roots)."},{"id":"math-06-062","unit":"math-06","topic":"math-06-nature","lo":"MATH-6.2","d":"D","q":"One root of x² − px + 8 = 0, where p is real, is the square of the other. What is p?","o":["6","−6","10","12"],"a":0,"x":"Roots α and α²: product α³ = 8, and for real p the real choice is α = 2, so the roots are 2 and 4. p = sum = 6. Taking the sign of the x-coefficient as the sum gives −6."},{"id":"math-06-063","unit":"math-06","topic":"math-06-unity","lo":"MATH-6.3","d":"M","q":"If ω is a complex cube root of unity, what is (1 + ω − ω²)(1 − ω + ω²)?","o":["1","0","−4","4"],"a":3,"x":"Since 1 + ω + ω² = 0: 1 + ω = −ω² and 1 + ω² = −ω. The product is (−2ω²)(−2ω) = 4ω³ = 4."},{"id":"math-06-064","unit":"math-06","topic":"math-06-unity","lo":"MATH-6.3","d":"E","q":"If ω is a complex cube root of unity, what is ω²⁹?","o":["ω","1","ω²","−1"],"a":2,"x":"ω³ = 1 and 29 = 27 + 2, so ω²⁹ = (ω³)⁹·ω² = ω². Check: 29 leaves remainder 2 on division by 3."},{"id":"math-06-065","unit":"math-06","topic":"math-06-unity","lo":"MATH-6.3","d":"M","q":"If ω is a complex cube root of unity, what is (1 + ω²)⁵?","o":["ω²","−ω","ω","−ω²"],"a":3,"x":"1 + ω² = −ω, so (1 + ω²)⁵ = (−ω)⁵ = −ω⁵ = −ω³·ω² = −ω²."},{"id":"math-06-066","unit":"math-06","topic":"math-06-unity","lo":"MATH-6.3","d":"M","q":"What is the product of the four fourth roots of unity?","o":["−1","1","0","i"],"a":0,"x":"The fourth roots of unity are 1, −1, i, −i. Product = (1)(−1)(i)(−i) = (−1)(−i²) = (−1)(1) = −1. Their sum, not product, is 0."},{"id":"math-06-067","unit":"math-06","topic":"math-06-unity","lo":"MATH-6.3","d":"M","q":"Taking ω = (−1 + √3 i)/2, what is ω − ω²?","o":["√3 i","−√3 i","−1","1"],"a":0,"x":"ω² = (−1 − √3 i)/2, so ω − ω² = (−1 + √3 i + 1 + √3 i)/2 = √3 i. Adding them instead gives ω + ω² = −1."},{"id":"math-06-068","unit":"math-06","topic":"math-06-unity","lo":"MATH-6.3","d":"D","q":"If ω is a complex cube root of unity, what is (1 + ω)(1 + ω²)(1 + ω⁴)(1 + ω⁸)?","o":["1","0","−1","16"],"a":0,"x":"ω⁴ = ω and ω⁸ = ω², so the product is [(1 + ω)(1 + ω²)]². And (1 + ω)(1 + ω²) = 1 + ω + ω² + ω³ = 0 + 1 = 1, so the answer is 1² = 1."},{"id":"math-06-069","unit":"math-06","topic":"math-06-unity","lo":"MATH-6.3","d":"M","q":"What are the three cube roots of −27?","o":["3, 3ω, 3ω²","−3, 3ω, 3ω²","−3, −3i, 3i","−3, −3ω, −3ω²"],"a":3,"x":"x³ = −27 = (−3)³, so x = −3·(cube roots of 1) = −3, −3ω, −3ω². Check: (−3ω)³ = −27ω³ = −27."},{"id":"math-06-070","unit":"math-06","topic":"math-06-unity","lo":"MATH-6.3","d":"D","q":"If ω is a complex cube root of unity, what is (2 + 5ω + 2ω²)⁶?","o":["−729","729ω","64","729"],"a":3,"x":"2 + 2ω + 2ω² = 0, so 2 + 5ω + 2ω² = 3ω. Then (3ω)⁶ = 729·ω⁶ = 729·1 = 729."},{"id":"math-06-071","unit":"math-06","topic":"math-06-unity","lo":"MATH-6.3","d":"E","q":"What are the solutions of x⁴ − 81 = 0?","o":["±3 only","±9, ±9i","±3, ±3i","±3i only"],"a":2,"x":"x⁴ − 81 = (x² − 9)(x² + 9) = 0, so x = ±3 or x = ±3i: 3 times each fourth root of unity 1, −1, i, −i."},{"id":"math-06-072","unit":"math-06","topic":"math-06-unity","lo":"MATH-6.3","d":"D","q":"Let ω be a complex cube root of unity and x = p + q, y = pω + qω², z = pω² + qω. What is xyz?","o":["p³ − q³","p³ + q³","3pq","(p + q)³"],"a":1,"x":"yz = p²ω³ + pqω² + pqω⁴ + q²ω³ = p² + pq(ω + ω²) + q² = p² − pq + q². Then xyz = (p + q)(p² − pq + q²) = p³ + q³."},{"id":"math-06-073","unit":"math-06","topic":"math-06-poly","lo":"MATH-6.4","d":"E","q":"What is the remainder when x³ − 2x² + 4x − 5 is divided by x − 2?","o":["−29","13","3","−3"],"a":2,"x":"By the remainder theorem the remainder is f(2) = 8 − 8 + 8 − 5 = 3. Using f(−2) = −29 is the sign slip."},{"id":"math-06-074","unit":"math-06","topic":"math-06-poly","lo":"MATH-6.4","d":"M","q":"If x + 2 is a factor of x³ + kx² − x − 2, what is k?","o":["−2","2","4","1/2"],"a":1,"x":"Factor theorem: f(−2) = 0, so −8 + 4k + 2 − 2 = 0, giving 4k = 8 and k = 2. Check: x³ + 2x² − x − 2 = (x + 2)(x² − 1)."},{"id":"math-06-075","unit":"math-06","topic":"math-06-poly","lo":"MATH-6.4","d":"M","q":"What is the remainder when 2x³ + 3x² − 5x + 1 is divided by 2x − 1?","o":["4","1/2","1","−1/2"],"a":3,"x":"The remainder is f(1/2) = 2/8 + 3/4 − 5/2 + 1 = 1/4 + 3/4 − 5/2 + 1 = −1/2. Using f(−1/2) gives 4."},{"id":"math-06-076","unit":"math-06","topic":"math-06-poly","lo":"MATH-6.4","d":"D","q":"Both x − 1 and x + 2 are factors of x³ + ax² + bx − 6. What are a and b?","o":["a = 4, b = 1","a = 1, b = 4","a = −4, b = 9","a = 2, b = 3"],"a":0,"x":"f(1) = 0 gives a + b = 5; f(−2) = 0 gives −8 + 4a − 2b − 6 = 0, so 2a − b = 7. Hence a = 4, b = 1. Check: x³ + 4x² + x − 6 = (x − 1)(x + 2)(x + 3)."},{"id":"math-06-077","unit":"math-06","topic":"math-06-poly","lo":"MATH-6.4","d":"M","q":"Using synthetic division, what is the quotient when x³ − 4x² + x + 6 is divided by x − 3?","o":["x² − 7x + 22","x² − x − 2","x² + x − 2","x² − x + 2"],"a":1,"x":"Synthetic division by 3 on 1, −4, 1, 6: 1; −4 + 3 = −1; 1 − 3 = −2; 6 − 6 = 0. Quotient x² − x − 2, remainder 0. Dividing by −3 instead
