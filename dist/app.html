<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a68">
<title>ECAT Prep</title>
<style>
:root{
  --bg:#f4f7f8; --card:#ffffff; --ink:#14232a; --muted:#5d6f77; --line:#dde5e8;
  --brand:#1f3a68; --brand-2:#2c5296; --brand-soft:#e6ecf6;
  --ok:#1f8a4c; --ok-soft:#e3f5ea; --bad:#c0392b; --bad-soft:#fbe9e7; --warn:#b7791f;
  --math:#d0621f; --phy:#2c6fbf; --chem:#7b4fb3; --cs:#2e8b57; --eng:#a0367a;
  --radius:14px; --shadow:0 1px 2px rgba(20,35,42,.06),0 4px 14px rgba(20,35,42,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1719; --card:#172226; --ink:#e7eef0; --muted:#9db0b6; --line:#27363b;
    --brand:#7fa6e0; --brand-2:#9dbbe8; --brand-soft:#1a2740;
    --ok:#4cc27c; --ok-soft:#173a26; --bad:#ef6b5e; --bad-soft:#3d1d1a; --warn:#e2a64b;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:620px;margin:0 auto;min-height:100vh;padding:0 16px 40px}
button{font:inherit;color:inherit}

/* top bar */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);
  border-bottom:1px solid var(--line)}
.bar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer;flex:none}
.iconbtn:active{background:var(--line)}

/* hero */
.hero{margin:16px 0;padding:20px;border-radius:var(--radius);color:#fff;
  background:linear-gradient(135deg,#1f3a68,#2c5296)}
.hero h2{margin:0 0 4px;font-size:22px}
.hero p{margin:0;opacity:.9;font-size:14px}
.hero .stats{display:flex;gap:18px;margin-top:14px}
.hero .stats b{display:block;font-size:20px}
.hero .stats span{font-size:12px;opacity:.85}

h3.section{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}

/* cards & lists */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.row:active{transform:scale(.99)}
.row.disabled{opacity:.55;cursor:default}
.row .main{flex:1;min-width:0}
.row .title{font-weight:600}
.row .sub{font-size:13px;color:var(--muted)}
.badge{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:13px;letter-spacing:-.02em}
.chev{color:var(--muted);flex:none}
.pbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--brand-2);border-radius:6px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.tag.soon{background:var(--line);color:var(--muted)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow)}
.tile .ic{font-size:22px}
.tile .title{font-weight:600;margin-top:6px}
.tile .sub{font-size:12px;color:var(--muted)}

/* buttons */
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;cursor:pointer;
  background:var(--brand);color:#fff;font-weight:600;font-size:16px;text-align:center}
.btn.secondary{background:var(--card);color:var(--brand);border:1.5px solid var(--brand)}
.btn:disabled{opacity:.45;cursor:default}
.btn+.btn{margin-top:10px}
.actions{margin-top:18px}

/* unit page */
.lo{font-size:13px;color:var(--muted);margin:4px 0 0;padding-left:0;list-style:none}
.lo li{margin:2px 0}
.lo code{font-size:11px;color:var(--brand);font-weight:700;margin-right:4px}

/* player */
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 8px;font-size:13px;color:var(--muted)}
.qprog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:12px}
.qprog i{display:block;height:100%;background:var(--brand-2)}
.qtext{font-size:18px;font-weight:500;margin:6px 0 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border-radius:12px;cursor:pointer;
  background:var(--card);border:1.5px solid var(--line);font-size:16px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;
  background:var(--line);color:var(--muted)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.locked{cursor:default}
.explain{margin-top:16px;padding:14px;border-radius:12px;background:var(--brand-soft);font-size:15px}
.explain b{display:block;margin-bottom:4px}
.verdict-ok{color:var(--ok)} .verdict-bad{color:var(--bad)}

/* results */
.score{text-align:center;padding:24px 16px;margin-top:16px}
.score .big{font-size:44px;font-weight:800;color:var(--brand)}
.score .of{color:var(--muted)}
.review{padding:14px;margin-top:10px}
.review .q{font-weight:600;margin-bottom:6px}
.review .ans{font-size:14px}
.review .x{font-size:14px;color:var(--muted);margin-top:6px}

/* rules & guidelines */
.guide{padding:4px 16px 12px;margin-top:14px;font-size:15px}
.guide h4{margin:18px 0 6px;font-size:15px;color:var(--brand)}
.guide ul{padding-left:20px;margin:8px 0}
.guide li{margin:6px 0}
.guide table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
.guide th,.guide td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.guide th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.callout{padding:12px;border-radius:10px;margin:12px 0;font-size:14px}
.callout.tip{background:var(--brand-soft)}
.callout.warn{background:var(--bad-soft)}
.srcs{padding-left:20px;font-size:14px}
.srcs a{color:var(--brand)}

.empty{text-align:center;color:var(--muted);padding:40px 10px}
.note{font-size:13px;color:var(--muted);margin-top:14px}

/* mock exams */
.timer{flex:none;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:4px 10px;border-radius:20px;background:var(--brand-soft);color:var(--brand)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.opt.chosen{border-color:var(--brand);background:var(--brand-soft)}
.opt.chosen .k{background:var(--brand);color:#fff}
.flagbtn{color:var(--muted)}
.flagbtn.on{color:var(--warn);background:var(--line)}
.mnav{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-top:18px}
.mnav .btn{padding:12px 6px;font-size:14px;margin:0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.mgrid .cell{height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;position:relative}
.mgrid .cell.done{background:var(--brand-soft);border-color:var(--brand-2);color:var(--brand)}
.mgrid .cell.flag::after{content:"⚑";position:absolute;top:-2px;right:3px;font-size:11px;color:var(--warn)}
.mgrid .cell.cur{outline:2px solid var(--brand);outline-offset:1px}
.passrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.tag.fail{background:var(--bad-soft);color:var(--bad)}
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable th,.mtable td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
.mtable th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.mtable tr:last-child td{border-bottom:0}
.agg{display:flex;gap:10px;margin-top:12px}
.agg label{flex:1;font-size:13px;color:var(--muted)}
.agg input{display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.aggout{margin-top:12px;font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
/* reading passage */
.passage{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:15px;line-height:1.55}
.passage summary{font-weight:600;cursor:pointer;color:var(--brand)}
.passage p{margin:8px 0 0}

</style>
</head>

mming Basics","books":"old Part II ch 8 · old Part II ch 9 · old Part II ch 10","topics":[{"id":"cs-08-structure","name":"Structure of a C program","los":[{"code":"CS-8.1","text":"Compiling, linking and preprocessor directives."}]},{"id":"cs-08-elements","name":"Data types and operators","los":[{"code":"CS-8.2","text":"Identifiers, keywords, data types, variables, constants, operators and precedence."}]},{"id":"cs-08-io","name":"Input and output","los":[{"code":"CS-8.3","text":"printf, scanf, format specifiers and escape sequences."}]}]},{"id":"cs-09","n":9,"name":"C Control Structures and Functions","books":"old Part II ch 11 · old Part II ch 12 · old Part II ch 13 · old Part II ch 14","topics":[{"id":"cs-09-decisions","name":"Decision constructs","los":[{"code":"CS-9.1","text":"if, if-else, else-if, switch and the conditional operator."}]},{"id":"cs-09-loops","name":"Loops","los":[{"code":"CS-9.2","text":"while, do-while, for, nested loops, break and continue."}]},{"id":"cs-09-functions","name":"Functions","los":[{"code":"CS-9.3","text":"Prototypes, parameters, return values and variable scope."}]},{"id":"cs-09-files","name":"File handling","los":[{"code":"CS-9.4","text":"Opening, reading, writing and closing text files."}]}]},{"id":"cs-10","n":10,"name":"Software Development","books":"new Class 11 ch 1 · new Class 12 ch 5","topics":[{"id":"cs-10-sdlc","name":"SDLC and methods","los":[{"code":"CS-10.1","text":"SDLC stages, Waterfall and Agile, project planning."}]},{"id":"cs-10-testing","name":"Testing and debugging","los":[{"code":"CS-10.2","text":"Syntax, runtime and logic errors; testing methods and debugging."}]}]},{"id":"cs-11","n":11,"name":"Python Programming","books":"new Class 11 ch 2 · new Class 12 ch 3 · new Class 12 ch 4","topics":[{"id":"cs-11-basics","name":"Python basics","los":[{"code":"CS-11.1","text":"Syntax, variables, data types, input and output."}]},{"id":"cs-11-control","name":"Operators, decisions and loops","los":[{"code":"CS-11.2","text":"Operators, if statements and loops."}]},{"id":"cs-11-functions","name":"Functions and data structures","los":[{"code":"CS-11.3","text":"Functions, lists, tuples and dictionaries."}]},{"id":"cs-11-oop","name":"Object-oriented Python","los":[{"code":"CS-11.4","text":"Classes, objects, inheritance, encapsulation and polymorphism."}]},{"id":"cs-11-gui","name":"GUI with Tkinter","los":[{"code":"CS-11.5","text":"Windows, widgets and event-driven programs."}]}]},{"id":"cs-12","n":12,"name":"Algorithms and Data Structures","books":"new Class 11 ch 3 · new Class 11 ch 4 · new Class 12 ch 2","topics":[{"id":"cs-12-algorithms","name":"Algorithms and complexity","los":[{"code":"CS-12.1","text":"Problem types, design techniques, P, NP and NP-complete."}]},{"id":"cs-12-sortsearch","name":"Sorting and searching","los":[{"code":"CS-12.2","text":"Common sorting and searching algorithms."}]},{"id":"cs-12-structures","name":"Data structures","los":[{"code":"CS-12.3","text":"Lists, stacks, queues, trees and graphs."}]},{"id":"cs-12-logic","name":"Computational thinking and logic","los":[{"code":"CS-12.4","text":"Decomposition, propositional and predicate logic."}]}]},{"id":"cs-13","n":13,"name":"Data Analytics","books":"new Class 11 ch 5 · new Class 12 ch 6 · new Class 12 ch 7","topics":[{"id":"cs-13-stats","name":"Descriptive statistics and models","los":[{"code":"CS-13.1","text":"Descriptive statistics, models and evaluation."}]},{"id":"cs-13-viz","name":"Data science and visualisation","los":[{"code":"CS-13.2","text":"Data science workflow, cleaning and visualisation."}]},{"id":"cs-13-hypothesis","name":"Hypothesis testing","los":[{"code":"CS-13.3","text":"Null and alternative hypotheses and significance."}]}]},{"id":"cs-14","n":14,"name":"Digital Literacy and Entrepreneurship","books":"new Class 11 ch 8 · new Class 11 ch 9","topics":[{"id":"cs-14-research","name":"Online research and digital literacy","los":[{"code":"CS-14.1","text":"Searching, evaluating sources and advanced search."}]},{"id":"cs-14-business","name":"Entrepreneurship in the digital age","los":[{"code":"CS-14.2","text":"Design thinking and business plans."}]}]}]},{"id":"eng","name":"English","mcqsInPaper":10,"bankTarget":500,"units":[{"id":"eng-01","n":1,"name":"Reading Comprehension","note":"The only English skill UET tests (FAQ 2026). Mocks use these passage questions.","topics":[{"id":"eng-01-main","name":"Main idea and purpose","los":[{"code":"ENG-1.1","text":"Identify the main idea, title or purpose of a passage."}]},{"id":"eng-01-detail","name":"Stated details","los":[{"code":"ENG-1.2","text":"Find facts and details stated in the passage."}]},{"id":"eng-01-infer","name":"Inference","los":[{"code":"ENG-1.3","text":"Draw conclusions the passage supports but does not state."}]},{"id":"eng-01-vocab","name":"Words in context","los":[{"code":"ENG-1.4","text":"Work out the meaning of a word or phrase from its context."}]},{"id":"eng-01-tone","name":"Tone and attitude","los":[{"code":"ENG-1.5","text":"Recognise the writer's tone, attitude and point of view."}]},{"id":"eng-01-structure","name":"Structure and reference","los":[{"code":"ENG-1.6","text":"Follow how the passage is organised and what pronouns and linking words refer to."}]}]},{"id":"eng-02","n":2,"name":"Vocabulary (extra practice)","note":"Not in the official ECAT 2026 English; offered as extra practice.","topics":[{"id":"eng-02-syn","name":"Synonyms","los":[{"code":"ENG-2.1","text":"Choose the word closest in meaning."}]},{"id":"eng-02-ant","name":"Antonyms","los":[{"code":"ENG-2.2","text":"Choose the word most nearly opposite in meaning."}]},{"id":"eng-02-usage","name":"Word usage and confusables","los":[{"code":"ENG-2.3","text":"Use commonly confused words and phrasal verbs correctly."}]}]},{"id":"eng-03","n":3,"name":"Sentence Correction (extra practice)","note":"Not in the official ECAT 2026 English; offered as extra practice.","topics":[{"id":"eng-03-agree","name":"Agreement and tense","los":[{"code":"ENG-3.1","text":"Correct subject-verb agreement and tense errors."}]},{"id":"eng-03-prep","name":"Prepositions and articles","los":[{"code":"ENG-3.2","text":"Choose the correct preposition or article."}]},{"id":"eng-03-struct","name":"Sentence structure","los":[{"code":"ENG-3.3","text":"Fix modifiers, parallelism, pronouns and word order."}]}]}]}]};
const QUESTIONS = [{"id":"math-01-001","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"E","q":"If a > b, which of the following must be true?","o":["a − 3 > b − 3","a² > b²","1/a < 1/b","ac > bc"],"a":0,"x":"Subtracting the same number from both sides keeps an inequality, so a − 3 > b − 3. a² > b² fails for a = 1, b = −2; 1/a < 1/b fails for a = 1, b = −1; ac > bc fails when c ≤ 0."},{"id":"math-01-002","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"E","q":"What is (1 + i)², where i² = −1?","o":["2","−2i","2i","2 + 2i"],"a":2,"x":"(1 + i)² = 1 + 2i + i² = 1 + 2i − 1 = 2i. The value 2 + 2i comes from taking i² = +1, and 2 keeps only the squares 1² + 1²."},{"id":"math-01-003","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"E","q":"In the complex plane, the point representing z = −3 + 2i lies in which quadrant?","o":["the first quadrant","the third quadrant","the fourth quadrant","the second quadrant"],"a":3,"x":"z = a + bi corresponds to the point (a, b) = (−3, 2): negative x and positive y, which is the second quadrant. Reading the point as (2, −3) would wrongly give the fourth quadrant."},{"id":"math-01-004","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"D","q":"The equation x² + px + q = 0, where p and q are real, has the root 1 − 2i. What is p + q?","o":["−7","−3","3","7"],"a":2,"x":"With real coefficients the other root is the conjugate 1 + 2i. Sum of roots 2 = −p, so p = −2; product (1 − 2i)(1 + 2i) = 5 = q. So p + q = 3. Forgetting the minus sign in the sum of roots gives p = 2 and p + q = 7."},{"id":"math-01-005","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"M","q":"If a < b < 0, which of the following is true?","o":["1/a < 1/b","a² < b²","b/a < 1","ab < b²"],"a":2,"x":"Dividing a < b by the negative number a reverses it: 1 > b/a, so b/a < 1 (e.g. a = −2, b = −1 gives 1/2). With these values 1/a = −1/2 > −1 = 1/b, a² = 4 > 1 = b², and ab = 2 > 1 = b², so the other three are false."},{"id":"math-01-006","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"E","q":"What is (3 + 2i) − (1 − 4i)?","o":["2 + 6i","2 − 6i","2 − 2i","4 − 2i"],"a":0,"x":"Subtract real and imaginary parts separately: (3 − 1) + (2 − (−4))i = 2 + 6i. The result 2 − 2i forgets that subtracting −4i adds 4i."},{"id":"math-01-007","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"M","q":"In the complex plane, the point representing z = (m² − 4) + (m + 1)i, where m is real, lies in the second quadrant. What is the range of m?","o":["−1 < m < 2","−2 < m < −1","m > −1","−2 < m < 2"],"a":0,"x":"Second quadrant: real part negative and imaginary part positive. m² − 4 < 0 gives −2 < m < 2, and m + 1 > 0 gives m > −1. Together −1 < m < 2. The answer −2 < m < 2 uses only the real-part condition."},{"id":"math-01-008","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"M","q":"The number 2 + i is a root of the equation x² − 4x + c = 0. What is the real number c?","o":["−5","5","3","4"],"a":1,"x":"(2 + i)² − 4(2 + i) + c = (3 + 4i) − 8 − 4i + c = c − 5 = 0, so c = 5. Equivalently the roots are 2 ± i, and their product is 4 + 1 = 5. Taking i² = +1 in the product gives 3."},{"id":"math-01-009","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"M","q":"If a > b > 0 and c < 0, which of the following is true?","o":["c/a > c/b","ac > bc","a + c < b + c","a/c > b/c"],"a":0,"x":"From a > b > 0, 1/a < 1/b; multiplying by the negative c reverses the sign, so c/a > c/b. Multiplying a > b by c < 0 gives ac < bc and a/c < b/c, and adding c keeps a + c > b + c."},{"id":"math-01-010","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"M","q":"What is (2 − i)(3 + 4i)?","o":["2 + 5i","10 + 5i","10 + 11i","6 − 4i"],"a":1,"x":"(2 − i)(3 + 4i) = 6 + 8i − 3i − 4i² = 6 + 5i + 4 = 10 + 5i. Taking i² = 1 gives 2 + 5i, and 6 − 4i only multiplies real parts with each other and imaginary parts with each other."},{"id":"math-01-011","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"D","q":"The complex number z satisfies |z − 1| = 1. What is the maximum value of |z − 4 − 4i|?","o":["4","6","5","7"],"a":1,"x":"|z − 1| = 1 is the circle with centre (1, 0) and radius 1, and |z − (4 + 4i)| is the distance from z to the point (4, 4). The centre is √(9 + 16) = 5 from (4, 4), so the largest distance is 5 + 1 = 6. The value 4 is the minimum, 5 − 1."},{"id":"math-01-012","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"D","q":"Which complex number w satisfies w² = −3 + 4i?","o":["2 + i","1 − 2i","1 + 2i","2 − i"],"a":2,"x":"(1 + 2i)² = 1 + 4i + 4i² = −3 + 4i. The others give (2 + i)² = 3 + 4i, (1 − 2i)² = −3 − 4i and (2 − i)² = 3 − 4i. The other square root is −1 − 2i, which is not listed."},{"id":"math-01-013","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"E","q":"If a > b and c > d, which of the following must be true?","o":["a + c > b + d","a − c > b − d","ac > bd","a/d > b/c"],"a":0,"x":"Inequalities in the same direction may be added: a + c > b + d. They may not be subtracted: a = 5, b = 1, c = 10, d = 0 gives a − c = −5 < 1 = b − d. Multiplying needs all terms positive, so ac > bd is not guaranteed."},{"id":"math-01-014","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"M","q":"What is (1 + 3i)/(1 − i) in the form a + bi?","o":["2 + 2i","−2 + 4i","−1 − 2i","−1 + 2i"],"a":3,"x":"Multiply top and bottom by the conjugate 1 + i: (1 + 3i)(1 + i)/2 = (1 + 4i + 3i²)/2 = (−2 + 4i)/2 = −1 + 2i. −2 + 4i forgets to divide by (1 − i)(1 + i) = 2, and 2 + 2i takes 3i² as +3."},{"id":"math-01-015","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"M","q":"In the complex plane, the points z satisfying |z + i| = |z − 1| form which set?","o":["the line y = x","the line y = −x","the line x + y = 1","the circle x² + y² = 1"],"a":1,"x":"The points are equidistant from −i, i.e. (0, −1), and from 1, i.e. (1, 0). With z = x + yi: x² + (y + 1)² = (x − 1)² + y² simplifies to 2y = −2x, so y = −x, the perpendicular bisector. Reading |z + i| as the distance to (0, 1) leads to y = x."},{"id":"math-01-016","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"E","q":"Over the complex numbers, what are the solutions of x² + 4 = 0?","o":["x = ±2i","x = ±2","x = ±4i","x = ±√2 i"],"a":0,"x":"x² = −4, and (2i)² = 4i² = −4, so x = ±2i. x = ±2 gives x² = 4, and ±4i gives x² = −16."},{"id":"math-01-017","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"M","q":"If 1 < a < 3 and −2 < b < 1, what is the range of a − b?","o":["−1 < a − b < 4","2 < a − b < 3","0 < a − b < 5","−1 < a − b < 5"],"a":2,"x":"From −2 < b < 1 we get −1 < −b < 2, and adding 1 < a < 3 gives 0 < a − b < 5. The range −1 < a − b < 4 is actually the range of a + b; inequalities are subtracted by first negating and reversing one of them."},{"id":"math-01-018","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"E","q":"What is the modulus |3 − 4i|?","o":["1","7","25","5"],"a":3,"x":"|3 − 4i| = √(3² + (−4)²) = √25 = 5. 25 forgets the square root, and 7 adds the absolute values of the parts."},{"id":"math-01-019","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"M","q":"In the complex plane, the point representing z = (2 − i)/i lies in which quadrant?","o":["the first quadrant","the second quadrant","the fourth quadrant","the third quadrant"],"a":3,"x":"z = (2 − i)(−i) = −2i + i² = −1 − 2i, the point (−1, −2), which is in the third quadrant. Multiplying by i instead of dividing gives 1 + 2i in the first quadrant."},{"id":"math-01-020","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"M","q":"If 2 < x < 4 and 1 < y < 2, what is the range of x/y?","o":["1 < x/y < 2","2 < x/y < 4","1/2 < x/y < 2","1 < x/y < 4"],"a":3,"x":"Since 1/2 < 1/y < 1 and all quantities are positive, multiplying gives 2 × 1/2 < x/y < 4 × 1, i.e. 1 < x/y < 4. The smallest quotient pairs the smallest x with the largest y; 2 < x/y < 4 forgets that dividing by y close to 2 can halve x."},{"id":"math-01-021","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"E","q":"What is the conjugate of the complex number 2 − 5i?","o":["−2 + 5i","−2 − 5i","5 − 2i","2 + 5i"],"a":3,"x":"The conjugate of a + bi is a − bi: keep the real part and change the sign of the imaginary part, giving 2 + 5i. −2 + 5i is the negative −z, not the conjugate."},{"id":"math-01-022","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"D","q":"The complex number z satisfies |z − 2i| = 1. What is the range of |z|?","o":["[0, 3]","[1, 3]","[1, 2]","[2, 3]"],"a":1,"x":"z lies on the circle with centre (0, 2) and radius 1, and |z| is its distance from the origin. The origin is 2 from the centre, so |z| ranges from 2 − 1 = 1 to 2 + 1 = 3. [0, 3] wrongly assumes the circle passes through the origin."},{"id":"math-01-023","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"M","q":"For every real x, how do (x + 1)(x + 3) and (x + 2)² compare?","o":["(x + 1)(x + 3) > (x + 2)² for all x","they are equal for all x","the order depends on x","(x + 1)(x + 3) < (x + 2)² for all x"],"a":3,"x":"(x + 2)² − (x + 1)(x + 3) = (x² + 4x + 4) − (x² + 4x + 3) = 1 > 0, so (x + 1)(x + 3) is always smaller. “The order depends on x” is wrong because the difference is the constant 1."},{"id":"math-01-024","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"E","q":"What is the value of i²⁰²⁶?","o":["−1","1","i","−i"],"a":0,"x":"Powers of i repeat with period 4: i, −1, −i, 1. Since 2026 = 4 × 506 + 2, i²⁰²⁶ = i² = −1. Using the remainder of 2026 ÷ 4 wrongly as 1 or 3 gives i or −i."},{"id":"math-01-025","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"E","q":"In the complex plane, points A and B represent 1 + 2i and 4 − 2i. What is the distance AB?","o":["3","7","25","5"],"a":3,"x":"AB = |(4 − 2i) − (1 + 2i)| = |3 − 4i| = √(9 + 16) = 5. 7 adds 3 and 4 instead of using Pythagoras, and 25 forgets the square root."},{"id":"math-01-026","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"E","q":"Which of the following inequalities holds for all real numbers a and b?","o":["a + b ≥ 2√(ab)","a² + b² ≥ 2ab","a² + b² ≤ 2ab","a/b + b/a ≥ 2"],"a":1,"x":"a² + b² − 2ab = (a − b)² ≥ 0 for all reals. a + b ≥ 2√(ab) needs a, b ≥ 0, and a/b + b/a ≥ 2 fails for a = 1, b = −1 (the sum is −2). a² + b² ≤ 2ab is the reverse of the true inequality."},{"id":"math-01-027","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"E","q":"What is the imaginary part of the complex number z = i(2 − 3i)?","o":["2i","3","−3","2"],"a":3,"x":"z = 2i − 3i² = 3 + 2i, so the imaginary part is 2. The imaginary part of a + bi is the real number b, not bi, so 2i is wrong; 3 is the real part."},{"id":"math-01-028","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"M","q":"In the complex plane, A represents 3 + 2i and B represents −1 + 4i. Which complex number represents the midpoint of AB?","o":["2 + 6i","−2 + i","4 − 2i","1 + 3i"],"a":3,"x":"The midpoint is the average: ((3 + 2i) + (−1 + 4i))/2 = (2 + 6i)/2 = 1 + 3i. 2 + 6i forgets to halve, and −2 + i is half of the vector AB, not the midpoint."},{"id":"math-01-029","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"M","q":"If a > b > 0, how does a/b compare with (a + 1)/(b + 1)?","o":["a/b < (a + 1)/(b + 1)","a/b = (a + 1)/(b + 1)","a/b > (a + 1)/(b + 1)","it depends on a and b"],"a":2,"x":"(a + 1)/(b + 1) − a/b = (b − a)/(b(b + 1)), which is negative since b < a and b > 0. So a/b is larger; for example 3/1 = 3 > 4/2 = 2. Adding 1 to top and bottom moves a fraction greater than 1 towards 1."},{"id":"math-01-030","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"E","q":"The complex number z = (a − 2) + (a + 1)i, where a is real, is purely imaginary. What is a?","o":["−2","−1","1","2"],"a":3,"x":"Purely imaginary means the real part is 0 and the imaginary part is not 0: a − 2 = 0 gives a = 2, and then a + 1 = 3 ≠ 0. a = −1 would make the imaginary part 0, so z would be the real number −3."},{"id":"math-01-031","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"E","q":"Which of these numbers is irrational?","o":["√12/√3","0.333… (3 repeating)","22/7","√5 + 1"],"a":3,"x":"√12/√3 = √4 = 2 and 0.333… = 1/3 are rational, and 22/7 is a ratio of integers. √5 is irrational, and adding 1 keeps it irrational."},{"id":"math-01-032","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"M","q":"Which fraction equals the recurring decimal 0.232323… (23 repeating)?","o":["23/99","23/100","23/90","7/30"],"a":0,"x":"Let x = 0.2323…; then 100x = 23.2323…, so 99x = 23 and x = 23/99. 23/100 is the terminating decimal 0.23."},{"id":"math-01-033","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"M","q":"What is the multiplicative inverse of √3 − √2?","o":["√3 − √2","√2 − √3","√3 + √2","(√3 + √2)/5"],"a":2,"x":"1/(√3 − √2) = (√3 + √2)/((√3)² − (√2)²) = (√3 + √2)/1 = √3 + √2. Check: (√3 − √2)(√3 + √2) = 3 − 2 = 1. √2 − √3 is the additive inverse."},{"id":"math-01-034","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"M","q":"Let a be a non-zero rational number and b an irrational number. Which number must be irrational?","o":["b²","b − b","ab","(b + 1) − b"],"a":2,"x":"If ab = r were rational, then b = r/a would be rational, which is false; so ab is irrational. b² can be rational (b = √2 gives 2), and b − b = 0 and (b + 1) − b = 1 are rational."},{"id":"math-01-035","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"M","q":"What is the additive inverse of the multiplicative inverse of −2/3?","o":["−3/2","2/3","3/2","−2/3"],"a":2,"x":"The multiplicative inverse of −2/3 is −3/2, and the additive inverse of −3/2 is 3/2. Stopping after the first step gives −3/2."},{"id":"math-01-036","unit":"math-01","topic":"math-01-real","lo":"MATH-1.1","d":"D","q":"If x = 2 + √3, what is x² + 1/x²?","o":["16","12","14","7 + 4√3"],"a":2,"x":"1/x = 1/(2 + √3) = 2 − √3, so x + 1/x = 4 and x² + 1/x² = 4² − 2 = 14. Check: (7 + 4√3) + (7 − 4√3) = 14. Forgetting the −2 gives 16."},{"id":"math-01-037","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"M","q":"What is the multiplicative inverse of 3 − 4i?","o":["(3 + 4i)/25","(3 + 4i)/5","(−3 + 4i)/25","(3 − 4i)/25"],"a":0,"x":"1/(3 − 4i) = (3 + 4i)/((3 − 4i)(3 + 4i)) = (3 + 4i)/(9 + 16) = (3 + 4i)/25. Dividing by |z| = 5 instead of |z|² = 25 gives (3 + 4i)/5."},{"id":"math-01-038","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"M","q":"What is the modulus of (3 + 4i)(1 − i)/(1 + 2i)?","o":["√10","5√2","√5","2√5"],"a":0,"x":"|z₁z₂/z₃| = |z₁||z₂|/|z₃| = 5 × √2/√5 = √5 × √2 = √10. Leaving out the denominator gives 5√2."},{"id":"math-01-039","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"E","q":"For every complex number z, which of these is always a real number?","o":["z − z̄","z + z̄","z²","iz"],"a":1,"x":"For z = x + iy, z + z̄ = 2x is real, while z − z̄ = 2iy is purely imaginary. For z = 1 + i, z² = 2i and iz = −1 + i, neither of which is real."},{"id":"math-01-040","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"M","q":"Which complex number z satisfies z(2 − i) = 3 + 4i?","o":["(2 + 11i)/5","(10 + 11i)/5","(2 + 11i)/3","(2 − 11i)/5"],"a":0,"x":"z = (3 + 4i)/(2 − i) = (3 + 4i)(2 + i)/5 = (6 + 3i + 8i + 4i²)/5 = (2 + 11i)/5. Treating i² as +1 gives (10 + 11i)/5."},{"id":"math-01-041","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"M","q":"What is ((1 + i)/(1 − i))¹⁰¹?","o":["−i","i","1","−1"],"a":1,"x":"(1 + i)/(1 − i) = (1 + i)²/2 = 2i/2 = i. Since 101 = 4 × 25 + 1, i¹⁰¹ = i."},{"id":"math-01-042","unit":"math-01","topic":"math-01-complex","lo":"MATH-1.2","d":"D","q":"Which complex number z satisfies |z| − z = 1 + 2i?","o":["3/2 + 2i","−3/2 − 2i","3/2 − 2i","5/2 − 2i"],"a":2,"x":"Let z = x + iy: √(x² + y²) − x − iy = 1 + 2i, so y = −2 and √(x² + 4) = 1 + x. Squaring: x² + 4 = 1 + 2x + x², x = 3/2. Check: |z| = 5/2 and 5/2 − 3/2 + 2i = 1 + 2i."},{"id":"math-01-043","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"M","q":"Writing complex numbers as ordered pairs, what is (2, 3)·(1, −1)?","o":["(−1, 1)","(2, −3)","(5, −1)","(5, 1)"],"a":3,"x":"(a, b)·(c, d) = (ac − bd, ad + bc) = (2 − (−3), −2 + 3) = (5, 1). Check: (2 + 3i)(1 − i) = 2 − 2i + 3i + 3 = 5 + i."},{"id":"math-01-044","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"E","q":"What is the polar form of 1 + i?","o":["2(cos π/4 + i sin π/4)","√2(cos π/3 + i sin π/3)","√2(cos π/4 + i sin π/4)","√2(cos 3π/4 + i sin 3π/4)"],"a":2,"x":"r = √(1 + 1) = √2 and tan θ = 1 with the point in the first quadrant, so θ = π/4. Using r = x + y = 2 is the common slip."},{"id":"math-01-045","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"M","q":"What is the principal argument of −1 − √3 i (taking −π < θ ≤ π)?","o":["−2π/3","2π/3","π/3","−π/3"],"a":0,"x":"The point (−1, −√3) is in the third quadrant with reference angle tan⁻¹√3 = π/3, so θ = −(π − π/3) = −2π/3. π/3 is the calculator value of tan⁻¹(y/x), which ignores the quadrant."},{"id":"math-01-046","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"M","q":"What is 2(cos 150° + i sin 150°) in the form a + bi?","o":["√3 + i","−√3 + i","−√3 − i","−1 + √3 i"],"a":1,"x":"cos 150° = −√3/2 and sin 150° = 1/2, so the number is 2(−√3/2 + i/2) = −√3 + i. Swapping sine and cosine gives −1 + √3 i."},{"id":"math-01-047","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"D","q":"What is (1 + √3 i)⁶?","o":["−64","64","64i","32"],"a":1,"x":"(1 + √3 i)² = 1 + 2√3 i − 3 = −2 + 2√3 i, and (1 + √3 i)³ = (1 + √3 i)(−2 + 2√3 i) = −2 − 6 = −8. So the sixth power is (−8)² = 64. In polar form: 2⁶(cos 2π + i sin 2π) = 64."},{"id":"math-01-048","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"M","q":"The point z = 3 + 2i is rotated about the origin through 90° anticlockwise in the Argand plane. Which number represents the new point?","o":["2 − 3i","−3 + 2i","−2 + 3i","3 − 2i"],"a":2,"x":"A 90° anticlockwise rotation multiplies by i: i(3 + 2i) = 3i + 2i² = −2 + 3i. Multiplying by −i (clockwise) gives 2 − 3i."},{"id":"math-01-049","unit":"math-01","topic":"math-01-argand","lo":"MATH-1.3","d":"D","q":"Non-zero complex numbers z₁ and z₂ satisfy |z₁ + z₂| = |z₁| + |z₂|. What must be true?","o":["z₁ and z₂ have equal moduli","z₁ = z̄₂","the arguments of z₁ and z₂ differ by π","z₁ and z₂ have the same argument"],"a":3,"x":"By the triangle inequality |z₁ + z₂| ≤ |z₁| + |z₂|, with equality only when the two vectors point the same way from the origin, i.e. equal arguments. Example: 1 + i and 2 + 2i give |3 + 3i| = 3√2 = √2 + 2√2."},{"id":"math-01-050","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"M","q":"What are the square roots of 5 − 12i?","o":["±(3 − 2i)","±(3 + 2i)","±(2 − 3i)","±(√5 − 2√3 i)"],"a":0,"x":"Let (x + iy)² = 5 − 12i: x² − y² = 5, 2xy = −12, and x² + y² = |5 − 12i| = 13. So x² = 9, y² = 4, and xy < 0 gives ±(3 − 2i). Check: (3 − 2i)² = 9 − 12i − 4 = 5 − 12i."},{"id":"math-01-051","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"M","q":"What are the square roots of i?","o":["±(1 − i)/√2","±(1 + i)/2","±(1 + i)/√2","±(1 + i)"],"a":2,"x":"((1 + i)/√2)² = (1 + 2i + i²)/2 = 2i/2 = i. Without the √2, (1 + i)² = 2i, and ((1 + i)/2)² = i/2."},{"id":"math-01-052","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"E","q":"What are the roots of x² − 2x + 5 = 0?","o":["−1 ± 2i","1 ± 4i","1 ± 2i","2 ± i"],"a":2,"x":"x = (2 ± √(4 − 20))/2 = (2 ± √(−16))/2 = (2 ± 4i)/2 = 1 ± 2i. Check: sum 2, product 1 + 4 = 5."},{"id":"math-01-053","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"M","q":"What are the roots of 2x² + 3x + 2 = 0?","o":["(−3 ± √7 i)/4","(3 ± √7 i)/4","(−3 ± √7 i)/2","(−3 ± √7)/4"],"a":0,"x":"Discriminant = 9 − 16 = −7, so x = (−3 ± √7 i)/(2 × 2) = (−3 ± √7 i)/4. Dividing by a instead of 2a gives the /2 option."},{"id":"math-01-054","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"D","q":"What are the roots of z² − 3z + (3 − i) = 0?","o":["2 − i and 1 + i","2 + i and 1 − i","2 + i and 1 + i","−2 − i and −1 + i"],"a":1,"x":"Discriminant = 9 − 4(3 − i) = −3 + 4i = (1 + 2i)². So z = (3 ± (1 + 2i))/2 = 2 + i or 1 − i. Check: sum 3, product (2 + i)(1 − i) = 3 − i."},{"id":"math-01-055","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"M","q":"Which cubic equation with real coefficients has 2 and i among its roots?","o":["x³ + 2x² + x + 2 = 0","x³ − 2x² + x − 2 = 0","x³ − 2x² − x + 2 = 0","x³ − (2 + i)x² + 2ix = 0"],"a":1,"x":"Real coefficients force −i to be a root as well, so the cubic is (x − 2)(x² + 1) = x³ − 2x² + x − 2. The last option has non-real coefficients, and x³ − 2x² − x + 2 = (x − 2)(x² − 1)."},{"id":"math-01-056","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"D","q":"One root of x³ − 4x² + 6x − 4 = 0 is 1 + i. What are the other two roots?","o":["1 − i and 2","1 − i and −2","−1 − i and 2","1 − i and 4"],"a":0,"x":"Real coefficients give the root 1 − i, and (x − 1 − i)(x − 1 + i) = x² − 2x + 2. Dividing: x³ − 4x² + 6x − 4 = (x² − 2x + 2)(x − 2), so the third root is 2. Check: sum of roots 2 + 2 = 4."},{"id":"math-01-057","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"M","q":"What are all the roots of x⁴ + 3x² − 4 = 0?","o":["±1, ±2","±i, ±2","±i, ±2i","±1, ±2i"],"a":3,"x":"Put y = x²: y² + 3y − 4 = 0, so y = 1 or y = −4. Then x = ±1 or x = ±2i. Taking y = −1 and 4 (sign slip) gives ±i, ±2."},{"id":"math-01-058","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"M","q":"What are the roots of z² + 4iz − 5 = 0?","o":["1 + 2i and −1 + 2i","1 − 2i and −1 − 2i","2 − i and −2 − i","1 − 2i and 1 + 2i"],"a":1,"x":"Discriminant = (4i)² + 20 = −16 + 20 = 4, so z = (−4i ± 2)/2 = ±1 − 2i. The roots are not conjugates because a coefficient is not real. Check: sum −4i, product (1 − 2i)(−1 − 2i) = −1 − 4 = −5."},{"id":"math-01-059","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"D","q":"The equation x² + kx + 4 = 0, where k is real, has non-real roots α and β. What is |α|?","o":["4","2","√2","|k|/2"],"a":1,"x":"Non-real roots of a real quadratic are conjugates, so αβ = α·ᾱ = |α|² = 4 and |α| = 2 whatever k is (−4 < k < 4). For k = 0 the roots are ±2i, modulus 2."},{"id":"math-01-060","unit":"math-01","topic":"math-01-roots","lo":"MATH-1.4","d":"E","q":"Over the complex numbers, how does a² + 4b² factorise (a, b real)?","o":["(a + 2b)(a − 2b)","(a + 2bi)(a − 2bi)","(a + 2bi)²","(a + 4bi)(a − bi)"],"a":1,"x":"(a + 2bi)(a − 2bi) = a² − (2bi)² = a² − 4b²i² = a² + 4b². (a + 2b)(a − 2b) gives a² − 4b²."},{"id":"math-02-001","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"E","q":"Let A = {1, 2, 3, 4} and B = {3, 4, 5, 6}. What is A ∩ B?","o":["{1, 2}","{5, 6}","{3, 4}","{1, 2, 3, 4, 5, 6}"],"a":2,"x":"A ∩ B contains only the elements that belong to both sets, namely 3 and 4. {1, 2, 3, 4, 5, 6} is the union A ∪ B, not the intersection."},{"id":"math-02-002","unit":"math-02","topic":"math-02-logic","lo":"MATH-2.2","d":"E","q":"What is the negation of the proposition “∀x ∈ R, x² ≥ 0”?","o":["∀x ∈ R, x² < 0","∃x ∈ R, x² ≥ 0","∀x ∈ R, x² ≤ 0","∃x ∈ R, x² < 0"],"a":3,"x":"To negate a universal statement, change ∀ to ∃ and negate the conclusion: “∃x ∈ R, x² < 0”. “∀x ∈ R, x² < 0” negates only the conclusion and keeps the wrong quantifier."},{"id":"math-02-003","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"E","q":"The universal set is U = {1, 2, 3, 4, 5, 6, 7, 8} and A = {2, 4, 6, 8}. What is the complement of A in U?","o":["{1, 3, 5, 7}","{1, 3, 5}","{2, 4, 6, 8}","{1, 3, 5, 7, 9}"],"a":0,"x":"The complement consists of the elements of U that are not in A: 1, 3, 5 and 7. The option containing 9 is wrong because 9 is not an element of U, and {1, 3, 5} leaves out 7."},{"id":"math-02-004","unit":"math-02","topic":"math-02-logic","lo":"MATH-2.2","d":"M","q":"What is the negation of the proposition “∃x > 0, x² − x + 1 ≤ 0”?","o":["∃x > 0, x² − x + 1 > 0","∀x > 0, x² − x + 1 > 0","∀x ≤ 0, x² − x + 1 > 0","∃x ≤ 0, x² − x + 1 > 0"],"a":1,"x":"Change ∃ to ∀, keep the range x > 0, and negate ≤ 0 to > 0: “∀x > 0, x² − x + 1 > 0”. The condition x > 0 describes which x are considered and is not negated, so the options with x ≤ 0 are wrong."},{"id":"math-02-005","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"E","q":"How many subsets does the set {a, b, c} have?","o":["6","8","7","9"],"a":1,"x":"A set with n elements has 2ⁿ subsets, so {a, b, c} has 2³ = 8 subsets, including ∅ and the set itself. The answer 7 counts only the proper subsets (or only the non-empty ones)."},{"id":"math-02-006","unit":"math-02","topic":"math-02-logic","lo":"MATH-2.2","d":"M","q":"Which of the following propositions is true?","o":["∀x ∈ R, x² > 0","∀x ∈ R, x² + 2x + 2 > 0","∃x ∈ R, x² + 1 = 0","∃x ∈ Z, 2x = 3"],"a":1,"x":"x² + 2x + 2 = (x + 1)² + 1 ≥ 1 > 0 for every real x, so this statement is true. x² > 0 fails at x = 0, x² + 1 = 0 has no real root, and 2x = 3 gives x = 1.5, which is not an integer."},{"id":"math-02-007","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"M","q":"Let A = {x ∈ Z | −2 < x ≤ 2}. How many proper subsets does A have?","o":["14","16","31","15"],"a":3,"x":"A = {−1, 0, 1, 2} has 4 elements, so it has 2⁴ = 16 subsets and 16 − 1 = 15 proper subsets (every subset except A itself). The value 14 wrongly removes ∅ as well; ∅ is a proper subset of any non-empty set."},{"id":"math-02-008","unit":"math-02","topic":"math-02-logic","lo":"MATH-2.2","d":"E","q":"What is the negation of the proposition “∃x ∈ R, x² − 2x + 3 < 0”?","o":["∀x ∈ R, x² − 2x + 3 < 0","∃x ∈ R, x² − 2x + 3 ≥ 0","∃x ∈ R, x² − 2x + 3 > 0","∀x ∈ R, x² − 2x + 3 ≥ 0"],"a":3,"x":"Change ∃ to ∀ and negate < 0 to ≥ 0: “∀x ∈ R, x² − 2x + 3 ≥ 0”. Keeping ∃ and negating only the inequality gives a statement that can be true at the same time as the original, so it is not the negation."},{"id":"math-02-009","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"E","q":"Which of the following statements is correct?","o":["0 ∈ ∅","{0} = ∅","∅ ⊆ {0}","0 ⊆ {0}"],"a":2,"x":"The empty set is a subset of every set, so ∅ ⊆ {0} is true. {0} is not empty because it contains the element 0, ∅ has no elements, and 0 ⊆ {0} misuses ⊆: an element belongs to a set (0 ∈ {0}), it is not a subset of it."},{"id":"math-02-010","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"M","q":"Let A = {x | −1 < x < 3} and B = {x | x ≥ 2}. What is A ∪ B?","o":["{x | x > −1}","{x | 2 ≤ x < 3}","{x | x ≥ −1}","{x | −1 < x ≤ 2}"],"a":0,"x":"Together the intervals (−1, 3) and [2, +∞) overlap and cover every x greater than −1, so A ∪ B = {x | x > −1}. {x | 2 ≤ x < 3} is the intersection, and x = −1 is in neither set, so ≥ −1 is wrong."},{"id":"math-02-011","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"M","q":"Let A = {x | x² − 3x − 4 < 0} and B = {x | x > 2}. What is A ∩ B?","o":["{x | −1 < x < 2}","{x | x > −1}","{x | −4 < x < 1}","{x | 2 < x < 4}"],"a":3,"x":"x² − 3x − 4 = (x − 4)(x + 1) < 0 gives A = {x | −1 < x < 4}. Intersecting with x > 2 gives 2 < x < 4. The interval −4 < x < 1 comes from factorising with the wrong signs, as (x + 4)(x − 1)."},{"id":"math-02-012","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"M","q":"The universal set is R. Let A = {x | x ≥ 1} and B = {x | −1 < x < 3}. What is (∁A) ∩ B, where ∁A is the complement of A in R?","o":["{x | −1 < x ≤ 1}","{x | 1 ≤ x < 3}","{x | −1 < x < 1}","{x | x < 3}"],"a":2,"x":"∁A = {x | x < 1}, and intersecting with −1 < x < 3 gives −1 < x < 1. The endpoint 1 belongs to A, so it is not in ∁A; that rules out −1 < x ≤ 1."},{"id":"math-02-013","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"D","q":"Let A = {1, 3, a} and B = {1, a²}, where B ⊆ A. How many different real values can a take?","o":["1","2","3","4"],"a":2,"x":"B ⊆ A needs a² = 3 or a² = a. a² = 3 gives a = ±√3; a² = a gives a = 0 or a = 1, but a = 1 makes A = {1, 3, 1} with a repeated element, so it is rejected. The possible values are 0, √3 and −√3, three in all; counting a = 1 gives the wrong answer 4."},{"id":"math-02-014","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"E","q":"In a group of 50 students, 25 study French, 20 study Arabic and 8 study both languages. How many students study neither language?","o":["5","8","21","13"],"a":3,"x":"The number studying at least one language is 25 + 20 − 8 = 37, so 50 − 37 = 13 study neither. The answer 5 comes from 50 − 45, which counts the 8 students who study both twice."},{"id":"math-02-015","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"M","q":"In a class of 60 students, 35 play football, 28 play cricket and 10 play neither sport. How many play both sports?","o":["3","13","10","23"],"a":1,"x":"60 − 10 = 50 students play at least one sport, so both = 35 + 28 − 50 = 13. The answer 3 comes from 35 + 28 − 60, which forgets to remove the 10 students who play neither."},{"id":"math-02-016","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"M","q":"Let A = {x | x ≤ a} and B = {x | 1 < x < 3}. If A ∪ B = A, what is the range of a?","o":["a > 3","a ≤ 1","a ≥ 3","a ≥ 1"],"a":2,"x":"A ∪ B = A means B ⊆ A, so every x in (1, 3) must satisfy x ≤ a, which needs a ≥ 3. a = 3 is allowed because 3 itself is not in B, so a > 3 is too strict."},{"id":"math-02-017","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"D","q":"Let A = {x | 2 ≤ x ≤ 5} and B = {x | m + 1 ≤ x ≤ 2m − 1}. If B ⊆ A, what is the range of the real number m?","o":["2 ≤ m ≤ 3","m ≤ 3","1 ≤ m ≤ 3","m < 2"],"a":1,"x":"If B = ∅ (m + 1 > 2m − 1, i.e. m < 2) then B ⊆ A automatically. If B ≠ ∅ (m ≥ 2) we need m + 1 ≥ 2 and 2m − 1 ≤ 5, giving 2 ≤ m ≤ 3. Combining the cases gives m ≤ 3; the answer 2 ≤ m ≤ 3 forgets the empty-set case."},{"id":"math-02-018","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"E","q":"Which of the following sets is the empty set?","o":["{0}","{x ∈ R | x² = 0}","{x ∈ R | x² + 1 = 0}","{x ∈ R | x² − 1 = 0}"],"a":2,"x":"x² + 1 ≥ 1 for every real x, so x² + 1 = 0 has no real solution and the set is empty. {0} and {x | x² = 0} both contain the element 0, so they are not empty."},{"id":"math-02-019","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"M","q":"Let M = {(x, y) | x + y = 3} and N = {(x, y) | x − y = 1}. What is M ∩ N?","o":["{(2, 1)}","{(1, 2)}","{2, 1}","{x = 2, y = 1}"],"a":0,"x":"M and N are sets of points, so their intersection is the set of common points. Solving x + y = 3 and x − y = 1 gives x = 2, y = 1, so M ∩ N = {(2, 1)}. {2, 1} is a set of two numbers, not a point."},{"id":"math-02-020","unit":"math-02","topic":"math-02-sets","lo":"MATH-2.1","d":"E","q":"Let A = {x | x > 1}. Which of the following is correct?","o":["0 ∈ A","{2} ∈ A","1 ∈ A","{2} ⊆ A"],"a":3,"x":"2 > 1, so 2 ∈ A and the set {2} is a subset of A. {2} ∈ A is wrong because the elements of A are numbers, not sets; 0 and 1 do not satisfy x > 1."},{"id":"math-02-021","unit":"math-02","topic":"math-02-logic","lo":"MATH-2.2","d":"M","q":"For which truth values of p and q is the statement ~p → q false?","o":["p false and q false","p true and q false","p true and q true","p false and q true"],"a":0,"x":"A conditional is false only when its hypothesis is true and its conclusion false. So ~p must be true (p false) and q false. In every other row ~p → q is true."},{"id":"math-02-022","unit":"math-02","topic":"math-02-logic","lo":"MATH-2.2","d":"M","q":"Which statement is logically equivalent to p → q?","o":["~p ∨ q","p ∨ ~q","~p ∧ q","q → p"],"a":0,"x":"p → q is false only when p is true and q false; ~p ∨ q is false in exactly the same row, so they agree in all four rows. q → p is the converse, which differs when p is false and q true."},{"id":"math-02-023","unit":"math-02","topic":"math-02-logic","lo":"MATH-2.2","d":"D","q":"Which of these statements is a tautology?","o":["[(p → q) ∧ q] → p","[(p → q) ∧ ~p] → ~q","(p → q) → (q → p)","[(p → q) ∧ p] → q"],"a":3,"x":"For [(p → q) ∧ p] → q to be false we need p true, p → q true and q false, which is impossible, so it is always true. The others fail at p false, q true: e.g. (p → q) ∧ q is then true while p is false."},{"id":"math-02-024","unit":"math-02","topic":"math-02-logic","lo":"MATH-2.2","d":"E","q":"What is the contrapositive of “If a triangle is equilateral, then it is isosceles”?","o":["If a triangle is isosceles, then it is equilateral.","If a triangle is not isosceles, then it is not equilateral.","If a triangle is not equilateral, then it is not isosceles.","A triangle is equilateral and not isosceles."],"a":1,"x":"The contrapositive of p → q is ~q → ~p: negate both parts and swap them. Swapping only gives the converse; negating only gives the inverse."},{"id":"math-02-025","unit":"math-02","topic":"math-02-relations","lo":"MATH-2.3","d":"M","q":"A = {1, 2} and B = {a, b, c}. How many different relations from A to B are there?","o":["6","64","32","9"],"a":1,"x":"A relation from A to B is any subset of A × B, which has 2 × 3 = 6 elements. So there are 2⁶ = 64 relations. 6 counts only the ordered pairs."},{"id":"math-02-026","unit":"math-02","topic":"math-02-relations","lo":"MATH-2.3","d":"E","q":"Let A = {1, 2, 3}. Which of these relations is a function from A to A?","o":["{(1, 2), (2, 2), (3, 1)}","{(1, 1), (1, 2), (3, 3)}","{(1, 3), (2, 1)}","{(2, 1), (3, 2), (2, 3)}"],"a":0,"x":"A function from A must pair every element of A with exactly one image. {(1, 2), (2, 2), (3, 1)} does; two images may be equal. The others give 1 or 2 two images, or leave 3 without an image."},{"id":"math-02-027","unit":"math-02","topic":"math-02-relations","lo":"MATH-2.3","d":"M","q":"What is the inverse of the function f(x) = (2x + 3)/5?","o":["f⁻¹(x) = (5x − 3)/2","f⁻¹(x) = (5x + 3)/2","f⁻¹(x) = 5/(2x + 3)","f⁻¹(x) = (2x − 3)/5"],"a":0,"x":"Put y = (2x + 3)/5: 5y = 2x + 3, x = (5y − 3)/2, so f⁻¹(x) = (5x − 3)/2. Check: f(f⁻¹(x)) = (5x − 3 + 3)/5 = x. 5/(2x + 3) is the reciprocal, not the inverse."},{"id":"math-02-028","unit":"math-02","topic":"math-02-relations","lo":"MATH-2.3","d":"M","q":"The function f: R → R is defined by f(x) = x². Which statement is true?","o":["f is one-one but not onto","f is onto but not one-one","f is neither one-one nor onto","f is one-one and onto"],"a":2,"x":"f(2) = f(−2) = 4, so f is not one-one; and no real x gives f(x) = −1, so f is not onto R. It would be a bijection only on a restricted domain and codomain such as [0, ∞)."},{"id":"math-02-029","unit":"math-02","topic":"math-02-relations","lo":"MATH-2.3","d":"M","q":"A set A has 3 elements and a set B has 5 elements. How many one-one functions from A to B are there?","o":["125","60","10","15"],"a":1,"x":"The first element of A has 5 possible images, the second 4 and the third 3, so there are 5 × 4 × 3 = 60 one-one functions. 5³ = 125 counts all functions."},{"id":"math-02-030","unit":"math-02","topic":"math-02-relations","lo":"MATH-2.3","d":"D","q":"How many functions from A = {1, 2, 3} onto B = {p, q} are there?","o":["8","2","6","3"],"a":2,"x":"There are 2³ = 8 functions from A to B. Only the 2 constant functions miss an element of B, so 8 − 2 = 6 are onto. Check: choose which single element goes alone to one image: 3 ways × 2 = 6."},{"id":"math-02-031","unit":"math-02","topic":"math-02-relations","lo":"MATH-2.3","d":"M","q":"R = {(x, y) | y = x + 1, x ∈ {1, 2, 3}}. What is the domain of the inverse relation R⁻¹?","o":["{1, 2, 3}","{1, 2, 3, 4}","{3, 4, 5}","{2, 3, 4}"],"a":3,"x":"R = {(1, 2), (2, 3), (3, 4)}, so R⁻¹ = {(2, 1), (3, 2), (4, 3)}. The domain of R⁻¹ is the range of R: {2, 3, 4}. {1, 2, 3} is the range of R⁻¹."},{"id":"math-02-032","unit":"math-02","topic":"math-02-relations","lo":"MATH-2.3","d":"D","q":"A function f(x) = mx + c satisfies f(1) = 5 and f⁻¹(11) = 3. What is f(x)?","o":["2x + 3","3x − 2","6x − 1","3x + 2"],"a":3,"x":"f⁻¹(11) = 3 means f(3) = 11. Then m + c = 5 and 3m + c = 11, so m = 3, c = 2 and f(x) = 3x + 2. Reading f⁻¹(11) = 3 as f(11) = 3 is the common slip."},{"id":"math-02-033","unit":"math-02","topic":"math-02-groups","lo":"MATH-2.4","d":"E","q":"Which of these sets is a group under ordinary addition?","o":["the set Z of all integers","the set N of natural numbers","the set of odd integers","the set {0, 1}"],"a":0,"x":"Z is closed, associative, has identity 0, and every n has inverse −n. N has no additive inverses, odd + odd is even, and 1 + 1 = 2 is not in {0, 1}."},{"id":"math-02-034","unit":"math-02","topic":"math-02-groups","lo":"MATH-2.4","d":"M","q":"Which of these sets is a group under ordinary multiplication?","o":["{1, i}","{1, −1, i, −i}","{−1, 0, 1}","{1, 2, 3}"],"a":1,"x":"{1, −1, i, −i} is closed (e.g. i × i = −1), has identity 1, and the inverses of i and −i are −i and i. In {1, i}, i² = −1 is missing; 0 has no inverse; 2 × 3 = 6 is not in {1, 2, 3}."},{"id":"math-02-035","unit":"math-02","topic":"math-02-groups","lo":"MATH-2.4","d":"M","q":"On the set Z the binary operation * is defined by a * b = a + b − 3. What is the identity element?","o":["3","0","−3","1"],"a":0,"x":"We need a * e = a + e − 3 = a for every a, so e = 3. Check: 7 * 3 = 7 + 3 − 3 = 7. 0 is the identity of ordinary addition, not of *."},{"id":"math-02-036","unit":"math-02","topic":"math-02-groups","lo":"MATH-2.4","d":"D","q":"On the non-zero rational numbers the operation * is defined by a * b = ab/2. What is the inverse of 4?","o":["1/4","2","1","1/2"],"a":2,"x":"Identity: a * e = ae/2 = a gives e = 2. Inverse of 4: 4b/2 = 2, so b = 1. Check: 4 * 1 = 4/2 = 2 = e. 1/4 is the inverse under ordinary multiplication."},{"id":"math-02-037","unit":"math-02","topic":"math-02-groups","lo":"MATH-2.4","d":"M","q":"On the set Z the operation * is defined by a * b = a − b. Which statement is true?","o":["* is closed but not commutative","* is commutative but not closed","* is associative and has identity 0","Z is a group under *"],"a":0,"x":"The difference of integers is an integer, so * is closed. But 5 − 2 ≠ 2 − 5, so it is not commutative, and (5 − 2) − 1 ≠ 5 − (2 − 1), so not associative and not a group."},{"id":"math-02-038","unit":"math-02","topic":"math-02-groups","lo":"MATH-2.4","d":"M","q":"Under multiplication, {1, ω, ω²} is a group, where ω is a complex cube root of unity. What is the inverse of ω?","o":["ω","ω²","1","−ω"],"a":1,"x":"The identity is 1, and ω × ω² = ω³ = 1, so ω⁻¹ = ω². Check: ω² is in the set, as a group needs."},{"id":"math-02-039","unit":"math-02","topic":"math-02-groups","lo":"MATH-2.4","d":"M","q":"Why is the set R of real numbers not a group under multiplication?","o":["multiplication is not associative","there is no identity element","0 has no multiplicative inverse","R is not closed under multiplication"],"a":2,"x":"R is closed and associative under multiplication with identity 1, but 0 × x = 0 ≠ 1 for every x, so 0 has no inverse. Removing 0 gives the group R \\ {0}."},{"id":"math-02-040","unit":"math-02","topic":"math-02-groups","lo":"MATH-2.4","d":"D","q":"On R \\ {−1} the operation * is defined by a * b = a + b + ab. What is the inverse of 2?","o":["−2","1/2","−1/3","−2/3"],"a":3,"x":"Identity: a + e + ae = a gives e(1 + a) = 0, so e = 0. Inverse of 2: 2 + b + 2b = 0, so b = −2/3. Check: 2 − 2/3 − 4/3 = 0. −2 is the inverse under ordinary addition."},{"id":"math-03-001","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"E","q":"What is the domain of f(x) = √(x − 2) + 1/(x − 5)?","o":["(2, 5) ∪ (5, +∞)","[2, 5) ∪ (5, +∞)","[2, +∞)","[2, 5)"],"a":1,"x":"The square root needs x − 2 ≥ 0, so x ≥ 2, and the fraction needs x − 5 ≠ 0, so x ≠ 5. Together the domain is [2, 5) ∪ (5, +∞). The option (2, 5) ∪ (5, +∞) wrongly drops x = 2, where √0 = 0 is perfectly defined."},{"id":"math-03-002","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"M","q":"If f(x + 1) = x² + 3x for all real x, then f(x) = ?","o":["x² + 5x + 4","x² + x","x² − x − 2","x² + x − 2"],"a":3,"x":"Let t = x + 1, so x = t − 1. Then f(t) = (t − 1)² + 3(t − 1) = t² − 2t + 1 + 3t − 3 = t² + t − 2, so f(x) = x² + x − 2. The option x² + 5x + 4 comes from substituting x + 1 instead of x − 1."},{"id":"math-03-003","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"E","q":"What is the range of y = 2ˣ + 1?","o":["(0, +∞)","[1, +∞)","(1, +∞)","(2, +∞)"],"a":2,"x":"For every real x, 2ˣ > 0 and it takes every positive value, so 2ˣ + 1 > 1. The range is (1, +∞). The value 1 is never reached because 2ˣ is never 0, so [1, +∞) is wrong."},{"id":"math-03-004","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"D","q":"What is the range of f(x) = 4ˣ − 2ˣ⁺¹ + 3 for x ∈ [0, 2]?","o":["[2, 3]","[2, 11]","[3, 11]","[3, 19]"],"a":1,"x":"Let t = 2ˣ; for x ∈ [0, 2], t ∈ [1, 4], and f = t² − 2t + 3 = (t − 1)² + 2. On [1, 4] this increases from 2 (at t = 1) to 16 − 8 + 3 = 11 (at t = 4). The range is [2, 11]. Writing 2ˣ⁺¹ as 2ˣ + 1 instead of 2·2ˣ leads to wrong ranges such as [3, 19]."},{"id":"math-03-005","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"M","q":"What is the domain of f(x) = log₂(x² − 3x − 4)?","o":["(−∞, −1) ∪ (4, +∞)","(−1, 4)","(−4, 1)","(−∞, −4) ∪ (1, +∞)"],"a":0,"x":"The argument of a logarithm must be positive: x² − 3x − 4 = (x − 4)(x + 1) > 0. A product of two factors is positive outside the roots, so x < −1 or x > 4. The interval (−1, 4) is where the quadratic is negative, which is exactly where the logarithm is undefined."},{"id":"math-03-006","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"E","q":"Let f(x) = 2x + 1 and g(x) = x² − 1. What is the value of f(g(2))?","o":["7","5","9","24"],"a":0,"x":"Work from the inside: g(2) = 4 − 1 = 3, then f(3) = 2·3 + 1 = 7. The value 24 is g(f(2)) = g(5), which applies the functions in the wrong order."},{"id":"math-03-007","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"E","q":"Which of these four functions increases on the interval (0, +∞)?","o":["y = −x²","y = 1/x","y = (1/2)ˣ","y = log₂x"],"a":3,"x":"A logarithm with base greater than 1 is increasing on its whole domain, so log₂x increases on (0, +∞). −x² and 1/x decrease for x > 0, and (1/2)ˣ decreases because its base lies between 0 and 1."},{"id":"math-03-008","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"D","q":"On which interval is f(x) = log₀.₅(x² − 4x + 3) increasing? (The base of the logarithm is 0.5.)","o":["(−∞, 1)","(−∞, 2)","(3, +∞)","(2, +∞)"],"a":0,"x":"The domain needs x² − 4x + 3 = (x − 1)(x − 3) > 0, so x < 1 or x > 3. The outer logarithm with base 0.5 is decreasing, so f increases where the inner quadratic decreases, which within the domain is (−∞, 1). The answer (−∞, 2) ignores the domain, and (3, +∞) is where f decreases."},{"id":"math-03-009","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"E","q":"Given f(x) = x² − 2x, what is the value of f(−3)?","o":["−3","3","15","9"],"a":2,"x":"Substitute x = −3: f(−3) = (−3)² − 2(−3) = 9 + 6 = 15. Getting 3 comes from treating −2(−3) as −6; the product of two negatives is positive."},{"id":"math-03-010","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"E","q":"Let f(x) = 3x − 2 and g(x) = x². Which expression equals g(f(x))?","o":["3x² − 2","9x² + 4","3x² − 12x + 4","9x² − 12x + 4"],"a":3,"x":"g(f(x)) squares the output of f: (3x − 2)² = 9x² − 12x + 4. The option 3x² − 2 is f(g(x)), the composition in the other order, and 9x² + 4 forgets the middle term of the square."},{"id":"math-03-011","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"E","q":"How can the graph of y = 2ˣ⁺¹ − 3 be obtained from the graph of y = 2ˣ?","o":["shift right 1 unit, then down 3 units","shift left 1 unit, then up 3 units","shift left 1 unit, then down 3 units","shift right 1 unit, then up 3 units"],"a":2,"x":"Replacing x by x + 1 shifts a graph 1 unit to the left, and subtracting 3 from the whole function shifts it 3 units down. A common mistake is to read x + 1 as a shift to the right."},{"id":"math-03-012","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"E","q":"What is the value of 8^(2/3) × 4^(−1/2)?","o":["4","2","8","16"],"a":1,"x":"8^(2/3) = (∛8)² = 2² = 4 and 4^(−1/2) = 1/√4 = 1/2, so the product is 4 × 1/2 = 2. Reading the negative exponent as positive gives 4 × 2 = 8."},{"id":"math-03-013","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"M","q":"In which pair do f and g represent the same function?","o":["f(x) = |x| and g(x) = √(x²)","f(x) = x and g(x) = √(x²)","f(x) = x and g(x) = x²/x","f(x) = log₂(x²) and g(x) = 2log₂x"],"a":0,"x":"Two functions are equal when they have the same domain and the same rule. √(x²) = |x| for every real x, so |x| and √(x²) are the same function. x²/x is undefined at x = 0, 2log₂x needs x > 0 while log₂(x²) only needs x ≠ 0, and √(x²) equals −x for negative x, so those pairs differ."},{"id":"math-03-014","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"M","q":"Let f(x) = 1/(1 − x). What is the value of f(f(f(3)))?","o":["−1/2","2/3","1/3","3"],"a":3,"x":"f(3) = 1/(1 − 3) = −1/2; f(−1/2) = 1/(3/2) = 2/3; f(2/3) = 1/(1/3) = 3. In fact f(f(f(x))) = x for this function, so three applications return the starting value. Stopping after one or two steps gives −1/2 or 2/3."},{"id":"math-03-015","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"M","q":"The graph of y = f(x) is reflected in the y-axis and then shifted 2 units to the right. Which equation describes the new graph?","o":["y = f(−x − 2)","y = f(2 − x)","y = −f(x − 2)","y = f(x + 2)"],"a":1,"x":"Reflecting in the y-axis gives y = f(−x). Shifting right by 2 replaces x by x − 2, so y = f(−(x − 2)) = f(2 − x). The option f(−x − 2) replaces x by x + 2 inside f(−x), which is a shift to the left."},{"id":"math-03-016","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"M","q":"What is the value of log₂24 − log₂3 + log₃9?","o":["2","3","4","5"],"a":3,"x":"log₂24 − log₂3 = log₂(24/3) = log₂8 = 3, and log₃9 = 2, so the total is 5. Stopping at 3 forgets the last term; log₂24 − log₂3 is not log₂21."},{"id":"math-03-017","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"M","q":"What is the range of y = (2x + 1)/(x − 1)?","o":["{y | y ≠ 1}","{y | y ≠ 2}","{y | y ≠ −1/2}","{y | y ≠ 3}"],"a":1,"x":"Rewrite y = (2(x − 1) + 3)/(x − 1) = 2 + 3/(x − 1). Since 3/(x − 1) can be any real number except 0, y can be anything except 2. The value 1 is the excluded x-value of the domain, not of the range."},{"id":"math-03-018","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"E","q":"What is the inverse function of f(x) = 2x + 3?","o":["f⁻¹(x) = (x + 3)/2","f⁻¹(x) = 2x − 3","f⁻¹(x) = (x − 3)/2","f⁻¹(x) = x/2 − 3"],"a":2,"x":"Write y = 2x + 3 and solve for x: x = (y − 3)/2, then swap the letters to get f⁻¹(x) = (x − 3)/2. The option x/2 − 3 undoes the steps in the wrong order: it halves before subtracting 3."},{"id":"math-03-019","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"D","q":"How many zeros does f(x) = 2ˣ − x² have?","o":["1","3","2","4"],"a":1,"x":"Checking gives f(2) = 4 − 4 = 0 and f(4) = 16 − 16 = 0. For x < 0, f(−1) = 1/2 − 1 < 0 and f(0) = 1 > 0, so there is a third zero in (−1, 0). For large x, 2ˣ grows faster than x², so there are exactly 3 zeros; answering 2 misses the negative zero."},{"id":"math-03-020","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"M","q":"What is the value of log₁₀25 + log₁₀4 − (1/2)⁻²?","o":["0","2","−2","6"],"a":2,"x":"log₁₀25 + log₁₀4 = log₁₀100 = 2, and (1/2)⁻² = 2² = 4, so the value is 2 − 4 = −2. Taking (1/2)⁻² as 1/4 or as −4 leads to other values; a negative exponent means the reciprocal, not a negative number."},{"id":"math-03-021","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"E","q":"Which of the following functions is odd?","o":["y = x² + 1","y = |x|","y = 2ˣ","y = x³ − x"],"a":3,"x":"For f(x) = x³ − x, f(−x) = −x³ + x = −f(x), and the domain ℝ is symmetric, so it is odd. x² + 1 and |x| are even, and 2ˣ is neither, because 2⁻ˣ is neither 2ˣ nor −2ˣ."},{"id":"math-03-022","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"M","q":"What is the inverse function of y = 2ˣ⁻¹ (x ∈ ℝ)?","o":["y = log₂x − 1 (x > 0)","y = log₂(x − 1) (x > 1)","y = 1 + log₂x (x > 0)","y = log₂(x + 1) (x > −1)"],"a":2,"x":"From y = 2ˣ⁻¹ we get x − 1 = log₂y, so x = 1 + log₂y with y > 0. Swapping the letters gives y = 1 + log₂x for x > 0, the range of the original function. log₂x − 1 has the sign of the shift reversed."},{"id":"math-03-023","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"E","q":"How is the graph of y = log₂(2x) related to the graph of y = log₂x?","o":["shifted left 1 unit","stretched vertically by a factor of 2","shifted right 2 units","shifted up 1 unit"],"a":3,"x":"log₂(2x) = log₂2 + log₂x = 1 + log₂x, so the graph is the graph of log₂x shifted up 1 unit. A vertical stretch by 2 would be 2log₂x = log₂(x²), a different function."},{"id":"math-03-024","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"E","q":"What is the value of log₂3 × log₃4 × log₄8?","o":["1","3","6","24"],"a":1,"x":"By the change-of-base formula, logₐb × log_b c = logₐc, so the product chains to log₂8 = 3. Multiplying the arguments 3 × 4 × 8 = 96 or adding the logs does not follow any logarithm law."},{"id":"math-03-025","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"M","q":"f(x) is an odd function defined on ℝ, and f(x) = x² − 2x for x > 0. What is the value of f(−3)?","o":["−15","3","−3","15"],"a":2,"x":"Because f is odd, f(−3) = −f(3) = −(9 − 6) = −3. Putting −3 straight into the formula gives 9 + 6 = 15, but that formula only holds for x > 0."},{"id":"math-03-026","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"E","q":"The function g is the inverse of f(x) = log₃x. What is the value of g(2)?","o":["log₃2","6","8","9"],"a":3,"x":"The inverse of log₃x is g(x) = 3ˣ, so g(2) = 3² = 9. log₃2 is f(2), the value of the original function, not of its inverse."},{"id":"math-03-027","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"D","q":"For which values of k does the equation |x² − 2x − 3| = k have exactly 4 real solutions?","o":["k = 4","0 < k < 4","k > 4","0 < k < 3"],"a":1,"x":"x² − 2x − 3 = (x − 1)² − 4 has minimum −4 at x = 1 and zeros at −1 and 3. Taking the absolute value reflects the part between −1 and 3 upwards, making a local peak of height 4 at x = 1. A horizontal line y = k meets this graph 4 times exactly when 0 < k < 4; at k = 4 there are 3 solutions, and for k > 4 only 2."},{"id":"math-03-028","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"D","q":"Given log₂3 = a and log₃5 = b, which expression equals log₁₅20?","o":["(2 + ab)/(a + ab)","(2 + b)/(1 + b)","(2 + ab)/(1 + ab)","(2a + b)/(a + b)"],"a":0,"x":"Change to base 2: log₂5 = log₂3 × log₃5 = ab. Then log₂20 = 2 + log₂5 = 2 + ab and log₂15 = log₂3 + log₂5 = a + ab, so log₁₅20 = (2 + ab)/(a + ab). Writing log₂15 as 1 + ab treats log₂3 as 1."},{"id":"math-03-029","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"M","q":"The function f(x) = x² + (b − 2)x + 1, defined on the interval [a, 3a + 4], is an even function. What is the value of a + b?","o":["−1","0","1","3"],"a":2,"x":"An even function needs a domain symmetric about 0: a + (3a + 4) = 0, so a = −1. It also needs no odd-power term, so b − 2 = 0 and b = 2. Hence a + b = 1. Forgetting the domain condition and using only b = 2 does not give the sum."},{"id":"math-03-030","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"M","q":"Let f(x) = log₂(x + a). The graph of the inverse function of f passes through the point (2, 1). What is the value of a?","o":["3","0","1","7"],"a":0,"x":"If (2, 1) lies on the graph of f⁻¹, then (1, 2) lies on the graph of f, so log₂(1 + a) = 2, giving 1 + a = 4 and a = 3. Putting (2, 1) straight into f gives log₂(2 + a) = 1 and a = 0, which forgets to swap the coordinates."},{"id":"math-03-031","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"M","q":"Let f(x) = x² + 2x − 3 for x ≤ 0 and f(x) = ln x − 2 for x > 0. How many zeros does f have?","o":["0","2","1","3"],"a":1,"x":"For x ≤ 0: x² + 2x − 3 = (x + 3)(x − 1) = 0 gives x = −3 (x = 1 is outside this piece). For x > 0: ln x = 2 gives x = e², which is valid. So f has 2 zeros; counting x = 1 as well gives the wrong answer 3."},{"id":"math-03-032","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"E","q":"What is the solution of the equation 2^(2x − 1) = 1/8?","o":["x = −2","x = 1","x = −1","x = 2"],"a":2,"x":"1/8 = 2⁻³, so 2x − 1 = −3 and x = −1. Using 1/8 = 2³ by mistake gives 2x − 1 = 3 and x = 2."},{"id":"math-03-033","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"E","q":"A linear function f satisfies f(1) = 3 and f(3) = −1. What is the value of f(0)?","o":["−2","3","5","7"],"a":2,"x":"The slope is (−1 − 3)/(3 − 1) = −2, so f(x) = 3 − 2(x − 1) = −2x + 5 and f(0) = 5. The value −2 is the slope, not the y-intercept."},{"id":"math-03-034","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"M","q":"The domain of the function f(x) is [1, 5]. What is the domain of f(2x − 1)?","o":["[1, 9]","[0, 2]","[1, 5]","[1, 3]"],"a":3,"x":"The input of f, here 2x − 1, must lie in [1, 5]: 1 ≤ 2x − 1 ≤ 5 gives 1 ≤ x ≤ 3. The answer [1, 9] substitutes x ∈ [1, 5] into 2x − 1, which finds the range of 2x − 1 instead of the allowed x."},{"id":"math-03-035","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"M","q":"f(x) is an even function. The graph of y = f(x − 1) is symmetric with respect to","o":["the line x = 1","the line x = −1","the y-axis","the point (1, 0)"],"a":0,"x":"The graph of f is symmetric about x = 0, and y = f(x − 1) is that graph shifted 1 unit to the right, so its axis of symmetry becomes x = 1. The line x = −1 comes from shifting in the wrong direction."},{"id":"math-03-036","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"M","q":"What is the solution set of 4ˣ − 3·2ˣ − 4 = 0?","o":["x = 4","x = 2","x = 4 or x = −1","x = 2 or x = 0"],"a":1,"x":"Let t = 2ˣ > 0. Then t² − 3t − 4 = (t − 4)(t + 1) = 0, so t = 4 or t = −1; t = −1 is impossible because 2ˣ > 0. From 2ˣ = 4, x = 2. Answers containing 4 or −1 give the values of t, not of x."},{"id":"math-03-037","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"E","q":"The graph of the power function f(x) = x^α passes through the point (4, 2). What is the value of f(16)?","o":["4","2","8","256"],"a":0,"x":"From 4^α = 2 we get α = 1/2, so f(x) = √x and f(16) = 4. The value 8 comes from assuming f(x) = x/2, which is linear, not a power function."},{"id":"math-03-038","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"M","q":"f(x) is an increasing linear function with f(f(x)) = 4x + 3. Which is f(x)?","o":["f(x) = 2x + 1","f(x) = −2x − 3","f(x) = 2x + 3","f(x) = 4x + 1"],"a":0,"x":"Let f(x) = kx + b. Then f(f(x)) = k²x + kb + b = 4x + 3, so k² = 4 and (k + 1)b = 3. Increasing means k = 2, so 3b = 3 and b = 1: f(x) = 2x + 1. The option −2x − 3 also satisfies the equation but is decreasing."},{"id":"math-03-039","unit":"math-03","topic":"math-03-graphs","lo":"MATH-3.3","d":"E","q":"The graph of y = (1/2)ˣ is the reflection of the graph of y = 2ˣ in which line?","o":["the x-axis","the y-axis","the line y = x","the line y = −x"],"a":1,"x":"(1/2)ˣ = 2⁻ˣ, so the new function is f(−x) with f(x) = 2ˣ, which is a reflection in the y-axis. Reflection in y = x would give the inverse function log₂x instead."},{"id":"math-03-040","unit":"math-03","topic":"math-03-explog","lo":"MATH-3.4","d":"M","q":"What is the solution of log₂(x + 1) + log₂(x − 1) = 3?","o":["x = −3","x = 3 or x = −3","x = 9","x = 3"],"a":3,"x":"Combine: log₂((x + 1)(x − 1)) = 3, so x² − 1 = 8 and x = ±3. Both logarithms need x > 1, so x = −3 is rejected and only x = 3 remains. Keeping both roots forgets to check the domain."},{"id":"math-03-041","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"M","q":"Which function from ℝ to ℝ is one-one but NOT onto?","o":["f(x) = eˣ","f(x) = x³","f(x) = x²","f(x) = x³ − x"],"a":0,"x":"eˣ is strictly increasing, so it is one-one, but its range is (0, ∞), not all of ℝ, so it is not onto. x³ is both one-one and onto (bijective), x² is neither, and x³ − x is onto but not one-one since f(0) = f(1) = 0."},{"id":"math-03-042","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"E","q":"Which of these functions is transcendental?","o":["y = 2ˣ + x","y = x^(3/2) + 1","y = √(x² + 1)","y = (x² − 1)/(x + 3)"],"a":0,"x":"A function is algebraic if it is built from x by +, −, ×, ÷, powers and roots only. 2ˣ has the variable in the exponent, so y = 2ˣ + x is transcendental; the other three use only powers, roots and quotients of polynomials."},{"id":"math-03-043","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"D","q":"Which function f: ℝ → ℝ is bijective?","o":["f(x) = 2x + |x|","f(x) = x + |x|","f(x) = x² + 1","f(x) = sin x"],"a":0,"x":"For x ≥ 0, 2x + |x| = 3x, and for x < 0 it equals x; both pieces are increasing and together cover all of ℝ, so it is one-one and onto. x + |x| = 0 for every x < 0 (not one-one), x² + 1 never goes below 1, and sin x repeats and stays in [−1, 1]."},{"id":"math-03-044","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"M","q":"What is the range of f(x) = x²/(x² + 1), x ∈ ℝ?","o":["[0, 1]","(0, 1)","[0, ∞)","[0, 1)"],"a":3,"x":"Write f(x) = 1 − 1/(x² + 1). Since x² + 1 ≥ 1, the fraction 1/(x² + 1) lies in (0, 1], so f lies in [0, 1); f(0) = 0 is reached but 1 never is. Including 1 is the usual slip."},{"id":"math-03-045","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"M","q":"A = {1, 2, 3} and B = {p, q, r, s}. How many one-one functions from A to B are there?","o":["64","24","12","4"],"a":1,"x":"The image of 1 can be chosen in 4 ways, then 2 in 3 ways and 3 in 2 ways, so there are 4 × 3 × 2 = 24 one-one functions. 64 = 4³ counts all functions from A to B, including those that repeat an image."},{"id":"math-03-046","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"M","q":"What is the domain of f(x) = √((x − 1)/(3 − x))?","o":["[1, 3)","[1, 3]","(1, 3)","(−∞, 1] ∪ (3, ∞)"],"a":0,"x":"We need (x − 1)/(3 − x) ≥ 0 with x ≠ 3. The quotient is 0 at x = 1, positive for 1 < x < 3 and negative outside, so the domain is [1, 3). Including 3 forgets that the denominator would be zero."},{"id":"math-03-047","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"M","q":"f(x) = x² − 6x + 5 is defined on the interval [k, ∞). What is the smallest value of k for which f is one-one?","o":["5","1","−3","3"],"a":3,"x":"The parabola has its vertex at x = −(−6)/2 = 3 and increases for x ≥ 3, so f is one-one on [k, ∞) exactly when k ≥ 3. The values 1 and 5 are the zeros of f, not the turning point."},{"id":"math-03-048","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"M","q":"The function f: ℝ → [a, ∞) given by f(x) = x² + 2x + 5 is onto. What is the value of a?","o":["5","4","1","−1"],"a":1,"x":"f(x) = (x + 1)² + 4, so its range is [4, ∞). For f to be onto, the co-domain must equal the range, so a = 4. 5 is f(0), and −1 is where the minimum occurs, not its value."},{"id":"math-03-049","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"D","q":"What is the range of f(x) = |x − 1| + |x + 3|?","o":["[2, ∞)","[0, ∞)","[−2, ∞)","[4, ∞)"],"a":3,"x":"|x − 1| + |x + 3| is the sum of the distances from x to 1 and to −3. For x between −3 and 1 it is always 4, and outside it is larger, so the range is [4, ∞). Taking 0 as the minimum ignores that both terms cannot vanish together."},{"id":"math-03-050","unit":"math-03","topic":"math-03-types","lo":"MATH-3.1","d":"D","q":"What is the domain of f(x) = 1/√(|x| − x)?","o":["(0, ∞)","ℝ","(−∞, 0)","ℝ except 0"],"a":2,"x":"We need |x| − x > 0. For x ≥ 0, |x| − x = 0, which is not allowed; for x < 0, |x| − x = −2x > 0. So the domain is (−∞, 0). Choosing (0, ∞) reverses the sign of |x| for negative x."},{"id":"math-03-051","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"M","q":"What is the inverse of f(x) = (2x + 3)/(x − 1), x ≠ 1?","o":["f⁻¹(x) = (x − 1)/(2x + 3)","f⁻¹(x) = (x + 3)/(x − 2)","f⁻¹(x) = (x − 3)/(x + 2)","f⁻¹(x) = (2x − 3)/(x + 1)"],"a":1,"x":"From y = (2x + 3)/(x − 1): xy − y = 2x + 3, so x(y − 2) = y + 3 and x = (y + 3)/(y − 2). Check: f(2) = 7 and (7 + 3)/(7 − 2) = 2. The reciprocal (x − 1)/(2x + 3) is 1/f, not the inverse."},{"id":"math-03-052","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"D","q":"Let f(x) = x² + 1 and g(x) = √(x − 1) for x ≥ 1. Which expression equals g(f(x)) for every real x?","o":["x","|x|","−x","x²"],"a":1,"x":"g(f(x)) = √(x² + 1 − 1) = √(x²) = |x|. Writing x is wrong for negative x, e.g. x = −2 gives √4 = 2. (The other order, f(g(x)) = x, holds only for x ≥ 1.)"},{"id":"math-03-053","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"M","q":"If f(x) = 3x − 4 and f(g(x)) = 6x + 5, what is g(x)?","o":["2x + 3","2x + 1/3","2x + 9","18x + 11"],"a":0,"x":"f(g(x)) = 3g(x) − 4 = 6x + 5, so 3g(x) = 6x + 9 and g(x) = 2x + 3. Check: 3(2x + 3) − 4 = 6x + 5. 18x + 11 is f(6x + 5), which composes in the wrong order."},{"id":"math-03-054","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"E","q":"If f(x) = x³ − 3, what is the value of f⁻¹(5)?","o":["2","122","8","∛2"],"a":0,"x":"f⁻¹(5) is the x with x³ − 3 = 5, so x³ = 8 and x = 2. 122 is f(5), not f⁻¹(5); 8 forgets to take the cube root."},{"id":"math-03-055","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"M","q":"At which point does the graph of f(x) = 2x − 4 meet the graph of its inverse?","o":["(2, 0)","(0, 2)","(−4, −4)","(4, 4)"],"a":3,"x":"f is increasing, so f and f⁻¹ meet on the line y = x: 2x − 4 = x gives x = 4, the point (4, 4). Check: f⁻¹(x) = (x + 4)/2 and f⁻¹(4) = 4. (2, 0) is only the x-intercept of f."},{"id":"math-03-056","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"M","q":"Let f(x) = (x + 1)/(x − 1), x ≠ 1. What is f(f(x)) for x ≠ 1?","o":["1/x","−x","x","(x + 1)/(x − 1)"],"a":2,"x":"f(f(x)) = [(x + 1)/(x − 1) + 1] / [(x + 1)/(x − 1) − 1] = [2x/(x − 1)] / [2/(x − 1)] = x. Check with x = 3: f(3) = 2 and f(2) = 3. So f is its own inverse."},{"id":"math-03-057","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"D","q":"Let f(x) = 2x + 1 and g(x) = x² − 2. For which real x is f(g(x)) = g(f(x))?","o":["x = 1","x = −1 or x = 1","x = 0","x = −1"],"a":3,"x":"f(g(x)) = 2x² − 3 and g(f(x)) = (2x + 1)² − 2 = 4x² + 4x − 1. Equating gives 2x² + 4x + 2 = 0, i.e. (x + 1)² = 0, so x = −1 only. Check: f(g(−1)) = f(−1) = −1 and g(f(−1)) = g(−1) = −1."},{"id":"math-03-058","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"M","q":"f(x) = √(x − 2) with domain x ≥ 2. Which describes the inverse function f⁻¹?","o":["f⁻¹(x) = x² + 2, x ≥ 0","f⁻¹(x) = x² + 2, x ∈ ℝ","f⁻¹(x) = x² − 2, x ≥ 0","f⁻¹(x) = √(x + 2), x ≥ −2"],"a":0,"x":"From y = √(x − 2): x = y² + 2. The domain of f⁻¹ is the range of f, which is [0, ∞), so f⁻¹(x) = x² + 2 for x ≥ 0. Allowing all real x would make it two-to-one and not the inverse."},{"id":"math-03-059","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"M","q":"Let f(x) = √x and g(x) = 4 − x². What is the domain of f(g(x))?","o":["[0, 2]","ℝ","[−2, 2]","(−∞, −2] ∪ [2, ∞)"],"a":2,"x":"f(g(x)) = √(4 − x²) needs 4 − x² ≥ 0, i.e. x² ≤ 4, so −2 ≤ x ≤ 2. [0, 2] wrongly keeps the restriction x ≥ 0 from f, and the union reverses the inequality."},{"id":"math-03-060","unit":"math-03","topic":"math-03-composition","lo":"MATH-3.2","d":"D","q":"f(x) = ax + b and its inverse is f⁻¹(x) = 2x − 6. What is the value of a + b?","o":["−4","7/2","−5/2","8"],"a":1,"x":"Inverting y = 2x − 6 gives x = (y + 6)/2, so f(x) = x/2 +
