+ 5² − 7²)/(2 × 3 × 5) = −15/30 = −1/2, so θ = 120°. Since 3² + 5² < 7² the angle is obtuse, so 90° is impossible."},{"id":"math-14-009","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"D","q":"In triangle ABC, a = 2, c = 2√3 and C = 120°. What is the area of the triangle?","o":["2√3","3","√3","3√3"],"a":2,"x":"sin A = a sin C/c = 2 × (√3/2)/(2√3) = 1/2, and A < C, so A = 30° and B = 30°. Area = ½ac sin B = ½ × 2 × 2√3 × ½ = √3. The value 3 uses sin C, but C is not the angle between sides a and c."},{"id":"math-14-010","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"M","q":"In triangle ABC, A = 60°, a = √3 and b = √2. What is B?","o":["135°","45°","45° or 135°","30°"],"a":1,"x":"sin B = b sin A/a = √2 × (√3/2)/√3 = √2/2, so B = 45° or 135°. Since b < a, B < A = 60°, which rules out 135°; also 60° + 135° > 180°. So B = 45° only."},{"id":"math-14-011","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"M","q":"Two sides of a triangle are 3 cm and 5 cm, and the angle between them is 60°. What is the area of the triangle?","o":["15/2 cm²","15√3/4 cm²","15/4 cm²","15√3/2 cm²"],"a":1,"x":"Area = ½ × 3 × 5 × sin 60° = (15/2)(√3/2) = 15√3/4 cm². The value 15√3/2 forgets the ½, and 15/4 uses cos 60° instead of sin 60°."},{"id":"math-14-012","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"D","q":"In triangle ABC, A = 30°, a = 2 and b = 2√3. What is c?","o":["4","2 or 4","2","2√3 or 4"],"a":1,"x":"sin B = b sin A/a = 2√3 × ½/2 = √3/2, so B = 60° or 120°; both are possible because b > a. If B = 60° then C = 90° and c = 4; if B = 120° then C = 30° and c = a = 2. Giving only 4 misses the obtuse case."},{"id":"math-14-013","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"M","q":"In triangle ABC, a = 5, b = 8 and C = 150°. What is the area of the triangle?","o":["10√3","10","20","20√3"],"a":1,"x":"Area = ½ab sin C = ½ × 5 × 8 × sin 150° = 20 × ½ = 10. The value 10√3 uses |cos 150°| = √3/2 instead of sin 150° = 1/2, and 20 forgets the ½."},{"id":"math-14-014","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"M","q":"In triangle ABC, sin A : sin B : sin C = 5 : 7 : 8. What is angle B?","o":["30°","45°","60°","120°"],"a":2,"x":"By the sine rule a : b : c = 5 : 7 : 8, so take a = 5k, b = 7k, c = 8k. cos B = (25 + 64 − 49)/(2 × 5 × 8) = 40/80 = 1/2, so B = 60°. 120° would need cos B = −1/2, which comes from a sign slip in the cosine rule."},{"id":"math-14-015","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"D","q":"In triangle ABC, A = 120°, a = 7 and b + c = 8. What is the area of the triangle?","o":["15√3/4","15/4","15√3/2","5√3/4"],"a":0,"x":"a² = b² + c² − 2bc cos 120° = b² + c² + bc = (b + c)² − bc, so 49 = 64 − bc and bc = 15. Area = ½bc sin A = ½ × 15 × √3/2 = 15√3/4. The value 15√3/2 forgets the ½; 5√3/4 comes from taking cos 120° = +1/2, which gives 49 = 64 − 3bc."},{"id":"math-14-016","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"M","q":"In any triangle ABC, the expression b cos C + c cos B is always equal to","o":["a","b + c","a/2","2R, where R is the circumradius"],"a":0,"x":"Drop the altitude from A to side BC: the segments of BC have lengths b cos C and c cos B (with sign if an angle is obtuse), and together they make up a. This is the projection formula a = b cos C + c cos B. It is not 2R, which equals a/sin A."},{"id":"math-14-017","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"D","q":"In triangle ABC, a cos A = b cos B. Which statement must be true?","o":["The triangle is isosceles","The triangle is right-angled","The triangle is equilateral","The triangle is isosceles or right-angled"],"a":3,"x":"By the sine rule sin A cos A = sin B cos B, so sin 2A = sin 2B. Hence 2A = 2B or 2A + 2B = 180°, i.e. A = B or A + B = 90°. Concluding only 'isosceles' misses the second case, where C = 90°."},{"id":"math-14-018","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"M","q":"In triangle ABC, b² + c² − a² = −bc. What is angle A?","o":["30°","60°","120°","150°"],"a":2,"x":"cos A = (b² + c² − a²)/(2bc) = −bc/(2bc) = −1/2, so A = 120°. The answer 60° drops the minus sign."},{"id":"math-14-019","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"D","q":"In triangle ABC, b = 2, A = 60° and the area is 2√3. What is a?","o":["2√3","2","4","2√7"],"a":0,"x":"Area = ½bc sin A = ½ × 2 × c × (√3/2) = (√3/2)c = 2√3, so c = 4. Then a² = 4 + 16 − 2 × 2 × 4 × ½ = 12 and a = 2√3. The value 2√7 uses cos 60° = −1/2 in the cosine rule; 4 is c, not a."},{"id":"math-14-020","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"M","q":"In triangle ABC, (a + b + c)(a + b − c) = 3ab. What is angle C?","o":["30°","120°","60°","150°"],"a":2,"x":"Expand: (a + b)² − c² = 3ab, so a² + b² − c² = ab and cos C = ab/(2ab) = 1/2, giving C = 60°. Choosing 120° comes from a sign error, reading a² + b² − c² as −ab."},{"id":"math-14-021","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"M","q":"In triangle ABC, c = 2b cos A. Which statement must be true?","o":["The triangle is isosceles","The triangle is right-angled","The triangle is equilateral","The triangle is obtuse"],"a":0,"x":"By the sine rule sin C = 2 sin B cos A, and sin C = sin(A + B) = sin A cos B + cos A sin B. So sin A cos B − cos A sin B = 0, i.e. sin(A − B) = 0 and A = B. The triangle is isosceles; nothing forces a right angle."},{"id":"math-14-022","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"D","q":"In an acute triangle ABC, A = 2B. What is the range of a/b?","o":["(1, 2)","(0, 2)","(1, √3)","(√2, √3)"],"a":3,"x":"a/b = sin 2B/sin B = 2 cos B. All angles acute: 2B < 90° gives B < 45°, and C = 180° − 3B < 90° gives B > 30°. So cos B lies in (√2/2, √3/2) and a/b in (√2, √3). The range (1, 2) uses only 0 < B < 60°, ignoring the acute conditions."},{"id":"math-14-023","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"E","q":"In triangle ABC, b = 4, c = 3 and A = 60°. What is a?","o":["5","√13","√37","13"],"a":1,"x":"a² = b² + c² − 2bc cos A = 16 + 9 − 2 × 4 × 3 × ½ = 13, so a = √13. The value √37 adds 2bc cos A instead of subtracting it, and 5 wrongly treats the triangle as right-angled."},{"id":"math-14-024","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"M","q":"In triangle ABC, B = 45°, C = 60° and c = √6. What is b?","o":["2","√2","√3","3"],"a":0,"x":"By the sine rule b = c sin B/sin C = √6 × (√2/2)/(√3/2) = √6 × √2/√3 = 2. The value 3 swaps sin B and sin C: √6 × (√3/2)/(√2/2) = 3."},{"id":"math-14-025","unit":"math-14","topic":"math-14-laws","lo":"MATH-14.2","d":"M","q":"In triangle ABC, a = √7, b = 2 and c = 3. What is angle A?","o":["30°","45°","60°","120°"],"a":2,"x":"cos A = (b² + c² − a²)/(2bc) = (4 + 9 − 7)/12 = 1/2, so A = 60°. The answer 120° comes from writing a² − b² − c² in the numerator, which flips the sign."},{"id":"math-14-026","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"E","q":"A ladder 10 m long leans against a vertical wall and makes an angle of 60° with the level ground. How high up the wall does it reach?","o":["5√3 m","5 m","10√3 m","5√2 m"],"a":0,"x":"Height = 10 sin 60° = 10 × √3/2 = 5√3 m. Using cos 60° gives 5 m, which is the distance of the foot of the ladder from the wall."},{"id":"math-14-027","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"M","q":"From the top of a tower 30 m high, the angle of depression of a car on the level ground is 30°. How far is the car from the foot of the tower?","o":["10√3 m","30 m","60 m","30√3 m"],"a":3,"x":"The angle of elevation of the tower top from the car is also 30°, so tan 30° = 30/d and d = 30/(1/√3) = 30√3 m. Writing tan 30° = d/30 gives 10√3 m."},{"id":"math-14-028","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"M","q":"The angle of elevation of the top of a pole from a point on level ground is 30°. After walking 20 m straight towards the pole, the angle becomes 60°. What is the height of the pole?","o":["10√3 m","20√3 m","10 m","20 m"],"a":0,"x":"Let d be the final distance: h = d√3 and h = (d + 20)/√3. So 3d = d + 20, d = 10 and h = 10√3 m. Check: from 30 m away, tan θ = 10√3/30 = 1/√3, θ = 30°."},{"id":"math-14-029","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"D","q":"Two points on level ground lie on opposite sides of a vertical tower, in line with its foot, and are 100 m apart. The angles of elevation of the tower top from them are 30° and 60°. What is the height of the tower?","o":["50√3 m","25 m","25√3 m","50 m"],"a":2,"x":"The distances from the foot are h cot 30° = h√3 and h cot 60° = h/√3. Their sum is 100: h(√3 + 1/√3) = 4h/√3 = 100, so h = 25√3 m. Taking the points on the same side (difference 100) would give 50√3 m."},{"id":"math-14-030","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"E","q":"The shadow of a vertical pole on level ground is √3 times the height of the pole. What is the angle of elevation of the sun?","o":["60°","45°","30°","15°"],"a":2,"x":"tan θ = height/shadow = 1/√3, so θ = 30°. Taking shadow/height = √3 as tan θ gives 60°."},{"id":"math-14-031","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"M","q":"In triangle ABC, C = 90°, the hypotenuse c = 25 and tan A = 3/4. What is the length of side a?","o":["20","12","75/4","15"],"a":3,"x":"tan A = 3/4 gives sin A = 3/5, so a = c sin A = 25 × 3/5 = 15 (and b = 20). 75/4 comes from multiplying the hypotenuse by tan A."},{"id":"math-14-032","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"M","q":"In triangle ABC, A = 30°, a = 5 and b = 8. How many triangles fit these data?","o":["two","one","none","infinitely many"],"a":0,"x":"b sin A = 8 × ½ = 4. Since 4 < a = 5 < b = 8, sin B = 8 sin 30°/5 = 4/5 gives one acute and one obtuse value of B, and both leave room for C. So there are two triangles (the ambiguous case)."},{"id":"math-14-033","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"M","q":"The angles of a triangle are in the ratio 1 : 2 : 3. What is the ratio of the sides opposite them?","o":["1 : 2 : 3","1 : √2 : √3","1 : √3 : 2","√3 : 1 : 2"],"a":2,"x":"The angles are 30°, 60°, 90°. By the law of sines the sides are in the ratio sin 30° : sin 60° : sin 90° = ½ : √3/2 : 1 = 1 : √3 : 2. Sides are not proportional to the angles, so 1 : 2 : 3 is wrong."},{"id":"math-14-034","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"D","q":"A flagstaff 10 m tall stands on top of a building. From a point on level ground, the angles of elevation of the bottom and top of the flagstaff are 45° and 60°. What is the height of the building?","o":["5(√3 − 1) m","5(√3 + 1) m","10(√3 + 1) m","10√3 m"],"a":1,"x":"With distance d and building height h: h = d tan 45° = d and h + 10 = d√3. So d(√3 − 1) = 10, d = 10/(√3 − 1) = 5(√3 + 1), and h = 5(√3 + 1) m. Rationalising the wrong way gives 5(√3 − 1)."},{"id":"math-14-035","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"M","q":"From the top of a cliff 50 m high, the angles of depression of two boats in line with the foot of the cliff, on the same side, are 45° and 30°. How far apart are the boats?","o":["50(√3 + 1) m","50√3 m","50 m","50(√3 − 1) m"],"a":3,"x":"The boats are 50 cot 45° = 50 m and 50 cot 30° = 50√3 m from the foot. The gap is 50√3 − 50 = 50(√3 − 1) m. Adding the distances (boats on opposite sides) gives 50(√3 + 1) m."},{"id":"math-14-036","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"M","q":"Two ships leave a harbour along straight courses that make an angle of 60° with each other. One ship travels 5 km and the other 8 km. How far apart are they then?","o":["√129 km","13 km","7 km","√89 km"],"a":2,"x":"Law of cosines: d² = 5² + 8² − 2 × 5 × 8 × cos 60° = 25 + 64 − 40 = 49, so d = 7 km. Using cos 120° gives √129 km; leaving out the cosine term gives √89 km."},{"id":"math-14-037","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"D","q":"In triangle ABC, a = √3 + 1, b = √3 − 1 and C = 60°. Using the law of tangents, what is A − B?","o":["60°","90°","45°","30°"],"a":1,"x":"tan((A − B)/2) = [(a − b)/(a + b)] cot(C/2) = (2/(2√3)) × √3 = 1, so (A − B)/2 = 45° and A − B = 90°. Stopping at 45° forgets to double. Check: A = 105°, B = 15° and sin 105°/sin 15° = 2 + √3 = a/b."},{"id":"math-14-038","unit":"math-14","topic":"math-14-triangles","lo":"MATH-14.1","d":"D","q":"A building is 20 m high. From its top, the angle of elevation of the top of a taller tower is 30° and the angle of depression of the foot of the tower is 60°. The ground is level. What is the height of the tower?","o":["40/3 m","60 m","20√3 m","80/3 m"],"a":3,"x":"Horizontal gap d = 20 cot 60° = 20/√3. The tower rises d tan 30° = (20/√3)(1/√3) = 20/3 m above the building top, so its height is 20 + 20/3 = 80/3 m. 20/3 m alone is only the part above the building."},{"id":"math-14-039","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"E","q":"Using Hero's formula, what is the area of the triangle with sides 13, 14 and 15?","o":["84","42","168","21"],"a":0,"x":"s = (13 + 14 + 15)/2 = 21. Area = √(21 × 8 × 7 × 6) = √7056 = 84. Using the full perimeter in place of s does not give a perfect square; 168 is twice the area."},{"id":"math-14-040","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"M","q":"What is the area of the triangle with sides 7, 8 and 9?","o":["24√5","6√5","12√5","12√3"],"a":2,"x":"s = 12, so area = √(12 × 5 × 4 × 3) = √720 = 12√5. Check: cos C (opposite 9) = (49 + 64 − 81)/112 = 2/7, sin C = 3√5/7, and ½ × 7 × 8 × 3√5/7 = 12√5."},{"id":"math-14-041","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"M","q":"In triangle ABC, a = 2 and B = C = 30°. What is the area of the triangle?","o":["√3","2√3/3","√3/6","√3/3"],"a":3,"x":"A = 120°. Area = a² sin B sin C/(2 sin A) = 4 × ¼/(2 × √3/2) = 1/√3 = √3/3. Check: b = c = 2 sin 30°/sin 120° = 2/√3, and ½bc sin A = ½ × (4/3) × √3/2 = √3/3."},{"id":"math-14-042","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"D","q":"Two sides of a triangle are 4 and 6, and its area is 6√3. What can the angle between these two sides be?","o":["60° only","60° or 120°","120° only","30° or 150°"],"a":1,"x":"½ × 4 × 6 × sin θ = 6√3 gives sin θ = √3/2, so θ = 60° or 120°. Both make a valid triangle, so stopping at 60° misses a case."},{"id":"math-14-043","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"M","q":"An isosceles triangle has its two equal sides 8 cm long and each base angle 75°. What is its area?","o":["16 cm²","32 cm²","16√3 cm²","8 cm²"],"a":0,"x":"The vertex angle is 180° − 150° = 30°, the angle between the equal sides. Area = ½ × 8 × 8 × sin 30° = 16 cm². Using sin 60° gives 16√3."},{"id":"math-14-044","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"D","q":"What is the area of the triangle with sides 4, 5 and 6?","o":["15√7/4","15√7/2","15√3/4","5√7"],"a":0,"x":"s = 15/2, s − a = 7/2, s − b = 5/2, s − c = 3/2. Area = √(15 × 7 × 5 × 3/16) = √1575/4 = 15√7/4. Check: cos C = (16 + 25 − 36)/40 = 1/8, sin C = 3√7/8, ½ × 4 × 5 × 3√7/8 = 15√7/4."},{"id":"math-14-045","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"M","q":"A triangle has area 12, one side 6, and the angle between this side and a second side is 30°. What is the length of the second side?","o":["4","8√3","16","8"],"a":3,"x":"½ × 6 × x × sin 30° = 12, so 3x/2 = 12 and x = 8. Forgetting the ½ in the area formula gives 4."},{"id":"math-14-046","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"M","q":"In triangle ABC, b = 5, c = 6 and cos A = 3/5. What is the area of the triangle?","o":["9","15","12","24"],"a":2,"x":"sin A = √(1 − 9/25) = 4/5. Area = ½ × 5 × 6 × 4/5 = 12. Using cos A instead of sin A gives 9."},{"id":"math-14-047","unit":"math-14","topic":"math-14-area","lo":"MATH-14.3","d":"D","q":"The area Δ of triangle ABC satisfies Δ = (a² + b² − c²)/4. What is angle C?","o":["45°","60°","30°","90°"],"a":0,"x":"By the law of cosines a² + b² − c² = 2ab cos C, so Δ = ½ab cos C. Also Δ = ½ab sin C. Hence sin C = cos C, tan C = 1 and C = 45°."},{"id":"math-14-048","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"E","q":"What is the radius r of the incircle of the triangle with sides 3, 4 and 5?","o":["2","1","5/2","1/2"],"a":1,"x":"Area Δ = ½ × 3 × 4 = 6 and s = 6, so r = Δ/s = 1. 5/2 is the circumradius R (half the hypotenuse)."},{"id":"math-14-049","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"M","q":"What is the circumradius R of the triangle with sides 13, 14 and 15?","o":["65/8","65/4","4","21/2"],"a":0,"x":"Area Δ = 84 (Hero, s = 21). R = abc/(4Δ) = 2730/336 = 65/8. Using 2Δ in the denominator gives 65/4; 4 is the inradius Δ/s."},{"id":"math-14-050","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"M","q":"A triangle has sides 5, 12 and 13. What is the radius of the escribed circle opposite the side 13?","o":["10","3","15","2"],"a":2,"x":"Δ = ½ × 5 × 12 = 30 and s = 15. The escribed radius opposite side c is Δ/(s − c) = 30/2 = 15. 3 and 10 are the escribed radii opposite 5 and 12; 2 is the inradius."},{"id":"math-14-051","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"M","q":"In triangle ABC, b = 4 and B = 150°. What is the circumradius R?","o":["4","8","2","4√3"],"a":0,"x":"b/sin B = 2R, so 2R = 4/sin 150° = 4/(½) = 8 and R = 4. Stopping at 2R gives 8; multiplying by sin B instead of dividing gives 2."},{"id":"math-14-052","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"D","q":"For every triangle with inradius r, escribed radii r₁, r₂, r₃ and circumradius R, the expression r₁ + r₂ + r₃ − r equals","o":["2R","R","3R","4R"],"a":3,"x":"r₁ + r₂ + r₃ − r = 4R is a standard relation. Check with the 3-4-5 triangle: Δ = 6, s = 6, r₁ = 6/3 = 2, r₂ = 6/2 = 3, r₃ = 6/1 = 6, r = 1, so 2 + 3 + 6 − 1 = 10 = 4 × 5/2."},{"id":"math-14-053","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"M","q":"For every triangle ABC with circumradius R, which expression equals the inradius r?","o":["4R cos(A/2) cos(B/2) cos(C/2)","2R sin(A/2) sin(B/2) sin(C/2)","4R sin(A/2) cos(B/2) cos(C/2)","4R sin(A/2) sin(B/2) sin(C/2)"],"a":3,"x":"r = 4R sin(A/2) sin(B/2) sin(C/2). Check an equilateral triangle: 4R × (½)³ = R/2, and indeed r = R/2. 4R sin(A/2) cos(B/2) cos(C/2) is r₁, and 4R cos(A/2) cos(B/2) cos(C/2) is s."},{"id":"math-14-054","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"M","q":"For every triangle with area Δ, inradius r and escribed radii r₁, r₂, r₃, the product r · r₁ · r₂ · r₃ equals","o":["Δ","Δ²","s²","Δ³"],"a":1,"x":"r = Δ/s, r₁ = Δ/(s − a), r₂ = Δ/(s − b), r₃ = Δ/(s − c). The product is Δ⁴/[s(s − a)(s − b)(s − c)] = Δ⁴/Δ² = Δ². Check 3-4-5: 1 × 2 × 3 × 6 = 36 = 6²."},{"id":"math-14-055","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"M","q":"A right-angled triangle has legs 6 and 8. What is R + r, the sum of its circumradius and inradius?","o":["7","12","6","5"],"a":0,"x":"Hypotenuse 10, so R = 10/2 = 5. Δ = 24 and s = 12, so r = 24/12 = 2. R + r = 7. Using the full hypotenuse as R gives 12."},{"id":"math-14-056","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"D","q":"A triangle has circumradius R = 3 and inradius r = 1. What is cos A + cos B + cos C?","o":["1/3","4/3","2/3","3"],"a":1,"x":"In every triangle cos A + cos B + cos C = 1 + r/R, so the value is 1 + 1/3 = 4/3. Check with an equilateral triangle: r/R = ½ and 3 × ½ = 1 + ½."},{"id":"math-14-057","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"M","q":"What is the inradius r of the triangle with sides 5, 5 and 6?","o":["25/8","3/2","2","3"],"a":1,"x":"s = 8 and Δ = √(8 × 3 × 3 × 2) = 12, so r = Δ/s = 3/2. 25/8 is the circumradius abc/(4Δ) = 150/48."},{"id":"math-14-058","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"D","q":"In an equilateral triangle, what is the ratio r : R : r₁ of the inradius, the circumradius and an escribed radius?","o":["1 : 2 : 4","1 : 2 : 3","1 : √2 : √3","1 : 3 : 2"],"a":1,"x":"For side a: Δ = √3a²/4, s = 3a/2, s − a = a/2. Then r = Δ/s = a/(2√3), R = a/√3 = 2a/(2√3) and r₁ = Δ/(s − a) = √3a/2 = 3a/(2√3). The ratio is 1 : 2 : 3."},{"id":"math-14-059","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"E","q":"A triangle has perimeter 24 cm and inradius 2 cm. What is its area?","o":["48 cm²","24 cm²","12 cm²","6 cm²"],"a":1,"x":"Δ = rs with s = 24/2 = 12, so Δ = 2 × 12 = 24 cm². Using the perimeter instead of s gives 48 cm²."},{"id":"math-14-060","unit":"math-14","topic":"math-14-circles","lo":"MATH-14.4","d":"D","q":"In triangle ABC, C = 90°. Which quantity is always equal to r₃, the radius of the escribed circle opposite C?","o":["R","2R","s − c","s"],"a":3,"x":"With legs a, b: r₃ = Δ/(s − c) and Δ = ½ab. Since (s − c)·s = ¼[(a + b)² − c²] = ½ab = Δ, we get r₃ = s. Check 3-4-5: r₃ = 6/1 = 6 = s. s − c is the inradius r, and 2R = c."},{"id":"math-15-001","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"E","q":"The principal value of sin⁻¹(1/2) is:","o":["π/3","5π/6","−π/6","π/6"],"a":3,"x":"sin(π/6) = 1/2 and π/6 lies in the principal range [−π/2, π/2]. 5π/6 also has sine 1/2 but is outside that range."},{"id":"math-15-002","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"E","q":"The principal value of cos⁻¹(−1/2) is:","o":["−π/3","π/3","4π/3","2π/3"],"a":3,"x":"The range of cos⁻¹ is [0, π]; cos(2π/3) = −1/2, so the value is 2π/3. −π/3 is negative and outside [0, π]."},{"id":"math-15-003","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"E","q":"The principal value of tan⁻¹(−1) is:","o":["3π/4","−π/4","π/4","7π/4"],"a":1,"x":"The range of tan⁻¹ is (−π/2, π/2); tan(−π/4) = −1. 3π/4 also has tangent −1 but is outside the principal range."},{"id":"math-15-004","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"E","q":"The domain of y = sin⁻¹x is:","o":["[−π/2, π/2]","all real numbers","[0, π]","[−1, 1]"],"a":3,"x":"sin⁻¹x is defined only where x is a value of sine, i.e. −1 ≤ x ≤ 1. [−π/2, π/2] is its range, not its domain."},{"id":"math-15-005","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"M","q":"The range (principal values) of y = cos⁻¹x is:","o":["[−π/2, π/2]","(0, π)","[−1, 1]","[0, π]"],"a":3,"x":"cos⁻¹x takes all values from cos⁻¹1 = 0 to cos⁻¹(−1) = π, both included, so the range is [0, π]. [−π/2, π/2] is the range of sin⁻¹."},{"id":"math-15-006","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"M","q":"sin⁻¹(sin(5π/6)) equals:","o":["5π/6","−π/6","π/6","π/3"],"a":2,"x":"sin(5π/6) = 1/2, and the principal value of sin⁻¹(1/2) is π/6. 5π/6 is outside [−π/2, π/2], so it cannot be the answer."},{"id":"math-15-007","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"D","q":"cos⁻¹(cos(7π/6)) equals:","o":["7π/6","5π/6","π/6","−π/6"],"a":1,"x":"cos(7π/6) = −√3/2, and cos⁻¹(−√3/2) in [0, π] is 5π/6. 7π/6 lies outside [0, π]; π/6 has the wrong sign of cosine."},{"id":"math-15-008","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"M","q":"sin(cos⁻¹(3/5)) equals:","o":["−4/5","4/5","3/4","3/5"],"a":1,"x":"Let θ = cos⁻¹(3/5), in [0, π], so sin θ ≥ 0 and sin θ = √(1 − 9/25) = 4/5. The negative root is ruled out by the range."},{"id":"math-15-009","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"M","q":"tan(sin⁻¹(−1/2)) equals:","o":["1/√3","−√3","−1/√3","√3"],"a":2,"x":"sin⁻¹(−1/2) = −π/6 and tan(−π/6) = −1/√3. Using tan(π/3) by mixing up the angle gives √3."},{"id":"math-15-010","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"M","q":"The principal value of sec⁻¹(2) is:","o":["π/6","2π/3","−π/3","π/3"],"a":3,"x":"sec⁻¹2 = cos⁻¹(1/2) = π/3, which lies in the range [0, π] (excluding π/2). Using sin(π/6) = 1/2 by mistake gives π/6."},{"id":"math-15-011","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"M","q":"Taking the principal range of cot⁻¹ as (0, π), the value of cot⁻¹(−√3) is:","o":["−π/6","5π/6","π/6","2π/3"],"a":1,"x":"cot(5π/6) = cos/sin = (−√3/2)/(1/2) = −√3, and 5π/6 is in (0, π). −π/6 also has cotangent −√3 but is outside (0, π)."},{"id":"math-15-012","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"D","q":"cos(tan⁻¹(−3/4)) equals:","o":["−4/5","3/5","−3/5","4/5"],"a":3,"x":"θ = tan⁻¹(−3/4) lies in (−π/2, 0), where cosine is positive. From a 3-4-5 triangle cos θ = 4/5. Carrying the minus sign into the cosine gives −4/5."},{"id":"math-15-013","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"M","q":"Which of these is NOT defined as a real number?","o":["tan⁻¹(3/2)","sin⁻¹(3/2)","sec⁻¹(3/2)","cos⁻¹(−1/2)"],"a":1,"x":"sin⁻¹ needs −1 ≤ x ≤ 1, and 3/2 > 1. tan⁻¹ accepts every real number, sec⁻¹ needs |x| ≥ 1 (true for 3/2), and −1/2 is in the domain of cos⁻¹."},{"id":"math-15-014","unit":"math-15","topic":"math-15-defs","lo":"MATH-15.1","d":"D","q":"sin⁻¹(sin 2), where 2 is in radians, equals:","o":["2","π − 2","2 − π","2π − 2"],"a":1,"x":"2 lies between π/2 and π, outside [−π/2, π/2]. sin 2 = sin(π − 2), and π − 2 (about 1.14) is inside the principal range, so the value is π − 2."},{"id":"math-15-015","unit":"math-15","topic":"math-15-graphs","lo":"MATH-15.2","d":"E","q":"The graph of y = sin⁻¹x is the reflection of the graph of y = sin x, −π/2 ≤ x ≤ π/2, in:","o":["the x-axis","the y-axis","the line y = x","the origin"],"a":2,"x":"The graph of an inverse function is the mirror image of the original graph in the line y = x, because (a, b) on one becomes (b, a) on the other."},{"id":"math-15-016","unit":"math-15","topic":"math-15-graphs","lo":"MATH-15.2","d":"M","q":"The horizontal asymptotes of the graph of y = tan⁻¹x are:","o":["y = π/2 and y = −π/2","x = π/2 and x = −π/2","y = 0 and y = π","y = 1 and y = −1"],"a":0,"x":"As x → ∞, tan⁻¹x → π/2 and as x → −∞ it → −π/2, so the lines y = ±π/2 are horizontal asymptotes. x = ±π/2 are the vertical asymptotes of tan x itself."},{"id":"math-15-017","unit":"math-15","topic":"math-15-graphs","lo":"MATH-15.2","d":"M","q":"Which point lies on the graph of y = cos⁻¹x?","o":["(0, 0)","(0, π/2)","(1, π/2)","(−1, 0)"],"a":1,"x":"cos⁻¹0 = π/2, so (0, π/2) is on the graph. cos⁻¹1 = 0 and cos⁻¹(−1) = π, so the other points are not."},{"id":"math-15-018","unit":"math-15","topic":"math-15-graphs","lo":"MATH-15.2","d":"M","q":"The graph of y = sin⁻¹x has end points:","o":["(−1, −π/2) and (1, π/2)","(−1, π) and (1, 0)","(−π/2, −1) and (π/2, 1)","(0, −π/2) and (0, π/2)"],"a":0,"x":"The domain is [−1, 1]; sin⁻¹(−1) = −π/2 and sin⁻¹1 = π/2. (−1, π) and (1, 0) are the end points of cos⁻¹x; swapping coordinates gives the sine curve's end points."},{"id":"math-15-019","unit":"math-15","topic":"math-15-graphs","lo":"MATH-15.2","d":"M","q":"On the interval [−1, 1], which function decreases as x increases?","o":["sin⁻¹x","tan⁻¹x","x³","cos⁻¹x"],"a":3,"x":"The graph of cos⁻¹x falls from (−1, π) to (1, 0), so it is decreasing. sin⁻¹x, tan⁻¹x and x³ all rise from left to right."},{"id":"math-15-020","unit":"math-15","topic":"math-15-graphs","lo":"MATH-15.2","d":"M","q":"The graph of y = tan⁻¹x is symmetric about:","o":["the y-axis","the origin","the x-axis","the line y = x"],"a":1,"x":"tan⁻¹(−x) = −tan⁻¹x, so tan⁻¹ is an odd function and its graph is symmetric about the origin. An even function would be symmetric about the y-axis."},{"id":"math-15-021","unit":"math-15","topic":"math-15-graphs","lo":"MATH-15.2","d":"D","q":"The graph of y = cos⁻¹x is symmetric about the point:","o":["(0, 0)","(π/2, 0)","(0, π/2)","(1, 0)"],"a":2,"x":"cos⁻¹(−x) = π − cos⁻¹x, so the points (x, y) and (−x, π − y) both lie on the graph; their midpoint is (0, π/2). cos⁻¹ is not odd, so the origin is wrong."},{"id":"math-15-022","unit":"math-15","topic":"math-15-graphs","lo":"MATH-15.2","d":"M","q":"The graph of y = sec⁻¹x, |x| ≥ 1, approaches which horizontal line as x → ∞ and as x → −∞?","o":["y = π/2","y = 0","y = π","y = −π/2"],"a":0,"x":"sec⁻¹x = cos⁻¹(1/x), and 1/x → 0, so y → cos⁻¹0 = π/2 from both sides; π/2 itself is never reached. y = 0 and y = π are the values at x = 1 and x = −1."},{"id":"math-15-023","unit":"math-15","topic":"math-15-graphs","lo":"MATH-15.2","d":"M","q":"At how many points does the line y = 1 meet the graph of y = tan⁻¹x?","o":["1","0","2","infinitely many"],"a":0,"x":"tan⁻¹x is increasing and takes every value in (−π/2, π/2) once; 1 < π/2 ≈ 1.57, so there is exactly one point, x = tan 1. Many points would be true for y = tan x, not its inverse."},{"id":"math-15-024","unit":"math-15","topic":"math-15-graphs","lo":"MATH-15.2","d":"M","q":"How many points do the graphs of y = sin⁻¹x and y = cos⁻¹x have in common?","o":["0","2","1","infinitely many"],"a":2,"x":"sin⁻¹x = cos⁻¹x means sin⁻¹x = π/2 − sin⁻¹x, so sin⁻¹x = π/4 and x = 1/√2 only. One graph rises and the other falls, so they cross once."},{"id":"math-15-025","unit":"math-15","topic":"math-15-graphs","lo":"MATH-15.2","d":"D","q":"The graph of y = sin⁻¹x + cos⁻¹x, for −1 ≤ x ≤ 1, is:","o":["a horizontal segment at height π/2","a straight segment through the origin with slope 1","a curve from (−1, −π) to (1, π)","a horizontal segment at height π"],"a":0,"x":"sin⁻¹x + cos⁻¹x = π/2 for every x in [−1, 1], so the graph is the horizontal segment y = π/2 from x = −1 to x = 1. Check at x = 1: π/2 + 0 = π/2."},{"id":"math-15-026","unit":"math-15","topic":"math-15-graphs","lo":"MATH-15.2","d":"E","q":"Which point lies on the graph of y = tan⁻¹x?","o":["(π/4, 1)","(1, π/2)","(0, π/2)","(1, π/4)"],"a":3,"x":"tan⁻¹1 = π/4, so (1, π/4) is on the graph. (π/4, 1) lies on y = tan x, the original function."},{"id":"math-15-027","unit":"math-15","topic":"math-15-graphs","lo":"MATH-15.2","d":"M","q":"Taking the principal range of cot⁻¹ as (0, π), the graph of y = cot⁻¹x cuts the y-axis at:","o":["(0, 0)","(0, π)","(0, π/2)","(π/2, 0)"],"a":2,"x":"On the y-axis x = 0, and cot⁻¹0 = π/2 because cot(π/2) = 0. The values 0 and π are never reached, since the range is open."},{"id":"math-15-028","unit":"math-15","topic":"math-15-formulas","lo":"MATH-15.3","d":"E","q":"For −1 ≤ x ≤ 1, sin⁻¹x + cos⁻¹x equals:","o":["π/2","π","0","π/4"],"a":0,"x":"If sin⁻¹x = θ then x = sin θ = cos(π/2 − θ), so cos⁻¹x = π/2 − θ and the sum is π/2. Check x = 0: 0 + π/2."},{"id":"math-15-029","unit":"math-15","topic":"math-15-formulas","lo":"MATH-15.3","d":"M","q":"tan⁻¹(1/2) + tan⁻¹(1/3) equals:","o":["π/3","π/6","π/4","π/2"],"a":2,"x":"tan⁻¹x + tan⁻¹y = tan⁻¹((x + y)/(1 − xy)) when xy < 1: (5/6)/(1 − 1/6) = (5/6)/(5/6) = 1, and tan⁻¹1 = π/4."},{"id":"math-15-030","unit":"math-15","topic":"math-15-formulas","lo":"MATH-15.3","d":"D","q":"tan⁻¹2 + tan⁻¹3 equals:","o":["−π/4","π/4","3π/4","π/2"],"a":2,"x":"(2 + 3)/(1 − 6) = −1, but here xy > 1 and both are positive, so each angle exceeds π/4 and the sum is π + tan⁻¹(−1) = 3π/4. Applying the formula blindly gives −π/4."},{"id":"math-15-031","unit":"math-15","topic":"math-15-formulas","lo":"MATH-15.3","d":"M","q":"2 tan⁻¹(1/3) equals:","o":["tan⁻¹(2/3)","tan⁻¹(3/5)","tan⁻¹(3/4)","tan⁻¹(4/3)"],"a":2,"x":"2 tan⁻¹x = tan⁻¹(2x/(1 − x²)) for |x| < 1: (2/3)/(1 − 1/9) = (2/3)/(8/9) = 3/4. Simply doubling 1/3 gives 2/3; using 1 + x² gives 3/5."},{"id":"math-15-032","unit":"math-15","topic":"math-15-formulas","lo":"MATH-15.3","d":"M","q":"sin⁻¹(3/5) + sin⁻¹(4/5) equals:","o":["π","π/3","π/4","π/2"],"a":3,"x":"If θ = sin⁻¹(3/5), then cos θ = 4/5, so sin⁻¹(4/5) = cos⁻¹(3/5) = π/2 − θ. The sum is π/2."},{"id":"math-15-033","unit":"math-15","topic":"math-15-formulas","lo":"MATH-15.3","d":"E","q":"If tan⁻¹x = π/10, then cot⁻¹x (principal range (0, π)) equals:","o":["9π/10","2π/5","π/10","π/5"],"a":1,"x":"tan⁻¹x + cot⁻¹x = π/2, so cot⁻¹x = π/2 − π/10 = 4π/10 = 2π/5. Subtracting from π instead gives 9π/10."},{"id":"math-15-034","unit":"math-15","topic":"math-15-formulas","lo":"MATH-15.3","d":"D","q":"The solution set of tan⁻¹(2x) + tan⁻¹(3x) = π/4 is:","o":["x = −1 only","x = 1/6 only","x = 1/6 and x = −1","x = 1/2 only"],"a":1,"x":"5x/(1 − 6x²) = 1 gives 6x² + 5x − 1 = 0, so x = 1/6 or x = −1. At x = −1 the left side is tan⁻¹(−2) + tan⁻¹(−3) = −3π/4, not π/4, so only x = 1/6 works."},{"id":"math-15-035","unit":"math-15","topic":"math-15-formulas","lo":"MATH-15.3","d":"M","q":"For −1 ≤ x ≤ 1, cos⁻¹(−x) equals:","o":["−cos⁻¹x","π + cos⁻¹x","π/2 − cos⁻¹x","π − cos⁻¹x"],"a":3,"x":"If cos⁻¹x = θ in [0, π], then cos(π − θ) = −x and π − θ is also in [0, π], so cos⁻¹(−x) = π − cos⁻¹x. −cos⁻¹x would be negative, outside the range."},{"id":"math-15-036","unit":"math-15","topic":"math-15-formulas","lo":"MATH-15.3","d":"D","q":"cos(sin⁻¹(3/5) + sin⁻¹(5/13)) equals:","o":["63/65","56/65","33/65","16/65"],"a":2,"x":"Let A = sin⁻¹(3/5), B = sin⁻¹(5/13): cos A = 4/5, cos B = 12/13. cos(A + B) = (4/5)(12/13) − (3/5)(5/13) = 48/65 − 15/65 = 33/65. Adding instead gives 63/65, which is cos(A − B)."},{"id":"math-15-037","unit":"math-15","topic":"math-15-formulas","lo":"MATH-15.3","d":"M","q":"tan⁻¹3 − tan⁻¹(1/2) equals:","o":["π/4","π/3","π/6","−π/4"],"a":0,"x":"tan⁻¹x − tan⁻¹y = tan⁻¹((x − y)/(1 + xy)): (3 − 1/2)/(1 + 3/2) = (5/2)/(5/2) = 1, so the value is π/4. Since 3 > 1/2 the difference is positive."},{"id":"math-15-038","unit":"math-15","topic":"math-15-formulas","lo":"MATH-15.3","d":"E","q":"For every real x, tan⁻¹(−x) equals:","o":["−tan⁻¹x","π − tan⁻¹x","tan⁻¹x","π/2 − tan⁻¹x"],"a":0,"x":"tan(−θ) = −tan θ and the range (−π/2, π/2) is symmetric about 0, so tan⁻¹(−x) = −tan⁻¹x. π − tan⁻¹x is the pattern for cos⁻¹, not tan⁻¹."},{"id":"math-15-039","unit":"math-15","topic":"math-15-formulas","lo":"MATH-15.3","d":"M","q":"cos(2 sin⁻¹(1/3)) equals:","o":["7/9","2/3","8/9","−7/9"],"a":0,"x":"With θ = sin⁻¹(1/3), cos 2θ = 1 − 2 sin²θ = 1 − 2/9 = 7/9. 8/9 is cos²θ, and 2/3 comes from doubling 1/3."},{"id":"math-15-040","unit":"math-15","topic":"math-15-formulas","lo":"MATH-15.3","d":"D","q":"cos⁻¹(4/5) + tan⁻¹(1/7) equals:","o":["π/4","π/3","π/2","π/6"],"a":0,"x":"cos⁻¹(4/5) is an acute angle with tangent 3/4, so it equals tan⁻¹(3/4). Then (3/4 + 1/7)/(1 − 3/28) = (25/28)/(25/28) = 1, giving π/4."},{"id":"math-16-001","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"M","q":"How many zeros does y = sin 2x have on the closed interval [0, 2π]?","o":["5","2","3","4"],"a":0,"x":"sin 2x = 0 when 2x = kπ, i.e. x = kπ/2. In [0, 2π] these are 0, π/2, π, 3π/2 and 2π: five zeros. Answering 4 leaves out one endpoint of the closed interval."},{"id":"math-16-002","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"E","q":"The general solution of sin θ = 0 is (n ∈ Z):","o":["θ = nπ","θ = 2nπ","θ = nπ/2","θ = (2n + 1)π/2"],"a":0,"x":"sin θ = 0 at θ = 0, π, 2π, … and the negatives, i.e. every integer multiple of π. 2nπ misses π, and (2n + 1)π/2 are the zeros of cos θ."},{"id":"math-16-003","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"E","q":"The general solution of tan θ = 1 is (n ∈ Z):","o":["θ = π/4 + 2nπ","θ = π/4 + nπ","θ = π/4 + nπ/2","θ = nπ − π/4"],"a":1,"x":"tan θ has period π, and tan(π/4) = 1, so θ = π/4 + nπ. Adding 2nπ misses 5π/4; nπ − π/4 gives tan θ = −1."},{"id":"math-16-004","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"M","q":"The general solution of sin θ = 1/2 is (n ∈ Z):","o":["θ = π/6 + 2nπ or θ = 7π/6 + 2nπ","θ = π/6 + 2nπ or θ = 5π/6 + 2nπ","θ = π/6 + nπ","θ = π/6 + 2nπ or θ = −π/6 + 2nπ"],"a":1,"x":"sin is positive in quadrants I and II: θ = π/6 and π − π/6 = 5π/6, each plus 2nπ. π/6 + nπ includes 7π/6 where sin θ = −1/2; ±π/6 is the pattern for cos."},{"id":"math-16-005","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"M","q":"The general solution of cos θ = −1/2 is (n ∈ Z):","o":["θ = π/3 + 2nπ or θ = 5π/3 + 2nπ","θ = 2π/3 + 2nπ or θ = 4π/3 + 2nπ","θ = 2π/3 + 2nπ or θ = π/3 + 2nπ","θ = 2π/3 + nπ"],"a":1,"x":"cos is negative in quadrants II and III: θ = π − π/3 = 2π/3 and π + π/3 = 4π/3, plus 2nπ (i.e. 2nπ ± 2π/3). π/3 and 5π/3 solve cos θ = +1/2; 2π/3 + nπ includes 5π/3."},{"id":"math-16-006","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"M","q":"The general solution of tan θ = −√3 is (n ∈ Z):","o":["θ = π/3 + nπ","θ = 5π/6 + nπ","θ = 2π/3 + nπ","θ = 2π/3 + 2nπ"],"a":2,"x":"tan(π/3) = √3, so tan θ = −√3 at θ = π − π/3 = 2π/3; the period of tan is π, giving 2π/3 + nπ. Using 2nπ misses 5π/3; π/3 + nπ gives +√3."},{"id":"math-16-007","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"M","q":"The solutions of sin θ = −√3/2 in the interval 0 ≤ θ ≤ 2π are:","o":["π/3 and 2π/3","2π/3 and 4π/3","4π/3 and 5π/3","7π/6 and 11π/6"],"a":2,"x":"Reference angle π/3 (sin π/3 = √3/2); sin is negative in quadrants III and IV: π + π/3 = 4π/3 and 2π − π/3 = 5π/3. 7π/6 and 11π/6 solve sin θ = −1/2."},{"id":"math-16-008","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"M","q":"The solutions of cos 2θ = 1/2 in the interval 0 ≤ θ ≤ π are:","o":["π/6 and 5π/6","π/6 only","π/3 and 5π/3","π/6 and π/3"],"a":0,"x":"For 0 ≤ θ ≤ π, 2θ runs over [0, 2π], where cos 2θ = 1/2 at 2θ = π/3 and 5π/3, so θ = π/6 and 5π/6. Stopping at 2θ = π/3 loses 5π/6; π/3 and 5π/3 forget to halve."},{"id":"math-16-009","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"M","q":"How many solutions does tan 3θ = 1 have in the interval 0 ≤ θ < π?","o":["1","3","2","6"],"a":1,"x":"3θ = π/4 + nπ gives θ = π/12 + nπ/3: π/12, 5π/12 and 9π/12 lie in [0, π), and the next, 13π/12, does not. So 3 solutions. Taking only the principal value gives 1."},{"id":"math-16-010","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"M","q":"The general solution of sin θ = sin(π/5) is (n ∈ Z):","o":["θ = 2nπ ± π/5","θ = nπ + π/5","θ = nπ − (−1)ⁿ π/5","θ = nπ + (−1)ⁿ π/5"],"a":3,"x":"sin θ = sin α gives θ = nπ + (−1)ⁿα: n = 0 gives π/5 and n = 1 gives π − π/5 = 4π/5. 2nπ ± α is the rule for cos, and nπ + π/5 includes 6π/5 where sin is negative."},{"id":"math-16-011","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"D","q":"The general solution of cos 3θ = cos θ is (n ∈ Z):","o":["θ = nπ","θ = nπ/2","θ = 2nπ","θ = nπ/4"],"a":1,"x":"cos A = cos B gives A = 2nπ ± B: 3θ = 2nπ + θ ⇒ θ = nπ, and 3θ = 2nπ − θ ⇒ θ = nπ/2. The second family contains the first, so θ = nπ/2. Check θ = π/2: cos(3π/2) = 0 = cos(π/2). Keeping only the + sign gives nπ."},{"id":"math-16-012","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"D","q":"The general solution of tan 2θ = tan θ, where both sides are defined, is (n ∈ Z):","o":["θ = nπ/2","θ = nπ/3","θ = nπ","θ = 2nπ"],"a":2,"x":"tan A = tan B gives A = nπ + B, so 2θ = nπ + θ and θ = nπ. Then tan 2θ = tan θ = 0. θ = nπ/2 would include π/2, where tan θ is undefined; 2nπ misses θ = π."},{"id":"math-16-013","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"M","q":"The smallest positive solution of 2 cos θ + √3 = 0 is:","o":["5π/6","π/6","7π/6","2π/3"],"a":0,"x":"cos θ = −√3/2. The reference angle is π/6 and cos is negative first in quadrant II, so θ = π − π/6 = 5π/6. π/6 ignores the sign; 2π/3 has cos = −1/2."},{"id":"math-16-014","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"E","q":"The solutions of tan θ = 1/√3 with 0° ≤ θ < 360° are:","o":["30° and 210°","30° and 150°","30° and 330°","60° and 240°"],"a":0,"x":"tan 30° = 1/√3 and tan has period 180°, so θ = 30° and 210°. 150° and 330° have tan = −1/√3; 60° and 240° solve tan θ = √3."},{"id":"math-16-015","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"M","q":"The equation 3 sin θ = k has a real solution θ exactly when:","o":["−3 ≤ k ≤ 3","−1 ≤ k ≤ 1","−1/3 ≤ k ≤ 1/3","−3 < k < 3"],"a":0,"x":"sin θ = k/3 is solvable only when −1 ≤ k/3 ≤ 1, i.e. −3 ≤ k ≤ 3. The endpoints are allowed: k = 3 gives θ = π/2."},{"id":"math-16-016","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"D","q":"The sum of all solutions of sin θ = 1/2 in the interval 0 ≤ θ ≤ 4π is:","o":["2π","3π","4π","6π"],"a":3,"x":"The solutions are π/6, 5π/6, 13π/6 and 17π/6 (two in each turn of 2π). Their sum is (1 + 5 + 13 + 17)π/6 = 36π/6 = 6π. Stopping at 2π leaves only π/6 + 5π/6 = π."},{"id":"math-16-017","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"M","q":"The general solution of sin(2θ − π/3) = 0 is (n ∈ Z):","o":["θ = nπ + π/6","θ = nπ/2 + π/6","θ = nπ + π/3","θ = nπ/2 − π/6"],"a":1,"x":"2θ − π/3 = nπ, so 2θ = nπ + π/3 and θ = nπ/2 + π/6. Forgetting to halve nπ gives nπ + π/6; a sign slip with π/3 gives nπ/2 − π/6."},{"id":"math-16-018","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"D","q":"θ = π/3 is a solution of cos 2θ = k. Which is another solution of the same equation in the interval 0 < θ < π?","o":["π/6","5π/6","π/2","2π/3"],"a":3,"x":"k = cos(2π/3) = −1/2. cos 2θ = −1/2 with 0 < 2θ < 2π gives 2θ = 2π/3 or 4π/3, so θ = π/3 or 2π/3. Check π/6: cos(π/3) = +1/2, so it is not a solution."},{"id":"math-16-019","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"M","q":"The general solution of tan(θ/2) = √3 is (n ∈ Z):","o":["θ = 2π/3 + nπ","θ = 2π/3 + 2nπ","θ = π/6 + nπ/2","θ = π/3 + 2nπ"],"a":1,"x":"θ/2 = π/3 + nπ, so θ = 2π/3 + 2nπ. Doubling only π/3 and not nπ gives 2π/3 + nπ; halving instead of doubling gives π/6 + nπ/2."},{"id":"math-16-020","unit":"math-16","topic":"math-16-general","lo":"MATH-16.1","d":"M","q":"The general solution of cosec θ = √2 is (n ∈ Z):","o":["θ = 2nπ ± π/4","θ = nπ + π/4","θ = nπ − (−1)ⁿ π/4","θ = nπ + (−1)ⁿ π/4"],"a":3,"x":"cosec θ = √2 means sin θ = 1/√2, so θ = nπ + (−1)ⁿπ/4 (π/4, 3π/4, 9π/4, …). 2nπ ± π/4 includes −π/4 and nπ + π/4 includes 5π/4, where sin θ is negative."},{"id":"math-16-021","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"E","q":"The values of sin θ that satisfy 2 sin²θ − sin θ − 1 = 0 are:","o":["−1 and 1/2","1 and −1/2","1 and 1/2","2 and −1"],"a":1,"x":"Put s = sin θ: 2s² − s − 1 = (s − 1)(2s + 1) = 0, so s = 1 or s = −1/2. Both lie in [−1, 1], so both are allowed."},{"id":"math-16-022","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"M","q":"The solutions of 2 cos²θ − 3 cos θ + 1 = 0 in the interval 0 ≤ θ < 2π are:","o":["π/3 and 5π/3","0, π/3 and 2π/3","0, 2π/3 and 4π/3","0, π/3 and 5π/3"],"a":3,"x":"(2 cos θ − 1)(cos θ − 1) = 0, so cos θ = 1/2 (θ = π/3, 5π/3) or cos θ = 1 (θ = 0). Missing the root cos θ = 1 leaves out θ = 0."},{"id":"math-16-023","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"M","q":"The general solution of 4 sin²θ = 3 is (n ∈ Z):","o":["θ = 2nπ ± π/3","θ = nπ + π/3","θ = nπ ± π/3","θ = nπ ± π/6"],"a":2,"x":"sin θ = ±√3/2, so θ = π/3, 2π/3, 4π/3, 5π/3, …, which is nπ ± π/3. Taking only the positive root gives nπ + (−1)ⁿπ/3; nπ ± π/6 would solve sin²θ = 1/4."},{"id":"math-16-024","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"M","q":"The solutions of sin²θ + sin θ = 0 in the interval 0 ≤ θ < 2π are:","o":["0, π and π/2","0 and 3π/2","π and 3π/2","0, π and 3π/2"],"a":3,"x":"sin θ(sin θ + 1) = 0: sin θ = 0 gives 0 and π; sin θ = −1 gives 3π/2. Dividing by sin θ loses 0 and π."},{"id":"math-16-025","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"D","q":"The solutions of 2 cos²θ + 3 sin θ = 0 in the interval 0 ≤ θ < 2π are:","o":["π/6 and 5π/6","4π/3 and 5π/3","7π/6 and 11π/6","π/6 and 11π/6"],"a":2,"x":"Replace cos²θ by 1 − sin²θ: 2sin²θ − 3 sin θ − 2 = 0, (2 sin θ + 1)(sin θ − 2) = 0. sin θ = 2 is impossible, so sin θ = −1/2: θ = 7π/6, 11π/6. A sign slip gives sin θ = 1/2."},{"id":"math-16-026","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"M","q":"When 2 sin²θ + 5 sin θ − 3 = 0 is solved as a quadratic in sin θ, which value of sin θ must be rejected?","o":["1/2","3","−1/2","−3"],"a":3,"x":"(2 sin θ − 1)(sin θ + 3) = 0 gives sin θ = 1/2 or sin θ = −3. Since −1 ≤ sin θ ≤ 1, the value −3 is rejected and only sin θ = 1/2 gives solutions."},{"id":"math-16-027","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"M","q":"The general solution of tan²θ − (1 + √3) tan θ + √3 = 0 is (n ∈ Z):","o":["θ = nπ + π/4 or θ = nπ + π/6","θ = nπ − π/4 or θ = nπ − π/3","θ = nπ + π/4 or θ = nπ + π/3","θ = 2nπ + π/4 or θ = 2nπ + π/3"],"a":2,"x":"(tan θ − 1)(tan θ − √3) = 0, so tan θ = 1 (θ = nπ + π/4) or tan θ = √3 (θ = nπ + π/3). tan θ = 1/√3 would give π/6; the period of tan is π, not 2π."},{"id":"math-16-028","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"M","q":"How many solutions does sin 2θ = cos θ have in the interval 0 ≤ θ < 2π?","o":["2","3","4","6"],"a":2,"x":"2 sin θ cos θ − cos θ = cos θ(2 sin θ − 1) = 0: cos θ = 0 gives π/2, 3π/2 and sin θ = 1/2 gives π/6, 5π/6, so 4 solutions. Cancelling cos θ loses two and gives 2."},{"id":"math-16-029","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"M","q":"The general solution of sec²θ = 2 tan θ is (n ∈ Z):","o":["θ = nπ + π/4","θ = nπ ± π/4","θ = 2nπ + π/4","θ = nπ + 3π/4"],"a":0,"x":"sec²θ = 1 + tan²θ, so tan²θ − 2 tan θ + 1 = (tan θ − 1)² = 0 and tan θ = 1: θ = nπ + π/4. nπ ± π/4 includes tan θ = −1, which does not satisfy the equation."},{"id":"math-16-030","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"D","q":"The solutions of sin θ + cos θ = 1 in the interval 0 ≤ θ < 2π are:","o":["0, π/2, π and 3π/2","π/4 only","π/2 and π","0 and π/2"],"a":3,"x":"Squaring gives 1 + sin 2θ = 1, sin 2θ = 0, so θ = 0, π/2, π, 3π/2. Squaring adds roots: at π and 3π/2 the left side is −1. Checking leaves 0 and π/2."},{"id":"math-16-031","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"M","q":"The solutions of cos 2θ + cos θ = 0 in the interval 0 ≤ θ < 2π are:","o":["π/3, π and 5π/3","π/3 and 5π/3","0, 2π/3 and 4π/3","π/3, 2π/3 and π"],"a":0,"x":"cos 2θ = 2cos²θ − 1: 2cos²θ + cos θ − 1 = (2 cos θ − 1)(cos θ + 1) = 0. cos θ = 1/2 gives π/3, 5π/3 and cos θ = −1 gives π. A sign slip in the factors gives cos θ = −1/2 or 1, i.e. 0, 2π/3, 4π/3."},{"id":"math-16-032","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"D","q":"How many solutions does cos 2θ = sin θ have in the interval 0 ≤ θ < 2π?","o":["2","4","1","3"],"a":3,"x":"cos 2θ = 1 − 2sin²θ, so 2sin²θ + sin θ − 1 = (2 sin θ − 1)(sin θ + 1) = 0. sin θ = 1/2 gives π/6, 5π/6 and sin θ = −1 gives only 3π/2: 3 solutions. Counting two angles for sin θ = −1 gives 4."},{"id":"math-16-033","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"E","q":"The general solution of sin θ − √3 cos θ = 0 is (n ∈ Z):","o":["θ = nπ + π/3","θ = nπ + π/6","θ = nπ − π/3","θ = 2nπ + π/3"],"a":0,"x":"cos θ = 0 does not satisfy the equation, so divide by cos θ: tan θ = √3 and θ = nπ + π/3. tan θ = 1/√3 (from dividing the wrong way) gives π/6."},{"id":"math-16-034","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"D","q":"The solutions of √3 sin θ − cos θ = √2 in the interval 0 ≤ θ < 2π are:","o":["π/12 and 7π/12","5π/12 only","5π/12 and 11π/12","5π/12 and 13π/12"],"a":2,"x":"Divide by 2: sin θ cos(π/6) − cos θ sin(π/6) = 1/√2, i.e. sin(θ − π/6) = 1/√2. So θ − π/6 = π/4 or 3π/4, giving θ = 5π/12 or 11π/12. Writing sin(θ + π/6) gives π/12 and 7π/12."},{"id":"math-16-035","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"D","q":"The general solution of tan θ + cot θ = 4/√3 is (n ∈ Z):","o":["θ = nπ + π/3 only","θ = nπ + π/6 or θ = nπ + π/3","θ = nπ + π/4","θ = nπ − π/6 or θ = nπ − π/3"],"a":1,"x":"Put t = tan θ: t + 1/t = 4/√3, so t² − (4/√3)t + 1 = 0. The roots have sum 4/√3 and product 1: t = √3 and 1/√3, giving θ = nπ + π/3 or nπ + π/6. Check t = √3: √3 + 1/√3 = 4/√3."},{"id":"math-16-036","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"D","q":"The solutions of 2 sin²θ + √3 cos θ + 1 = 0 in the interval 0 ≤ θ < 2π are:","o":["π/6 and 11π/6","2π/3 and 4π/3","5π/6 and 7π/6","5π/6 and 11π/6"],"a":2,"x":"Use sin²θ = 1 − cos²θ: 2cos²θ − √3 cos θ − 3 = 0, so cos θ = (√3 ± 3√3)/4 = √3 or −√3/2. Reject √3 > 1; cos θ = −√3/2 gives 5π/6 and 7π/6. Check 5π/6: 1/2 − 3/2 + 1 = 0."},{"id":"math-16-037","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"M","q":"The general solution of 3 tan²θ + 2√3 tan θ + 1 = 0 is (n ∈ Z):","o":["θ = nπ + π/6","θ = nπ ± π/6","θ = nπ − π/3","θ = nπ − π/6"],"a":3,"x":"The left side is (√3 tan θ + 1)², so tan θ = −1/√3 (a repeated root) and θ = nπ − π/6. Missing the sign gives nπ + π/6; tan θ = −√3 would give nπ − π/3."},{"id":"math-16-038","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"M","q":"The solutions of sin 2θ = √3 sin θ in the open interval 0 < θ < π are:","o":["π/6 only","π/6 and 5π/6","π/3 only","π/6 and π"],"a":0,"x":"sin θ(2 cos θ − √3) = 0. sin θ ≠ 0 inside (0, π), so cos θ = √3/2 and θ = π/6. 5π/6 has cos θ = −√3/2, and π is not in the open interval."},{"id":"math-16-039","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"E","q":"To solve 2 cos²θ + sin θ − 1 = 0 as a quadratic in sin θ, cos²θ is replaced by:","o":["sin²θ − 1","1 + sin²θ","1 − sin²θ","1 − 2 sin²θ"],"a":2,"x":"From sin²θ + cos²θ = 1, cos²θ = 1 − sin²θ. The equation becomes 2sin²θ − sin θ − 1 = 0. 1 − 2sin²θ is cos 2θ, not cos²θ."},{"id":"math-16-040","unit":"math-16","topic":"math-16-reducible","lo":"MATH-16.2","d":"M","q":"The solutions of tan θ = 2 sin θ in the interval 0 ≤ θ < 2π are:","o":["π/3 and 5π/3","0, π/3, π and 5π/3","0 and π","0, π/3, 2π/3 and π"],"a":1,"x":"sin θ/cos θ = 2 sin θ gives sin θ(1 − 2 cos θ) = 0: sin θ = 0 (θ = 0, π) or cos θ = 1/2 (θ = π/3, 5π/3). Cancelling sin θ loses 0 and π."},{"id":"math-17-001","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"E","q":"For x > 0, what is the minimum value of x + 9/x?","o":["9","10","18","6"],"a":3,"x":"By AM-GM, x + 9/x ≥ 2√(x · 9/x) = 2√9 = 6, with equality when x = 9/x, i.e. x = 3. The value 10 is just f(1), and 18 comes from 2 × 9 without the square root."},{"id":"math-17-002","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"E","q":"Let f(x) = x³. What is the value of lim(Δx→0) [f(2 + Δx) − f(2)]/Δx?","o":["12","4","6","8"],"a":0,"x":"The limit is the definition of f′(2). Since f′(x) = 3x², f′(2) = 3 × 4 = 12. The value 8 is f(2), not the derivative, and 6 comes from writing 3x instead of 3x²."},{"id":"math-17-003","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"E","q":"What is the derivative of y = x⁵?","o":["x⁴","5x⁵","5x⁴","x⁶/6"],"a":2,"x":"By the power rule (xⁿ)′ = nxⁿ⁻¹, so y′ = 5x⁴. The option x⁶/6 is an antiderivative, not a derivative, and 5x⁵ forgets to lower the power by one."},{"id":"math-17-004","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"E","q":"Which of the following derivative formulas is correct?","o":["(sin x)′ = −cos x","(cos x)′ = sin x","(eˣ)′ = x·eˣ⁻¹","(ln x)′ = 1/x"],"a":3,"x":"The standard results are (sin x)′ = cos x, (cos x)′ = −sin x, (eˣ)′ = eˣ and (ln x)′ = 1/x (x > 0). The formula x·eˣ⁻¹ wrongly applies the power rule to an exponential function, and the two trigonometric options have the minus sign in the wrong place."},{"id":"math-17-005","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"M","q":"For x > 1, what is the minimum value of x + 4/(x − 1)?","o":["4","6","8","5"],"a":3,"x":"Write x + 4/(x − 1) = (x − 1) + 4/(x − 1) + 1 ≥ 2√4 + 1 = 5, with equality when x − 1 = 2, i.e. x = 3. The answer 4 forgets the +1 that was added to make the product constant."},{"id":"math-17-006","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"M","q":"If f′(x₀) = 3, what is the value of lim(h→0) [f(x₀ + 2h) − f(x₀)]/h?","o":["3/2","3","12","6"],"a":3,"x":"Write the quotient as 2 × [f(x₀ + 2h) − f(x₀)]/(2h); as h → 0 the bracket tends to f′(x₀) = 3, so the limit is 2 × 3 = 6. Answering 3 ignores that the increment is 2h while the denominator is only h; 3/2 divides by 2 instead of multiplying."},{"id":"math-17-007","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"E","q":"What is the derivative of y = √x (x > 0)?","o":["1/(2√x)","2√x","−1/(2√x)","√x/2"],"a":0,"x":"Write √x = x^(1/2); the power rule gives (1/2)x^(−1/2) = 1/(2√x). The option √x/2 keeps the original power instead of reducing it by one, and the negative option confuses √x with 1/√x."},{"id":"math-17-008","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"M","q":"What is the derivative of y = 2ˣ?","o":["2ˣ ln 2","x·2ˣ⁻¹","2ˣ/ln 2","2ˣ"],"a":0,"x":"For aˣ with a > 0, (aˣ)′ = aˣ ln a, so y′ = 2ˣ ln 2. The option x·2ˣ⁻¹ treats the exponential as a power function, and 2ˣ alone is correct only for base e."},{"id":"math-17-009","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"E","q":"A rectangular garden has an area of 64 m². What is the smallest possible perimeter?","o":["32 m","16 m","24 m","40 m"],"a":0,"x":"With sides x and y, xy = 64 and x + y ≥ 2√64 = 16, so the perimeter 2(x + y) ≥ 32 m, reached by the 8 m × 8 m square. 16 m is only x + y, half the perimeter; 40 m is the 4 m × 16 m rectangle."},{"id":"math-17-010","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"M","q":"If f′(x₀) = 4, what is the value of lim(h→0) [f(x₀ − h) − f(x₀)]/h?","o":["−4","−2","2","4"],"a":0,"x":"Put k = −h: the expression becomes −[f(x₀ + k) − f(x₀)]/k, which tends to −f′(x₀) = −4. The answer 4 overlooks that the increment in x is −h while the denominator is +h."},{"id":"math-17-011","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"E","q":"What is the derivative of y = 1/x²?","o":["−1/x³","2/x³","−2/x³","−2/x"],"a":2,"x":"Write 1/x² = x⁻²; then y′ = −2x⁻³ = −2/x³. The option 2/x³ drops the minus sign from the exponent, and −2/x lowers the power in the wrong direction."},{"id":"math-17-012","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"M","q":"What is the derivative of y = log₃ x (x > 0)?","o":["1/(x ln 3)","ln 3/x","1/(3x)","1/x"],"a":0,"x":"Since log₃ x = ln x / ln 3, y′ = 1/(x ln 3). The option 1/x is the derivative of ln x only, and ln 3/x puts ln 3 in the numerator instead of the denominator."},{"id":"math-17-013","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"M","q":"For x > 0, what is the maximum value of x/(x² + 4)?","o":["1","1/2","1/8","1/4"],"a":3,"x":"Divide top and bottom by x: x/(x² + 4) = 1/(x + 4/x). Since x + 4/x ≥ 2√4 = 4, the fraction is at most 1/4, reached at x = 2. The answer 1/2 uses 1/√4 instead of the minimum value 4 of the denominator."},{"id":"math-17-014","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"D","q":"If f′(x₀) = 2, what is the value of lim(h→0) [f(x₀ + h) − f(x₀ − h)]/h?","o":["4","0","1","2"],"a":0,"x":"Split the numerator: [f(x₀ + h) − f(x₀)]/h + [f(x₀) − f(x₀ − h)]/h. Each part tends to f′(x₀) = 2, so the limit is 4. The answer 2 forgets that the total change in x is 2h, not h."},{"id":"math-17-015","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"E","q":"If f(x) = π², what is f′(x)?","o":["2π","0","π","π²"],"a":1,"x":"π² is a constant (about 9.87), and the derivative of any constant is 0. Writing 2π treats π as the variable, which it is not."},{"id":"math-17-016","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"E","q":"If f(x) = sin x, what is the value of f′(π/3)?","o":["1/2","−1/2","√3/2","−√3/2"],"a":0,"x":"f′(x) = cos x, so f′(π/3) = cos(π/3) = 1/2. The value √3/2 is sin(π/3), the function value rather than the derivative."},{"id":"math-17-017","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"M","q":"For x < 0, what is the maximum value of x + 1/x?","o":["−2","2","−1","0"],"a":0,"x":"Let t = −x > 0. Then t + 1/t ≥ 2, so x + 1/x = −(t + 1/t) ≤ −2, with equality at x = −1. The answer 2 applies AM-GM directly to negative numbers, which is not allowed."},{"id":"math-17-018","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"E","q":"What is the average rate of change of f(x) = x² + 1 on the interval [1, 3]?","o":["4","2","6","8"],"a":0,"x":"Average rate of change = [f(3) − f(1)]/(3 − 1) = (10 − 2)/2 = 4. The value 8 is the change in f without dividing by the length of the interval; 2 and 6 are the instantaneous rates f′(1) and f′(3)."},{"id":"math-17-019","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"M","q":"If f(x) = x³ − 2x² + 5x − 1, what is the value of f′(1)?","o":["2","3","12","4"],"a":3,"x":"f′(x) = 3x² − 4x + 5, so f′(1) = 3 − 4 + 5 = 4. The value 3 is f(1), and 12 comes from adding 3 + 4 + 5 after losing the minus sign."},{"id":"math-17-020","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"M","q":"If f(x) = cos x, what is the value of f′(π/6)?","o":["1/2","√3/2","−√3/2","−1/2"],"a":3,"x":"f′(x) = −sin x, so f′(π/6) = −sin(π/6) = −1/2. Forgetting the minus sign gives 1/2, and √3/2 is just cos(π/6)."},{"id":"math-17-021","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"E","q":"For x > 0, what is the minimum value of 4x + 1/x?","o":["1","2","4","5"],"a":2,"x":"By AM-GM, 4x + 1/x ≥ 2√(4x · 1/x) = 2√4 = 4, with equality when 4x = 1/x, i.e. x = 1/2. The answer 5 is just the value at x = 1, and 2 forgets the factor 4 under the square root."},{"id":"math-17-022","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"E","q":"For a differentiable function y = f(x), what is the geometric meaning of f′(x₀)?","o":["The slope of the tangent line to y = f(x) at x = x₀","The y-intercept of the tangent line to y = f(x) at x = x₀","The value of f(x) at x = x₀ divided by x₀","The average rate of change of f(x) from x = 0 to x = x₀"],"a":0,"x":"f′(x₀) is the limit of the slopes of secant lines through (x₀, f(x₀)), which is the slope of the tangent line at that point. The average rate of change from 0 to x₀ is the slope of one particular secant, not the tangent, and the y-intercept of the tangent is f(x₀) − x₀f′(x₀), not f′(x₀)."},{"id":"math-17-023","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"M","q":"What is the derivative of f(x) = x²eˣ?","o":["2x eˣ","x² eˣ","(2x − x²)eˣ","(x² + 2x)eˣ"],"a":3,"x":"Product rule: f′(x) = (x²)′eˣ + x²(eˣ)′ = 2x eˣ + x²eˣ = (x² + 2x)eˣ. The option 2x eˣ differentiates only the first factor and drops the term x²eˣ."},{"id":"math-17-024","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"M","q":"If f(x) = x ln x (x > 0), what is the value of f′(e)?","o":["1/e","1","e","2"],"a":3,"x":"Product rule: f′(x) = ln x + x·(1/x) = ln x + 1, so f′(e) = 1 + 1 = 2. The answer 1 keeps only one term of the product rule (either ln e or x·1/x)."},{"id":"math-17-025","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"M","q":"For x > 2, what is the minimum value of x + 1/(x − 2)?","o":["4","2","3","5"],"a":0,"x":"x + 1/(x − 2) = (x − 2) + 1/(x − 2) + 2 ≥ 2 + 2 = 4, with equality when x − 2 = 1, i.e. x = 3. The answer 2 forgets to add back the 2 that was subtracted from x."},{"id":"math-17-026","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"M","q":"Using the definition of the derivative, the derivative of f(x) = 1/x at x = 1 is lim(Δx→0) [1/(1 + Δx) − 1]/Δx. What is the value of this limit?","o":["−1/2","0","1","−1"],"a":3,"x":"1/(1 + Δx) − 1 = −Δx/(1 + Δx), so the quotient is −1/(1 + Δx), which tends to −1. This agrees with f′(x) = −1/x² at x = 1. The answer 1 loses the minus sign in the numerator."},{"id":"math-17-027","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"M","q":"If f(x) = (x + 1)/(x − 1), what is the value of f′(2)?","o":["−1/2","1","−2","2"],"a":2,"x":"Quotient rule: f′(x) = [(x − 1) − (x + 1)]/(x − 1)² = −2/(x − 1)², so f′(2) = −2/1 = −2. Getting +2 comes from subtracting the numerator terms in the wrong order."},{"id":"math-17-028","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"M","q":"What is the derivative of y = e⁻³ˣ?","o":["3e⁻³ˣ","e⁻³ˣ","−3e⁻³ˣ","−3x·e⁻³ˣ⁻¹"],"a":2,"x":"Chain rule with u = −3x: y′ = eᵘ·u′ = −3e⁻³ˣ. Writing e⁻³ˣ forgets the inner derivative, and 3e⁻³ˣ loses its minus sign."},{"id":"math-17-029","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"M","q":"What is the largest interval of positive x on which f(x) = x + 4/x is decreasing?","o":["(0, 2]","(0, √2]","[2, +∞)","(0, 4]"],"a":0,"x":"f′(x) = 1 − 4/x², which is negative for 0 < x < 2 and positive for x > 2, so f decreases on (0, 2] and increases on [2, +∞). (0, √2] is only part of that interval; (0, 4] is wrong because the minimum f(2) = 4 is at x = 2, not at x = 4."},{"id":"math-17-030","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"M","q":"What is the derivative of y = sin x / x (x ≠ 0)?","o":["cos x","(sin x − x cos x)/x²","(x cos x + sin x)/x²","(x cos x − sin x)/x²"],"a":3,"x":"Quotient rule: y′ = [(sin x)′·x − sin x·(x)′]/x² = (x cos x − sin x)/x². The option (sin x − x cos x)/x² reverses the order of the subtraction, which changes the sign, and cos x simply divides the derivatives."},{"id":"math-17-031","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"M","q":"If y = ln(2x − 1), what is the value of y′ at x = 1?","o":["1/2","2","1","4"],"a":1,"x":"Chain rule: y′ = 2/(2x − 1), so at x = 1, y′ = 2/1 = 2. The answer 1 forgets the inner derivative 2 and uses 1/(2x − 1)."},{"id":"math-17-032","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"D","q":"The function f(x) = (ax + 1)/(x + 2) is increasing on (−2, +∞). What is the range of a?","o":["a < 1/2","a > 2","a > 1/2","a < −2"],"a":2,"x":"Rewrite f(x) = (a(x + 2) + 1 − 2a)/(x + 2) = a + (1 − 2a)/(x + 2). On (−2, +∞), k/(x + 2) increases when k < 0, so 1 − 2a < 0 and a > 1/2. Choosing a < 1/2 makes the numerator positive, giving a decreasing function."},{"id":"math-17-033","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"M","q":"What is the derivative of y = (2x + 1)⁵?","o":["5(2x + 1)⁴","10(2x + 1)⁴","10(2x + 1)⁵","2(2x + 1)⁴"],"a":1,"x":"Chain rule: y′ = 5(2x + 1)⁴ × (2x + 1)′ = 5(2x + 1)⁴ × 2 = 10(2x + 1)⁴. The option 5(2x + 1)⁴ forgets to multiply by the inner derivative 2."},{"id":"math-17-034","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"E","q":"What is the derivative of y = eˣ + ln x (x > 0)?","o":["x·eˣ⁻¹ + 1/x","eˣ − 1/x","eˣ + 1/x","eˣ + ln x"],"a":2,"x":"Using (eˣ)′ = eˣ and (ln x)′ = 1/x with the sum rule, y′ = eˣ + 1/x. The option x·eˣ⁻¹ + 1/x wrongly treats eˣ as a power of x."},{"id":"math-17-035","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"E","q":"What is the equation of the tangent line to y = x² at the point (1, 1)?","o":["y = x","y = 2x − 1","y = 2x + 1","y = 2x"],"a":1,"x":"y′ = 2x, so the slope at x = 1 is 2 and the tangent is y − 1 = 2(x − 1), i.e. y = 2x − 1. The line y = 2x has the right slope but does not pass through (1, 1)."},{"id":"math-17-036","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"E","q":"What is the derivative of y = 3x² − 5x + 2?","o":["6x − 5","3x − 5","6x² − 5","6x + 2"],"a":0,"x":"Differentiate term by term: (3x²)′ = 6x, (−5x)′ = −5 and the constant 2 gives 0, so y′ = 6x − 5. The option 6x + 2 keeps the constant term, whose derivative is 0."},{"id":"math-17-037","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"M","q":"If y = sin(2x + π/3), what is the value of y′ at x = 0?","o":["1/2","√3","2","1"],"a":3,"x":"Chain rule: y′ = 2cos(2x + π/3), so at x = 0, y′ = 2cos(π/3) = 2 × 1/2 = 1. Forgetting the inner factor 2 gives 1/2, and √3 comes from using sin instead of cos."},{"id":"math-17-038","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"M","q":"What is the equation of the tangent line to the curve y = x³ − 2x at the point where x = 1?","o":["y = −x","y = 3x − 4","y = x + 2","y = x − 2"],"a":3,"x":"At x = 1, y = 1 − 2 = −1 and y′ = 3x² − 2 = 1, so the tangent is y + 1 = 1·(x − 1), i.e. y = x − 2. The option y = 3x − 4 uses slope 3 from differentiating only the x³ term."},{"id":"math-17-039","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"M","q":"What is the derivative of y = x sin x?","o":["cos x","x cos x","sin x − x cos x","sin x + x cos x"],"a":3,"x":"Product rule: y′ = (x)′ sin x + x (sin x)′ = sin x + x cos x. The option cos x multiplies the derivatives of the two factors, which is not the product rule, and x cos x drops the term from differentiating x."},{"id":"math-17-040","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"M","q":"What is the derivative of y = cos² x?","o":["sin 2x","−2cos x","−sin 2x","2cos x"],"a":2,"x":"Chain rule with u = cos x: y′ = 2cos x·(cos x)′ = −2 sin x cos x = −sin 2x. The option sin 2x forgets that (cos x)′ = −sin x, and 2cos x forgets the inner derivative completely."},{"id":"math-17-041","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"M","q":"What is the equation of the tangent line to y = eˣ at the point where x = 0?","o":["y = x","y = x + 1","y = ex","y = 2x + 1"],"a":1,"x":"At x = 0 the point is (0, 1) and the slope is e⁰ = 1, so the tangent is y = x + 1. The line y = x has the correct slope but misses the point (0, 1)."},{"id":"math-17-042","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"M","q":"What is the derivative of y = eˣ/x (x ≠ 0)?","o":["(1 − x)eˣ/x²","eˣ/x²","(x + 1)eˣ/x²","(x − 1)eˣ/x²"],"a":3,"x":"Quotient rule: y′ = (eˣ·x − eˣ·1)/x² = (x − 1)eˣ/x². Reversing the order of subtraction in the numerator gives (1 − x)eˣ/x², which has the wrong sign."},{"id":"math-17-043","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"E","q":"What is the derivative of y = 3 sin x − 2 cos x?","o":["3cos x − 2sin x","−3cos x + 2sin x","3cos x + 2sin x","3sin x + 2cos x"],"a":2,"x":"(sin x)′ = cos x and (cos x)′ = −sin x, so y′ = 3cos x − 2(−sin x) = 3cos x + 2sin x. The option 3cos x − 2sin x forgets the minus sign in the derivative of cos x."},{"id":"math-17-044","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"M","q":"The tangent line to y = ln x at the point (e, 1) also passes through which of the following points?","o":["(0, 1)","(1, 0)","(0, 0)","(0, −1)"],"a":2,"x":"The slope is 1/x = 1/e, so the tangent is y − 1 = (x − e)/e, which simplifies to y = x/e and passes through the origin. The point (0, −1) lies on the tangent at (1, 0), which is y = x − 1, not the tangent at (e, 1)."},{"id":"math-17-045","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"E","q":"If f(x) = x cos x, what is the value of f′(π)?","o":["−π","0","1","−1"],"a":3,"x":"Product rule: f′(x) = cos x − x sin x, so f′(π) = cos π − π sin π = −1 − 0 = −1. The value −π is f(π) = π cos π, not the derivative."},{"id":"math-17-046","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"E","q":"If f(x) = eˣ, what is the value of f′(ln 3)?","o":["e³","ln 3","3","1"],"a":2,"x":"f′(x) = eˣ, so f′(ln 3) = e^(ln 3) = 3. The option e³ substitutes 3 instead of ln 3 into the exponent."},{"id":"math-17-047","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"M","q":"What is the angle of inclination of the tangent line to y = x³/3 − 2x at the point where x = 1?","o":["π/4","π/3","2π/3","3π/4"],"a":3,"x":"y′ = x² − 2, so the slope at x = 1 is −1. An angle of inclination α in [0, π) with tan α = −1 is α = 3π/4. Answering π/4 ignores the negative sign of the slope."},{"id":"math-17-048","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"E","q":"What is the derivative of y = x⁴ − 2x?","o":["4x³","x³ − 2","4x⁴ − 2","4x³ − 2"],"a":3,"x":"By the power rule (x⁴)′ = 4x³ and (2x)′ = 2, so y′ = 4x³ − 2. The option 4x³ forgets to differentiate the term −2x, and 4x⁴ − 2 does not lower the power."},{"id":"math-17-049","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"D","q":"Two lines pass through the point P(2, 3) and are tangent to the parabola y = x². What is the sum of their slopes?","o":["4","8","6","10"],"a":1,"x":"The tangent at (a, a²) is y = 2ax − a². It passes through (2, 3) when 3 = 4a − a², i.e. a² − 4a + 3 = 0, so a = 1 or a = 3. The slopes are 2a = 2 and 6, with sum 8. The answer 4 is the sum of the tangency x-coordinates a, not of the slopes 2a."},{"id":"math-17-050","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"E","q":"If f(x) = x² + 3x, what is the value of f′(2)?","o":["4","5","7","10"],"a":2,"x":"f′(x) = 2x + 3, so f′(2) = 4 + 3 = 7. The value 10 is f(2) = 4 + 6, the function value rather than the derivative."},{"id":"math-17-051","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"M","q":"The tangent to the curve y = x² − x at some point is parallel to the line y = 3x + 1. What is the equation of this tangent?","o":["y = 3x + 4","y = 3x − 2","y = 3x − 6","y = 3x − 4"],"a":3,"x":"Parallel means slope 3: y′ = 2x − 1 = 3 gives x = 2 and y = 4 − 2 = 2. The tangent is y − 2 = 3(x − 2), i.e. y = 3x − 4. The option y = 3x + 4 comes from a sign error when expanding 3(x − 2)."},{"id":"math-17-052","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"E","q":"What is the derivative of y = 1/x (x ≠ 0)?","o":["ln x","−1/x²","1/x²","−1/x"],"a":1,"x":"Write 1/x = x⁻¹; the power rule gives −1·x⁻² = −1/x². The option ln x is an antiderivative of 1/x, not its derivative, and 1/x² loses the minus sign."},{"id":"math-17-053","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"D","q":"The tangent to y = x ln x at a point P is perpendicular to the line x + 2y = 0. What is the equation of this tangent?","o":["y = 2x − 2e","y = 2x − e","y = 2x + e","y = 2x − 1"],"a":1,"x":"The line x + 2y = 0 has slope −1/2, so the tangent has slope 2. y′ = ln x + 1 = 2 gives x = e and y = e ln e = e, so P = (e, e) and the tangent is y − e = 2(x − e), i.e. y = 2x − e. The option y = 2x − 1 uses the point x = 1, where the slope is only 1."},{"id":"math-17-054","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"E","q":"What is the derivative of y = (x + 1)(x − 2)?","o":["2x − 1","1","2x + 1","2x − 3"],"a":0,"x":"Product rule: y′ = 1·(x − 2) + (x + 1)·1 = 2x − 1 (or expand to x² − x − 2 first). The answer 1 multiplies the derivatives of the two factors, which is not how a product is differentiated."},{"id":"math-17-055","unit":"math-17","topic":"math-17-apps","lo":"MATH-17.6","d":"M","q":"A line through the origin is tangent to the curve y = eˣ. What is the slope of this line?","o":["e","1","e²","1/e"],"a":0,"x":"The tangent at (a, eᵃ) is y − eᵃ = eᵃ(x − a). Passing through (0, 0) gives −eᵃ = −aeᵃ, so a = 1 and the slope is e¹ = e. The answer 1 is the slope at x = 0, but the tangent there, y = x + 1, does not pass through the origin."},{"id":"math-17-056","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"M","q":"If f′(x₀) = 5, what is the value of lim(h→0) [f(x₀ + 3h) − f(x₀ − 2h)]/h?","o":["5","15","−5","25"],"a":3,"x":"Write it as 3·[f(x₀ + 3h) − f(x₀)]/(3h) + 2·[f(x₀) − f(x₀ − 2h)]/(2h) → 3f′(x₀) + 2f′(x₀) = 5 × 5 = 25. Using 3 − 2 = 1 instead of 3 + 2 gives 5."},{"id":"math-17-057","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"D","q":"A function f is differentiable with f(2) = 3 and f′(2) = 1. What is the value of lim(x→2) [3x² − 4f(x)]/(x − 2)?","o":["8","16","12","−4"],"a":0,"x":"Add and subtract 12: [3(x² − 4) − 4(f(x) − 3)]/(x − 2) → 3 × 2 × 2 − 4f′(2) = 12 − 4 = 8. Adding the two parts instead of subtracting gives 16."},{"id":"math-17-058","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"E","q":"To find the derivative of √x from first principles, the difference quotient [√(x + h) − √x]/h is multiplied above and below by the conjugate. What does it become?","o":["1/(√(x + h) − √x)","h/(√(x + h) + √x)","1/(√(x + h) + √x)","(√(x + h) + √x)/h"],"a":2,"x":"The numerator becomes (x + h) − x = h, which cancels the h below, leaving 1/(√(x + h) + √x). As h → 0 this tends to 1/(2√x)."},{"id":"math-17-059","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"M","q":"What is the value of lim(h→0) [1/√(4 + h) − 1/2]/h?","o":["1/16","−1/16","−1/8","−1/4"],"a":1,"x":"This is f′(4) for f(x) = x^(−1/2): f′(x) = −½x^(−3/2), so f′(4) = −½ × 1/8 = −1/16. Dropping the minus sign gives 1/16."},{"id":"math-17-060","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"E","q":"What is the value of lim(h→0) [e^(2 + h) − e²]/h?","o":["e²","2e","e","1"],"a":0,"x":"The limit is the derivative of eˣ at x = 2, and (eˣ)′ = eˣ, so the value is e². Treating e² like x² and writing 2e is the usual slip."},{"id":"math-17-061","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"M","q":"For f(x) = |x² − 4|, what is the right-hand derivative of f at x = 2, that is lim(h→0⁺) [f(2 + h) − f(2)]/h?","o":["−4","0","4","2"],"a":2,"x":"For x slightly above 2, x² − 4 > 0, so f(x) = x² − 4 and the right-hand derivative is 2x = 4. From the left f(x) = 4 − x² gives −4, so f is not differentiable at 2."},{"id":"math-17-062","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"M","q":"Which function is continuous at x = 0 but NOT differentiable there?","o":["f(x) = x|x|","f(x) = x²","f(x) = |x|","f(x) = sin x"],"a":2,"x":"For |x| the difference quotient |h|/h is 1 from the right and −1 from the left, so there is a corner at 0. For x|x| the quotient is |h| → 0, so it is differentiable with f′(0) = 0."},{"id":"math-17-063","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"D","q":"f(x) = x² for x ≤ 1 and f(x) = ax + b for x > 1. For which values is f differentiable at x = 1?","o":["a = 1, b = 0","a = 2, b = −1","a = 2, b = 1","a = −2, b = 3"],"a":1,"x":"Continuity at 1: a + b = 1. Equal one-sided derivatives: a = 2x at x = 1, so a = 2 and b = −1. a = 1, b = 0 makes f only continuous, with a corner."},{"id":"math-17-064","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"M","q":"A differentiable function has f(1) = 2 and f′(1) = 3. What is lim(x→1) [f(x) − 2]/(x² − 1)?","o":["3","6","1/2","3/2"],"a":3,"x":"Write it as [f(x) − f(1)]/(x − 1) × 1/(x + 1) → f′(1) × ½ = 3/2. Forgetting the factor 1/(x + 1) gives 3."},{"id":"math-17-065","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"M","q":"A differentiable function has f(1) = 2 and f′(1) = 3. What is lim(h→0) [(f(1 + h))² − (f(1))²]/h?","o":["6","9","12","4"],"a":2,"x":"The limit is the derivative of g(x) = (f(x))² at x = 1: g′ = 2f(x)f′(x) = 2 × 2 × 3 = 12. Forgetting the factor 2 gives 6."},{"id":"math-17-066","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"E","q":"The tangent to y = f(x) at x = 2 makes an angle of 45° with the positive x-axis. What is lim(h→0) [f(2 + h) − f(2)]/h?","o":["1/√2","π/4","1","√3"],"a":2,"x":"The limit is f′(2), the slope of the tangent, and slope = tan 45° = 1. π/4 is the angle itself, not its tangent."},{"id":"math-17-067","unit":"math-17","topic":"math-17-first","lo":"MATH-17.1","d":"M","q":"For f(x) = x³, what does the difference quotient [f(x + h) − f(x)]/h simplify to (h ≠ 0)?","o":["3x² + 3xh","3x² + h²","3x² + 3xh + h²","3x²h + 3xh² + h³"],"a":2,"x":"(x + h)³ − x³ = 3x²h + 3xh² + h³; dividing by h gives 3x² + 3xh + h², which tends to 3x² as h → 0. The last expression is the numerator before dividing by h."},{"id":"math-17-068","unit":"math-17","topic":"math-17-rules","lo":"MATH-17.2","d":"M","q":"Given f(2) = 3, f′(2) = −1, g(2) = 1 and g′(2) = 4, what is the derivative of f(x)/g(x) at x = 2?","o":["11","13","−11","−13"],"a":3,"x":"Quotient rule: (f′g − fg′)/g² = (−1 × 1 − 3 × 4)/1² = −13. Swapping the order in the numerator gives 13; using a plus sign gives 11."},{"id":"math-17-069","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"M","q":"What is the derivative of y = tan⁻¹(x²)?","o":["1/(1 + x⁴)","2x/(1 + x⁴)","2x/(1 + x²)","2x/(1 − x⁴)"],"a":1,"x":"(tan⁻¹u)′ = u′/(1 + u²) with u = x², so y′ = 2x/(1 + x⁴). Forgetting the chain-rule factor 2x gives 1/(1 + x⁴)."},{"id":"math-17-070","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"M","q":"What is the derivative of y = cosh²x?","o":["−sinh 2x","sinh 2x","2 sinh x","cosh 2x"],"a":1,"x":"y′ = 2 cosh x · sinh x = sinh 2x, since (cosh x)′ = sinh x with no minus sign. Copying the trig rule (cos x)′ = −sin x gives −sinh 2x."},{"id":"math-17-071","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"D","q":"What is the derivative of y = tan⁻¹[(1 + x)/(1 − x)] for x ≠ 1?","o":["2/(1 + x²)","1/(1 + x²)","−1/(1 + x²)","1/(1 − x²)"],"a":1,"x":"With u = (1 + x)/(1 − x): u′ = 2/(1 − x)² and 1 + u² = 2(1 + x²)/(1 − x)², so y′ = u′/(1 + u²) = 1/(1 + x²). Check: for x < 1, y = π/4 + tan⁻¹x."},{"id":"math-17-072","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"M","q":"What is the derivative of y = ln(sec x + tan x)?","o":["sec x","tan x","sec x tan x","sec²x"],"a":0,"x":"y′ = (sec x tan x + sec²x)/(sec x + tan x) = sec x(tan x + sec x)/(sec x + tan x) = sec x. Keeping only the derivative of sec x on top and forgetting to divide gives sec x tan x."},{"id":"math-17-073","unit":"math-17","topic":"math-17-trans","lo":"MATH-17.3","d":"E","q":"What is the derivative of y = cosh⁻¹x for x > 1?","o":["1/√(1 − x²)","−1/√(x² − 1)","1/√(x² + 1)","1/√(x² − 1)"],"a":3,"x":"The standard result is (cosh⁻¹x)′ = 1/√(x² − 1) for x > 1. 1/√(x² + 1) belongs to sinh⁻¹x and 1/√(1 − x²) to sin⁻¹x."},{"id":"math-17-074","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"E","q":"For the circle x² + y² = 25, what is dy/dx at the point (3, 4)?","o":["−3/4","3/4","−4/3","4/3"],"a":0,"x":"Differentiate: 2x + 2y·y′ = 0, so y′ = −x/y = −3/4. Writing −y/x gives −4/3."},{"id":"math-17-075","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"M","q":"The point (3/2, 3/2) lies on the curve x³ + y³ = 3xy. What is dy/dx there?","o":["1","−1","0","−2"],"a":1,"x":"3x² + 3y²y′ = 3y + 3xy′ gives y′ = (y − x²)/(y² − x). At (3/2, 3/2): (3/2 − 9/4)/(9/4 − 3/2) = (−3/4)/(3/4) = −1."},{"id":"math-17-076","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"M","q":"What is dy/dx for the curve x² + xy + y² = 7 at the point (1, 2)?","o":["−5/4","4/5","−2/3","−4/5"],"a":3,"x":"2x + y + xy′ + 2yy′ = 0, so y′ = −(2x + y)/(x + 2y) = −(2 + 2)/(1 + 4) = −4/5. Turning the fraction upside down gives −5/4."},{"id":"math-17-077","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"E","q":"A curve is given by x = t², y = t³. What is dy/dx at t = 2?","o":["3","1/3","12","6"],"a":0,"x":"dy/dx = (dy/dt)/(dx/dt) = 3t²/(2t) = 3t/2 = 3 at t = 2. Dividing the other way gives 1/3."},{"id":"math-17-078","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"D","q":"A curve is given by x = t², y = t³ (t > 0). What is d²y/dx² at t = 1?","o":["3/2","3/4","3","1/4"],"a":1,"x":"dy/dx = 3t/2, so d²y/dx² = [d/dt(3t/2)]/(dx/dt) = (3/2)/(2t) = 3/4 at t = 1. Forgetting to divide by dx/dt gives 3/2; dividing d²y/dt² by d²x/dt² gives 3."},{"id":"math-17-079","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"M","q":"For the cycloid x = a(t − sin t), y = a(1 − cos t), what is dy/dx?","o":["tan(t/2)","cot(t/2)","−cot(t/2)","sin t"],"a":1,"x":"dy/dx = a sin t/[a(1 − cos t)] = 2 sin(t/2)cos(t/2)/[2 sin²(t/2)] = cot(t/2). Dividing the other way round gives tan(t/2)."},{"id":"math-17-080","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"M","q":"What is the derivative of y = xˣ (x > 0)?","o":["x·x^(x − 1)","xˣ ln x","xˣ(ln x − 1)","xˣ(1 + ln x)"],"a":3,"x":"Take logs: ln y = x ln x, so y′/y = ln x + 1 and y′ = xˣ(1 + ln x). The power rule x·x^(x − 1) wrongly treats the exponent as constant; xˣ ln x treats the base as constant."},{"id":"math-17-081","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"M","q":"What is dy/dx for y = x^(sin x), x > 0?","o":["x^(sin x)(cos x ln x − sin x/x)","x^(sin x) cos x ln x","x^(sin x)(cos x ln x + sin x/x)","sin x · x^(sin x − 1)"],"a":2,"x":"ln y = sin x ln x, so y′/y = cos x ln x + sin x · (1/x), giving y′ = x^(sin x)(cos x ln x + sin x/x). Each one-term answer forgets one half of the product rule."},{"id":"math-17-082","unit":"math-17","topic":"math-17-implicit","lo":"MATH-17.4","d":"D","q":"If y = (x + 1)²(x + 2)³/(x + 3)⁴, what is the value of y′/y at x = 0?","o":["29/6","13/6","11/6","1"],"a":1,"x":"Logarithmic differentiation: y′/y = 2/(x + 1) + 3/(x + 2)
