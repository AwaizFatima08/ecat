1 = 0?","o":["(2, 4)","(4, 2)","(3, 2)","(−2, 4)"],"a":0,"x":"Let the image be (m, n). The midpoint ((4 + m)/2, n/2) lies on the line and PP′ has slope −2 (perpendicular to slope ½). Solving gives (2, 4): the midpoint (3, 2) satisfies 3 − 4 + 1 = 0 and the slope from P is 4/(−2) = −2. (3, 2) is only the foot of the perpendicular."},{"id":"math-20-039","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"M","q":"Point P divides the join of A(2, −3) and B(8, 6) internally in the ratio 1 : 2 (AP : PB). What are the coordinates of P?","o":["(6, 3)","(5, 3/2)","(−4, −12)","(4, 0)"],"a":3,"x":"P = ((1·8 + 2·2)/3, (1·6 + 2·(−3))/3) = (12/3, 0/3) = (4, 0). Swapping the weights gives (6, 3), which divides AB in 2 : 1; (5, 3/2) is the midpoint."},{"id":"math-20-040","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"M","q":"In what ratio does the x-axis divide the line segment joining A(3, −4) and B(−1, 2)?","o":["1 : 2 internally","2 : 1 externally","2 : 1 internally","1 : 2 externally"],"a":2,"x":"Let the ratio be k : 1. The y-coordinate of the point is (2k − 4)/(k + 1) = 0, so k = 2: the ratio is 2 : 1, and k > 0 means internal. Check: the point is (1/3, 0), and AP : PB = 2 : 1."},{"id":"math-20-041","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"M","q":"Point P divides the join of A(−2, 1) and B(4, 7) externally in the ratio 3 : 1. What are the coordinates of P?","o":["(5/2, 11/2)","(7, 10)","(−5, −2)","(1, 4)"],"a":1,"x":"External division: P = ((3·4 − 1·(−2))/(3 − 1), (3·7 − 1·1)/(3 − 1)) = (14/2, 20/2) = (7, 10). Check: AP = (9, 9) and BP = (3, 3), so AP : BP = 3 : 1. (5/2, 11/2) is the internal point."},{"id":"math-20-042","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"E","q":"What is the distance between the points (−3, 2) and (5, −4)?","o":["2√2","14","10","100"],"a":2,"x":"d = √((5 − (−3))² + (−4 − 2)²) = √(64 + 36) = √100 = 10. Adding the coordinates instead of subtracting gives 2√2; 100 forgets the square root."},{"id":"math-20-043","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"M","q":"The distance between the points (k, 3) and (2, −1) is 5. What are the possible values of k?","o":["−5 or 1","5 or −1","2 ± √21","5 only"],"a":1,"x":"(k − 2)² + (3 − (−1))² = 25 gives (k − 2)² = 9, so k − 2 = ±3 and k = 5 or −1. Using 3 − 1 = 2 instead of 4 for the y-difference leads to 2 ± √21; keeping only the positive root misses −1."},{"id":"math-20-044","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"M","q":"Two vertices of a triangle are (2, 5) and (−1, 3), and its centroid is (1, 2). What is the third vertex?","o":["(0, −4)","(4, 2)","(2, −2)","(−2, 2)"],"a":2,"x":"The third vertex is (3·1 − 2 − (−1), 3·2 − 5 − 3) = (2, −2). Check: ((2 − 1 + 2)/3, (5 + 3 − 2)/3) = (1, 2)."},{"id":"math-20-045","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"D","q":"What is the in-centre of the triangle with vertices O(0, 0), A(6, 0) and B(0, 8)?","o":["(2, 2)","(2, 8/3)","(3, 4)","(5/2, 5/2)"],"a":0,"x":"Sides opposite O, A, B are 10, 8, 6. In-centre = ((10·0 + 8·6 + 6·0)/24, (10·0 + 8·0 + 6·8)/24) = (2, 2). Check: for a right triangle the in-radius is (6 + 8 − 10)/2 = 2. (2, 8/3) is the centroid and (3, 4) the circumcentre."},{"id":"math-20-046","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"E","q":"The origin is shifted to the point (2, −3) by a translation of axes. What are the new coordinates of the point P(5, 1)?","o":["(7, −2)","(3, 4)","(3, −2)","(7, 4)"],"a":1,"x":"With X = x − h and Y = y − k: X = 5 − 2 = 3 and Y = 1 − (−3) = 4. Adding instead of subtracting gives (7, −2)."},{"id":"math-20-047","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"M","q":"The axes are translated so that the new origin is (2, −3). What does the equation x² + y² − 4x + 6y − 3 = 0 become?","o":["X² + Y² = 16","X² + Y² = 3","X² + Y² = 10","X² + Y² = 4"],"a":0,"x":"Put x = X + 2, y = Y − 3: (X + 2)² + (Y − 3)² − 4(X + 2) + 6(Y − 3) − 3 = X² + Y² + 4 + 9 − 8 − 18 − 3 = X² + Y² − 16. So X² + Y² = 16, a circle of radius 4 about the new origin."},{"id":"math-20-048","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"M","q":"The axes are rotated through 45°. What are the new coordinates of the point whose old coordinates are (√2, 3√2)?","o":["(4, 2)","(−2, 4)","(2, 4)","(4, −2)"],"a":0,"x":"X = x cos 45° + y sin 45° = (√2 + 3√2)/√2 = 4 and Y = −x sin 45° + y cos 45° = (−√2 + 3√2)/√2 = 2. Rotating the point instead of the axes (the opposite sense) gives (−2, 4)."},{"id":"math-20-049","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"M","q":"The axes are rotated through an acute angle θ, and the point with old coordinates (2, 2√3) gets new coordinates (4, 0). What is θ?","o":["60°","30°","45°","90°"],"a":0,"x":"Y = 0 means the point lies on the new x-axis, so θ is the angle of OP: tan θ = 2√3/2 = √3, θ = 60°. Check: X = 2 cos 60° + 2√3 sin 60° = 1 + 3 = 4."},{"id":"math-20-050","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"D","q":"The axes are rotated through 45°. What does the equation xy = 2 become in the new coordinates X, Y?","o":["X² − Y² = 4","X² − Y² = 2","Y² − X² = 4","X² + Y² = 4"],"a":0,"x":"x = X cos 45° − Y sin 45° = (X − Y)/√2 and y = X sin 45° + Y cos 45° = (X + Y)/√2. Then xy = (X² − Y²)/2 = 2, so X² − Y² = 4. Forgetting the factor ½ gives X² − Y² = 2."},{"id":"math-20-051","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"M","q":"Which point on the x-axis is equidistant from A(1, 2) and B(5, 4)?","o":["(3, 0)","(5/2, 0)","(−9/2, 0)","(9/2, 0)"],"a":3,"x":"(x − 1)² + 4 = (x − 5)² + 16 gives −2x + 5 = −10x + 41, so 8x = 36 and x = 9/2. Check: (7/2)² + 4 = 65/4 and (1/2)² + 16 = 65/4. (3, 0) lies straight below the midpoint (3, 3), but the perpendicular bisector of AB is not vertical."},{"id":"math-20-052","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"M","q":"The vertices of a triangle are O(0, 0), A(3, 4) and B(−4, 3). What kind of triangle is OAB?","o":["Equilateral","Right-angled but not isosceles","Isosceles but not right-angled","Right-angled and isosceles"],"a":3,"x":"OA = √(9 + 16) = 5, OB = √(16 + 9) = 5 and AB = √(49 + 1) = √50. Two sides are equal and 5² + 5² = 50 = AB², so the triangle is right-angled at O and isosceles."},{"id":"math-20-053","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"M","q":"Three consecutive vertices of a parallelogram ABCD are A(1, 2), B(4, 3) and C(6, 6). What is D?","o":["(9, 7)","(−1, −1)","(3, 5)","(7/2, 4)"],"a":2,"x":"The diagonals bisect each other, so A + C = B + D, giving D = (1 + 6 − 4, 2 + 6 − 3) = (3, 5). Check: the midpoints of AC and BD are both (7/2, 4). (9, 7) = B + C − A is the wrong vertex order."},{"id":"math-20-054","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"D","q":"In what ratio does the line 2x + y − 4 = 0 divide the segment joining A(−1, 1) and B(5, 4)?","o":["2 : 1 internally","1 : 2 internally","1 : 2 externally","2 : 1 externally"],"a":1,"x":"Take P = ((5k − 1)/(k + 1), (4k + 1)/(k + 1)) for ratio k : 1. On the line: 2(5k − 1) + (4k + 1) − 4(k + 1) = 0, so 10k − 5 = 0 and k = 1/2, i.e. 1 : 2 internally. Check: P = (1, 2) and 2 + 2 − 4 = 0."},{"id":"math-20-055","unit":"math-20","topic":"math-20-coords","lo":"MATH-20.1","d":"E","q":"M(2, −1) is the midpoint of AB, and A is (5, 3). What is B?","o":["(−1, −5)","(7/2, 1)","(3, 4)","(1, 5)"],"a":0,"x":"B = (2·2 − 5, 2·(−1) − 3) = (−1, −5). Check: ((5 − 1)/2, (3 − 5)/2) = (2, −1). (7/2, 1) is the midpoint of A and M, not the other end."},{"id":"math-20-056","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"M","q":"What is the normal form x cos α + y sin α = p (with p > 0) of the line √3x + y + 4 = 0?","o":["x cos 30° + y sin 30° = 2","x cos 150° + y sin 150° = 2","x cos 210° + y sin 210° = 2","x cos 240° + y sin 240° = 2"],"a":2,"x":"√(3 + 1) = 2. Write −√3x − y = 4 so the right side is positive, then divide by 2: −(√3/2)x − ½y = 2, so cos α = −√3/2, sin α = −½, α = 210°, p = 2. Using α = 30° keeps the wrong sign and describes the line √3x + y = 4."},{"id":"math-20-057","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"M","q":"A line meets the x-axis at A and the y-axis at B, and the point (3, 4) is the midpoint of AB. What is the equation of the line?","o":["4x + 3y − 12 = 0","3x + 4y − 25 = 0","4x + 3y − 24 = 0","3x + 4y − 24 = 0"],"a":2,"x":"The midpoint is (3, 4), so A = (6, 0) and B = (0, 8): x/6 + y/8 = 1, i.e. 4x + 3y − 24 = 0. Taking intercepts 3 and 4 gives 4x + 3y − 12 = 0, which does not even pass through (3, 4)."},{"id":"math-20-058","unit":"math-20","topic":"math-20-lines","lo":"MATH-20.2","d":"D","q":"A line passes through (3, −2) and its inclination is twice the inclination of the line y = x/√3. What is its equation?","o":["2x − √3y − 6 − 2√3 = 0","x − √3y − 3 − 2√3 = 0","√3x + y − 3√3 + 2 = 0","√3x − y − 3√3 − 2 = 0"],"a":3,"x":"y = x/√3 has inclination 30°, so the new line has inclination 60° and slope √3: y + 2 = √3(x − 3), i.e. √3x − y − 3√3 − 2 = 0. Doubling the slope (2/√3) instead of the angle gives the second-most tempting equation."},{"id":"math-20-059","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"M","q":"What is the acute angle between the lines y = 3x + 1 and y = −2x + 5?","o":["30°","60°","90°","45°"],"a":3,"x":"tan θ = |(m₁ − m₂)/(1 + m₁m₂)| = |(3 − (−2))/(1 + 3·(−2))| = |5/(−5)| = 1, so θ = 45°. The other angle between them is 135°, which is not acute."},{"id":"math-20-060","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"M","q":"The lines 2x + y − 3 = 0, x − y − 3 = 0 and kx + 3y + 1 = 0 are concurrent. What is k?","o":["−1","1","2","1/2"],"a":1,"x":"Adding the first two lines gives 3x − 6 = 0, so x = 2 and y = −1. The third line must pass through (2, −1): 2k − 3 + 1 = 0, so k = 1. Check: 2 − 3 + 1 = 0."},{"id":"math-20-061","unit":"math-20","topic":"math-20-two","lo":"MATH-20.3","d":"D","q":"A line through (1, 2) makes an angle of 45° with the line x − 3y + 2 = 0. What are the possible slopes of this line?","o":["−2 or 1/2","2 or −1/2","2 only","1 or −1/3"],"a":1,"x":"The given slope is 1/3. tan 45° = |(m − 1/3)/(1 + m/3)| = 1 gives (3m − 1) = ±(3 + m): m = 2 or m = −1/2. Check m = 2: (2 − 1/3)/(1 + 2/3) = (5/3)/(5/3) = 1. Dropping the ± sign loses −1/2."},{"id":"math-20-062","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"M","q":"What is the foot of the perpendicular from the point (3, 4) to the line x + y − 1 = 0?","o":["(0, 1)","(1, 0)","(−3, −2)","(2, −1)"],"a":0,"x":"Move from (3, 4) along the normal (1, 1): (3 + t, 4 + t) on the line gives 2t + 6 = 0, t = −3, so the foot is (0, 1). Check: (3, 4) − (0, 1) = (3, 3) is parallel to the normal. (2, −1) lies on the line but is not the foot."},{"id":"math-20-063","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"M","q":"What is the length of the perpendicular from the origin to the line x/3 + y/4 = 1?","o":["5","12/7","12/5","5/12"],"a":2,"x":"The line is 4x + 3y − 12 = 0, so p = |−12|/√(16 + 9) = 12/5. Check: area of the triangle with the axes = ½·3·4 = 6 = ½·5·p, so p = 12/5. The value 5 is the length of the cut-off segment."},{"id":"math-20-064","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"M","q":"Which points on the x-axis are at a distance 3 from the line 3x − 4y + 6 = 0?","o":["(3, 0) or (−7, 0)","(−3, 0) or (7, 0)","(3, 0) only","(−1, 0) or (−3, 0)"],"a":0,"x":"|3x + 6|/5 = 3 gives 3x + 6 = ±15, so x = 3 or x = −7. Forgetting to divide by √(9 + 16) = 5 gives |3x + 6| = 3, i.e. x = −1 or −3."},{"id":"math-20-065","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"M","q":"Which lines are parallel to 3x + 4y − 5 = 0 and at a distance 2 from it?","o":["3x + 4y − 3 = 0 and 3x + 4y − 7 = 0","3x + 4y + 15 = 0 and 3x + 4y − 15 = 0","3x + 4y + 5 = 0 and 3x + 4y − 15 = 0","3x + 4y − 15 = 0 only"],"a":2,"x":"A parallel line is 3x + 4y + c = 0 with |c − (−5)|/5 = 2, so c + 5 = ±10: c = 5 or c = −15. Forgetting the divisor 5 gives c = −3 or −7; there are always two such lines, one on each side."},{"id":"math-20-066","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"D","q":"A triangle has vertices A(3, −2), B(−1, −1) and C(5, 7). What is the length of the altitude from A?","o":["19/10","38/5","19/5","19"],"a":2,"x":"BC: slope 8/6 = 4/3, equation 4x − 3y + 1 = 0. Altitude = |12 + 6 + 1|/5 = 19/5. Check: the area by coordinates is 19 and BC = 10, so altitude = 2·19/10 = 19/5."},{"id":"math-20-067","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"M","q":"Where do the points P(1, 2) and Q(3, −1) lie relative to the line 2x + y − 3 = 0?","o":["On the same side as the origin","On opposite sides of the line","One of them lies on the line","On the same side, the side not containing the origin"],"a":3,"x":"Put each point into 2x + y − 3: P gives 1 and Q gives 2, both positive, so P and Q are on the same side. The origin gives −3, negative, so it is on the other side."},{"id":"math-20-068","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"D","q":"What is the locus of points equidistant from the lines 3x − 4y + 1 = 0 and 4x + 3y − 2 = 0?","o":["x + 7y − 3 = 0 and 7x − y − 1 = 0","x + 7y + 3 = 0 and 7x − y + 1 = 0","x − 7y + 1 = 0 and 7x + y − 3 = 0","x + 7y − 3 = 0 only"],"a":0,"x":"Both divisors are 5, so |3x − 4y + 1| = |4x + 3y − 2|. The minus case gives −x − 7y + 3 = 0, i.e. x + 7y − 3 = 0; the plus case gives 7x − y − 1 = 0. These are the two angle bisectors; keeping only one sign loses a line."},{"id":"math-20-069","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"E","q":"What is the distance from the point (2, 1) to the line y = 2x + 2?","o":["5","3/√5","√5","2√5"],"a":2,"x":"Write the line as 2x − y + 2 = 0. d = |4 − 1 + 2|/√(4 + 1) = 5/√5 = √5. Forgetting the divisor gives 5."},{"id":"math-20-070","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"M","q":"The point (k, k) is at a distance √2 from the line x + y − 2 = 0. What are the possible values of k?","o":["1 or 3","0 or 2","2 only","−1 or 3"],"a":1,"x":"|k + k − 2|/√2 = √2 gives |2k − 2| = 2, so 2k − 2 = ±2 and k = 2 or k = 0. Check k = 0: |−2|/√2 = √2."},{"id":"math-20-071","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"M","q":"Two sides of a square lie on the lines 2x − y + 1 = 0 and 2x − y − 4 = 0. What is the area of the square?","o":["√5","5","25","9/5"],"a":1,"x":"The side equals the distance between the parallel lines: |1 − (−4)|/√(4 + 1) = 5/√5 = √5. Area = (√5)² = 5. √5 is the side, not the area."},{"id":"math-20-072","unit":"math-20","topic":"math-20-distance","lo":"MATH-20.4","d":"M","q":"Which line is parallel to x − y + 2 = 0 and x − y − 6 = 0 and lies midway between them?","o":["x − y − 2 = 0","x − y − 4 = 0","x − y + 4 = 0","x − y + 8 = 0"],"a":0,"x":"A midway parallel line has constant term equal to the average of 2 and −6, i.e. −2: x − y − 2 = 0. Check: its distance from each line is 4/√2 = 2√2."},{"id":"math-20-073","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"E","q":"Which two lines does the equation x² − 5xy + 6y² = 0 represent?","o":["x + 2y = 0 and x + 3y = 0","2x − y = 0 and 3x − y = 0","x − 2y = 0 and x − 3y = 0","x − y = 0 and x − 6y = 0"],"a":2,"x":"x² − 5xy + 6y² = (x − 2y)(x − 3y). Check: −3xy − 2xy = −5xy and (−2y)(−3y) = 6y². Wrong signs in the factors give x + 2y and x + 3y."},{"id":"math-20-074","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"M","q":"What is the acute angle between the lines represented by x² − 4xy + y² = 0?","o":["30°","60°","45°","90°"],"a":1,"x":"Here a = 1, h = −2, b = 1. tan θ = 2√(h² − ab)/|a + b| = 2√(4 − 1)/2 = √3, so θ = 60°. Using 2h = −2 in place of h gives tan θ = 0 and no angle at all."},{"id":"math-20-075","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"E","q":"For which value of k are the lines represented by kx² + 3xy − 5y² = 0 perpendicular?","o":["−5","3","0","5"],"a":3,"x":"The lines ax² + 2hxy + by² = 0 are perpendicular when a + b = 0, so k − 5 = 0 and k = 5. Check: 5x² + 3xy − 5y² has slopes with product a/b = −1."},{"id":"math-20-076","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"M","q":"For which values of k does x² + kxy + 9y² = 0 represent two coincident lines?","o":["±3","±6","6 only","±9"],"a":1,"x":"Here 2h = k, so h = k/2. Coincident lines need h² = ab: k²/4 = 9, k = ±6. Check: x² ± 6xy + 9y² = (x ± 3y)². Forgetting that the xy coefficient is 2h gives ±3."},{"id":"math-20-077","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"M","q":"What is the sum of the slopes of the lines represented by x² + 4xy − 3y² = 0?","o":["4/3","−4/3","8/3","−1/3"],"a":0,"x":"Put y = mx: 1 + 4m − 3m² = 0, i.e. 3m² − 4m − 1 = 0, so m₁ + m₂ = 4/3 (and m₁m₂ = −1/3). This agrees with m₁ + m₂ = −2h/b = −4/(−3)."},{"id":"math-20-078","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"M","q":"The lines represented by x² + xy − 6y² = 0 meet the line y = 1 at the points A and B. What is the length AB?","o":["1","6","√13","5"],"a":3,"x":"x² + xy − 6y² = (x + 3y)(x − 2y). On y = 1 the lines give x = −3 and x = 2, so A(−3, 1), B(2, 1) and AB = 5. Subtracting the roots the wrong way round gives 1."},{"id":"math-20-079","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"D","q":"The slope of one of the lines represented by x² − 3xy + ky² = 0 is twice the slope of the other. What is k?","o":["2","8","9/8","1/2"],"a":0,"x":"Put y = mx: km² − 3m + 1 = 0 with roots m and 2m. Then 3m = 3/k and 2m² = 1/k, so m = 1/k and 2/k² = 1/k, k = 2. Check: 2m² − 3m + 1 = 0 gives m = 1 and ½. Taking h = −3 instead of −3/2 in 8h² = 9ab gives 8."},{"id":"math-20-080","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"D","q":"What is the joint equation of the lines through the origin perpendicular to the lines x² − 3xy + 2y² = 0?","o":["2x² + 3xy + y² = 0","2x² − 3xy + y² = 0","x² + 3xy + 2y² = 0","2x² + 3xy − y² = 0"],"a":0,"x":"x² − 3xy + 2y² = (x − y)(x − 2y), slopes 1 and ½. The perpendiculars have slopes −1 and −2: x + y = 0 and 2x + y = 0. Their product is (x + y)(2x + y) = 2x² + 3xy + y²."},{"id":"math-20-081","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"E","q":"What is the joint equation of the lines y = 2x and y = −3x?","o":["6x² + xy − y² = 0","6x² − xy + y² = 0","6x² − xy − y² = 0","x² − xy − 6y² = 0"],"a":2,"x":"(y − 2x)(y + 3x) = y² + xy − 6x² = 0; multiplying by −1 gives 6x² − xy − y² = 0. Check with y = 2x: 6x² − 2x² − 4x² = 0."},{"id":"math-20-082","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"M","q":"What does the equation x² + 2xy + 3y² = 0 represent?","o":["Two real and distinct lines","Two coincident lines","Two imaginary lines (only the origin is a real point)","Two perpendicular lines"],"a":2,"x":"Here h = 1, a = 1, b = 3, so h² − ab = 1 − 3 = −2 < 0: the lines are imaginary. The only real point satisfying it is (0, 0)."},{"id":"math-20-083","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"D","q":"For which values of k do the lines x² + kxy + y² = 0 make an angle of 45° with each other?","o":["±√2","±2√2","2√2 only","±√6"],"a":1,"x":"Here h = k/2, a = b = 1. tan 45° = 2√(k²/4 − 1)/2 = 1 gives k²/4 − 1 = 1, k² = 8, k = ±2√2. Check k = 2√2: slopes −√2 ± 1 have difference 2 and product 1, so tan θ = 2/2 = 1."},{"id":"math-20-084","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"M","q":"For which value of k are the lines x² + (k − 3)xy − 4y² = 0 equally inclined to the x-axis (slopes m and −m)?","o":["−3","3","4","0"],"a":1,"x":"Equal and opposite slopes mean m₁ + m₂ = −2h/b = (k − 3)/4 = 0, so k = 3. The equation becomes x² = 4y², i.e. y = ±x/2."},{"id":"math-20-085","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"E","q":"Which statement about the lines represented by 2x² + 3xy − 2y² = 0 is true?","o":["They are coincident","They are perpendicular","They are imaginary","One of them is the x-axis"],"a":1,"x":"a + b = 2 + (−2) = 0, so the lines are perpendicular. Indeed 2x² + 3xy − 2y² = (2x − y)(x + 2y), with slopes 2 and −½."},{"id":"math-20-086","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"M","q":"The equation ax² + 2hxy + by² = 0 represents two lines, one of which is the x-axis. Which condition must hold?","o":["b = 0","a = 0","h = 0","a + b = 0"],"a":1,"x":"Every point (x, 0) must satisfy the equation, so ax² = 0 for all x and a = 0. Then the equation is y(2hx + by) = 0. b = 0 is the condition for the y-axis instead."},{"id":"math-20-087","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"M","q":"For every value of θ (with cot θ defined), what can be said about the lines x² − 2xy cot θ − y² = 0?","o":["They are coincident","They are perpendicular to each other","They are inclined at the angle θ","They are inclined at the angle 2θ"],"a":1,"x":"The coefficients of x² and y² are 1 and −1, so a + b = 0 for every θ, and the lines are always perpendicular. The xy term only turns the pair about the origin."},{"id":"math-20-088","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"D","q":"The lines 6x² − 5xy − 6y² = 0 and the line x + y = 1 form a triangle. What is its area?","o":["13/5","13/20","1/2","13/10"],"a":3,"x":"6x² − 5xy − 6y² = (3x + 2y)(2x − 3y). With x + y = 1 these meet at (−2, 3) and (3/5, 2/5). Area = ½|x₁y₂ − x₂y₁| = ½|(−2)(2/5) − (3/5)(3)| = ½·13/5 = 13/10. Forgetting the ½ gives 13/5."},{"id":"math-20-089","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"M","q":"What is the joint equation of the lines through the origin inclined at 60° and 120° to the positive x-axis?","o":["3x² − y² = 0","x² − 3y² = 0","3x² + y² = 0","x² − y² = 0"],"a":0,"x":"The slopes are tan 60° = √3 and tan 120° = −√3, so the lines are y = ±√3x and (y − √3x)(y + √3x) = y² − 3x² = 0, i.e. 3x² − y² = 0. x² − 3y² = 0 gives the 30° and 150° lines."},{"id":"math-20-090","unit":"math-20","topic":"math-20-pair","lo":"MATH-20.5","d":"D","q":"One of the lines represented by 2x² + kxy − 3y² = 0 is perpendicular to the line 2x − y = 0. What is k?","o":["−5/2","1/2","5/2","−1/2"],"a":2,"x":"The perpendicular through the origin is x + 2y = 0, so x = −2y must satisfy the equation: 8y² − 2ky² − 3y² = 0, so k = 5/2. Check: 4x² + 5xy − 6y² = (x + 2y)(4x − 3y). Substituting x = 2y by a sign slip gives −5/2."},{"id":"math-21-001","unit":"math-21","topic":"math-21-ineq","lo":"MATH-21.1","d":"E","q":"Which point satisfies the inequality 2x + 3y ≤ 6?","o":["(2, 1)","(1, 1)","(0, 3)","(3, 1)"],"a":1,"x":"Substitute: (1, 1) gives 2 + 3 = 5 ≤ 6, true. The others give 7, 9 and 9, all greater than 6."},{"id":"math-21-002","unit":"math-21","topic":"math-21-ineq","lo":"MATH-21.1","d":"E","q":"How is the solution region of x + y < 4 described?","o":["The half-plane on the origin side of the line x + y = 4, with the line itself included (drawn solid)","The half-plane away from the origin across the line x + y = 4, with the line excluded","The half-plane away from the origin across the line x + y = 4, with the line included","The half-plane on the origin side of the line x + y = 4, with the line itself excluded (drawn broken)"],"a":3,"x":"Test the origin: 0 + 0 < 4 is true, so the region is on the origin side. The inequality is strict, so points on x + y = 4 are not included and the boundary is drawn broken."},{"id":"math-21-003","unit":"math-21","topic":"math-21-ineq","lo":"MATH-21.1","d":"M","q":"A boundary line passes through (3, 0) and (0, 2). Which inequality describes the closed half-plane on the origin side of this line?","o":["2x + 3y ≥ 6","3x + 2y ≤ 6","3x + 2y ≥ 6","2x + 3y ≤ 6"],"a":3,"x":"Intercept form x/3 + y/2 = 1 gives 2x + 3y = 6. The origin gives 0 ≤ 6, so the origin side is 2x + 3y ≤ 6. Swapping the intercepts gives 3x + 2y = 6, a different line."},{"id":"math-21-004","unit":"math-21","topic":"math-21-ineq","lo":"MATH-21.1","d":"M","q":"What are the corner points of the region given by x ≥ 0, y ≥ 0, x + y ≤ 5 and x ≤ 3?","o":["(0, 0), (3, 0), (3, 2), (0, 5)","(0, 0), (5, 0), (0, 5)","(0, 0), (3, 0), (3, 5), (0, 5)","(0, 0), (3, 0), (2, 3), (0, 5)"],"a":0,"x":"The lines x = 3 and x + y = 5 meet at (3, 2); with the axes this gives corners (0, 0), (3, 0), (3, 2) and (0, 5). (3, 5) breaks x + y ≤ 5, and forgetting x ≤ 3 gives the triangle."},{"id":"math-21-005","unit":"math-21","topic":"math-21-ineq","lo":"MATH-21.1","d":"M","q":"The region x + y ≤ 6, x − y ≥ 2, y ≥ 0 is a triangle. What are its corner points?","o":["(0, 0), (6, 0), (4, 2)","(2, 0), (6, 0), (4, 2)","(2, 0), (6, 0), (2, 4)","(−2, 0), (6, 0), (4, 2)"],"a":1,"x":"x − y = 2 meets y = 0 at (2, 0); x + y = 6 meets y = 0 at (6, 0); adding x + y = 6 and x − y = 2 gives x = 4, y = 2. The origin fails x − y ≥ 2, so (0, 0) is not in the region."},{"id":"math-21-006","unit":"math-21","topic":"math-21-ineq","lo":"MATH-21.1","d":"E","q":"The inequality x ≥ 0 represents which region of the xy-plane?","o":["The y-axis together with the half-plane to its right","The x-axis together with the half-plane above it","The y-axis together with the half-plane to its left","The half-plane to the right of the y-axis, without the y-axis"],"a":0,"x":"x ≥ 0 holds for all points with non-negative x: everything right of the y-axis, and the y-axis itself (x = 0) because the sign includes equality."},{"id":"math-21-007","unit":"math-21","topic":"math-21-ineq","lo":"MATH-21.1","d":"M","q":"Which system describes the closed triangle with vertices (0, 0), (4, 0) and (0, 4)?","o":["x ≥ 0, y ≥ 0, x + y ≥ 4","x ≥ 0, y ≥ 0, x + y ≤ 4","x ≤ 0, y ≥ 0, x + y ≤ 4","x ≥ 0, y ≤ 0, x + y ≤ 4"],"a":1,"x":"The sides lie on x = 0, y = 0 and x + y = 4. An interior point such as (1, 1) satisfies x ≥ 0, y ≥ 0 and 1 + 1 ≤ 4, which fixes every sign."},{"id":"math-21-008","unit":"math-21","topic":"math-21-ineq","lo":"MATH-21.1","d":"M","q":"The region 2x + y ≤ 4, x + 2y ≤ 4, x ≥ 0, y ≥ 0 has one corner point that is on neither axis. What is it?","o":["(4/3, 4/3)","(2, 2)","(1, 2)","(4/3, 2/3)"],"a":0,"x":"Solve 2x + y = 4 and x + 2y = 4: subtracting gives x = y, then 3x = 4, so x = y = 4/3. Check: 8/3 + 4/3 = 4 for both lines."},{"id":"math-21-009","unit":"math-21","topic":"math-21-ineq","lo":"MATH-21.1","d":"M","q":"Which statement about the region x ≥ 0, y ≥ 0, x + y ≥ 2 is true?","o":["It is a bounded triangle with corner points (0, 0), (2, 0) and (0, 2)","It is unbounded, with corner points (0, 0), (2, 0) and (0, 2)","It contains no points at all","It is unbounded, with corner points (2, 0) and (0, 2)"],"a":3,"x":"x + y ≥ 2 is the side away from the origin, so the region in the first quadrant stretches without limit. Its corners are where x + y = 2 meets the axes, (2, 0) and (0, 2); the origin fails x + y ≥ 2."},{"id":"math-21-010","unit":"math-21","topic":"math-21-ineq","lo":"MATH-21.1","d":"D","q":"Which system of inequalities has no solution at all?","o":["x + y ≤ 4, x ≥ 3, y ≥ 2","x + y ≤ 4, x ≥ 1, y ≥ 2","x + y ≥ 4, x ≤ 3, y ≤ 2","x + y ≤ 5, x ≥ 3, y ≥ 2"],"a":0,"x":"From x ≥ 3 and y ≥ 2 we get x + y ≥ 5, which cannot be ≤ 4, so that region is empty. The others contain (1, 2), (3, 2) and (3, 2) respectively."},{"id":"math-21-011","unit":"math-21","topic":"math-21-ineq","lo":"MATH-21.1","d":"M","q":"The origin does not satisfy which one of these inequalities?","o":["2x − y ≤ 5","x − 3y < 1","3x + y > −2","x + 2y ≥ 3"],"a":3,"x":"At (0, 0): 0 ≥ 3 is false, while 0 ≤ 5, 0 < 1 and 0 > −2 are all true. So the region of x + 2y ≥ 3 lies on the far side of its line from the origin."},{"id":"math-21-012","unit":"math-21","topic":"math-21-ineq","lo":"MATH-21.1","d":"D","q":"Which pair of inequalities describes the strip between the parallel lines y = x and y = x + 2, including both lines?","o":["y − x ≤ 0 and y − x ≥ 2","y − x ≥ 0 and y − x ≤ 2","y − x ≥ 0 and y − x ≥ 2","x − y ≥ 0 and x − y ≤ 2"],"a":1,"x":"A point in the strip is on or above y = x and on or below y = x + 2, so 0 ≤ y − x ≤ 2. Test (0, 1): y − x = 1 lies between 0 and 2. The pair y − x ≤ 0, y − x ≥ 2 is empty, and x − y between 0 and 2 is the strip on the other side of y = x."},{"id":"math-21-013","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"E","q":"In linear programming, the feasible region is the set of points that","o":["satisfy all the constraints at the same time","satisfy at least one of the constraints","satisfy only the non-negativity constraints","make the objective function zero"],"a":0,"x":"A feasible solution must obey every constraint simultaneously, so the feasible region is the intersection of all the half-planes given by the constraints."},{"id":"math-21-014","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"E","q":"For a bounded feasible region, the maximum value of a linear objective function f = ax + by occurs","o":["always at the origin","at the centre of the region","at a corner point of the region","only at an interior point of the region"],"a":2,"x":"By the corner-point rule, a linear function on a bounded convex polygon takes its maximum and minimum at vertices (corner points), so we evaluate f only there."},{"id":"math-21-015","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"E","q":"The non-negativity constraints x ≥ 0 and y ≥ 0 restrict the feasible region to which quadrant?","o":["The first quadrant, including the axes","The second quadrant, including the axes","The third quadrant, including the axes","The fourth quadrant, including the axes"],"a":0,"x":"x ≥ 0 keeps points on or right of the y-axis and y ≥ 0 keeps them on or above the x-axis, which together give the first quadrant with its boundary axes."},{"id":"math-21-016","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"M","q":"The feasible region has corner points (0, 0), (4, 0), (3, 2) and (0, 4). What is the maximum value of f = 3x + 2y?","o":["12","8","13","0"],"a":2,"x":"f at the corners: 0, 12, 9 + 4 = 13 and 8. The maximum is 13 at (3, 2). 12 comes from stopping at (4, 0), and 0 is the minimum."},{"id":"math-21-017","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"M","q":"Maximise z = x + 3y subject to x + y ≤ 4, y ≤ 3, x ≥ 0, y ≥ 0. What is the maximum value of z?","o":["9","12","10","4"],"a":2,"x":"Corners: (0, 0), (4, 0), (1, 3) where y = 3 meets x + y = 4, and (0, 3). z = 0, 4, 10, 9, so the maximum is 10. Ignoring y ≤ 3 and using (0, 4) gives 12."},{"id":"math-21-018","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"M","q":"Minimise z = 2x + 3y subject to x + y ≥ 4, x ≥ 0, y ≥ 0. What is the minimum value of z?","o":["8","12","0","10"],"a":0,"x":"The region is unbounded with corners (4, 0) and (0, 4); z = 8 and 12. Since both coefficients are positive, z only grows further out, so the minimum is 8. The origin (z = 0) is not feasible."},{"id":"math-21-019","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"M","q":"Find the minimum of z = 4x + y subject to x + y ≥ 3, x ≥ 1, y ≥ 0.","o":["12","6","4","7"],"a":1,"x":"Corners of the unbounded region: x = 1 meets x + y = 3 at (1, 2), and x + y = 3 meets y = 0 at (3, 0). z = 4 + 2 = 6 and 12, and z increases away from them, so the minimum is 6. The value 4 comes from (1, 0), which fails x + y ≥ 3."},{"id":"math-21-020","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"D","q":"Maximise z = 5x + 4y subject to x + y ≤ 5, 2x + y ≤ 8, x ≥ 0, y ≥ 0. What is the maximum value of z?","o":["20","25","23","32"],"a":2,"x":"x + y = 5 and 2x + y = 8 meet at x = 3, y = 2. Corners (0, 0), (4, 0), (3, 2), (0, 5) give z = 0, 20, 23, 20, so the maximum is 23. Using (5, 0) or (0, 8), which break a constraint, gives 25 or 32."},{"id":"math-21-021","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"M","q":"A tailor makes x shirts and y trousers. A shirt takes 2 hours and a pair of trousers 3 hours, and at most 24 hours are available. Which constraint expresses the time limit?","o":["3x + 2y ≤ 24","2x + 3y ≤ 24","2x + 3y ≥ 24","x + y ≤ 24"],"a":1,"x":"Time used is 2 hours per shirt times x plus 3 hours per pair times y, which must not exceed 24: 2x + 3y ≤ 24. Swapping the times gives 3x + 2y, and ≥ would mean at least 24 hours."},{"id":"math-21-022","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"D","q":"A shop can stock at most 20 items: x fans and y heaters, with at most 12 heaters. Profit is Rs 300 per fan and Rs 500 per heater. What is the maximum profit?","o":["Rs 6000","Rs 10000","Rs 8400","Rs 7600"],"a":2,"x":"Constraints x + y ≤ 20, y ≤ 12, x, y ≥ 0; corners (0, 0), (20, 0), (8, 12), (0, 12). Profit 300x + 500y = 0, 6000, 2400 + 6000 = 8400, 6000, so the maximum is Rs 8400 with 8 fans and 12 heaters. 20 heaters ignores y ≤ 12 (Rs 10000); swapping the counts gives Rs 7600."},{"id":"math-21-023","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"D","q":"A feasible region has corner points (0, 0), (6, 0), (4, 3) and (0, 5). For what value of k does z = x + ky take its maximum at both (6, 0) and (4, 3)?","o":["2/3","3/2","1/3","2"],"a":0,"x":"Set z(6, 0) = z(4, 3): 6 = 4 + 3k, so k = 2/3. Check the other corner: z(0, 5) = 10/3 < 6, so 6 really is the maximum."},{"id":"math-21-024","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"M","q":"Which point is feasible for the constraints x + y ≤ 6, 2x + y ≤ 8, x ≥ 0, y ≥ 0?","o":["(3, 3)","(4, 1)","(1, 6)","(2, 4)"],"a":3,"x":"(2, 4): 6 ≤ 6 and 8 ≤ 8, both hold (it is a corner). (3, 3) and (4, 1) give 2x + y = 9 > 8, and (1, 6) gives x + y = 7 > 6."},{"id":"math-21-025","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"M","q":"What are the corner points of the feasible region x + 2y ≤ 10, 3x + y ≤ 15, x ≥ 0, y ≥ 0?","o":["(0, 0), (10, 0), (4, 3), (0, 15)","(0, 0), (5, 0), (3, 4), (0, 5)","(0, 0), (10, 0), (4, 3), (0, 5)","(0, 0), (5, 0), (4, 3), (0, 5)"],"a":3,"x":"On the axes the tighter intercepts are x = 5 (from 3x + y = 15) and y = 5 (from x + 2y = 10). The two lines meet where x = 10 − 2y and 30 − 6y + y = 15, so y = 3, x = 4. (10, 0) breaks 3x + y ≤ 15."},{"id":"math-21-026","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"M","q":"Minimise z = 3x + 5y subject to x + y ≥ 4, x + 3y ≥ 6, x ≥ 0, y ≥ 0.","o":["18","20","14","10"],"a":2,"x":"Corners of the unbounded region: (0, 4), the intersection (3, 1) of the two lines, and (6, 0). z = 20, 9 + 5 = 14, 18, so the minimum is 14 at (3, 1)."},{"id":"math-21-027","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"M","q":"A feasible region has corner points (0, 0), (3, 0), (2, 2) and (0, 3). What is the minimum value of z = 2x − y on it?","o":["0","2","−3","−2"],"a":2,"x":"z at the corners: 0, 6, 4 − 2 = 2 and −3. The minimum is −3 at (0, 3). Assuming the minimum is always at the origin gives 0."},{"id":"math-21-028","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"M","q":"A feasible region has corner points (0, 0), (5, 0), (3, 2) and (0, 4). Where does z = x + y take its maximum value?","o":["Only at (5, 0)","At every point of the edge joining (5, 0) and (3, 2)","Only at (3, 2)","Only at (0, 4)"],"a":1,"x":"z = 0, 5, 5, 4 at the corners. The maximum 5 is reached at two adjacent corners, so it is reached at every point of the edge between them, which lies on x + y = 5."},{"id":"math-21-029","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"M","q":"Maximise z = x + y subject to x + y ≥ 2, x ≥ 0, y ≥ 0. Which statement is true?","o":["The maximum is 2, at (2, 0) and (0, 2)","z has no maximum, since the region is unbounded and z can be made as large as we like","The maximum is 0, at the origin","The maximum is 4, at (2, 2)"],"a":1,"x":"The region stretches without limit away from the origin; for example (n, 0) is feasible for every n ≥ 2 with z = n. So z has no maximum; 2 is in fact its minimum value."},{"id":"math-21-030","unit":"math-21","topic":"math-21-lp","lo":"MATH-21.2","d":"D","q":"Food P costs Rs 20 per unit and gives 2 units of vitamin and 1 of protein; food Q costs Rs 30 per unit and gives 1 of vitamin and 2 of protein. At least 8 units of vitamin and 7 of protein are needed. What is the least cost?","o":["Rs 140","Rs 240","Rs 100","Rs 120"],"a":3,"x":"Constraints 2x + y ≥ 8, x + 2y ≥ 7, x, y ≥ 0. Corners: (0, 8), (3, 2) where the lines meet, and (7, 0). Cost 20x + 30y = 240, 60 + 60 = 120, 140, so the least cost is Rs 120."},{"id":"math-22-001","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"E","q":"What are the centre and radius of the circle (x − 2)² + (y + 3)² = 16?","o":["(2, −3), 4","(−2, 3), 4","(2, −3), 16","(−2, 3), 16"],"a":0,"x":"Compare with (x − a)² + (y − b)² = r²: a = 2, b = −3 and r² = 16, so the centre is (2, −3) and r = 4. Taking (−2, 3) copies the signs inside the brackets, and 16 is r², not r."},{"id":"math-22-002","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"E","q":"What are the coordinates of the foci of the ellipse x²/25 + y²/9 = 1?","o":["(0, ±4)","(±5, 0)","(±√34, 0)","(±4, 0)"],"a":3,"x":"a² = 25 is under x², so the foci are on the x-axis, and c² = a² − b² = 25 − 9 = 16, so c = 4 and the foci are (±4, 0). (±√34, 0) adds a² and b², which is the hyperbola rule."},{"id":"math-22-003","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"E","q":"What are the asymptotes of the hyperbola x²/9 − y²/16 = 1?","o":["y = ±(3/4)x","y = ±(4/3)x","y = ±(9/16)x","y = ±(16/9)x"],"a":1,"x":"For x²/a² − y²/b² = 1 the asymptotes are y = ±(b/a)x. Here a = 3 and b = 4, so y = ±(4/3)x. y = ±(3/4)x uses a/b, which is the rule for a hyperbola with foci on the y-axis."},{"id":"math-22-004","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"E","q":"What are the coordinates of the focus of the parabola y² = 8x?","o":["(0, 2)","(4, 0)","(−2, 0)","(2, 0)"],"a":3,"x":"Compare with y² = 2px: 2p = 8, so p = 4 and the focus is (p/2, 0) = (2, 0). (4, 0) uses p instead of p/2, and (0, 2) puts the focus on the wrong axis."},{"id":"math-22-005","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"M","q":"The line y = x + m is tangent to the parabola y² = 4x. What is m?","o":["−1","1","1/2","2"],"a":1,"x":"Substituting gives x² + (2m − 4)x + m² = 0. Tangency needs a zero discriminant: (2m − 4)² − 4m² = 16 − 16m = 0, so m = 1. m = −1 is the line through the focus, which cuts the parabola twice."},{"id":"math-22-006","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"E","q":"What are the centre and radius of the circle x² + y² + 2x − 4y − 4 = 0?","o":["(1, −2), 3","(−1, 2), 9","(1, −2), 2","(−1, 2), 3"],"a":3,"x":"Complete the squares: (x + 1)² + (y − 2)² = 4 + 1 + 4 = 9, so the centre is (−1, 2) and the radius is 3. The centre (1, −2) has the signs reversed; the centre of x² + y² + Dx + Ey + F = 0 is (−D/2, −E/2)."},{"id":"math-22-007","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"E","q":"What is the eccentricity of the ellipse x²/16 + y²/12 = 1?","o":["2","1/2","√3/2","1/4"],"a":1,"x":"a = 4 and c² = 16 − 12 = 4, so c = 2 and e = c/a = 2/4 = 1/2. √3/2 is b/a = √12/4, not c/a; an ellipse always has 0 < e < 1, which also rules out 2."},{"id":"math-22-008","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"E","q":"What are the coordinates of the foci of the hyperbola x²/4 − y²/5 = 1?","o":["(0, ±3)","(±3, 0)","(±1, 0)","(±√5, 0)"],"a":1,"x":"For a hyperbola c² = a² + b² = 4 + 5 = 9, so c = 3. The x² term is positive, so the foci are on the x-axis: (±3, 0). (±1, 0) uses the ellipse rule c² = a² − b² with the values swapped."},{"id":"math-22-009","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"E","q":"What is the equation of the directrix of the parabola x² = 4y?","o":["x = −1","y = −1","y = 1","y = −2"],"a":1,"x":"x² = 2py with 2p = 4 gives p = 2; the focus is (0, 1) and the directrix is y = −p/2 = −1. y = 1 is the line through the focus, and x = −1 belongs to y² = 4x."},{"id":"math-22-010","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"M","q":"The equation x² + y² + 2x − 4y + m = 0 represents a circle. What is the range of m?","o":["m > 5","m < 5","m ≤ 5","m < 20"],"a":1,"x":"Completing squares gives (x + 1)² + (y − 2)² = 5 − m, which is a circle only if 5 − m > 0, i.e. m < 5. Equivalently D² + E² − 4F = 4 + 16 − 4m > 0. m < 20 forgets the factor 4 in front of F, and m = 5 gives a single point, not a circle."},{"id":"math-22-011","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"E","q":"What are the lengths of the major and minor axes of the ellipse 4x² + y² = 16?","o":["4 and 2","16 and 4","8 and 2","8 and 4"],"a":3,"x":"Dividing by 16 gives x²/4 + y²/16 = 1, so a = 4 (on the y-axis) and b = 2. The major axis is 2a = 8 and the minor axis is 2b = 4. The pair 4 and 2 gives the semi-axes, not the axes."},{"id":"math-22-012","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"E","q":"What is the eccentricity of the hyperbola x² − y²/3 = 1?","o":["2√3/3","√2","√3","2"],"a":3,"x":"a = 1, b = √3, so c = √(1 + 3) = 2 and e = c/a = 2. 2√3/3 divides c by b instead of by a."},{"id":"math-22-013","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"M","q":"What is the equation of the directrix of the parabola y = 2x²?","o":["y = −1/2","x = −1/8","y = −1/8","y = 1/8"],"a":2,"x":"First write it in standard form: x² = ½y, so 2p = ½ and p = ¼. The directrix is y = −p/2 = −1/8. y = −1/2 comes from reading y = 2x² as if it were y² = 2px, without rewriting."},{"id":"math-22-014","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"E","q":"A circle has centre (1, −2) and passes through the origin. What is its equation?","o":["(x + 1)² + (y − 2)² = 5","(x − 1)² + (y + 2)² = 5","(x − 1)² + (y + 2)² = √5","(x − 1)² + (y − 2)² = 5"],"a":1,"x":"r² = (0 − 1)² + (0 + 2)² = 5, so the equation is (x − 1)² + (y + 2)² = 5. Writing √5 on the right confuses r with r²."},{"id":"math-22-015","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"E","q":"An ellipse has foci (±3, 0) and major axis of length 10. What is its standard equation?","o":["x²/25 + y²/16 = 1","x²/25 + y²/9 = 1","x²/16 + y²/25 = 1","x²/100 + y²/91 = 1"],"a":0,"x":"2a = 10 gives a = 5, and c = 3, so b² = a² − c² = 25 − 9 = 16. The foci are on the x-axis, so a² goes under x²: x²/25 + y²/16 = 1. x²/16 + y²/25 = 1 would put the foci on the y-axis."},{"id":"math-22-016","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"E","q":"What is the length of the real (transverse) axis of the hyperbola y²/16 − x²/9 = 1?","o":["6","10","16","8"],"a":3,"x":"The positive term is y²/16, so a² = 16, a = 4 and the real axis has length 2a = 8. 6 is the imaginary axis 2b, and 10 is the focal distance 2c."},{"id":"math-22-017","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"E","q":"A parabola has its vertex at the origin and its focus at (0, −3). What is its equation?","o":["x² = 12y","y² = −12x","x² = −6y","x² = −12y"],"a":3,"x":"The focus is on the negative y-axis, so the parabola is x² = −2py with p/2 = 3, p = 6: x² = −12y. x² = −6y uses p/2 = 3 as if it were 2p = 6."},{"id":"math-22-018","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"M","q":"A(−1, 2) and B(3, −4) are the ends of a diameter of a circle. What is the equation of the circle?","o":["(x − 1)² + (y + 1)² = 13","(x − 1)² + (y + 1)² = 52","(x + 1)² + (y − 1)² = 13","(x − 1)² + (y + 1)² = 26"],"a":0,"x":"The centre is the midpoint (1, −1). |AB|² = 4² + 6² = 52, so r² = (|AB|/2)² = 52/4 = 13. Using 52 treats the diameter as the radius."},{"id":"math-22-019","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"M","q":"P is a point on the ellipse x²/16 + y²/7 = 1 with foci F₁ and F₂. If |PF₁| = 3, what is |PF₂|?","o":["3","4","5","8"],"a":2,"x":"For any point on an ellipse, |PF₁| + |PF₂| = 2a. Here a = 4, so |PF₂| = 8 − 3 = 5. The value 8 is 2a itself, the whole sum."},{"id":"math-22-020","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"M","q":"A hyperbola has foci (±√5, 0) and asymptotes y = ±½x. What is its equation?","o":["x² − y²/4 = 1","x²/4 − y²/9 = 1","x²/4 − y² = 1","y²/4 − x² = 1"],"a":2,"x":"b/a = 1/2, so a = 2b, and a² + b² = c² = 5 gives 5b² = 5, so b = 1 and a = 2. The equation is x²/4 − y² = 1. x² − y²/4 = 1 has asymptotes y = ±2x."},{"id":"math-22-021","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"M","q":"A point P on the parabola y² = 4x is at distance 5 from the focus. What is the x-coordinate of P?","o":["4","3","5","6"],"a":0,"x":"The focus is (1, 0) and the directrix is x = −1. By the definition, |PF| equals the distance to the directrix, x + 1 = 5, so x = 4. 5 takes the focal distance as the x-coordinate."},{"id":"math-22-022","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"E","q":"Where is the point P(1, 1) relative to the circle x² + y² − 4x + 2y − 4 = 0?","o":["On the circle","Outside the circle","Cannot be determined","Inside the circle"],"a":3,"x":"Substitute P: 1 + 1 − 4 + 2 − 4 = −4 < 0, so P is inside. Check with standard form: (x − 2)² + (y + 1)² = 9, and the distance from P to (2, −1) is √5 < 3."},{"id":"math-22-023","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"M","q":"F₁ and F₂ are the foci of the ellipse x²/9 + y²/5 = 1. A chord AB passes through F₁. What is the perimeter of triangle ABF₂?","o":["4","6","12","8"],"a":2,"x":"|AF₁| + |AF₂| = 2a and |BF₁| + |BF₂| = 2a, and |AF₁| + |BF₁| = |AB|. So the perimeter is |AB| + |AF₂| + |BF₂| = 4a = 12. The value 6 is 2a, counting only one of the two points."},{"id":"math-22-024","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"M","q":"A hyperbola has its foci on the x-axis and asymptotes y = ±√3x. What is its eccentricity?","o":["2√3/3","√3","4","2"],"a":3,"x":"b/a = √3, so e = c/a = √(1 + b²/a²) = √(1 + 3) = 2. 2√3/3 is the eccentricity when the foci are on the y-axis (then a/b = √3)."},{"id":"math-22-025","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"M","q":"The point P(x₀, 4) lies on the parabola y² = 8x. What is the distance from P to the focus?","o":["4","6","2√5","2"],"a":0,"x":"16 = 8x₀ gives x₀ = 2. The directrix is x = −2, so |PF| = x₀ + 2 = 4. 2√5 is the distance from P to the origin, not to the focus (2, 0)."},{"id":"math-22-026","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"M","q":"The line 3x + 4y + m = 0 is tangent to the circle x² + y² = 4. What is m?","o":["10","−10","±2","±10"],"a":3,"x":"Tangency means the distance from the centre (0, 0) equals the radius: |m|/5 = 2, so |m| = 10 and m = ±10. Choosing only 10 or only −10 misses one of the two parallel tangents."},{"id":"math-22-027","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"M","q":"The ellipse x²/m + y²/4 = 1 has focal distance |F₁F₂| = 2. What is m?","o":["3 or 5","5","3","√3 or √5"],"a":0,"x":"2c = 2 gives c = 1. If m > 4, the foci are on the x-axis and m − 4 = 1, so m = 5; if 0 < m < 4, the foci are on the y-axis and 4 − m = 1, so m = 3. Both cases are possible, so m = 3 or 5."},{"id":"math-22-028","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"M","q":"P is a point on the hyperbola x²/9 − y²/16 = 1 with foci F₁ and F₂. If |PF₁| = 7, what is |PF₂|?","o":["1 or 13","1","13","10"],"a":2,"x":"||PF₁| − |PF₂|| = 2a = 6, so |PF₂| = 1 or 13. But c = 5, and every point of the hyperbola is at least c − a = 2 from a focus, so 1 is impossible and |PF₂| = 13. Keeping both values forgets this check."},{"id":"math-22-029","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"M","q":"A line through the focus of y² = 4x meets the parabola at A(x₁, y₁) and B(x₂, y₂) with x₁ + x₂ = 6. What is |AB|?","o":["6","8","7","10"],"a":1,"x":"|AF| = x₁ + 1 and |BF| = x₂ + 1 (distance to the directrix x = −1). Since AB passes through F, |AB| = x₁ + x₂ + 2 = 8. 6 forgets to add the two distances p/2."},{"id":"math-22-030","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"M","q":"What is the length of the chord cut from the circle (x − 2)² + (y − 1)² = 4 by the line x − y + 1 = 0?","o":["√2","2","2√2","4"],"a":2,"x":"Distance from (2, 1) to the line: |2 − 1 + 1|/√2 = √2. Half the chord is √(r² − d²) = √(4 − 2) = √2, so the chord is 2√2. √2 is only half the chord."},{"id":"math-22-031","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"M","q":"The equation x²/(k − 2) + y²/(6 − k) = 1 represents an ellipse with foci on the x-axis. What is the range of k?","o":["2 < k < 6","k > 4","4 < k < 6","2 < k < 4"],"a":2,"x":"Foci on the x-axis need k − 2 > 6 − k > 0. The first inequality gives k > 4 and the second gives k < 6, so 4 < k < 6. 2 < k < 6 only makes both denominators positive and includes k = 4, which gives a circle."},{"id":"math-22-032","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"M","q":"A rectangular (equilateral) hyperbola with centre at the origin and axes along the coordinate axes passes through (3, −1). What is its equation?","o":["y² − x² = 8","x² − y² = 8","x² − y² = 10","x² − y² = 4"],"a":1,"x":"Such a hyperbola is x² − y² = λ (λ ≠ 0). Substituting (3, −1) gives λ = 9 − 1 = 8, so x² − y² = 8. x² − y² = 10 adds the squares instead of subtracting."},{"id":"math-22-033","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"M","q":"A parabola has its vertex at the origin, its axis along the x-axis, and passes through (−2, 4). What is its equation?","o":["y² = 8x","y² = −4x","x² = y","y² = −8x"],"a":3,"x":"With axis along the x-axis the form is y² = mx. Substituting gives 16 = −2m, so m = −8 and y² = −8x. x² = y also passes through (−2, 4), but its axis is the y-axis."},{"id":"math-22-034","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"M","q":"What is the position of the line y = x + 3 relative to the circle x² + y² = 4?","o":["Intersecting, through the centre","Separate (no common point)","Intersecting, not through the centre","Tangent"],"a":1,"x":"Write the line as x − y + 3 = 0. The distance from (0, 0) is 3/√2 = 3√2/2 ≈ 2.12, which is greater than r = 2, so the line and circle do not meet."},{"id":"math-22-035","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"M","q":"An ellipse with centre at the origin and major axis on the x-axis passes through (2, 0) and has eccentricity √3/2. What is its equation?","o":["x²/4 + y²/3 = 1","x² + y²/4 = 1","x²/4 + y² = 1","x²/16 + y²/4 = 1"],"a":2,"x":"(2, 0) is a vertex on the major axis, so a = 2. Then c = ea = √3 and b² = 4 − 3 = 1, giving x²/4 + y² = 1. x²/4 + y²/3 = 1 uses b² = 3, which is c², not b²."},{"id":"math-22-036","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"M","q":"A hyperbola has the same asymptotes as x²/4 − y²/9 = 1 and passes through (4, 3). What is its equation?","o":["x²/8 − y²/18 = 1","x²/12 − y²/27 = 1","y²/27 − x²/12 = 1","x²/3 − y²/9 = 1"],"a":1,"x":"Hyperbolas with these asymptotes are x²/4 − y²/9 = λ. At (4, 3): 16/4 − 9/9 = 3, so λ = 3 and the equation is x²/12 − y²/27 = 1. The y²-first version would need λ < 0."},{"id":"math-22-037","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"E","q":"Point P moves so that its distance to F(2, 0) equals its distance to the line x = −2. What is the equation of the path of P?","o":["y² = 4x","y² = 16x","y² = 8x","x² = 8y"],"a":2,"x":"This is a parabola with focus (2, 0) and directrix x = −2, so p/2 = 2, p = 4 and y² = 2px = 8x. y² = 4x would have focus (1, 0)."},{"id":"math-22-038","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"M","q":"What is the equation of the tangent to the circle x² + y² = 25 at the point (3, −4)?","o":["3x + 4y − 25 = 0","3x − 4y − 25 = 0","4x − 3y − 25 = 0","3x − 4y + 25 = 0"],"a":1,"x":"The tangent to x² + y² = r² at (x₀, y₀) is x₀x + y₀y = r², so 3x − 4y = 25, i.e. 3x − 4y − 25 = 0. Check: it passes through (3, −4) and is perpendicular to the radius, which has slope −4/3. 3x + 4y − 25 = 0 does not pass through (3, −4)."},{"id":"math-22-039","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"M","q":"P moves on the ellipse x²/9 + y²/4 = 1 with foci F₁ and F₂. What is the greatest area of triangle PF₁F₂?","o":["2√5","6","3√5","√5"],"a":0,"x":"c = √(9 − 4) = √5, so the base F₁F₂ = 2√5. The height is greatest when P is at an end of the minor axis, height b = 2. Area = ½ × 2√5 × 2 = 2√5. Using height 3 (= a) gives 3√5, but no point of the ellipse is 3 units from the x-axis."},{"id":"math-22-040","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"M","q":"What is the distance from a focus of the hyperbola x²/4 − y²/12 = 1 to one of its asymptotes?","o":["√3","2√3","2","4"],"a":1,"x":"c = √(4 + 12) = 4, focus (4, 0), asymptote √3x − y = 0. Distance = |4√3|/√(3 + 1) = 2√3, which equals b, as it does for every hyperbola. 2 is a, not b."},{"id":"math-22-041","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"D","q":"F is the focus of the parabola x² = 4y and A is the point (1, 3). P moves on the parabola. What is the minimum value of |PA| + |PF|?","o":["√5","4","3","5"],"a":1,"x":"|PF| equals the distance from P to the directrix y = −1. A is inside the parabola (1 < 4 × 3), so |PA| + |PF| is least when P is directly below A, at (1, 1/4), and the minimum is the distance from A to the directrix, 3 + 1 = 4. √5 is |AF|, which would need P on segment AF, but no such point of the parabola lies there."},{"id":"math-22-042","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"M","q":"What is the position of the circles x² + y² = 4 and (x − 3)² + (y − 4)² = 9 relative to each other?","o":["Externally tangent","Separate","Intersecting","Internally tangent"],"a":0,"x":"The distance between centres is √(3² + 4²) = 5, and r₁ + r₂ = 2 + 3 = 5. When the distance equals the sum of the radii, the circles touch externally."},{"id":"math-22-043","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"D","q":"P is a point on the ellipse x²/25 + y²/9 = 1 with foci F₁ and F₂, and ∠F₁PF₂ = 90°. What is the area of triangle F₁PF₂?","o":["16","12","6","9"],"a":3,"x":"Let |PF₁| = m and |PF₂| = n. Then m + n = 2a = 10 and m² + n² = (2c)² = 64. So 2mn = 100 − 64 = 36, mn = 18, and the area is ½mn = 9 (equal to b² when the angle is 90°). 16 is c², not b²."},{"id":"math-22-044","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"D","q":"A hyperbola x²/a² − y²/b² = 1 has eccentricity 2, and the distance from a focus to an asymptote is √3. What is its equation?","o":["x²/3 − y² = 1","x²/4 − y²/12 = 1","x² − y² = 3","x² − y²/3 = 1"],"a":3,"x":"The focus-to-asymptote distance equals b, so b = √3. e = 2 gives c = 2a, and c² = a² + b² gives 4a² = a² + 3, so a = 1. The equation is x² − y²/3 = 1. x²/4 − y²/12 = 1 also has e = 2, but its focus-to-asymptote distance is 2√3."},{"id":"math-22-045","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"M","q":"The line y = x − 1 meets the parabola y² = 4x at A and B. What is |AB|?","o":["8","4√2","6","10"],"a":0,"x":"Substituting gives (x − 1)² = 4x, i.e. x² − 6x + 1 = 0, so x₁ + x₂ = 6. The line passes through the focus (1, 0), so |AB| = x₁ + x₂ + p = 6 + 2 = 8. 6 forgets the p."},{"id":"math-22-046","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"M","q":"What is the equation of the circle through the points (0, 0), (4, 0) and (0, 6)?","o":["x² + y² + 4x + 6y = 0","x² + y² − 2x − 3y = 0","x² + y² − 4x − 6y = 0","x² + y² − 4x − 6y − 13 = 0"],"a":2,"x":"Through the origin, so c = 0 in x² + y² + 2gx + 2fy + c = 0. (4, 0): 16 + 8g = 0, g = −2; (0, 6): 36 + 12f = 0, f = −3. So x² + y² − 4x − 6y = 0, centre (2, 3), radius √13. Using g = 2, f = 3 puts the centre at (−2, −3)."},{"id":"math-22-047","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"M","q":"A circle has centre (2, −1) and touches the line 3x + 4y + 8 = 0. What is its equation?","o":["(x − 2)² + (y + 1)² = 4","(x − 2)² + (y + 1)² = 2","(x + 2)² + (y − 1)² = 4","(x − 2)² + (y + 1)² = 100"],"a":0,"x":"The radius is the distance from the centre to the tangent: |3·2 + 4·(−1) + 8|/5 = 10/5 = 2, so r² = 4. Forgetting to divide by 5 gives r = 10; writing r instead of r² gives 2."},{"id":"math-22-048","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"D","q":"A circle touches both coordinate axes and passes through the point (2, 1). What are the possible radii?","o":["5 only","1 or 5","2 or 3","1 only"],"a":1,"x":"The point is in the first quadrant, so the centre is (r, r): (2 − r)² + (1 − r)² = r² gives r² − 6r + 5 = 0, r = 1 or 5. Check: centre (1, 1) is 1 from (2, 1); centre (5, 5) is √(9 + 16) = 5 from it."},{"id":"math-22-049","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"M","q":"A circle has its centre on the line y = x and passes through (0, 2) and (4, 0). What is its equation?","o":["(x − 3)² + (y − 3)² = 10","(x − 2)² + (y − 2)² = 4","(x − 1)² + (y − 1)² = 10","(x − 3)² + (y − 3)² = 9"],"a":0,"x":"Centre (a, a): a² + (a − 2)² = (a − 4)² + a² gives −4a + 4 = −8a + 16, so a = 3. r² = 3² + 1² = 10. Check with (4, 0): 1 + 9 = 10."},{"id":"math-22-050","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"E","q":"What is the length of the tangent from the point (4, 5) to the circle x² + y² − 2x + 4y − 4 = 0?","o":["49","7","√41","5"],"a":1,"x":"Tangent length = √S₁ = √(16 + 25 − 8 + 20 − 4) = √49 = 7. Leaving out the square root gives 49."},{"id":"math-22-051","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"M","q":"The point (7, 1) lies on the circle x² + y² − 6x + 4y − 12 = 0. What is the equation of the normal to the circle at this point?","o":["3x − 4y − 17 = 0","4x + 3y − 31 = 0","3x + 4y − 25 = 0","4x − 3y − 25 = 0"],"a":0,"x":"The normal passes through the centre (3, −2). Slope = (1 + 2)/(7 − 3) = 3/4, so y − 1 = (3/4)(x − 7), i.e. 3x − 4y − 17 = 0. Check the centre: 9 + 8 − 17 = 0. 4x + 3y − 31 = 0 is the tangent at the point."},{"id":"math-22-052","unit":"math-22","topic":"math-22-circle","lo":"MATH-22.1","d":"D","q":"What is the length of the common chord of the circles x² + y² = 25 and x² + y² − 8x + 7 = 0?","o":["3","8","6","4"],"a":2,"x":"Subtracting the equations gives 8x − 7 = 25, so the common chord is x = 4. On x² + y² = 25 this gives y = ±3, so the chord has length 6. Check (4, 3) in the second circle: 16 + 9 − 32 + 7 = 0. Taking only y = 3 gives 3."},{"id":"math-22-053","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"E","q":"What is the length of the latus rectum of the parabola y² = −12x?","o":["3","6","24","12"],"a":3,"x":"y² = −4ax with 4a = 12, so a = 3 and the latus rectum is 4a = 12. The value 3 is a, the distance from vertex to focus."},{"id":"math-22-054","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"M","q":"What is the focus of the parabola y² − 4y − 8x + 20 = 0?","o":["(2, 2)","(0, 2)","(2, 4)","(4, 2)"],"a":3,"x":"Complete the square: (y − 2)² = 8x − 16 = 8(x − 2). Vertex (2, 2), 4a = 8, a = 2, opening to the right, so the focus is (2 + 2, 2) = (4, 2). (2, 2) is the vertex; (0, 2) lies on the directrix side."},{"id":"math-22-055","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"M","q":"What is the directrix of the parabola (x + 1)² = −8(y − 3)?","o":["y = 5","y = 1","y = 11","x = 1"],"a":0,"x":"Vertex (−1, 3), 4a = 8, a = 2, opening downwards, so the focus is (−1, 1) and the directrix is a above the vertex: y = 3 + 2 = 5. y = 1 is the level of the focus."},{"id":"math-22-056","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"M","q":"What is the equation of the parabola with focus (2, 3) and directrix x = −2?","o":["(y − 3)² = 8x","(y − 3)² = 4x","(y + 3)² = 8x","(y − 3)² = 16x"],"a":0,"x":"The vertex is midway between focus and directrix: (0, 3), with a = 2, opening right: (y − 3)² = 4·2·x = 8x. Check (2, 7): distance to focus 4, to directrix 4, and (7 − 3)² = 16 = 8·2."},{"id":"math-22-057","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"D","q":"An equilateral triangle is inscribed in the parabola y² = 4x with one vertex at the origin. What is the length of its side?","o":["4√3","12","8","8√3"],"a":3,"x":"By symmetry the other vertices are (x, ±y) with y = x tan 30° = x/√3. Then x²/3 = 4x gives x = 12 and y = ±4√3, so the side is 2·4√3 = 8√3. Check: OP = √(144 + 48) = √192 = 8√3. Stopping at y gives 4√3."},{"id":"math-22-058","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"M","q":"What is the equation of the parabola with vertex (1, 2) and focus (1, 5)?","o":["(x − 1)² = 3(y − 2)","(x − 1)² = 12(y − 2)","(y − 2)² = 12(x − 1)","(x − 1)² = −12(y − 2)"],"a":1,"x":"The focus is directly above the vertex at distance a = 3, so the axis is x = 1 and the parabola opens upwards: (x − 1)² = 4·3(y − 2) = 12(y − 2). Using 4a = 3 gives the second equation; the third has its axis horizontal."},{"id":"math-22-059","unit":"math-22","topic":"math-22-parabola","lo":"MATH-22.2","d":"D","q":"A focal chord of the parabola y² = 4x has one end at P(4, 4). What is its other end?","o":["(1/4, 1)","(1, −2)","(1/4, −1)","(4, −4)"],"a":2,"x":"The focus is (1, 0); line PF has slope 4/3: y = (4/3)(x − 1). Then (16/9)(x − 1)² = 4x gives 4x² − 17x + 4 = 0, so x = 4 or 1/4, and y = (4/3)(1/4 − 1) = −1. Check: (−1)² = 4·(1/4). (4, −4) is the mirror image of P, not on line PF."},{"id":"math-22-060","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"M","q":"What are the foci of the ellipse (x − 2)²/9 + (y + 1)²/25 = 1?","o":["(2, 3) and (2, −5)","(6, −1) and (−2, −1)","(2, 4) and (2, −4)","(2, −1 + √34) and (2, −1 − √34)"],"a":0,"x":"The larger denominator 25 is under y, so the major axis is vertical through the centre (2, −1). c² = 25 − 9 = 16, c = 4, foci (2, −1 ± 4) = (2, 3) and (2, −5). Putting the foci on the horizontal line gives (6, −1) and (−2, −1); adding 25 + 9 gives √34."},{"id":"math-22-061","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"E","q":"What is the length of the latus rectum of the ellipse x²/25 + y²/16 = 1?","o":["25/2","16/5","32/5","8"],"a":2,"x":"Latus rectum = 2b²/a = 2·16/5 = 32/5. Using 2a²/b gives 25/2, and b²/a (half of it) gives 16/5."},{"id":"math-22-062","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"M","q":"What are the directrices of the ellipse x²/16 + y²/12 = 1?","o":["x = ±2","x = ±4","x = ±16","x = ±8"],"a":3,"x":"a = 4, c² = 16 − 12 = 4, c = 2, e = c/a = 1/2. Directrices: x = ±a/e = ±8. The value ±2 is ±ae, the foci, and ±4 are the vertices."},{"id":"math-22-063","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"M","q":"An ellipse has centre at the origin and foci on the y-axis. Its minor axis has length 8 and the distance between its foci is 6. What is its equation?","o":["x²/25 + y²/16 = 1","x²/16 + y²/25 = 1","x²/16 + y²/9 = 1","x²/64 + y²/100 = 1"],"a":1,"x":"b = 4 and c = 3, so a² = b² + c² = 25. With the major axis on the y-axis: x²/16 + y²/25 = 1. Swapping the denominators puts the foci on the x-axis; using the full lengths 8 and 10 instead of halves gives 64 and 100."},{"id":"math-22-064","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"D","q":"The latus rectum of an ellipse is half the length of its minor axis. What is its eccentricity?","o":["1/2","√2/2","√3/2","3/4"],"a":2,"x":"2b²/a = ½·2b gives b = a/2. Then e² = 1 − b²/a² = 1 − 1/4 = 3/4, so e = √3/2. Stopping at e² gives 3/4."},{"id":"math-22-065","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"M","q":"An ellipse has centre at the origin, a focus at (4, 0) and the corresponding directrix x = 9. What is its equation?","o":["x²/20 + y²/36 = 1","x²/81 + y²/65 = 1","x²/36 + y²/52 = 1","x²/36 + y²/20 = 1"],"a":3,"x":"ae = 4 and a/e = 9 multiply to a² = 36, so a = 6, e = 2/3 and b² = a² − (ae)² = 36 − 16 = 20. Adding instead of subtracting gives 52; taking a = 9 gives 81."},{"id":"math-22-066","unit":"math-22","topic":"math-22-ellipse","lo":"MATH-22.3","d":"D","q":"The point P on the ellipse x²/25 + y²/9 = 1 has x-coordinate 3. What is the distance from P to the focus (−4, 0)?","o":["13/5","37/5","7","5"],"a":1,"x":"e = 4/5, and the distance to the left focus is a + ex = 5 + (4/5)·3 = 37/5. Check: y² = 9(1 − 9/25) = 144/25, and √(7² + 144/25) = √(1369/25) = 37/5. a − ex = 13/5 is the distance to the right focus (4, 0)."},{"id":"math-22-067","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"E","q":"What is the length of the latus rectum of the hyperbola x²/16 − y²/9 = 1?","o":["9/4","32/3","9/2","9/8"],"a":2,"x":"Latus rectum = 2b²/a = 2·9/4 = 9/2. Leaving out the 2 gives 9/4, and 2a²/b = 32/3 swaps a and b."},{"id":"math-22-068","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"M","q":"What are the foci of the hyperbola (x − 1)²/9 − (y + 2)²/16 = 1?","o":["(1, 3) and (1, −7)","(1 + √7, −2) and (1 − √7, −2)","(6, −2) and (−4, −2)","(5, 0) and (−5, 0)"],"a":2,"x":"Centre (1, −2), transverse axis horizontal, c² = a² + b² = 9 + 16 = 25, c = 5. Foci (1 ± 5, −2) = (6, −2) and (−4, −2). c² = 16 − 9 = 7 is the ellipse slip; (±5, 0) forgets the shifted centre."},{"id":"math-22-069","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"M","q":"What is the eccentricity of the hyperbola 9x² − 4y² − 18x − 16y − 43 = 0?","o":["√13/2","√13/3","√5/3","3/2"],"a":0,"x":"9(x − 1)² − 9 − 4(y + 2)² + 16 − 43 = 0 gives 9(x − 1)² − 4(y + 2)² = 36, i.e. (x − 1)²/4 − (y + 2)²/9 = 1. a² = 4, b² = 9, e = √(1 + 9/4) = √13/2. Dividing c by b gives √13/3."},{"id":"math-22-070","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"M","q":"What are the directrices of the hyperbola x²/9 − y²/16 = 1?","o":["x = ±5","x = ±16/5","x = ±9/5","x = ±25/9"],"a":2,"x":"c = √(9 + 16) = 5, e = 5/3, directrices x = ±a/e = ±3/(5/3) = ±9/5. The value ±5 is ±ae, the foci."},{"id":"math-22-071","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"M","q":"What is the eccentricity of the hyperbola conjugate to x²/9 − y²/16 = 1?","o":["5/4","5/3","4/3","√7/4"],"a":0,"x":"The conjugate hyperbola is y²/16 − x²/9 = 1, with transverse semi-axis 4 and c² = 16 + 9 = 25. e = 5/4. The given hyperbola has e = 5/3; note 1/(5/3)² + 1/(5/4)² = 9/25 + 16/25 = 1."},{"id":"math-22-072","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"D","q":"P is the point on the right branch of the hyperbola x² − y² = 9 with x = 6. What is the distance from P to the focus (3√2, 0)?","o":["6√2 + 3","3√2","9","6√2 − 3"],"a":3,"x":"a = 3, c = 3√2, e = √2. For the right branch the distance to the right focus is ex − a = 6√2 − 3. Check: y² = 27 and (6 − 3√2)² + 27 = 81 − 36√2 = (6√2 − 3)². ex + a = 6√2 + 3 is the distance to the left focus."},{"id":"math-22-073","unit":"math-22","topic":"math-22-hyperbola","lo":"MATH-22.4","d":"M","q":"A hyperbola has vertices (±3, 0) and passes through the point (5, 8/3). What is its equation?","o":["x²/9 − y²/4 = 1","x²/9 − y²/16 = 1","x²/3 − y²/4 = 1","x²/9 + y²/4 = 1"],"a":0,"x":"a² = 9, so 25/9 − (64/9)/b² = 1 gives (64/9)/b² = 16/9 and b² = 4. Check: 25/9 − 16/9 = 1. Using a² = 3 confuses a with a²."},{"id":"math-22-074","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"E","q":"What is the equation of the tangent to the parabola y² = 8x at the point (2, 4)?","o":["x + y − 6 = 0","2x − y = 0","x − y + 2 = 0","x − 2y + 6 = 0"],"a":2,"x":"Tangent to y² = 4ax at (x₁, y₁): yy₁ = 2a(x + x₁). With a = 2: 4y = 4(x + 2), i.e. y = x + 2 or x − y + 2 = 0. x + y − 6 = 0 is the normal at the same point."},{"id":"math-22-075","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"M","q":"The point (2, 3√3/2) lies on the ellipse x²/16 + y²/9 = 1. What is the tangent to the ellipse at this point?","o":["3x + 4√3y = 12","3x + 4√3y = 24","3x − 4√3y = 24","4x + 3√3y = 24"],"a":1,"x":"Tangent: xx₁/16 + yy₁/9 = 1 gives 2x/16 + (3√3/2)y/9 = 1, i.e. x/8 + √3y/6 = 1. Multiply by 24: 3x + 4√3y = 24. Check the point: 6 + 18 = 24."},{"id":"math-22-076","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"M","q":"The line y = 2x + c is tangent to the ellipse x²/4 + y²/9 = 1. What are the possible values of c?","o":["±√17","±5","5 only","±√7"],"a":1,"x":"For x²/a² + y²/b² = 1, the condition is c² = a²m² + b² = 4·4 + 9 = 25, so c = ±5. Using a²m instead of a²m² gives √17; there is one tangent of each sign."},{"id":"math-22-077","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"M","q":"The line y = 2x + c is tangent to the hyperbola x²/4 − y²/7 = 1. What are the possible values of c?","o":["±√23","3 only","±3","±9"],"a":2,"x":"For x²/a² − y²/b² = 1 the condition is c² = a²m² − b² = 16 − 7 = 9, so c = ±3. The ellipse condition with + gives √23; 9 is c², not c."},{"id":"math-22-078","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"M","q":"A tangent to the parabola y² = 12x has slope 3. What is its point of contact?","o":["(27, 18)","(2, 1/3)","(1/3, −2)","(1/3, 2)"],"a":3,"x":"a = 3. The tangent with slope m is y = mx + a/m = 3x + 1, touching at (a/m², 2a/m) = (1/3, 2). Check: 2² = 12·(1/3) and 3·(1/3) + 1 = 2. (am², 2am) = (27, 18) inverts m."},{"id":"math-22-079","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"E","q":"What is the tangent at the vertex of the parabola (y − 1)² = 4(x + 2)?","o":["x = −2","y = 1","x = −1","x = 2"],"a":0,"x":"The vertex is (−2, 1) and the axis is horizontal (y = 1), so the tangent at the vertex is the vertical line x = −2. y = 1 is the axis; x = −1 passes through the focus."},{"id":"math-22-080","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"M","q":"The tangent to the parabola y² = 4x at a point P meets the x-axis at (−4, 0). What is P?","o":["(4, 4) only","(4, 4) or (4, −4)","(16, 8) or (16, −8)","(2, 2√2) or (2, −2√2)"],"a":1,"x":"The tangent at (x₁, y₁) is yy₁ = 2(x + x₁); putting y = 0 gives x = −x₁, so x₁ = 4 and y₁² = 16, y₁ = ±4. Check (4, 4): 4y = 2(x + 4) meets y = 0 at x = −4. Both points work by symmetry."},{"id":"math-22-081","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"D","q":"The point (2√2, √2) lies on the hyperbola x²/4 − y²/2 = 1. What is the normal to the hyperbola at this point?","o":["x − y = √2","x + y = √2","x + y = 3√2","x + 2y = 4√2"],"a":2,"x":"Tangent: 2√2x/4 − √2y/2 = 1, i.e. x − y = √2, slope 1. The normal has slope −1 through (2√2, √2): x + y = 3√2. x − y = √2 is the tangent itself."},{"id":"math-22-082","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"M","q":"What does the equation x² + 4xy + 4y² + x − 3 = 0 represent?","o":["A parabola","An ellipse","A hyperbola","A pair of straight lines"],"a":0,"x":"With A = 1, B = 4, C = 4: B² − 4AC = 16 − 16 = 0, so the conic is of parabola type. It is (x + 2y)² = 3 − x, which does not split into two lines (the second-degree part is a square but the linear part is not a multiple of x + 2y), so it is a parabola."},{"id":"math-22-083","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"M","q":"Through what acute angle must the axes be rotated to remove the xy-term from 5x² + 2√3xy + 3y² − 12 = 0?","o":["30°","60°","45°","15°"],"a":0,"x":"tan 2θ = B/(A − C) = 2√3/(5 − 3) = √3, so 2θ = 60° and θ = 30°. Taking 60° forgets to halve 2θ; 45° applies only when A = C."},{"id":"math-22-084","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"D","q":"The axes are rotated through 30°. What does 5x² + 2√3xy + 3y² − 12 = 0 become?","o":["X² + 3Y² = 6","3X² + Y² = 6","3X² − Y² = 6","2X² + Y² = 4"],"a":1,"x":"With x = X cos 30° − Y sin 30°, y = X sin 30° + Y cos 30°: the X² coefficient is 5·¾ + 2√3·(√3/4) + 3·¼ = 6 and the Y² coefficient is 5·¼ − 3/2 + 3·¾ = 2, so 6X² + 2Y² = 12, i.e. 3X² + Y² = 6. Check: 6 + 2 = 5 + 3 and 6·2 = 15 − 3 (invariants)."},{"id":"math-22-085","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"M","q":"For which values of k does x² + kxy + 4y² − 2x + 5 = 0 represent a parabola?","o":["4 only","±2","±4","±16"],"a":2,"x":"A parabola needs B² − 4AC = k² − 16 = 0, so k = ±4. Both work: with k = ±4 the equation is (x ± 2y)² = 2x − 5, which is not a pair of lines. Using h² = ab with h = k gives ±2."},{"id":"math-22-086","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"D","q":"For which value of k does x² − 5xy + 6y² + x − 3y + k = 0 represent a pair of straight lines?","o":["1","−1","6","0"],"a":3,"x":"The second-degree part is (x − 2y)(x − 3y). Try (x − 2y + p)(x − 3y + q): the x and y terms need p + q = 1 and −3p − 2q = −3, so p = 1, q = 0 and k = pq = 0. Check: (x − 3y)(x − 2y + 1) expands to the given equation with k = 0."},{"id":"math-22-087","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"M","q":"The point (4, 3√3) lies on the hyperbola x²/4 − y²/9 = 1. What is the tangent at this point?","o":["√3x − y = √3","x − √3y = 1","√3x + y = 7√3","4x − 3√3y = 1"],"a":0,"x":"Tangent: xx₁/4 − yy₁/9 = 1 gives x − (3√3/9)y = 1, i.e. x − y/√3 = 1, so √3x − y = √3. Check: 4√3 − 3√3 = √3. Forgetting to divide by a² and b² gives 4x − 3√3y = 1."},{"id":"math-22-088","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"D","q":"Two tangents are drawn from the point (−1, 2) to the parabola y² = 4x. What is the angle between them?","o":["60°","45°","30°","90°"],"a":3,"x":"A tangent y = mx + 1/m through (−1, 2) gives 2 = −m + 1/m, i.e. m² + 2m − 1 = 0, so m₁m₂ = −1 and the tangents are perpendicular. This fits the fact that (−1, 2) lies on the directrix x = −1."},{"id":"math-22-089","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"M","q":"The point (2, 1) lies on the ellipse x²/8 + y²/2 = 1. What is the normal to the ellipse at this point?","o":["x + 2y − 4 = 0","2x + y − 5 = 0","2x − y − 3 = 0","x − 2y = 0"],"a":2,"x":"Tangent: 2x/8 + y/2 = 1, i.e. x + 2y = 4, slope −½. The normal has slope 2: y − 1 = 2(x − 2), i.e. 2x − y − 3 = 0. x + 2y − 4 = 0 is the tangent."},{"id":"math-22-090","unit":"math-22","topic":"math-22-tangents","lo":"MATH-22.5","d":"D","q":"The line y = x + c meets the ellipse x²/3 + y² = 1 in two distinct points. What is the range of c?","o":["−2 < c < 2","c = ±2","−√3 < c < √3","c < −2 or c > 2"],"a":0,"x":"Substituting: x²/3 + (x + c)² = 1 gives 4x² + 6cx + 3c² − 3 = 0. Two real roots need 36c² − 16(3c² − 3) > 0, i.e. c² < 4, so −2 < c < 2. c = ±2 gives the tangents (c² = a²m² + b² = 3 + 1); outside that range the line misses the ellipse."},{"id":"math-23-001","unit":"math-23","topic":"math-23-plane","lo":"MATH-23.1","d":"E","q":"Given the vectors a = (2, −1) and b = (−3, 4), what is a + 2b?","o":["(−1, 3)","(−4, 7)","(−4, 9)","(4, −7)"],"a":1,"x":"2b = (−6, 8), so a + 2b = (2 − 6, −1 + 8) = (−4, 7). (−1, 3) is a + b, where b was not doubled, and (4, −7) has every sign reversed, which is −(a + 2b)."},{"id":"math-23-002","unit":"math-23","topic":"math-23-dot","lo":"MATH-23.2","d":"E","q":"If a = (1, 2) and b = (3, −1), what is the value of a · b?","o":["1","−5","−1","5"],"a":0,"x":"a · b = 1 × 3 + 2 × (−1) = 3 − 2 = 1. The value 5 comes from ignoring the negative sign of −1 (or multiplying crosswise, 1 × (−1) + 2 × 3); the dot product pairs x with x and y with y."},{"id":"math-23-003","unit":"math-23","topic":"math-23-cross","lo":"MATH-23.3","d":"M","q":"What is the area of the triangle with vertices A(1, 0, 0), B(0, 1, 0) and C(0, 0, 1)?","o":["1/2","√2/2","√3/2","√3"],"a":2,"x":"Each side is √(1 + 1) = √2, so the triangle is equilateral and its area is (√3/4) × (√2)² = √3/2. 1/2 is the area of the right triangle OAB in the xOy plane, not of ABC."},{"id":"math-23-004","unit":"math-23","topic":"math-23-triple","lo":"MATH-23.4","d":"M","q":"In the tetrahedron OABC, the edges OA, OB and OC are mutually perpendicular, with OA = 2, OB = 3 and OC = 4. What is its volume?","o":["8","12","4","24"],"a":2,"x":"Take OAB as the base, a right triangle of area ½ × 2 × 3 = 3, and OC = 4 as the height: V = ⅓ × 3 × 4 = 4. 12 forgets the ⅓, and 8 forgets the ½ in the triangle area."},{"id":"math-23-005","unit":"math-23","topic":"math-23-plane","lo":"MATH-23.1","d":"E","q":"What is the magnitude of the vector a = (5, −12)?","o":["17","7","13","√119"],"a":2,"x":"|a| = √(5² + (−12)²) = √(25 + 144) = √169 = 13. Adding or subtracting the components (17 or 7) is not how length works, and √119 comes from subtracting 25 from 144 instead of adding."},{"id":"math-23-006","unit":"math-23","topic":"math-23-dot","lo":"MATH-23.2","d":"M","q":"The vectors a = (k, 3) and b = (2, −4) are perpendicular. What is the value of k?","o":["−6","−3/2","3/2","6"],"a":3,"x":"Perpendicular means a · b = 0: 2k + 3 × (−4) = 0, so 2k = 12 and k = 6. The value −3/2 comes from using the parallel condition −4k − 6 = 0 instead, and −6 is a sign slip."},{"id":"math-23-007","unit":"math-23","topic":"math-23-cross","lo":"MATH-23.3","d":"M","q":"What is the area of the triangle with vertices A(1, 0, 1), B(3, 2, 0) and C(3, −1, 3)?","o":["3","9/2","9","3√2"],"a":1,"x":"AB = (2, 2, −1) and AC = (2, −1, 2), so |AB| = |AC| = 3 and AB · AC = 4 − 2 − 2 = 0. The triangle is right-angled at A, and its area is ½ × 3 × 3 = 9/2. 9 forgets the ½, and 3√2 is the length of BC."},{"id":"math-23-008","unit":"math-23","topic":"math-23-plane","lo":"MATH-23.1","d":"M","q":"The vectors a = (2, m) and b = (3, 6) are parallel. What is the value of m?","o":["−1","1","4","9"],"a":2,"x":"For parallel vectors x₁y₂ − x₂y₁ = 0: 2 × 6 − 3m = 0, so m = 4 (indeed b = 1.5a). The value −1 comes from the perpendicular condition 6 + 6m = 0, and 9 from the inverted ratio 2/3 = 6/m."},{"id":"math-23-009","unit":"math-23","topic":"math-23-dot","lo":"MATH-23.2","d":"M","q":"What is the angle between the vectors a = (1, √3) and b = (√3, 1)?","o":["30°","45°","60°","120°"],"a":0,"x":"a · b = √3 + √3 = 2√3 and |a| = |b| = 2, so cos θ = 2√3/4 = √3/2 and θ = 30°. Choosing 60° confuses cos θ = √3/2 with sin θ = √3/2."},{"id":"math-23-010","unit":"math-23","topic":"math-23-plane","lo":"MATH-23.1","d":"E","q":"Points A(1, 2) and B(4, −2) are given. What are the coordinates of the vector AB (from A to B)?","o":["(3, −4)","(−3, 4)","(4, −2)","(5, 0)"],"a":0,"x":"AB = B − A = (4 − 1, −2 − 2) = (3, −4). (−3, 4) is the vector BA (end minus start reversed), (5, 0) adds the coordinates, and (4, −2) is just the position of B."},{"id":"math-23-011","unit":"math-23","topic":"math-23-dot","lo":"MATH-23.2","d":"M","q":"The vectors a and b satisfy |a| = 2, |b| = 3, and the angle between them is 60°. What is |a + b|?","o":["5","√13","√7","√19"],"a":3,"x":"|a + b|² = |a|² + 2a · b + |b|² = 4 + 2 × 2 × 3 × ½ + 9 = 19, so |a + b| = √19. √13 drops the 2a · b term, √7 is |a − b|, and 5 simply adds the lengths, which only works when the vectors point the same way."},{"id":"math-23-012","unit":"math-23","topic":"math-23-plane","lo":"MATH-23.1","d":"M","q":"Which vector is the unit vector with the same direction as (−6, 8)?","o":["(−3, 4)","(−3/5, 4/5)","(−3/7, 4/7)","(3/5, −4/5)"],"a":1,"x":"The length of (−6, 8) is √(36 + 64) = 10, so the unit vector is (−6/10, 8/10) = (−3/5, 4/5). (3/5, −4/5) is a unit vector but points the opposite way, and (−3/7, 4/7) divides by |−6| + |8| = 14 instead of the length."},{"id":"math-23-013","unit":"math-23","topic":"math-23-dot","lo":"MATH-23.2","d":"M","q":"The vectors a and b satisfy |a| = 3, |b| = 4 and |a − b| = √13. What is a · b?","o":["12","6","3","−6"],"a":1,"x":"|a − b|² = |a|² − 2a · b + |b|², so 13 = 9 + 16 − 2a · b, giving 2a · b = 12 and a · b = 6. The value 12 forgets to divide by 2, and −6 comes from writing the middle term as +2a · b."},{"id":"math-23-014","unit":"math-23","topic":"math-23-plane","lo":"MATH-23.1","d":"M","q":"Let a = (2, 1) and b = (x, 3). If a + b is parallel to a − 2b, what is the value of x?","o":["−6","−2","6","3"],"a":2,"x":"a + b = (2 + x, 4) and a − 2b = (2 − 2x, −5). Parallel means (2 + x)(−5) − 4(2 − 2x) = 0, so −10 − 5x − 8 + 8x = 0, 3x = 18 and x = 6 (then b = 3a). The value −6 comes from a sign slip when expanding −5(2 + x).
