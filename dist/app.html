 gives x² − 7x + 22."},{"id":"math-06-078","unit":"math-06","topic":"math-06-poly","lo":"MATH-6.4","d":"M","q":"Which is the factorisation of x³ − 7x + 6?","o":["(x + 1)(x + 2)(x − 3)","(x − 1)(x + 2)(x − 3)","(x − 1)(x − 2)(x − 3)","(x − 1)(x − 2)(x + 3)"],"a":3,"x":"f(1) = 1 − 7 + 6 = 0, so x − 1 is a factor: x³ − 7x + 6 = (x − 1)(x² + x − 6) = (x − 1)(x − 2)(x + 3). (x + 1)(x + 2)(x − 3) expands to x³ − 7x − 6."},{"id":"math-06-079","unit":"math-06","topic":"math-06-poly","lo":"MATH-6.4","d":"D","q":"A polynomial f(x) leaves remainder 3 when divided by x − 1 and remainder 5 when divided by x − 2. What is the remainder when f(x) is divided by (x − 1)(x − 2)?","o":["x + 2","2x + 1","−2x + 5","2x + 3"],"a":1,"x":"The remainder has the form px + q with f(1) = p + q = 3 and f(2) = 2p + q = 5, so p = 2, q = 1: remainder 2x + 1. Check: at x = 2 it gives 5, while −2x + 5 gives 1."},{"id":"math-06-080","unit":"math-06","topic":"math-06-poly","lo":"MATH-6.4","d":"M","q":"What is the remainder when x⁵¹ + 51 is divided by x + 1?","o":["52","51","0","50"],"a":3,"x":"Remainder = f(−1) = (−1)⁵¹ + 51 = −1 + 51 = 50. Treating (−1)⁵¹ as +1 gives 52."},{"id":"math-06-081","unit":"math-06","topic":"math-06-poly","lo":"MATH-6.4","d":"D","q":"The cubic x³ + px + q has (x − 1)² as a factor. What are p and q?","o":["p = 3, q = −2","p = −3, q = −2","p = −3, q = 2","p = −2, q = 1"],"a":2,"x":"Write x³ + px + q = (x² − 2x + 1)(x + c) = x³ + (c − 2)x² + (1 − 2c)x + c. No x² term, so c = 2; then p = 1 − 4 = −3 and q = 2. Check: f(1) = 1 − 3 + 2 = 0."},{"id":"math-06-082","unit":"math-06","topic":"math-06-simul","lo":"MATH-6.6","d":"E","q":"What are the solutions of the system x + y = 5, xy = 6?","o":["(−2, −3) and (−3, −2)","(2, 3) and (3, 2)","(1, 6) and (6, 1)","(2, 3) only"],"a":1,"x":"y = 5 − x gives x(5 − x) = 6, so x² − 5x + 6 = 0 and x = 2 or 3, with y = 3 or 2. Both ordered pairs are solutions."},{"id":"math-06-083","unit":"math-06","topic":"math-06-simul","lo":"MATH-6.6","d":"M","q":"What are the solutions of the system x − y = 1, x² + y² = 25?","o":["(4, 3) and (3, 4)","(−4, −3) and (3, 4)","(4, 3) and (−3, −4)","(4, 3) and (−3, 4)"],"a":2,"x":"y = x − 1: x² + (x − 1)² = 25, so 2x² − 2x − 24 = 0, x² − x − 12 = 0, x = 4 or −3, giving y = 3 or −4. (3, 4) fails x − y = 1."},{"id":"math-06-084","unit":"math-06","topic":"math-06-simul","lo":"MATH-6.6","d":"D","q":"For which values of k does the line y = x + k touch the circle x² + y² = 8 (meet it at exactly one point)?","o":["k = ±4","k = ±2√2","k = ±8","k = ±2"],"a":0,"x":"Substituting: 2x² + 2kx + k² − 8 = 0. One point needs discriminant 4k² − 8(k² − 8) = 64 − 4k² = 0, so k = ±4. Check: k = 4 gives 2(x + 2)² = 0."},{"id":"math-06-085","unit":"math-06","topic":"math-06-simul","lo":"MATH-6.6","d":"M","q":"How does the line y = 2x − 3 meet the curve y = x² − 2x + 1?","o":["it cuts the curve at (1, −1) and (3, 3)","it does not meet the curve","it cuts the curve at (2, 1) and (−2, −7)","it touches the curve at (2, 1) only"],"a":3,"x":"x² − 2x + 1 = 2x − 3 gives x² − 4x + 4 = 0 = (x − 2)², a double root, so the line touches at x = 2, y = 1."},{"id":"math-06-086","unit":"math-06","topic":"math-06-simul","lo":"MATH-6.6","d":"D","q":"What are the solutions of the system 2x + y = 7, x² − xy = 6?","o":["(3, 1) and (−2/3, 25/3)","(3, 1) and (2/3, 17/3)","(3, 1) only","(−3, 13) and (2/3, 17/3)"],"a":0,"x":"y = 7 − 2x: x² − x(7 − 2x) = 6 gives 3x² − 7x − 6 = 0 = (3x + 2)(x − 3), so x = 3 (y = 1) or x = −2/3 (y = 25/3). Check: 4/9 + 50/9 = 6."},{"id":"math-06-087","unit":"math-06","topic":"math-06-simul","lo":"MATH-6.6","d":"M","q":"The difference of two positive numbers is 3 and their product is 54. What is their sum?","o":["21","12","18","15"],"a":3,"x":"Let the numbers be x and x + 3: x(x + 3) = 54, so x² + 3x − 54 = 0 = (x + 9)(x − 6) and x = 6. The numbers are 6 and 9, sum 15."},{"id":"math-06-088","unit":"math-06","topic":"math-06-simul","lo":"MATH-6.6","d":"M","q":"A rectangle has perimeter 34 cm and diagonal 13 cm. What is its area?","o":["120 cm²","72 cm²","30 cm²","60 cm²"],"a":3,"x":"l + w = 17 and l² + w² = 169. Then 2lw = 17² − 169 = 120, so the area lw = 60 cm² (sides 12 and 5). 120 is 2lw."},{"id":"math-06-089","unit":"math-06","topic":"math-06-simul","lo":"MATH-6.6","d":"M","q":"What is the solution of the system x + y = 8, x² − y² = 16?","o":["(3, 5)","(4, 4)","(6, 2)","(5, 3)"],"a":3,"x":"x² − y² = (x + y)(x − y) = 16, so 8(x − y) = 16 and x − y = 2. With x + y = 8: x = 5, y = 3. (3, 5) gives x² − y² = −16."},{"id":"math-06-090","unit":"math-06","topic":"math-06-simul","lo":"MATH-6.6","d":"D","q":"What are the solutions of the system 3x − 2y = 1, x² + xy − y² = 1?","o":["(1, 1) and (−5, −8)","(1, 1) and (5, 7)","(−1, −2) and (5, 7)","(1, 1) only"],"a":0,"x":"y = (3x − 1)/2; multiplying the second equation by 4: 4x² + 2x(3x − 1) − (3x − 1)² = 4, which gives x² + 4x − 5 = 0, x = 1 or −5, y = 1 or −8. Check (−5, −8): 25 + 40 − 64 = 1."},{"id":"math-07-001","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"E","q":"If 1/((x − 1)(x + 2)) = A/(x − 1) + B/(x + 2), what is the value of A?","o":["−1/3","1","1/3","3"],"a":2,"x":"Cover-up: put x = 1 in 1/(x + 2) to get A = 1/3. Putting x = −2 instead gives B = −1/3, the most common mix-up."},{"id":"math-07-002","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"M","q":"Resolve (5x + 1)/((x − 1)(x + 1)) into partial fractions.","o":["3/(x − 1) + 2/(x + 1)","2/(x − 1) + 3/(x + 1)","3/(x − 1) − 2/(x + 1)","−2/(x − 1) + 3/(x + 1)"],"a":0,"x":"5x + 1 = A(x + 1) + B(x − 1). x = 1 gives 6 = 2A, A = 3; x = −1 gives −4 = −2B, B = 2. Swapping the two constants gives the main wrong choice."},{"id":"math-07-003","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"E","q":"Which is the correct form of the partial fractions of (2x + 3)/((x − 1)²(x + 4))?","o":["A/(x − 1) + B/(x + 4)","A/(x − 1)² + B/(x + 4)","A/(x − 1) + B/(x − 1)² + C/(x + 4)","A/(x − 1) + B/(x + 4) + C/(x + 4)²"],"a":2,"x":"A repeated linear factor (x − 1)² needs one term for each power, A/(x − 1) and B/(x − 1)², and the single factor (x + 4) needs C/(x + 4). Dropping the A/(x − 1) term is the usual slip."},{"id":"math-07-004","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"M","q":"Express (x² + 1)/((x − 1)(x + 1)) in partial fractions.","o":["1/(x − 1) − 1/(x + 1)","1 + 1/(x − 1) + 1/(x + 1)","1 + 1/(x − 1) − 1/(x + 1)","1 − 1/(x − 1) + 1/(x + 1)"],"a":2,"x":"The fraction is improper (equal degrees), so divide first: (x² + 1)/(x² − 1) = 1 + 2/((x − 1)(x + 1)). Then 2/((x − 1)(x + 1)) = 1/(x − 1) − 1/(x + 1). Forgetting the quotient 1 gives the second choice."},{"id":"math-07-005","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"M","q":"If x/((x − 2)(x − 3)) = A/(x − 2) + B/(x − 3), find A + B.","o":["5","−1","1","−5"],"a":2,"x":"Cover-up: A = 2/(2 − 3) = −2 and B = 3/(3 − 2) = 3, so A + B = 1. Check: the x-coefficient of A(x − 3) + B(x − 2) is A + B, which must equal 1."},{"id":"math-07-006","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"M","q":"If (x + 3)/(x − 1)² = A/(x − 1) + B/(x − 1)², what is the value of B?","o":["1","4","3","2"],"a":1,"x":"x + 3 = A(x − 1) + B. Putting x = 1 gives B = 4; comparing x-coefficients gives A = 1. Reporting A instead of B gives 1."},{"id":"math-07-007","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"M","q":"Resolve 1/(x²(x + 1)) into partial fractions.","o":["−1/x + 1/x² + 1/(x + 1)","1/x + 1/x² − 1/(x + 1)","1/x² + 1/(x + 1)","−1/x + 1/x² − 1/(x + 1)"],"a":0,"x":"1 = Ax(x + 1) + B(x + 1) + Cx². x = 0 gives B = 1; x = −1 gives C = 1; the x² terms give A + C = 0, so A = −1. Leaving out the A/x term gives the third choice, which does not add back to the original."},{"id":"math-07-008","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"M","q":"Express (x² + 1)/(x(x − 1)(x + 1)) as partial fractions.","o":["1/x + 1/(x − 1) + 1/(x + 1)","−1/x + 1/(x − 1) + 1/(x + 1)","−1/x + 1/(x − 1) − 1/(x + 1)","1/x − 1/(x − 1) + 1/(x + 1)"],"a":1,"x":"Cover-up: at x = 0, 1/((−1)(1)) = −1; at x = 1, 2/((1)(2)) = 1; at x = −1, 2/((−1)(−2)) = 1. A sign slip in the first product gives +1/x."},{"id":"math-07-009","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"D","q":"Resolve x³/(x² − 1) into partial fractions.","o":["x + 1/(2(x − 1)) + 1/(2(x + 1))","1/(2(x − 1)) + 1/(2(x + 1))","x + 1/(2(x − 1)) − 1/(2(x + 1))","x − 1/(2(x − 1)) − 1/(2(x + 1))"],"a":0,"x":"Divide: x³/(x² − 1) = x + x/(x² − 1). Then x/((x − 1)(x + 1)) has A = 1/2 at x = 1 and B = (−1)/(−2) = 1/2 at x = −1. Skipping the division loses the term x."},{"id":"math-07-010","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"M","q":"If (kx + 1)/((x + 1)(x − 2)) = 1/(x + 1) + B/(x − 2), find k.","o":["−2","2","4","−4"],"a":2,"x":"Cover-up at x = −1: (−k + 1)/(−1 − 2) = 1, so −k + 1 = −3 and k = 4. Check: then B = 9/3 = 3, and 1·(x − 2) + 3(x + 1) = 4x + 1."},{"id":"math-07-011","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"E","q":"In (3x − 1)/((x + 1)(x − 2)) = A/(x + 1) + B/(x − 2), what is A?","o":["−4/3","5/3","3/4","4/3"],"a":3,"x":"Put x = −1 in (3x − 1)/(x − 2): (−4)/(−3) = 4/3. The value 5/3 is B (from x = 2), and −4/3 comes from dropping one minus sign."},{"id":"math-07-012","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"D","q":"If x²/((x − 1)²(x + 1)) = A/(x − 1) + B/(x − 1)² + C/(x + 1), find A.","o":["3/4","1/4","1/2","1"],"a":0,"x":"x² = A(x − 1)(x + 1) + B(x + 1) + C(x − 1)². x = 1 gives B = 1/2; x = −1 gives 4C = 1, C = 1/4; the x² terms give A + C = 1, so A = 3/4. The other values are C, B and the x² coefficient itself."},{"id":"math-07-013","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"D","q":"Express (x² + x + 1)/(x − 1)² in partial fractions.","o":["3/(x − 1) + 3/(x − 1)²","1 + 3/(x − 1) + 1/(x − 1)²","1 + 3/(x − 1) + 3/(x − 1)²","1 + 1/(x − 1) + 3/(x − 1)²"],"a":2,"x":"Equal degrees, so divide: x² + x + 1 = (x² − 2x + 1) + 3x, giving 1 + 3x/(x − 1)². Then 3x = 3(x − 1) + 3, so 3x/(x − 1)² = 3/(x − 1) + 3/(x − 1)². Check at x = 2: 7/1 = 1 + 3 + 3."},{"id":"math-07-014","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"M","q":"Resolve (2x + 1)/(x + 1)² into partial fractions.","o":["2/(x + 1) + 1/(x + 1)²","2/(x + 1) − 1/(x + 1)²","1/(x + 1) + 1/(x + 1)²","2/(x + 1) − 3/(x + 1)²"],"a":1,"x":"Write 2x + 1 = 2(x + 1) − 1, so the fraction is 2/(x + 1) − 1/(x + 1)². Check at x = 0: 1 = 2 − 1."},{"id":"math-07-015","unit":"math-07","topic":"math-07-linear","lo":"MATH-7.1","d":"M","q":"Using 1/(n(n + 1)) = 1/n − 1/(n + 1), find 1/(1×2) + 1/(2×3) + 1/(3×4) + … + 1/(9×10).","o":["10/11","1/10","11/10","9/10"],"a":3,"x":"The partial fractions cancel in pairs (telescoping): (1 − 1/2) + (1/2 − 1/3) + … + (1/9 − 1/10) = 1 − 1/10 = 9/10. Stopping at 1/11 by mistake gives 10/11."},{"id":"math-07-016","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"E","q":"Which is the correct form of the partial fractions of (3x + 1)/((x − 2)(x² + 1))?","o":["A/(x − 2) + B/(x² + 1)","A/(x − 2) + (Bx + C)/(x² + 1)","A/(x − 2) + (Bx + C)/(x² + 1)²","(Ax + B)/(x − 2) + C/(x² + 1)"],"a":1,"x":"x² + 1 cannot be factorised over the reals, so its numerator must be a general linear expression Bx + C; the linear factor gets a constant A. Using only a constant B over x² + 1 is the common slip."},{"id":"math-07-017","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"E","q":"Which is the correct form of the partial fractions of 1/(x(x² + 4)²)?","o":["A/x + (Bx + C)/(x² + 4)²","A/x + (Bx + C)/(x² + 4) + (Dx + E)/(x² + 4)²","A/x + B/(x² + 4) + C/(x² + 4)²","A/x + (Bx + C)/(x² + 4) + D/(x² + 4)²"],"a":1,"x":"A repeated irreducible quadratic (x² + 4)² needs a term for each power, each with a linear numerator: (Bx + C)/(x² + 4) + (Dx + E)/(x² + 4)². Constant numerators or a missing first power give the wrong forms."},{"id":"math-07-018","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"E","q":"Which of these quadratic factors is irreducible over the real numbers?","o":["x² + x + 1","x² − 4","x² + 5x + 6","x² − 2x + 1"],"a":0,"x":"x² + x + 1 has discriminant 1 − 4 = −3 < 0, so it has no real linear factors. The others factor as (x − 2)(x + 2), (x + 2)(x + 3) and (x − 1)²."},{"id":"math-07-019","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"M","q":"Resolve 1/(x(x² + 1)) into partial fractions.","o":["1/x + x/(x² + 1)","1/x − x/(x² + 1)","1/x − 1/(x² + 1)","−1/x + x/(x² + 1)"],"a":1,"x":"1 = A(x² + 1) + (Bx + C)x. x = 0 gives A = 1; x² terms: A + B = 0, so B = −1; x terms: C = 0. Check: (x² + 1 − x²)/(x(x² + 1)) = 1/(x(x² + 1))."},{"id":"math-07-020","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"M","q":"Express (x² + 2x + 3)/((x + 1)(x² + 1)) in partial fractions.","o":["1/(x + 1) + 2/(x² + 1)","1/(x + 1) + 2x/(x² + 1)","2/(x + 1) + 1/(x² + 1)","1/(x + 1) + (x + 2)/(x² + 1)"],"a":0,"x":"Cover-up at x = −1: A = (1 − 2 + 3)/2 = 1. Then x² + 2x + 3 − (x² + 1) = 2x + 2 = 2(x + 1), so the numerator over x² + 1 is 2. Check at x = 0: 3/1 = 1 + 2."},{"id":"math-07-021","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"M","q":"If (2x² + x + 3)/((x − 1)(x² + 2)) = A/(x − 1) + (Bx + C)/(x² + 2), find B and C.","o":["B = 1, C = 0","B = 1, C = 1","B = 0, C = −1","B = 0, C = 1"],"a":3,"x":"A = (2 + 1 + 3)/(1 + 2) = 2. Then 2x² + x + 3 − 2(x² + 2) = x − 1 = (Bx + C)(x − 1), so Bx + C = 1: B = 0, C = 1. Taking x − 1 itself as the numerator gives B = 1, C = 0."},{"id":"math-07-022","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"M","q":"Resolve x/((x + 1)(x² + 1)) into partial fractions.","o":["1/(2(x + 1)) + (x − 1)/(2(x² + 1))","−1/(2(x + 1)) + (x − 1)/(2(x² + 1))","1/(2(x + 1)) − (x + 1)/(2(x² + 1))","−1/(2(x + 1)) + (x + 1)/(2(x² + 1))"],"a":3,"x":"Cover-up: A = (−1)/((−1)² + 1) = −1/2. Then x + ½(x² + 1) = ½(x + 1)², so (Bx + C) = ½(x + 1). Check at x = 0: 0 = −1/2 + 1/2."},{"id":"math-07-023","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"M","q":"Express x³/(x² + 1)² in partial fractions.","o":["x/(x² + 1) − x/(x² + 1)²","x/(x² + 1) + x/(x² + 1)²","1/(x² + 1) − x/(x² + 1)²","x/(x² + 1) − 1/(x² + 1)²"],"a":0,"x":"Write x³ = x(x² + 1) − x, so x³/(x² + 1)² = x/(x² + 1) − x/(x² + 1)². Check at x = 1: 1/4 = 1/2 − 1/4."},{"id":"math-07-024","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"D","q":"If (2x³ + x² + 5x + 1)/(x² + 2)² = (Ax + B)/(x² + 2) + (Cx + D)/(x² + 2)², what is Cx + D?","o":["x + 1","1 − x","2x − 1","x − 1"],"a":3,"x":"Divide the numerator by x² + 2: 2x³ + x² + 5x + 1 = (2x + 1)(x² + 2) + (x − 1), since (2x + 1)(x² + 2) = 2x³ + x² + 4x + 2. So Ax + B = 2x + 1 and Cx + D = x − 1."},{"id":"math-07-025","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"M","q":"Before splitting into partial fractions, (x³ + x + 1)/(x² + 1) is written as a polynomial plus a proper fraction. Which is correct?","o":["x + x/(x² + 1)","1 + 1/(x² + 1)","x − 1/(x² + 1)","x + 1/(x² + 1)"],"a":3,"x":"x³ + x = x(x² + 1), so x³ + x + 1 = x(x² + 1) + 1 and the result is x + 1/(x² + 1). Check at x = 1: 3/2 = 1 + 1/2."},{"id":"math-07-026","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"M","q":"If (x² + k)/((x − 1)(x² + 1)) = 2/(x − 1) + (Bx + C)/(x² + 1), find k.","o":["3","1","5","4"],"a":0,"x":"Cover-up at x = 1: (1 + k)/(1 + 1) = 2, so k = 3. Check: x² + 3 − 2(x² + 1) = 1 − x² = −(x + 1)(x − 1), giving Bx + C = −(x + 1), a valid split."},{"id":"math-07-027","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"D","q":"Resolve 1/(x³ + 1) into partial fractions.","o":["1/(3(x + 1)) + (x − 2)/(3(x² − x + 1))","1/(3(x + 1)) − (x + 2)/(3(x² − x + 1))","1/(3(x + 1)) + (2 − x)/(3(x² − x + 1))","1/(x + 1) + (2 − x)/(x² − x + 1)"],"a":2,"x":"x³ + 1 = (x + 1)(x² − x + 1). Cover-up: A = 1/(1 + 1 + 1) = 1/3. Then 1 − ⅓(x² − x + 1) = −⅓(x − 2)(x + 1), so Bx + C = (2 − x)/3. Check at x = 0: 1 = 1/3 + 2/3."},{"id":"math-07-028","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"D","q":"In the partial fractions of 1/(x⁴ − 1), what is the coefficient of 1/(x² + 1)?","o":["1/2","−1/4","1/4","−1/2"],"a":3,"x":"1/(x² − 1) − 1/(x² + 1) = 2/(x⁴ − 1), so 1/(x⁴ − 1) = ½·1/(x² − 1) − ½·1/(x² + 1). The coefficient is −1/2; the values ±1/4 belong to 1/(x − 1) and 1/(x + 1)."},{"id":"math-07-029","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"M","q":"How many unknown constants appear in the partial-fraction form of (x + 5)/((x − 1)²(x² + 3))?","o":["3","4","5","2"],"a":1,"x":"The form is A/(x − 1) + B/(x − 1)² + (Cx + D)/(x² + 3): four constants, which matches the degree 4 of the denominator. Giving x² + 3 only a constant numerator gives 3."},{"id":"math-07-030","unit":"math-07","topic":"math-07-quadratic","lo":"MATH-7.2","d":"M","q":"Resolve 1/(x²(x² + 1)) into partial fractions.","o":["1/x − 1/(x² + 1)","1/x² − 1/(x² + 1)","1/x² + 1/(x² + 1)","1/x² − x/(x² + 1)"],"a":1,"x":"Treat x² as one block: 1/(u(u + 1)) = 1/u − 1/(u + 1) with u = x². So the answer is 1/x² − 1/(x² + 1); the A/x and Bx terms are both 0. Check at x = 1: 1/2 = 1 − 1/2."},{"id":"math-08-001","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"E","q":"For positive numbers a and b, which of the following always holds?","o":["(a + b)/2 ≥ √(ab)","(a + b)/2 ≤ √(ab)","a + b ≥ 2ab","a² + b² < 2ab"],"a":0,"x":"The arithmetic mean of two positive numbers is at least the geometric mean: (a + b)/2 ≥ √(ab), since (√a − √b)² ≥ 0. a + b ≥ 2ab fails for a = b = 2 (4 < 8), and a² + b² < 2ab contradicts (a − b)² ≥ 0."},{"id":"math-08-002","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"E","q":"In an arithmetic sequence, a₁ = 3 and the common difference is d = 4. What is the value of a₁₀?","o":["36","40","39","43"],"a":2,"x":"aₙ = a₁ + (n − 1)d, so a₁₀ = 3 + 9 × 4 = 39. Using 10d instead of 9d gives 43, and leaving out a₁ gives 36."},{"id":"math-08-003","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"E","q":"In a geometric sequence, a₁ = 2 and the common ratio is q = 3. What is the value of a₅?","o":["18","54","486","162"],"a":3,"x":"aₙ = a₁qⁿ⁻¹, so a₅ = 2 × 3⁴ = 2 × 81 = 162. Using 3⁵ instead of 3⁴ gives 486, and 54 is a₄."},{"id":"math-08-004","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"M","q":"A sequence satisfies a₁ = 1 and aₙ₊₁ = aₙ + 2n for n ≥ 1. What is the value of a₁₀?","o":["73","101","91","111"],"a":2,"x":"Adding the differences, a₁₀ = 1 + 2(1 + 2 + … + 9) = 1 + 2 × 45 = 91 (generally aₙ = n² − n + 1). Adding up to 2 × 10 instead of 2 × 9 gives 111, and 73 is a₉."},{"id":"math-08-005","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"E","q":"The positive number G makes 4, G, 9 a geometric sequence. What is G?","o":["6.5","13","6","36"],"a":2,"x":"G² = 4 × 9 = 36 and G > 0, so G = 6. The value 6.5 is the arithmetic mean of 4 and 9, which would make an arithmetic sequence instead."},{"id":"math-08-006","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"E","q":"What is the sum of the first 20 positive odd numbers, 1 + 3 + 5 + … + 39?","o":["400","420","210","441"],"a":0,"x":"This is arithmetic with a₁ = 1, a₂₀ = 39, so S₂₀ = 20(1 + 39)/2 = 400 (in general the first n odd numbers add to n²). 420 is the sum of the first 20 even numbers, and 210 is 1 + 2 + … + 20."},{"id":"math-08-007","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"E","q":"Which of the following is a geometric sequence?","o":["1, 2, 4, 7, 11, …","3, 6, 9, 12, …","5, −10, 20, −40, …","1, 4, 9, 16, …"],"a":2,"x":"In 5, −10, 20, −40, … each term is the previous one multiplied by −2, so the ratio is constant. 3, 6, 9, 12 has a constant difference (arithmetic), not a constant ratio; 1, 2, 4, 7, 11 and the squares have neither."},{"id":"math-08-008","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"M","q":"What is the value of 1/(1 × 3) + 1/(3 × 5) + 1/(5 × 7) + … + 1/(19 × 21)?","o":["20/21","10/21","10/11","5/11"],"a":1,"x":"1/((2k − 1)(2k + 1)) = ½[1/(2k − 1) − 1/(2k + 1)], so the sum telescopes to ½(1 − 1/21) = ½ × 20/21 = 10/21. Forgetting the factor ½ gives 20/21."},{"id":"math-08-009","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"M","q":"In an arithmetic sequence, a₃ = 7 and a₇ = 19. What is the value of a₁₀?","o":["31","25","28","22"],"a":2,"x":"a₇ − a₃ = 4d = 12, so d = 3 and a₁₀ = a₇ + 3d = 19 + 9 = 28. Dividing 12 by 3 instead of 4 gives d = 4 and the wrong value 31."},{"id":"math-08-010","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"M","q":"A geometric sequence has first term 3 and common ratio 2. What is the sum of its first 6 terms?","o":["189","93","192","381"],"a":0,"x":"S₆ = a₁(q⁶ − 1)/(q − 1) = 3(64 − 1)/1 = 189. 93 is S₅ and 381 is S₇; 192 = 3 × 2⁶ forgets the − 1."},{"id":"math-08-011","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"D","q":"What is the value of 1/(√1 + √2) + 1/(√2 + √3) + 1/(√3 + √4) + … + 1/(√24 + √25)?","o":["4","5","√24 − 1","24"],"a":0,"x":"Rationalising, 1/(√k + √(k + 1)) = √(k + 1) − √k, so the sum telescopes to √25 − √1 = 5 − 1 = 4. Forgetting the leftover −√1 gives 5."},{"id":"math-08-012","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"E","q":"A sequence has general term aₙ = n² − 3n. What is the value of a₅?","o":["−10","4","10","40"],"a":2,"x":"a₅ = 5² − 3 × 5 = 25 − 15 = 10. The value 4 is a₄, and −10 comes from computing 15 − 25 the wrong way round."},{"id":"math-08-013","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"E","q":"What is the sum to infinity of the geometric series 12 + 6 + 3 + 3/2 + …?","o":["8","12","24","21"],"a":2,"x":"a₁ = 12 and q = 1/2, so S = a₁/(1 − q) = 12/(1/2) = 24. Using 1 + q in the denominator gives 8, and 21 is only the sum of the first three terms."},{"id":"math-08-014","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"M","q":"A sequence has general term aₙ = n + 2ⁿ. What is the sum of its first 5 terms?","o":["78","62","77","147"],"a":2,"x":"Split the sum: (1 + 2 + 3 + 4 + 5) + (2 + 4 + 8 + 16 + 32) = 15 + 62 = 77. Writing 2 + 4 + … + 32 as 2⁶ − 1 = 63 instead of 2⁶ − 2 gives 78."},{"id":"math-08-015","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"M","q":"A sequence is defined by a₁ = 2 and aₙ₊₁ = 2aₙ − 1 for n ≥ 1. What is the value of a₅?","o":["9","15","17","33"],"a":2,"x":"a₂ = 3, a₃ = 5, a₄ = 9, a₅ = 17 (in fact aₙ = 2ⁿ⁻¹ + 1). Stopping one step early gives 9, and one step too far gives 33."},{"id":"math-08-016","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"M","q":"In a geometric sequence with all terms positive, a₂ · a₈ = 36. What is the value of a₅?","o":["9","18","36","6"],"a":3,"x":"Since 2 + 8 = 5 + 5, a₂a₈ = a₅², so a₅² = 36 and a₅ = 6 (positive). Halving 36 (as if it were an arithmetic mean) gives the wrong value 18."},{"id":"math-08-017","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"D","q":"The sequence {aₙ} has aₙ = n · 2ⁿ⁻¹. Which expression equals the sum of its first n terms, Sₙ?","o":["(n − 1) · 2ⁿ + 1","n · 2ⁿ − 1","(n − 1) · 2ⁿ − 1","(n + 1) · 2ⁿ − 1"],"a":0,"x":"Sₙ = 1 + 2·2 + 3·2² + … + n·2ⁿ⁻¹ and 2Sₙ = 1·2 + 2·2² + … + n·2ⁿ. Subtracting, −Sₙ = (1 + 2 + … + 2ⁿ⁻¹) − n·2ⁿ = 2ⁿ − 1 − n·2ⁿ, so Sₙ = (n − 1)2ⁿ + 1. Check: S₂ = 1 + 4 = 5 = 1 × 4 + 1, while n·2ⁿ − 1 gives 7."},{"id":"math-08-018","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"M","q":"An arithmetic sequence has a₁ = 5 and common difference 3. What is the sum of its first 12 terms?","o":["258","276","516","129"],"a":0,"x":"a₁₂ = 5 + 11 × 3 = 38, so S₁₂ = 12(5 + 38)/2 = 6 × 43 = 258. Taking a₁₂ = 5 + 12 × 3 = 41 gives 276, and forgetting to halve gives 516."},{"id":"math-08-019","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"E","q":"A geometric sequence has first term 5 and common ratio −1/2. Which statement is true?","o":["The terms alternate in sign and the sum to infinity is 10/3","The terms decrease and the sum to infinity is 10","The terms alternate in sign and the sum to infinity is 10","The sum to infinity does not exist"],"a":0,"x":"A negative ratio makes the signs alternate, and since |q| = 1/2 < 1 the sum to infinity is 5/(1 − (−1/2)) = 5/(3/2) = 10/3. The value 10 comes from using 1 − 1/2 and ignoring the sign of q."},{"id":"math-08-020","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"D","q":"What is the sum of the infinite series 1/(1 × 3) + 1/(2 × 4) + 1/(3 × 5) + … + 1/(n(n + 2)) + …?","o":["1/2","3/4","1","3/2"],"a":1,"x":"1/(n(n + 2)) = ½[1/n − 1/(n + 2)]. The partial sum telescopes to ½[1 + 1/2 − 1/(n + 1) − 1/(n + 2)], which tends to ½ × 3/2 = 3/4. Keeping only the 1 and forgetting the surviving 1/2 gives 1/2."},{"id":"math-08-021","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"E","q":"Three numbers are inserted between 4 and 24 so that the five numbers form an arithmetic sequence. What is the common difference?","o":["5","4","20/3","10"],"a":0,"x":"The five terms have four gaps, so 4d = 24 − 4 = 20 and d = 5 (the sequence is 4, 9, 14, 19, 24). Dividing by 3, the number of inserted terms, gives the wrong value 20/3."},{"id":"math-08-022","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"M","q":"In a geometric sequence of real numbers, a₂ = 6 and a₅ = 162. What is a₁?","o":["3","6","2","18"],"a":2,"x":"a₅/a₂ = q³ = 27, so q = 3 and a₁ = a₂/q = 6/3 = 2. The value 18 multiplies by q instead of dividing, and 3 is the ratio, not the first term."},{"id":"math-08-023","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"M","q":"Here lg denotes the logarithm to base 10. What is the value of lg(2/1) + lg(3/2) + lg(4/3) + … + lg(100/99)?","o":["2","1","lg 99","99"],"a":0,"x":"lg((k + 1)/k) = lg(k + 1) − lg k, so the sum telescopes to lg 100 − lg 1 = 2. Stopping the telescoping at lg 99 forgets that the last term contributes lg 100."},{"id":"math-08-024","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"M","q":"In an arithmetic sequence {aₙ}, a₃ + a₉ = 20. What is the sum of the first 11 terms, S₁₁?","o":["110","100","120","220"],"a":0,"x":"Since 3 + 9 = 1 + 11, a₁ + a₁₁ = a₃ + a₉ = 20, so S₁₁ = 11 × 20/2 = 110. Forgetting to divide by 2 gives 220."},{"id":"math-08-025","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"D","q":"A geometric sequence with positive common ratio has S₃ = 7 and S₆ = 63, where Sₙ is the sum of the first n terms. What is S₉?","o":["189","448","567","511"],"a":3,"x":"S₆/S₃ = 1 + q³ = 9, so q³ = 8, q = 2, and a₁(1 + 2 + 4) = 7 gives a₁ = 1. Then S₉ = 2⁹ − 1 = 511. Equivalently S₃, S₆ − S₃, S₉ − S₆ = 7, 56, 448. Multiplying 63 by 9 again (567) wrongly treats the sums themselves as geometric."},{"id":"math-08-026","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"D","q":"What is the value of 1 × 2 + 2 × 3 + 3 × 4 + … + 10 × 11?","o":["330","385","572","440"],"a":3,"x":"k(k + 1) = k² + k, so the sum is (1² + … + 10²) + (1 + … + 10) = 385 + 55 = 440; equivalently n(n + 1)(n + 2)/3 = 10 × 11 × 12/3 = 440. The value 385 is only the sum of the squares, and 572 goes up to 11 × 12."},{"id":"math-08-027","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"D","q":"The sum of the first n terms of a sequence {aₙ} is Sₙ = n² + n + 1. Which statement about its general term is correct?","o":["aₙ = 2n for all n ≥ 1","aₙ = 2n + 1 for all n ≥ 1","a₁ = 2 and aₙ = 2n + 1 for n ≥ 2","a₁ = 3 and aₙ = 2n for n ≥ 2"],"a":3,"x":"a₁ = S₁ = 3. For n ≥ 2, aₙ = Sₙ − Sₙ₋₁ = (n² + n + 1) − ((n − 1)² + (n − 1) + 1) = 2n. Since 2 × 1 = 2 ≠ 3, the formula 2n does not hold for n = 1, so 'aₙ = 2n for all n' is wrong."},{"id":"math-08-028","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"M","q":"Two numbers are inserted between 3 and 81 so that the four numbers form a geometric sequence. What is the sum of the two inserted numbers?","o":["30","36","84","108"],"a":1,"x":"81 = 3q³ gives q³ = 27, q = 3, so the inserted numbers are 9 and 27, with sum 36. Inserting numbers to make an arithmetic sequence instead (29 and 55) gives 84."},{"id":"math-08-029","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"D","q":"A sequence satisfies a₁ = 2 and aₙ₊₁ − aₙ = 3ⁿ for n ≥ 1. What is its general term?","o":["aₙ = (3ⁿ − 1)/2","aₙ = (3ⁿ + 1)/2","aₙ = 3ⁿ⁻¹ + 1","aₙ = (3ⁿ + 1)/2 + 1"],"a":1,"x":"Adding the differences, aₙ = 2 + (3 + 3² + … + 3ⁿ⁻¹) = 2 + (3ⁿ − 3)/2 = (3ⁿ + 1)/2 (check: a₂ = 5, a₃ = 14). The formula 3ⁿ⁻¹ + 1 fits a₁ = 2 but gives a₂ = 4 instead of 5."},{"id":"math-08-030","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"M","q":"An arithmetic sequence has a₁ = 25 and common difference −3. For which value of n is the sum of the first n terms, Sₙ, the largest?","o":["8","10","17","9"],"a":3,"x":"aₙ = 25 − 3(n − 1) = 28 − 3n, so a₉ = 1 > 0 and a₁₀ = −2 < 0. Sₙ grows while the added terms are positive, so it is largest at n = 9 (S₉ = 117). At n = 10 a negative term has already been added."},{"id":"math-08-031","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"D","q":"A ball is dropped from a height of 10 m. After each bounce it rises to half the height from which it last fell. In theory it bounces forever. What is the total vertical distance it travels?","o":["15 m","20 m","30 m","40 m"],"a":2,"x":"Down 10 m, then each rise of 5, 2.5, … m is followed by an equal fall: total = 10 + 2(5 + 2.5 + …) = 10 + 2 × 5/(1 − ½) = 10 + 20 = 30 m. 20 m counts each bounce only once (10/(1 − ½))."},{"id":"math-08-032","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"M","q":"For which n is 1/(1 × 2) + 1/(2 × 3) + … + 1/(n(n + 1)) = 9/10?","o":["8","10","9","11"],"a":2,"x":"1/(k(k + 1)) = 1/k − 1/(k + 1), so the sum telescopes to 1 − 1/(n + 1) = n/(n + 1). Setting n/(n + 1) = 9/10 gives n = 9. Choosing 10 matches the denominator n + 1, not n."},{"id":"math-08-033","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"M","q":"A lecture hall has 15 rows of seats. The first row has 20 seats and each row after it has 2 more seats than the row in front. How many seats are there in total?","o":["300","525","1020","510"],"a":3,"x":"The last row has 20 + 14 × 2 = 48 seats, so the total is 15(20 + 48)/2 = 510. Taking the last row as 20 + 15 × 2 = 50 gives 525, and forgetting to halve gives 1020."},{"id":"math-08-034","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"M","q":"A geometric sequence has a₁ = 1 and common ratio 2. What is the smallest n for which the sum of the first n terms exceeds 1000?","o":["10","7","8","9"],"a":0,"x":"Sₙ = 2ⁿ − 1, and 2⁹ − 1 = 511 < 1000 while 2¹⁰ − 1 = 1023 > 1000, so n = 10. Choosing 9 checks the term 2⁹ = 512 or the sum 511, neither of which is above 1000."},{"id":"math-08-035","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"M","q":"A sequence has general term aₙ = (2n − 1) + (1/2)ⁿ. Which expression gives the sum of its first n terms?","o":["n² + 1/2ⁿ","n² + 1 − 1/2ⁿ","n² − 1 + 1/2ⁿ","n² + 2 − 1/2ⁿ⁻¹"],"a":1,"x":"Sum the two parts separately: 1 + 3 + … + (2n − 1) = n², and 1/2 + 1/4 + … + 1/2ⁿ = 1 − 1/2ⁿ. So Sₙ = n² + 1 − 1/2ⁿ. Check n = 2: S₂ = 3/2 + 13/4 = 19/4 = 4 + 1 − 1/4, whereas n² + 1/2ⁿ gives 17/4."},{"id":"math-08-036","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"M","q":"How many terms of the A.P. 5, 9, 13, … must be added to give a sum of 275?","o":["10","12","11","25"],"a":2,"x":"Sₙ = (n/2)[2(5) + (n − 1)4] = n(2n + 3). Setting n(2n + 3) = 275 gives 2n² + 3n − 275 = 0, so n = (−3 + 47)/4 = 11. Check: 11 × 25 = 275."},{"id":"math-08-037","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"M","q":"Ali saves Rs. 500 in the first month and Rs. 100 more each month than in the month before. How much does he save in total in the first 12 months?","o":["Rs. 12,600","Rs. 13,200","Rs. 1,600","Rs. 12,000"],"a":0,"x":"The savings form an A.P. with a = 500, d = 100, n = 12: S₁₂ = (12/2)[2(500) + 11(100)] = 6 × 2100 = 12,600. Using 12d instead of 11d gives 13,200, and Rs. 1,600 is only the 12th month's saving."},{"id":"math-08-038","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"M","q":"How many integers between 100 and 500 are divisible by 7?","o":["56","57","58","55"],"a":1,"x":"The multiples run 105, 112, …, 497, an A.P. with d = 7. From 497 = 105 + (n − 1)7, n − 1 = 56 and n = 57. Forgetting to add 1 gives 56."},{"id":"math-08-039","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"M","q":"a, b and c are in A.P. Which of these is also an A.P.?","o":["a², b², c²","2ᵃ, 2ᵇ, 2ᶜ","1/a, 1/b, 1/c","b + c, c + a, a + b"],"a":3,"x":"The differences are (c + a) − (b + c) = a − b and (a + b) − (c + a) = b − c, and a − b = b − c because b − a = c − b. Test with 1, 2, 3: 5, 4, 3 is an A.P., but 1, 4, 9 is not; 2ᵃ, 2ᵇ, 2ᶜ is a G.P. and 1/a, 1/b, 1/c is an H.P."},{"id":"math-08-040","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"D","q":"In an A.P. the pth term is q and the qth term is p, where p ≠ q. What is the (p + q)th term?","o":["0","p + q","p − q","1"],"a":0,"x":"a + (p − 1)d = q and a + (q − 1)d = p; subtracting gives (p − q)d = q − p, so d = −1 and a = p + q − 1. Then the (p + q)th term is a + (p + q − 1)(−1) = 0. Check: 5, 4, 3, 2, … has 2nd term 4 and 4th term 2, and its 6th term is 0."},{"id":"math-08-041","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"M","q":"Four arithmetic means are inserted between 3 and 23. What is the sum of the four means?","o":["78","26","60","52"],"a":3,"x":"The six numbers form an A.P. with d = (23 − 3)/5 = 4: 3, 7, 11, 15, 19, 23. The means sum to 7 + 11 + 15 + 19 = 52, which is 4 × (3 + 23)/2. 78 is the sum of all six numbers."},{"id":"math-08-042","unit":"math-08","topic":"math-08-ap","lo":"MATH-8.1","d":"D","q":"Three numbers in A.P. have sum 15 and product 80. What is the largest of them?","o":["7","8","10","9"],"a":1,"x":"Write them as a − d, a, a + d. Then 3a = 15 gives a = 5, and 5(25 − d²) = 80 gives d² = 9, so the numbers are 2, 5, 8. Check: 2 × 5 × 8 = 80. The largest is 8 whichever sign d has."},{"id":"math-08-043","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"M","q":"Which fraction equals the recurring decimal 0.272727… ?","o":["27/100","3/10","2/7","3/11"],"a":3,"x":"0.2727… = 27/100 + 27/100² + … = (27/100)/(1 − 1/100) = 27/99 = 3/11. Check: 3 ÷ 11 = 0.2727…. 27/100 is only the first term, and 3/10 comes from dividing by 90 instead of 99."},{"id":"math-08-044","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"M","q":"Three positive geometric means are inserted between 2 and 32. What is the product of the three means?","o":["64","512","28","8"],"a":1,"x":"2r⁴ = 32 gives r = 2, so the means are 4, 8, 16 with product 512 = 8³ (the middle mean is √(2 × 32) = 8). 28 is their sum, and 8 is only the middle mean."},{"id":"math-08-045","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"M","q":"For which values of x does the infinite series 1 + (x − 1) + (x − 1)² + … have a finite sum?","o":["0 < x < 2","−1 < x < 1","x < 2","0 ≤ x ≤ 2"],"a":0,"x":"A geometric series converges exactly when its common ratio r = x − 1 satisfies |r| < 1, i.e. −1 < x − 1 < 1, so 0 < x < 2. The endpoints give r = ±1, where the series does not converge; −1 < x < 1 puts the condition on x instead of on x − 1."},{"id":"math-08-046","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"D","q":"An infinite G.P. has sum 8, and the sum of the squares of its terms is 32. What is its first term?","o":["4","6","8/3","16/3"],"a":3,"x":"a/(1 − r) = 8 and a²/(1 − r²) = 32. Dividing, a/(1 + r) = 4. So a = 8(1 − r) = 4(1 + r), giving r = 1/3 and a = 16/3. Check: (16/3)/(2/3) = 8 and (256/9)/(8/9) = 32."},{"id":"math-08-047","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"M","q":"Bilal buys a car for Rs. 2,000,000. Its value falls by 20% of its value at the start of each year. What is its value after 3 years?","o":["Rs. 1,200,000","Rs. 1,024,000","Rs. 1,280,000","Rs. 800,000"],"a":1,"x":"The values form a G.P. with ratio 0.8: 2,000,000 × 0.8³ = 2,000,000 × 0.512 = 1,024,000. Subtracting 20% of the original price each year (a fall of 3 × 400,000) gives 1,200,000, and 1,280,000 is the value after 2 years."},{"id":"math-08-048","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"E","q":"Which term of the G.P. 3, 6, 12, … is 384?","o":["7th","9th","8th","128th"],"a":2,"x":"aₙ = 3 × 2ⁿ⁻¹ = 384 gives 2ⁿ⁻¹ = 128 = 2⁷, so n − 1 = 7 and n = 8. Taking n = 7 forgets the −1 in the exponent; 128 is the value of 2ⁿ⁻¹, not n."},{"id":"math-08-049","unit":"math-08","topic":"math-08-gp","lo":"MATH-8.2","d":"D","q":"Three numbers in G.P. have sum 13 and product 27, and the common ratio is greater than 1. What is the third number?","o":["3","1","27","9"],"a":3,"x":"Write them as 3/r, 3, 3r, since the product (3/r)(3)(3r) = 27 gives the middle term 3. Then 3/r + 3 + 3r = 13 gives 3r² − 10r + 3 = 0, so r = 3 (r > 1) and the numbers are 1, 3, 9. Check: 1 + 3 + 9 = 13."},{"id":"math-08-050","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"E","q":"What is the harmonic mean of 3 and 6?","o":["9/2","3√2","1/4","4"],"a":3,"x":"H = 2ab/(a + b) = 2 × 18/9 = 4. 9/2 is the arithmetic mean and 3√2 the geometric mean; 1/4 is the mean of the reciprocals, before taking the reciprocal again."},{"id":"math-08-051","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"M","q":"What is the 10th term of the H.P. 1/2, 1/5, 1/8, … ?","o":["1/32","29","1/26","1/29"],"a":3,"x":"The reciprocals 2, 5, 8, … form an A.P. with d = 3, whose 10th term is 2 + 9 × 3 = 29. So the 10th term of the H.P. is 1/29. Using 10d gives 1/32; forgetting to take the reciprocal back gives 29."},{"id":"math-08-052","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"M","q":"Which of these sequences is a harmonic progression?","o":["1, 1/2, 1/4, 1/8","6, 3, 2, 3/2","2, 4, 6, 8","1, 1/4, 1/9, 1/16"],"a":1,"x":"The reciprocals of 6, 3, 2, 3/2 are 1/6, 2/6, 3/6, 4/6, an A.P. with difference 1/6, so it is an H.P. The reciprocals 1, 2, 4, 8 form a G.P.; 2, 4, 6, 8 is itself an A.P.; and 1, 4, 9, 16 is not an A.P."},{"id":"math-08-053","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"M","q":"The 3rd term of an H.P. is 1/5 and its 7th term is 1/13. What is its 12th term?","o":["1/25","1/23","23","1/21"],"a":1,"x":"The reciprocals form an A.P. with a + 2d = 5 and a + 6d = 13, so d = 2 and a = 1. Its 12th term is 1 + 11 × 2 = 23, so the H.P. term is 1/23. Using 12d gives 1/25."},{"id":"math-08-054","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"M","q":"The arithmetic mean of two positive numbers is 5 and their geometric mean is 4. What is their harmonic mean?","o":["9/2","16/5","3","20"],"a":1,"x":"For two positive numbers G² = AH, so H = G²/A = 16/5. Check: the numbers are 2 and 8 (sum 10, product 16), and 2 × 16/10 = 16/5. 20 is A × G, not the HM."},{"id":"math-08-055","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"D","q":"Two positive numbers have arithmetic mean 10 and harmonic mean 6.4. What is the larger number?","o":["12","18","16","15"],"a":2,"x":"G² = AH = 10 × 6.4 = 64, so the product is 64 and the sum is 20. The numbers are the roots of t² − 20t + 64 = 0, namely 4 and 16. Check: 2 × 64/20 = 6.4."},{"id":"math-08-056","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"M","q":"Two harmonic means are inserted between 1/3 and 1/12. What are they?","o":["1/4 and 1/6","1/6 and 1/9","1/5 and 1/8","1/7 and 1/10"],"a":1,"x":"The reciprocals 3, _, _, 12 form an A.P. with d = (12 − 3)/3 = 3: 3, 6, 9, 12. So the harmonic means are 1/6 and 1/9. 1/4 and 1/6 are the arithmetic means of 1/3 and 1/12."},{"id":"math-08-057","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"D","q":"a, b and c are distinct and in H.P. Which relation is true?","o":["(a − b)/(b − c) = c/a","(a − b)/(b − c) = a/b","(a − b)/(b − c) = 1","(a − b)/(b − c) = a/c"],"a":3,"x":"With b = 2ac/(a + c): a − b = a(a − c)/(a + c) and b − c = c(a − c)/(a + c), so the ratio is a/c. Check with 1, 1/2, 1/3: (1/2)/(1/6) = 3 = a/c. The ratio 1 is the A.P. condition."},{"id":"math-08-058","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"D","q":"For positive unequal numbers a and b, the expression (aⁿ⁺¹ + bⁿ⁺¹)/(aⁿ + bⁿ) equals their harmonic mean for which value of n?","o":["−1","0","−1/2","1"],"a":0,"x":"With n = −1 the expression is (1 + 1)/(1/a + 1/b) = 2ab/(a + b), the harmonic mean. n = 0 gives (a + b)/2, the arithmetic mean, and n = −1/2 gives √(ab), the geometric mean."},{"id":"math-08-059","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"M","q":"Hamza drives from Lahore to Faisalabad at 60 km/h and returns along the same road at 40 km/h. What is his average speed for the whole trip?","o":["50 km/h","48 km/h","20√6 km/h","24 km/h"],"a":1,"x":"Equal distances make the average speed the harmonic mean: 2 × 60 × 40/(60 + 40) = 48 km/h. Check with 120 km each way: 2 h + 3 h = 5 h for 240 km. 50 km/h is the arithmetic mean, which assumes equal times."},{"id":"math-08-060","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"M","q":"The first two terms of an H.P. are 2 and 3. What is its third term?","o":["4","9/2","6","12/5"],"a":2,"x":"The reciprocals 1/2, 1/3 form an A.P. with d = −1/6, so the third reciprocal is 1/3 − 1/6 = 1/6 and the third term is 6. Continuing 2, 3 as an A.P. gives 4, and as a G.P. gives 9/2; 12/5 is the HM of 2 and 3."},{"id":"math-08-061","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"M","q":"Harmonic means are inserted between 1 and 1/21 so that the reciprocals of all the terms form an A.P. with common difference 4. How many means are inserted?","o":["5","4","6","20"],"a":1,"x":"The reciprocals run 1, 5, 9, 13, 17, 21: (21 − 1)/4 = 5 steps, so there are 5 + 1 = 6 terms in all and 4 means (1/5, 1/9, 1/13, 1/17). 5 counts the steps rather than the means."},{"id":"math-08-062","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"D","q":"Three nonzero numbers a, b, c are in A.P. and also in H.P. Which must be true?","o":["a = b = c","b² = ac with a ≠ c","a + b + c = 0","c = 2a"],"a":0,"x":"From the A.P., b = (a + c)/2; from the H.P., b = 2ac/(a + c). Equating gives (a + c)² = 4ac, i.e. (a − c)² = 0, so a = c and then b = a. They are then also in G.P., but only trivially."},{"id":"math-08-063","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"M","q":"a, b and c are nonzero and in A.P. with nonzero common difference. Which of these sequences is an H.P.?","o":["bc, ca, ab","a², b², c²","2a, 2b, 2c","a + 1, b + 1, c + 1"],"a":0,"x":"Dividing bc, ca, ab by abc gives 1/a, 1/b, 1/c, so the reciprocals of bc, ca, ab are a/(abc), b/(abc), c/(abc), an A.P. Hence bc, ca, ab is an H.P. Test with 1, 2, 3: 6, 3, 2 has reciprocals 1/6, 2/6, 3/6. 2a, 2b, 2c and a + 1, b + 1, c + 1 are A.P.s."},{"id":"math-08-064","unit":"math-08","topic":"math-08-hp","lo":"MATH-8.3","d":"M","q":"For positive numbers a and b, what is the least value of (a + b)(1/a + 1/b)?","o":["2","4","1","8"],"a":1,"x":"A ≥ H gives (a + b)/2 ≥ 2/(1/a + 1/b), so (a + b)(1/a + 1/b) ≥ 4, with equality at a = b (e.g. a = b = 1 gives 2 × 2 = 4). Equally, the product is 2 + a/b + b/a and a/b + b/a ≥ 2."},{"id":"math-08-065","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"E","q":"What is the value of 1² + 2² + 3² + … + 10²?","o":["55","3025","506","385"],"a":3,"x":"Σk² = n(n + 1)(2n + 1)/6 = 10 × 11 × 21/6 = 385. 55 is 1 + 2 + … + 10 and 3025 = 55² is the sum of the cubes."},{"id":"math-08-066","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"M","q":"For which n is 1³ + 2³ + … + n³ = 1296?","o":["6","9","36","8"],"a":3,"x":"Σk³ = [n(n + 1)/2]², so n(n + 1)/2 = √1296 = 36 and n(n + 1) = 72, n = 8. Check: 8 × 9/2 = 36. 36 is the value of n(n + 1)/2, not n."},{"id":"math-08-067","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"M","q":"What is the value of 11² + 12² + 13² + … + 20²?","o":["2870","2364","2485","3255"],"a":2,"x":"Subtract the first ten squares from the first twenty: 20 × 21 × 41/6 − 385 = 2870 − 385 = 2485. Subtracting up to 11² instead of 10² gives 2870 − 506 = 2364; 2870 forgets to subtract at all, and 3255 adds instead of subtracting."},{"id":"math-08-068","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"D","q":"What is the sum of the infinite series 1 + 2/3 + 3/9 + 4/27 + … ?","o":["9/4","3/2","3","9/2"],"a":0,"x":"S = Σ n xⁿ⁻¹ with x = 1/3. S − S/3 = 1 + 1/3 + 1/9 + … = 3/2, so (2/3)S = 3/2 and S = 9/4 = 1/(1 − x)². 3/2 is only the geometric part, before dividing by 2/3."},{"id":"math-08-069","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"M","q":"What is the value of 1² + 3² + 5² + … + 19²?","o":["1540","1330","1320","2870"],"a":1,"x":"Σ(2k − 1)² for k = 1 to 10 equals 4Σk² − 4Σk + 10 = 4(385) − 4(55) + 10 = 1330. Check: the squares of 1 to 20 sum to 2870, the even squares 4 × 385 = 1540, and 2870 − 1540 = 1330. Dropping the +10 gives 1320."},{"id":"math-08-070","unit":"math-08","topic":"math-08-sigma","lo":"MATH-8.4","d":"D","q":"The nth term of a series is n² + 2n. Which expression is the sum of its first n terms?","o":["n(n + 1)(2n + 13)/6","n(n + 1)(2n + 7)/6","n(n + 1)(2n + 1)/6 + 2n","n(n + 1)(n + 5)/6"],"a":1,"x":"Σ(k² + 2k) = n(n + 1)(2n + 1)/6 + n(n + 1) = n(n + 1)(2n + 1 + 6)/6 = n(n + 1)(2n + 7)/6. Check n = 2: 3 + 8 = 11 and 2 × 3 × 11/6 = 11. Writing Σ2k as 2n gives the third expression."},{"id":"math-09-001","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"E","q":"A café offers 4 kinds of bread, 3 fillings and 2 sauces. A sandwich uses exactly one bread, one filling and one sauce. How many different sandwiches are possible?","o":["9","12","48","24"],"a":3,"x":"Each choice is made in turn, so by the multiplication principle there are 4 × 3 × 2 = 24 sandwiches. Adding the choices (4 + 3 + 2 = 9) would count picking one item from any group, not one from each group."},{"id":"math-09-002","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"E","q":"How many three-digit numbers can be formed from the digits 1, 2, 3, 4, 5 if no digit may be repeated?","o":["10","120","125","60"],"a":3,"x":"There are 5 choices for the hundreds digit, then 4 for the tens and 3 for the units: 5 × 4 × 3 = 60. 125 = 5³ allows repetition, and 10 = C(5, 3) only chooses the digits without arranging them."},{"id":"math-09-003","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"M","q":"Let C(n, r) be the number of ways to choose r objects from n different objects. What is the value of C(8, 3) + C(8, 4)?","o":["70","126","84","120"],"a":1,"x":"C(8, 3) = 56 and C(8, 4) = 70, so the sum is 126; this agrees with Pascal's rule C(8, 3) + C(8, 4) = C(9, 4) = 126. Choosing 84 = C(9, 3) uses the wrong lower index in Pascal's rule."},{"id":"math-09-004","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"E","q":"A fair six-sided die is rolled once. What is the probability that the number shown is a prime number?","o":["1/2","2/3","3/4","5/6"],"a":0,"x":"The primes among 1 to 6 are 2, 3 and 5, so the probability is 3/6 = 1/2. Counting 1 as a prime gives the wrong value 4/6 = 2/3; 1 is not prime."},{"id":"math-09-005","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"E","q":"A lock code has 3 characters, and each character is one of the digits 0 to 9. Digits may be repeated. How many different codes are possible?","o":["30","720","999","1000"],"a":3,"x":"Each of the 3 positions has 10 choices, so there are 10 × 10 × 10 = 1000 codes (000 to 999). 720 = 10 × 9 × 8 wrongly forbids repetition, and 999 forgets the code 000."},{"id":"math-09-006","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"M","q":"Six people, including Ahmed and Bilal, stand in a row. In how many arrangements do Ahmed and Bilal stand next to each other?","o":["24","60","120","240"],"a":3,"x":"Treat Ahmed and Bilal as one block: the block and the other 4 people give 5 units, arranged in 5! = 120 ways. Inside the block the two can swap, so the total is 2 × 120 = 240. Answering 120 forgets the internal order of the pair."},{"id":"math-09-007","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"E","q":"A class of 10 students must choose 2 representatives with equal roles. In how many ways can this be done?","o":["45","20","90","100"],"a":0,"x":"The order does not matter, so the number is C(10, 2) = (10 × 9)/2 = 45. The value 90 = 10 × 9 counts each pair twice, as if the two roles were different."},{"id":"math-09-008","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"E","q":"A bag contains 4 red, 3 blue and 3 green balls of the same size. One ball is drawn at random. What is the probability that it is blue or green?","o":["3/10","3/5","2/5","7/10"],"a":1,"x":"There are 3 + 3 = 6 blue or green balls out of 10, so the probability is 6/10 = 3/5. The value 2/5 is the probability of red, the complement."},{"id":"math-09-009","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"E","q":"A restaurant menu has 3 starters and 5 main courses. A meal is one starter and one main course. How many different meals are possible?","o":["15","18","20","30"],"a":0,"x":"By the multiplication principle there are 3 × 5 = 15 meals. Adding 3 + 5 = 8 would count choosing one dish only, and 30 counts each meal twice."},{"id":"math-09-010","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"M","q":"Six people, including Amina and Carlos, stand in a row. In how many arrangements are Amina and Carlos NOT next to each other?","o":["240","360","480","600"],"a":2,"x":"All arrangements: 6! = 720. Arrangements with the two together: 2 × 5! = 240. So the number with them apart is 720 − 240 = 480. The option 240 is the number of arrangements where they are together."},{"id":"math-09-011","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"M","q":"A committee of 3 is chosen from 5 boys and 4 girls. In how many ways can the committee contain exactly 2 boys?","o":["40","60","84","120"],"a":0,"x":"Choose 2 of the 5 boys and 1 of the 4 girls: C(5, 2) × C(4, 1) = 10 × 4 = 40. 84 = C(9, 3) is the number of all committees, with no condition on the boys."},{"id":"math-09-012","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"M","q":"Two fair dice are rolled. What is the probability that the sum of the two numbers is 8?","o":["1/12","5/36","1/9","1/6"],"a":1,"x":"Among 36 equally likely ordered outcomes, sum 8 comes from (2,6), (3,5), (4,4), (5,3), (6,2): 5 outcomes, so 5/36. Counting only unordered pairs {2,6}, {3,5}, {4,4} gives 3/36 = 1/12, but those pairs are not equally likely."},{"id":"math-09-013","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"D","q":"How many positive divisors does 72 have?","o":["5","10","12","6"],"a":2,"x":"72 = 2³ × 3², and each divisor is 2ᵃ × 3ᵇ with a ∈ {0, 1, 2, 3} and b ∈ {0, 1, 2}, so there are 4 × 3 = 12 divisors. Multiplying the exponents (3 × 2 = 6) forgets the choice of exponent 0."},{"id":"math-09-014","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"M","q":"How many different arrangements of the letters of the word BANANA are there?","o":["120","360","60","720"],"a":2,"x":"BANANA has 6 letters with A repeated 3 times and N repeated 2 times, so the count is 6!/(3! × 2!) = 720/12 = 60. 120 = 6!/3! only allows for the repeated A's and forgets the two N's."},{"id":"math-09-015","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"M","q":"A committee of 3 is chosen from 5 boys and 4 girls. In how many ways can the committee contain at least one girl?","o":["74","10","80","84"],"a":0,"x":"Use the complement: all committees C(9, 3) = 84 minus all-boy committees C(5, 3) = 10 gives 74. Subtracting the all-girl committees C(4, 3) = 4 instead gives the wrong value 80."},{"id":"math-09-016","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"M","q":"Two fair dice are rolled. What is the probability that the sum is at least 10?","o":["1/6","1/36","1/12","1/9"],"a":0,"x":"Sum 10: 3 outcomes, sum 11: 2 outcomes, sum 12: 1 outcome, total 6 of 36, so 6/36 = 1/6. The value 1/12 = 3/36 counts only sums 11 and 12, forgetting the sum 10."},{"id":"math-09-017","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"D","q":"Using the digits 0, 1, 2, 3, 4, 5 with no digit repeated, how many four-digit even numbers can be formed?","o":["96","156","120","180"],"a":1,"x":"Last digit 0: the other three places take 5 × 4 × 3 = 60 ways. Last digit 2 or 4: the first digit cannot be 0 or the last digit, so 4 choices, then 4 × 3 for the middle: 2 × 48 = 96. Total 60 + 96 = 156. The value 96 forgets the numbers ending in 0, and 180 ignores that 0 cannot lead."},{"id":"math-09-018","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"M","q":"How many diagonals does a convex octagon (8 sides) have?","o":["16","28","20","40"],"a":2,"x":"Any 2 of the 8 vertices give C(8, 2) = 28 segments; 8 of these are sides, so there are 28 − 8 = 20 diagonals. 28 forgets to remove the sides."},{"id":"math-09-019","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"M","q":"A fair coin is tossed 3 times. What is the probability of getting exactly 2 heads?","o":["1/8","1/4","3/8","1/2"],"a":2,"x":"There are 2³ = 8 equally likely outcomes, and exactly 2 heads occurs in HHT, HTH, THH: 3 outcomes, so 3/8. The value 1/4 wrongly treats the 4 possible numbers of heads (0, 1, 2, 3) as equally likely."},{"id":"math-09-020","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"M","q":"Five students stand in a line. Carlos must not stand at either end. How many arrangements are possible?","o":["48","96","72","120"],"a":2,"x":"Carlos takes one of the 3 middle places, and the other 4 students fill the rest in 4! = 24 ways: 3 × 24 = 72. Equivalently 120 − 2 × 24 = 72. The value 96 = 120 − 24 removes only one end."},{"id":"math-09-021","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"D","q":"There are 10 points in a plane. Exactly 4 of them lie on one straight line, and no other three points are collinear. How many triangles have all three vertices among these points?","o":["104","116","112","120"],"a":1,"x":"Any 3 points give C(10, 3) = 120 choices, but the C(4, 3) = 4 choices taken from the collinear points give no triangle. So there are 120 − 4 = 116 triangles. The value 120 forgets the collinear points."},{"id":"math-09-022","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"M","q":"Two cards are drawn at the same time from six cards numbered 1 to 6. What is the probability that the product of the two numbers is even?","o":["4/5","1/5","1/2","3/5"],"a":0,"x":"The product is odd only if both cards are odd: C(3, 2) = 3 of C(6, 2) = 15 pairs. So P(even) = 1 − 3/15 = 4/5. The value 1/5 is the probability of an odd product."},{"id":"math-09-023","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"E","q":"In how many ways can 4 different flags be hung in a row on a pole?","o":["24","64","120","256"],"a":0,"x":"There are 4 choices for the first place, 3 for the second, 2 for the third and 1 for the last: 4! = 24. The value 256 = 4⁴ allows the same flag to be used more than once."},{"id":"math-09-024","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"M","q":"A shelf holds 5 different mathematics books, 4 different physics books and 3 different chemistry books. In how many ways can Kwame choose 2 books from different subjects?","o":["60","66","47","132"],"a":2,"x":"Add the three subject pairs: maths–physics 5 × 4 = 20, maths–chemistry 5 × 3 = 15, physics–chemistry 4 × 3 = 12, total 47. The value 66 = C(12, 2) also includes pairs from the same subject."},{"id":"math-09-025","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"M","q":"Three boys and two girls stand in a row in random order. What is the probability that the two girls stand at the two ends?","o":["1/5","1/10","2/5","3/5"],"a":1,"x":"The girls occupy 2 of the 5 places, and all C(5, 2) = 10 pairs of places are equally likely; only one pair is the two ends, so the probability is 1/10. Equivalently 2! × 3!/5! = 12/120. The value 2/5 is only the probability that one particular girl stands at an end."},{"id":"math-09-026","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"M","q":"Eight runners take part in a race. In how many ways can the gold and silver medals be awarded (no ties)?","o":["28","56","64","112"],"a":1,"x":"Gold can go to any of 8 runners and silver to any of the remaining 7, so there are 8 × 7 = 56 ways. The value 28 = C(8, 2) ignores that gold and silver are different medals."},{"id":"math-09-027","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"D","q":"Six different books are shared among three students, Ahmed, Amina and Kwame, so that each student gets exactly 2 books. In how many ways can this be done?","o":["90","15","30","45"],"a":0,"x":"Ahmed's 2 books can be chosen in C(6, 2) = 15 ways, Amina's in C(4, 2) = 6 ways and Kwame takes the last 2: 15 × 6 = 90. The value 15 = 90/3! counts only the splits into three unnamed pairs, but here the students are different."},{"id":"math-09-028","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"D","q":"An integer is chosen at random from 1 to 20. What is the probability that it is divisible by 3 or by 5?","o":["9/20","2/5","1/2","11/20"],"a":0,"x":"Multiples of 3: 6 numbers; multiples of 5: 4 numbers; 15 is in both lists. So 6 + 4 − 1 = 9 numbers and the probability is 9/20. Adding 6 + 4 = 10 to get 1/2 counts 15 twice."},{"id":"math-09-029","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"M","q":"In how many ways can 5 people sit around a round table, if only their positions relative to each other matter?","o":["120","60","24","3125"],"a":2,"x":"Fix one person's seat to remove rotations; the other 4 people can then be arranged in 4! = 24 ways. The value 120 = 5! counts each seating 5 times, once for each rotation."},{"id":"math-09-030","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"M","q":"A team of 4 is chosen from 6 men and 5 women. In how many ways can the team have exactly 2 men and 2 women?","o":["25","300","150","330"],"a":2,"x":"Choose the men in C(6, 2) = 15 ways and the women in C(5, 2) = 10 ways; multiply: 15 × 10 = 150. Adding 15 + 10 = 25 is wrong because each choice of men goes with every choice of women, and 330 = C(11, 4) ignores the condition."},{"id":"math-09-031","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"E","q":"Which of the following values can be the probability of an event?","o":["0.75","−0.2","4/3","1.05"],"a":0,"x":"Any probability P satisfies 0 ≤ P ≤ 1, and only 0.75 lies in this interval. A negative value such as −0.2 and values above 1 such as 4/3 and 1.05 are impossible."},{"id":"math-09-032","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"D","q":"Four-digit numbers are formed using each of the digits 1, 2, 3, 4 exactly once. How many of them are greater than 2300?","o":["16","12","14","18"],"a":0,"x":"First digit 3 or 4: 2 × 3! = 12 numbers. First digit 2: the second digit must be 3 or 4, giving 2 × 2! = 4 numbers (2314, 2341, 2413, 2431). Total 16. The value 12 forgets the numbers beginning with 2."},{"id":"math-09-033","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"E","q":"The probability that event A happens is 0.35. What is the probability that A does not happen?","o":["0.70","0.85","1.35","0.65"],"a":3,"x":"Complementary events have probabilities adding to 1, so P(not A) = 1 − 0.35 = 0.65. The value 1.35 adds instead of subtracting and is greater than 1, which is impossible."},{"id":"math-09-034","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"M","q":"Events A and B are independent with P(A) = 0.4 and P(B) = 0.5. What is P(A ∪ B), the probability that at least one of them happens?","o":["0.20","0.45","0.70","0.90"],"a":2,"x":"Independence gives P(A ∩ B) = 0.4 × 0.5 = 0.2, so P(A ∪ B) = 0.4 + 0.5 − 0.2 = 0.7. The value 0.9 simply adds the probabilities, which is only correct for mutually exclusive events."},{"id":"math-09-035","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"M","q":"Three players shoot at a target independently. Their probabilities of hitting it are 1/2, 1/3 and 1/4. What is the probability that the target is hit at least once?","o":["3/4","1/24","1/4","1/2"],"a":0,"x":"All three miss with probability (1/2)(2/3)(3/4) = 1/4, so at least one hit has probability 1 − 1/4 = 3/4. The value 1/4 is the probability that everyone misses, and 1/24 is the probability that all three hit."},{"id":"math-09-036","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"E","q":"What is the value of 7!/5!?","o":["210","2","24","42"],"a":3,"x":"7!/5! = 7 × 6 × 5!/5! = 7 × 6 = 42. 210 = 7 × 6 × 5 cancels one factor too few, and 2 comes from dividing 7 − 5 as if factorials cancelled like numbers."},{"id":"math-09-037","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"M","q":"For n ≥ 2, which expression equals n! − (n − 1)!?","o":["(n − 1)!","1","n · (n − 2)!","(n − 1) · (n − 1)!"],"a":3,"x":"n! = n · (n − 1)!, so n! − (n − 1)! = (n − 1)!(n − 1). Check n = 3: 6 − 2 = 4 = 2 × 2!. Treating n! − (n − 1)! like n − (n − 1) gives 1."},{"id":"math-09-038","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"M","q":"What is the units digit of 1! + 2! + 3! + … + 50!?","o":["0","1","9","3"],"a":3,"x":"From 5! onwards every factorial contains 2 × 5, so it ends in 0. The units digit therefore comes from 1 + 2 + 6 + 24 = 33, which is 3. Choosing 0 forgets the first four terms."},{"id":"math-09-039","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"M","q":"How many four-digit numbers have all four digits even?","o":["625","256","480","500"],"a":3,"x":"The even digits are 0, 2, 4, 6, 8. The first digit cannot be 0 (4 choices), and each of the other three has 5 choices: 4 × 5 × 5 × 5 = 500. 625 = 5⁴ wrongly allows a leading 0."},{"id":"math-09-040","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"M","q":"Zara can travel from Lahore to Islamabad by any one of 4 trains or 6 buses. In how many ways can she go and come back if she returns by a different vehicle from the one she went by?","o":["100","48","20","90"],"a":3,"x":"By the addition principle she has 4 + 6 = 10 ways to go; any of the other 9 vehicles can bring her back, so 10 × 9 = 90 ways. 100 allows the same vehicle both ways, and 48 multiplies 4 × 6 × 2 instead of adding."},{"id":"math-09-041","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"M","q":"A quiz has 5 multiple-choice questions, each with 4 options and exactly one correct option. In how many ways can a student answer every question and get all of them wrong?","o":["1024","243","20","15"],"a":1,"x":"Each question has 3 wrong options, and the choices are independent, so 3⁵ = 243. 1024 = 4⁵ counts all possible answer sheets; 15 adds 3 five times instead of multiplying."},{"id":"math-09-042","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"D","q":"How many three-digit numbers contain the digit 7 at least once?","o":["243","252","270","648"],"a":1,"x":"There are 900 three-digit numbers. Those with no 7: first digit 8 choices (1–9 except 7), the others 9 each, giving 8 × 9 × 9 = 648. So 900 − 648 = 252 contain a 7. 648 is the complement itself."},{"id":"math-09-043","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"M","q":"How many even three-digit numbers can be formed from the digits 1, 2, 3, 4, 5, 6 if digits may be repeated?","o":["60","108","216","120"],"a":1,"x":"The units digit must be 2, 4 or 6 (3 choices), and the hundreds and tens digits have 6 choices each: 6 × 6 × 3 = 108. 216 = 6³ ignores the even condition, and 60 forbids repetition."},{"id":"math-09-044","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"M","q":"Which expression equals the product 2 × 4 × 6 × … × 20?","o":["20!/2","2 × 10!","20!/10!","2¹⁰ × 10!"],"a":3,"x":"Take a factor 2 out of each of the 10 terms: 2 × 4 × … × 20 = 2¹⁰ × (1 × 2 × … × 10) = 2¹⁰ × 10!. Taking out only one 2 gives 2 × 10!, and 20!/10! is 11 × 12 × … × 20."},{"id":"math-09-045","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"D","q":"Which expression equals the product of the first n odd numbers, 1 × 3 × 5 × … × (2n − 1)?","o":["(2n)!/n!","(2n)!/2ⁿ","(2n)!/(2ⁿ × n!)","(2n − 1)!/n!"],"a":2,"x":"(2n)! is the product of the odd numbers times the even numbers 2 × 4 × … × 2n = 2ⁿ × n!. Dividing gives (2n)!/(2ⁿ × n!). Check n = 3: 720/(8 × 6) = 15 = 1 × 3 × 5."},{"id":"math-09-046","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"M","q":"In how many ways can 4 different letters be posted in 3 different letter boxes, if any box may receive any number of letters?","o":["81","64","12","24"],"a":0,"x":"Each letter independently goes into one of 3 boxes, so 3⁴ = 81. 64 = 4³ reverses the roles (each box choosing a letter), and 12 = 4 × 3 multiplies instead of using powers."},{"id":"math-09-047","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"M","q":"A number plate has 3 different letters from A to Z followed by 3 digits, which may repeat. How many plates are possible?","o":["17,576,000","15,600,000","11,232,000","15,600"],"a":1,"x":"Letters: 26 × 25 × 24 = 15,600; digits: 10 × 10 × 10 = 1000; total 15,600 × 1000 = 15,600,000. 17,576,000 lets the letters repeat, and 11,232,000 forbids the digits to repeat (15,600 × 720)."},{"id":"math-09-048","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"E","q":"Usman must choose exactly one optional subject, either one of 3 science subjects or one of 4 arts subjects. In how many ways can he choose?","o":["12","3","7","4"],"a":2,"x":"He chooses from one group or the other, not both, so the addition principle gives 3 + 4 = 7. Multiplying to 12 would count choosing one science and one arts subject together."},{"id":"math-09-049","unit":"math-09","topic":"math-09-counting","lo":"MATH-9.1","d":"D","q":"How many positive integers less than 1000 can be written using only the digits 1, 2 and 3 (digits may repeat)?","o":["39","27","36","81"],"a":0,"x":"One-digit: 3; two-digit: 3² = 9; three-digit: 3³ = 27. Adding gives 3 + 9 + 27 = 39. Counting only the three-digit numbers gives 27."},{"id":"math-09-050","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"M","q":"If P(n, 4) = 20 × P(n, 2), what is the value of n?","o":["6","7","8","5"],"a":1,"x":"P(n, 4) = n(n − 1)(n − 2)(n − 3) and P(n, 2) = n(n − 1), so (n − 2)(n − 3) = 20 = 5 × 4, giving n − 2 = 5 and n = 7. Check: P(7, 4) = 840 = 20 × 42."},{"id":"math-09-051","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"M","q":"How many different arrangements can be made of all the letters of the word PAKISTAN?","o":["40320","10080","5040","20160"],"a":3,"x":"PAKISTAN has 8 letters with A appearing twice, so the count is 8!/2! = 40320/2 = 20160. 40320 treats the two A's as different, and 10080 divides by an extra 2."},{"id":"math-09-052","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"M","q":"The letters of the word LAHORE are arranged so that the three vowels A, O, E are always together. How many arrangements are possible?","o":["720","144","36","24"],"a":1,"x":"Treat A, O, E as one block: the block and L, H, R give 4 units, arranged in 4! = 24 ways, and the vowels inside the block in 3! = 6 ways: 24 × 6 = 144. Forgetting the arrangement inside the block gives 24."},{"id":"math-09-053","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"M","q":"Seven people, including Ali and Sara, sit around a round table. In how many arrangements do Ali and Sara sit next to each other?","o":["240","120","720","1440"],"a":0,"x":"Tie Ali and Sara together as one unit: 6 units around a table give (6 − 1)! = 120 arrangements, and the pair can swap seats: 120 × 2 = 240. Forgetting the swap gives 120; using 6! for a circle gives 1440."},{"id":"math-09-054","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"M","q":"In how many ways can 8 different beads be strung on a necklace, if a necklace turned over counts as the same?","o":["5040","2520","40320","20160"],"a":1,"x":"Circular arrangements of 8 objects: (8 − 1)! = 5040. A necklace can be flipped, so clockwise and anticlockwise orders are the same: 5040/2 = 2520. 5040 is the round-table answer without the flip."},{"id":"math-09-055","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"D","q":"5 boys and 3 girls stand in a row. In how many arrangements are no two girls next to each other?","o":["4320","40320","7200","14400"],"a":3,"x":"Arrange the boys in 5! = 120 ways; this leaves 6 gaps (ends included), and the 3 girls take 3 different gaps in P(6, 3) = 120 ways: 120 × 120 = 14400. 4320 = 6! × 3! counts the girls all together, which is a different condition."},{"id":"math-09-056","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"D","q":"4 different flags are available. A signal is made by hoisting one or more of them, one above the other. How many different signals can be made?","o":["24","256","64","60"],"a":2,"x":"Order matters, so count by the number of flags: P(4, 1) + P(4, 2) + P(4, 3) + P(4, 4) = 4 + 12 + 24 + 24 = 64. Using only all 4 flags gives 24."},{"id":"math-09-057","unit":"math-09","topic":"math-09-perm","lo":"MATH-9.2","d":"E","q":"What is the value of P(8, 3)?","o":["56","336","512","6720"],"a":1,"x":"P(8, 3) = 8!/5! = 8 × 7 × 6 = 336. 56 is C(8, 3), which divides by 3! more, and 512 = 8³ allows repetition."},{"id":"math-09-058","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"M","q":"If C(n, 8) = C(n, 12), what is the value of C(n, 18)?","o":["20","380","1140","190"],"a":3,"x":"C(n, r) = C(n, s) with r ≠ s means r + s = n, so n = 20. Then C(20, 18) = C(20, 2) = 20 × 19/2 = 190. 380 is P(20, 2), which forgets to divide by 2."},{"id":"math-09-059","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"M","q":"At a party, every guest shook hands exactly once with every other guest, and there were 66 handshakes in all. How many guests were there?","o":["12","11","33","13"],"a":0,"x":"Each handshake is a pair of guests, so C(n, 2) = n(n − 1)/2 = 66, giving n(n − 1) = 132 = 12 × 11 and n = 12. Using n(n − 1) = 66 would give no whole number; 11 picks the wrong factor."},{"id":"math-09-060","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"D","q":"How many three-digit numbers have their digits in strictly increasing order from left to right (for example 137)?","o":["120","504","84","720"],"a":2,"x":"Any 3 different digits can be written in increasing order in exactly one way, and 0 can never appear (it would have to come first). So the count is C(9, 3) = 84. C(10, 3) = 120 wrongly allows 0, and 504 = P(9, 3) counts all orders."},{"id":"math-09-061","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"M","q":"A convex polygon has 35 diagonals. How many sides does it have?","o":["7","10","12","9"],"a":1,"x":"An n-gon has C(n, 2) − n = n(n − 3)/2 diagonals. n(n − 3) = 70 = 10 × 7 gives n = 10. Check: C(10, 2) − 10 = 45 − 10 = 35."},{"id":"math-09-062","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"M","q":"Hina has 6 different fruits. In how many ways can she choose one or more of them?","o":["64","720","6","63"],"a":3,"x":"Each fruit is either taken or not: 2⁶ = 64 subsets, i.e. C(6, 0) + C(6, 1) + … + C(6, 6) = 64. Removing the empty choice leaves 63. 720 = 6! counts orders, which do not matter here."},{"id":"math-09-063","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"D","q":"A committee of 5 is chosen from 6 men and 4 women. Usman (one of the men) must be on it and Hina (one of the women) must not. In how many ways can it be chosen?","o":["126","70","56","252"],"a":1,"x":"Put Usman in and remove Hina: 4 more members come from the other 5 men and 3 women, so C(8, 4) = 70. 126 = C(9, 4) forgets to exclude Hina, and 56 = C(8, 5) forgets that Usman already fills one place."},{"id":"math-09-064","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"M","q":"An exam has 7 questions. A student must answer 5 of them, including at least 2 of the first 3. In how many ways can she choose her questions?","o":["21","12","6","18"],"a":3,"x":"Either 2 of the first 3 and 3 of the last 4: C(3, 2) × C(4, 3) = 3 × 4 = 12, or all 3 of the first 3 and 2 of the last 4: 1 × C(4, 2) = 6. Total 12 + 6 = 18. 21 = C(7, 5) ignores the condition."},{"id":"math-09-065","unit":"math-09","topic":"math-09-comb","lo":"MATH-9.3","d":"E","q":"What is the value of C(12, 10)?","o":["132","2","120","66"],"a":3,"x":"C(12, 10) = C(12, 2) = 12 × 11/2 = 66. 132 = P(12, 2) forgets to divide by 2!, and 2 confuses C(12, 10) with 12 − 10."},{"id":"math-09-066","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"M","q":"A card is drawn at random from a well-shuffled pack of 52 playing cards. What is the probability that it is a king or a heart?","o":["17/52","1/52","4/13","1/4"],"a":2,"x":"P(king) + P(heart) − P(king of hearts) = 4/52 + 13/52 − 1/52 = 16/52 = 4/13. 17/52 counts the king of hearts twice; 1/52 is the probability of a card that is both a king and a heart."},{"id":"math-09-067","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"M","q":"A bag has 5 red and 3 white balls. Two balls are drawn one after the other without replacement. What is the probability that both are red?","o":["25/64","5/8","5/14","15/28"],"a":2,"x":"P = (5/8) × (4/7) = 20/56 = 5/14. Equally, C(5, 2)/C(8, 2) = 10/28 = 5/14. 25/64 treats the draws as with replacement, and 15/28 is the probability of one ball of each colour."},{"id":"math-09-068","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"D","q":"Ali and Bilal try a problem independently. Ali solves it with probability 1/3 and Bilal with probability 1/4. What is the probability that exactly one of them solves it?","o":["1/12","7/12","5/12","1/2"],"a":2,"x":"P(Ali only) + P(Bilal only) = (1/3)(3/4) + (2/3)(1/4) = 3/12 + 2/12 = 5/12. 7/12 = 1/3 + 1/4 ignores the other person failing, and 1/12 is the probability that both solve it."},{"id":"math-09-069","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"M","q":"E and F are mutually exclusive events with P(E) = 0.3 and P(F) = 0.45. What is the probability that neither E nor F happens?","o":["0.75","0.25","0.385","0.135"],"a":1,"x":"Mutually exclusive means P(E ∩ F) = 0, so P(E ∪ F) = 0.3 + 0.45 = 0.75 and P(neither) = 1 − 0.75 = 0.25. 0.385 = 1 − 0.75 + 0.135 wrongly treats the events as independent, and 0.135 = 0.3 × 0.45."},{"id":"math-09-070","unit":"math-09","topic":"math-09-prob","lo":"MATH-9.4","d":"M","q":"Two fair dice are rolled. What is the probability that at least one of them shows a six?","o":["11/36","1/3","5/18","1/36"],"a":0,"x":"P(no six) = (5/6)(5/6) = 25/36, so P(at least one six) = 1 − 25/36 = 11/36. Adding 1/6 + 1/6 = 1/3 counts the double six twice, and 5/18 = 10/36 is exactly one six."},{"id":"math-10-001","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"E","q":"In a proof by mathematical induction, the first step (the base case) checks the statement for:","o":["the smallest value of n for which it is claimed","every value of n one by one","n = k + 1 only","n = 0 in every case"],"a":0,"x":"The base case verifies the statement at the starting value (usually n = 1, or n₀ if it is claimed from n₀ onwards). The inductive step then carries it from k to k + 1."},{"id":"math-10-002","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"E","q":"In the inductive step, we assume the statement P(k) is true and then prove:","o":["P(k − 1)","P(k + 1)","P(2k)","P(1)"],"a":1,"x":"Induction passes truth from one integer to the next: P(k) true ⇒ P(k + 1) true. Together with the base case this gives P(n) for all n."},{"id":"math-10-003","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"M","q":"To prove 1 + 3 + 5 + … + (2n − 1) = n² by induction, which term is added to the left side of P(k) to get the left side of P(k + 1)?","o":["2k − 1","2k + 3","k + 1","2k + 1"],"a":3,"x":"The (k + 1)th term is 2(k + 1) − 1 = 2k + 1, and k² + (2k + 1) = (k + 1)². Writing 2k − 1 repeats the kth term."},{"id":"math-10-004","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"M","q":"P(n): 1 + 2 + 4 + … + 2^(n−1) = 2ⁿ − 1. Assuming P(k), the left side of P(k + 1) simplifies to:","o":["2^(k+1) + 1","2ᵏ − 1","2^(k+1) − 2","2^(k+1) − 1"],"a":3,"x":"Add the (k + 1)th term 2ᵏ: (2ᵏ − 1) + 2ᵏ = 2·2ᵏ − 1 = 2^(k+1) − 1, which is the right side of P(k + 1)."},{"id":"math-10-005","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"M","q":"Which expression is divisible by 6 for every positive integer n?","o":["n² + n","n³ + 1","n³ − n","n² − 1"],"a":2,"x":"n³ − n = (n − 1)n(n + 1) is a product of three consecutive integers, so it has factors 2 and 3. Test n = 1 and n = 2: n² + n = 2, n³ + 1 = 2, n² − 1 = 3 are not multiples of 6."},{"id":"math-10-006","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"M","q":"What is the greatest positive integer that divides 5ⁿ − 1 for every positive integer n?","o":["2","24","8","4"],"a":3,"x":"n = 1 gives 4 and n = 2 gives 24, so the answer divides gcd(4, 24) = 4; and 5ⁿ − 1 = (5 − 1)(5^(n−1) + … + 1) is always a multiple of 4. 24 works only from n = 2."},{"id":"math-10-007","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"M","q":"For every positive integer n, 7ⁿ − 3ⁿ is divisible by:","o":["3","4","7","10"],"a":1,"x":"7ⁿ − 3ⁿ has the factor 7 − 3 = 4. At n = 1 the value is 4 itself, which is not divisible by 3, 7 or 10 (10 divides the n = 2 value 40, but not 4)."},{"id":"math-10-008","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"M","q":"The statement 'n² − n + 41 is prime' is true for n = 1, 2, …, 40. The smallest positive integer n for which it is false is:","o":["41","40","42","43"],"a":0,"x":"At n = 41: 41² − 41 + 41 = 41², not prime. The example shows that checking many cases is not a proof; induction needs the general step P(k) ⇒ P(k + 1)."},{"id":"math-10-009","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"E","q":"A student checks a statement P(n) for n = 1, 2, 3, …, 100 and finds it true each time. This:","o":["proves P(n) for all positive integers n","proves P(n) only for even n","does not prove P(n) for all positive integers n","proves the inductive step P(k) ⇒ P(k + 1)"],"a":2,"x":"Finitely many checks never cover all n; a statement can fail later (n² − n + 41 is prime up to n = 40 only). A proof needs the base case and the general inductive step."},{"id":"math-10-010","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"M","q":"By induction, 1·2 + 2·3 + 3·4 + … + n(n + 1) equals:","o":["n(n + 1)(n + 2)/3","n(n + 1)(n + 2)/6","n(n + 1)(2n + 1)/6","n²(n + 1)/2"],"a":0,"x":"Check n = 1: 2 = 1·2·3/3, and n = 2: 2 + 6 = 8 = 2·3·4/3. The other forms give 1 at n = 1; dividing by 6 is the sum-of-squares or triangular-number slip."},{"id":"math-10-011","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"M","q":"For every positive integer n, 1/(1·2) + 1/(2·3) + … + 1/(n(n + 1)) equals:","o":["1/(n + 1)","(n + 1)/n","n/(n + 1)","n/(n + 2)"],"a":2,"x":"Each term is 1/r − 1/(r + 1), so the sum telescopes to 1 − 1/(n + 1) = n/(n + 1). Check n = 1: 1/2. The value 1/(n + 1) is the part subtracted, not the sum."},{"id":"math-10-012","unit":"math-10","topic":"math-10-induction","lo":"MATH-10.1","d":"M","q":"To prove 1² + 2² + … + n² = n(n + 1)(2n + 1)/6 by induction, one must show that k(k + 1)(2k + 1)/6 + (k + 1)² equals:","o":["(k + 1)(k + 2)(2k + 3)/6","(k + 1)(k + 2)(2k + 1)/6","k(k + 1)(2k + 3)/6","(k + 1)(k + 2)(2k + 2)/6"],"a":0,"x":"Put n = k + 1 in the formula: (k + 1)(k + 2)(2(k + 1) + 1)/6 = (k + 1)(k + 2)(2k + 3)/6. Indeed (k + 1)[k(2k + 1) + 6(k + 1)]/6 = (k + 1)(2k² + 7k + 6)/6 = (k + 1
